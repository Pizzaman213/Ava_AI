# Minimal DeepSpeed Test Configuration
# For quick testing of DeepSpeed ZeRO-2 integration
# Can run on single GPU or 2 GPUs

model:
  # Small model for fast testing
  hidden_size: 512
  num_layers: 4
  num_attention_heads: 8
  intermediate_size: 2048
  vocab_size: 50257
  max_position_embeddings: 1024

  # MoE Configuration
  num_experts: 4
  num_experts_per_token: 2
  expert_capacity_factor: 1.25
  router_type: "mixtral"

  # Basic features only
  use_moh: false
  use_moa: false
  use_rag: false
  use_cross_attention: false
  use_episodic_memory: false

training:
  batch_size: 16
  gradient_accumulation_steps: 1
  optimizer: "adamw"
  learning_rate: 0.0001
  max_gradient_norm: 1.0
  num_epochs: 1
  warmup_steps: 100
  weight_decay: 0.01
  mixed_precision: "bf16"
  gradient_checkpointing: false

# DeepSpeed Configuration (ZeRO-2 for testing)
deepspeed:
  enabled: true
  zero_stage: 2                       # Optimizer + gradient sharding

  # No offloading for fast testing
  cpu_offload: false
  nvme_offload: false

  # Precision
  precision_type: "bf16"

  # Batch Configuration
  gradient_accumulation_steps: 1
  train_batch_size: 16                # For single GPU: 16 * 1 * 1 = 16
  micro_batch_size: 16

  # No activation checkpointing for speed
  activation_checkpointing: false
  partition_activations: false

  # Gradient Clipping
  gradient_clipping: 1.0

  # ZeRO-2 Settings (minimal)
  zero_overlap_comm: true
  zero_contiguous_gradients: true
  zero_reduce_scatter: true

# Data Loading
data:
  data_dir: "code/data/processed"
  max_length: 512                      # Shorter sequences for speed
  tokenizer_name: "gpt2"
  train_batch_size: 16
  eval_batch_size: 16
  use_pretokenized: false              # Use regular loading for simplicity

  # Simple data loading
  streaming: false
  buffer_size: 1000
  distributed: false
  multi_column: false

# Performance
performance:
  ultra_fast_mode: false
  fast_progress: true                  # Show progress
  minimal_progress: false
  express_mode: false

# Output
output:
  output_dir: "code/outputs/deepspeed_test"
  save_total_limit: 1

# Monitoring
wandb:
  enabled: false                        # Disable for quick testing
  project: "ava-deepspeed-test"

# Hardware Requirements
# Minimum: 1 GPU with 8GB+ VRAM
# Recommended: 2 GPUs with 16GB+ VRAM
# Test with: torchrun --nproc_per_node=2 code/scripts/5_training/train_pipeline.py --config code/configs/moe/deepspeed_test.yaml --max-steps 10
