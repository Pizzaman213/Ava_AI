# =============================================================================
# Deterministic Training Configuration
# =============================================================================
# Reproducible training with fixed data ordering
#
# Use this config when you want:
# - Exact reproducibility (same seed = same training)
# - Benchmark results reliably
# - Compare different model architectures fairly
#
# Performance impact: NONE (uses optimizations)
# The only difference is that data ordering is deterministic, not random
#
# This config is based on the RTX 3090 Ti optimized setup with reproducibility enabled

model:
  vocab_size: 50680
  pad_token_id: 0
  eos_token_id: 3
  hidden_size: 768
  num_layers: 12
  num_attention_heads: 12
  intermediate_size: 3072
  max_position_embeddings: 1024
  num_experts: 4
  num_experts_per_token: 2
  router_type: mixtral
  capacity_factor: 1.25
  quantize_kv_cache: true
  expert_dropout: 0.0
  activation: swiglu
  use_grouped_gemm: true
  use_triton_kernels: true
  use_torch_compile: false
  use_flash_attention: true
  gradient_checkpointing: true
  use_optimized_moe: true
  router_z_loss_coef: 0.001
  load_balance_loss_coef: 0.01
  diversity_loss_coef: 0.0
  expert_dropout_loss_coef: 0.0
  router_jitter_noise: 0.01
  use_lora_experts: false
  use_expert_offloading: false
  attention_dropout: 0.1
  dropout: 0.1
  layer_norm_eps: 1.0e-5
  initializer_range: 0.02

hybrid_caching:
  enabled: true
  max_cache_size_gb: 1.0
  kv_cache_ratio: 0.7
  eviction_policy: hybrid
  prefetch_enabled: true
  prefetch_lookahead: 2
  min_score_threshold: 0.1

training:
  precision:
    mixed_precision: bf16

  batching:
    batch_size: 8
    

  optimizer:
    type: adamw_8bit
    learning_rate: 3.0e-5
    betas: [0.9, 0.95]
    weight_decay: 0.1
    use_fused: true
    # eps: AUTO-DETECTED based on mixed_precision setting
    #      bf16 → 1e-6 (safe for bfloat16 mantissa precision ~1e-7)
    #      fp16/fp32 → 1e-8 (standard Adam epsilon)
    #      Override only if you need custom epsilon behavior
    max_grad_norm: 1.0

  schedule:
    num_epochs: 3
    max_steps: null
    warmup_steps: 2000
    scheduler_type: cosine_with_restarts
    num_cycles: 3
    min_lr: 1.0e-5

  logging:
    save_steps: 500
    eval_steps: 500
    logging_steps: 50

  validation:
    enabled: true
    batch_size: 24
    max_batches: 10
    compute_train_ratio: true

  generation:
    enabled: true
    every_n_steps: 1
    generate_every_n_steps: 1
    num_per_step: 1
    during_eval: true
    test_quality: true
    max_length: 128
    temperature: 0.8
    top_p: 0.9
    top_k: 50
    repetition_penalty: 1.2
    skip_special_tokens: true
    prompt: "Once upon a time, in a land far away,"
    alternative_prompts:
      - "The quick brown fox"
      - "In the beginning"
      - "A long time ago"

  coherence:
    enabled: false
    eval_every_n_steps: 500
    num_samples: 5
    max_generation_length: 128
    temperature: 0.8
    top_p: 0.9
    top_k: 50
    log_to_wandb: true
    log_to_console: true

# =============================================================================
# REPRODUCIBILITY CONTROL - DETERMINISTIC SETTINGS
# =============================================================================
data:
  streaming: true

  # REPRODUCIBILITY: Fixed seed for deterministic training
  # Same seed = same data order across all runs
  shuffle_seed: 42  # integer = deterministic, null = random

  # REPRODUCIBILITY: Keep length-based sorting for GPU load balancing
  enable_length_sorting: true  # true = sort by length, false = random order

  # REPRODUCIBILITY: Keep packing sorting for efficiency
  disable_packing_length_sort: false  # false = sort by length, true = random order

  # REPRODUCIBILITY: Keep bucketing enabled
  enable_bucketing: true  # true = use length buckets, false = no bucketing

  # Standard buffer size (good balance of shuffle quality and memory)
  buffer_size: 5000

  # Standard data settings
  data_dir: code/data/Ava_Ai/data/train/data
  max_length: 512
  train_split: train
  eval_split: validation
  auto_create_validation_split: true
  validation_split_ratio: 0.05
  tokenizer_name: code/data/Ava_Ai/tokenizer/tokenizer.json
  padding_side: right
  truncation: true

  # Data loading - 8 parallel workers for optimal throughput
  num_workers: 8
  prefetch_factor: 2
  persistent_workers: true
  dataloader_drop_last: true
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 2
  dataloader_persistent_workers: false
  dataloader_samples_per_file: 1000
  skip_dataloader_validation: true

  # Sequence packing with length sorting
  use_sequence_packing: true
  packing_strategy: greedy
  packing_target_ratio: 0.95

  # Dataset loading
  use_pretokenized: true
  use_all_data: true
  max_files_to_load: null
  lazy_file_discovery: true
  multiprocessing_context: spawn
  cache_size: 20
  skip_validation: true

output:
  output_dir: code/outputs
  save_every: 500
  fresh_start: true

generation:
  enabled: true
  generate_every_n_steps: 1000
  num_per_step: 1
  max_length: 128
  temperature: 0.8
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.2
  prompt: "Once upon a time, in a land far away,"

optimizations:
  use_overlapped_checkpointing: true

cuda_streams:
  enabled: false
  num_streams: 4
  use_event_timing: true
  use_stream_pool: true
  high_priority_transfers: true

overlapped_checkpointing:
  enabled: true
  stream_overlap: true
  target_layers: "layers"

double_checkpointing:
  enabled: true
  coarse_checkpoint_interval: 8
  fine_checkpoint_interval: 2
  use_cuda_streams: true

fp8:
  enabled: false
  use_transformer_engine: false
  format: e4m3

performance:
  enable_cudnn_benchmark: true
  enable_tf32: true
  torchinductor_max_autotune: 0
  enable_torch_compile: false
  torch_compile_mode: default
  torch_compile_fullgraph: false
  torch_compile_dynamic: true

kernel_optimization:
  router_kernel_mode: auto
  use_fused_softmax_topk: true
  router_block_size: 4
  use_sparse_expert_dispatch: false
  use_fused_activations: true
  use_selective_expert_loading: false
  use_vectorized_capacity: true
  use_fused_moe_kernel: false
  enable_kernel_profiling: false

wandb:
  enabled: true
  project: ava-training
  entity: null
  tags:
    - rtx3090ti
    - 24gb_vram
    - 446m_params
    - deterministic
  notes: |
    Deterministic training configuration for Ava framework.

    Same seed (42) ensures reproducible training across runs.
    All optimizations enabled for best performance.

    Use for:
    - Reproducible experiments
    - Benchmarking
    - Comparing model architectures fairly

deepspeed:
  use_deepspeed: true
  config_file: code/configs/distributed/deepspeed_zero2.yaml
