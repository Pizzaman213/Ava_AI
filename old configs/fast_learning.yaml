# =============================================================================
# Fast Learning Configuration - Reduced Regularization for Faster Progress
# =============================================================================
# Balanced between full regularization (minimal_working.yaml) and overfitting.
# Use this when you want the model to learn faster on TinyStories while still
# maintaining reasonable generalization.
#
# Key differences from minimal_working.yaml:
# - Lower dropout (0.05 vs 0.1)
# - Higher learning rate (5e-4 vs 3e-4)
# - Reduced entropy regularization
# - Reduced MoE diversity loss
# - Still maintains some regularization for generalization
#
# Usage: python code/scripts/5_training/train_pipeline.py --config code/configs/moe/fast_learning.yaml

model:
  vocab_size: 50680
  pad_token_id: 0
  eos_token_id: 1
  bos_token_id: 2
  hidden_size: 384
  num_layers: 6
  num_attention_heads: 6
  intermediate_size: 1536
  max_position_embeddings: 512
  num_experts: 4
  num_experts_per_token: 2
  router_type: mixtral
  capacity_factor: 1.25
  quantize_kv_cache: true
  expert_dropout: 0.0
  activation: swiglu
  tie_word_embeddings: true

  # GPU Optimizations
  use_grouped_gemm: true
  use_triton_kernels: true
  use_torch_compile: false
  use_flash_attention: true
  gradient_checkpointing: true
  use_optimized_moe: true

  # MoE losses - REDUCED for faster learning
  router_z_loss_coef: 0.0005      # REDUCED from 0.001 (less constraint on router)
  load_balance_loss_coef: 0.005   # REDUCED from 0.01 (allow more imbalance)
  diversity_loss_coef: 0.01       # REDUCED from 0.02 (less forced specialization)
  expert_dropout_loss_coef: 0.0
  router_jitter_noise: 0.0

  # Coherence regularization - REDUCED
  entropy_regularization: 0.01    # REDUCED from 0.025 (less entropy penalty)
  output_diversity_weight: 0.005  # REDUCED from 0.01 (less diversity requirement)
  eos_logit_bias: 0.5             # REDUCED from 0.8 (less EOS bias)

  # Regularization - REDUCED for faster learning
  use_lora_experts: false
  use_expert_offloading: false
  attention_dropout: 0.05         # REDUCED from 0.1 (less aggressive dropout)
  dropout: 0.05                   # REDUCED from 0.1 (less aggressive dropout)
  layer_norm_eps: 1.0e-5
  initializer_range: 0.02

# Hybrid Caching
hybrid_caching:
  enabled: true
  max_cache_size_gb: 1.0
  kv_cache_ratio: 0.7
  eviction_policy: hybrid
  prefetch_enabled: true
  prefetch_lookahead: 2
  min_score_threshold: 0.1

# Batch Size Calibration
batch_size_calibration:
  enabled: true
  target_memory: 0.85
  max_batch_size: 64
  perform_optimizer_step: true
  calibration_timeout_sec: 90.0
  calibration_headroom: 1.10
  use_real_dataloader: true
  measure_peak_utilization: true

training:
  precision:
    mixed_precision: bf16

  batching:
    batch_size: 16
    gradient_accumulation_steps: 8  # Effective batch size = 128
    label_smoothing: 0.0

  optimizer:
    type: adamw_8bit
    learning_rate: 5.0e-4           # INCREASED from 3e-4 (faster learning)
    betas: [0.9, 0.95]
    weight_decay: 0.005             # REDUCED from 0.01 (less weight penalty)
    use_fused: true
    max_grad_norm: 1.0

  schedule:
    num_epochs: 5
    max_steps: null
    warmup_steps: 800               # REDUCED from 1000 (reach full LR faster)
    scheduler_type: cosine
    num_cycles: 1
    min_lr: 5.0e-5                  # 10% of peak LR

  logging:
    save_steps: 500
    eval_steps: 250
    logging_steps: 50
    use_tensorboard: true
    use_wandb: true

  validation:
    enabled: true
    batch_size: 24
    max_batches: 20
    compute_train_ratio: true
    early_stopping_patience: 5
    early_stopping_min_delta: 0.01

  generation:
    enabled: true
    generate_every_n_steps: 100     # INCREASED: skip very early steps
    num_per_step: 2
    during_eval: true
    test_quality: true
    skip_until_step: 1000           # ADDED: skip generation before step 1000
    max_length: 128
    temperature: 0.8                # INCREASED: more diverse sampling
    top_p: 0.9                      # INCREASED: sample from larger vocabulary
    top_k: 50                       # INCREASED: allow more token choices
    repetition_penalty: 1.2         # REDUCED: less aggressive penalty
    no_repeat_ngram_size: 2         # REDUCED: only block 2-grams (less strict)
    skip_special_tokens: true
    prompt: "Once upon a time"
    alternative_prompts:
      - "The quick brown fox"
      - "In the beginning"
      - "Hello, my name is"

  coherence:
    enabled: true
    eval_every_n_steps: 100
    num_samples: 8
    max_generation_length: 100
    temperature: 0.7
    top_p: 0.85
    top_k: 40
    log_to_wandb: true
    log_to_console: true

data:
  streaming: true
  buffer_size: 1000

  # Standard randomization settings (balanced)
  # shuffle_seed: null = random each run
  # enable_length_sorting: true = good GPU efficiency
  # enable_bucketing: true = reduce padding waste

  data_dir: code/data/tinystories_clean/train
  val_data_dir: code/data/tinystories_clean/val
  max_length: 512
  add_special_tokens: false
  train_split: train
  eval_split: validation
  auto_create_validation_split: false
  validation_split_ratio: 0.05
  tokenizer_name: code/data/Ava_Ai/tokenizer/tokenizer.json
  padding_side: right
  truncation: false

  # Data loading - optimized
  num_workers: 8
  prefetch_factor: 2
  persistent_workers: true
  dataloader_drop_last: true
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 2
  dataloader_persistent_workers: true
  dataloader_samples_per_file: 2000
  skip_dataloader_validation: true

  # Sequence packing - disabled for simplicity
  use_sequence_packing: false

  # Use all data
  use_pretokenized: true
  use_all_data: true
  max_files_to_load: null
  lazy_file_discovery: true
  multiprocessing_context: spawn
  cache_size: 20
  skip_validation: true
  shuffle_files: true

  # Indexed loader - disabled (slow startup)
  use_indexed_loader: false

output:
  output_dir: code/outputs
  save_every: 500
  fresh_start: true

optimizations:
  use_overlapped_checkpointing: true

cuda_streams:
  enabled: false
  num_streams: 4
  use_event_timing: true
  use_stream_pool: true
  high_priority_transfers: true

overlapped_checkpointing:
  enabled: true
  stream_overlap: true
  target_layers: "layers"

double_checkpointing:
  enabled: true
  coarse_checkpoint_interval: 8
  fine_checkpoint_interval: 2
  use_cuda_streams: true

fp8:
  enabled: false
  use_transformer_engine: false
  format: e4m3

performance:
  enable_cudnn_benchmark: true
  enable_tf32: true
  torchinductor_max_autotune: 0
  enable_torch_compile: false
  torch_compile_mode: default
  torch_compile_fullgraph: false
  torch_compile_dynamic: true

cuda_graphs:
  enabled: false
  warmup_steps: 11

kernel_optimization:
  router_kernel_mode: auto
  use_fused_softmax_topk: true
  router_block_size: 4
  use_sparse_expert_dispatch: true
  use_fused_activations: true
  use_selective_expert_loading: true
  use_vectorized_capacity: true
  use_fused_moe_kernel: true
  enable_kernel_profiling: false

logging:
  tensorboard:
    enabled: true
    log_dir: null

wandb:
  enabled: true
  project: ava-training
  entity: null
  tags:
    - fast_learning
    - 62m_params
    - tinystories
    - reduced_regularization
  notes: |
    62M parameter MoE with reduced regularization for faster learning.
    Dropout: 0.05, LR: 5e-4, reduced MoE losses.
    Balance between overfitting and generalization.

model_selection:
  enabled: true
  val_loss_weight: 0.5
  coherence_score_weight: 0.3
  perplexity_weight: 0.2
  perplexity_cap: 100.0
  val_loss_cap: 10.0
  higher_is_better: true
  require_all_metrics: false
  fallback_to_val_loss: true

diagnostics:
  enabled: true
  enable_per_layer_gradients: false
  per_layer_log_freq: 500
  layer_name_patterns:
    - layers
    - experts
  enable_routing_diagnostics: true
  routing_log_freq: 100
  track_per_expert_load: true
  track_routing_entropy: true
  track_expert_capacity_usage: true
  enable_memory_breakdown: true
  memory_log_freq: 500
  track_activation_memory: true
  track_gradient_memory: true
  track_optimizer_state_memory: true
  track_parameter_memory: true
  enable_timing_profiling: true
  timing_log_freq: 100
  profile_forward: true
  profile_backward: true
  profile_optimizer_step: true
  profile_data_loading: true

deepspeed:
  use_deepspeed: false
  config_file: code/configs/distributed/deepspeed_zero2.yaml
