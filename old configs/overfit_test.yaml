# =============================================================================
# Overfitting Test Configuration - Verify model can learn
# =============================================================================
# Use this to test if your model architecture can overfit a small dataset.
# If it CAN'T overfit this, something is wrong with the model/training.
#
# Usage: python code/scripts/5_training/train_pipeline.py --config code/configs/moe/overfit_test.yaml

model:
  vocab_size: 50680
  pad_token_id: 0
  eos_token_id: 1
  bos_token_id: 2
  hidden_size: 384
  num_layers: 6
  num_attention_heads: 6
  intermediate_size: 1536
  max_position_embeddings: 512
  num_experts: 4
  num_experts_per_token: 2
  router_type: mixtral
  capacity_factor: 1.25
  quantize_kv_cache: false  # Disabled for overfitting test
  expert_dropout: 0.0
  activation: swiglu
  tie_word_embeddings: true

  # GPU Optimizations
  use_grouped_gemm: true
  use_triton_kernels: true
  use_torch_compile: false
  use_flash_attention: true
  gradient_checkpointing: true
  use_optimized_moe: true

  # MoE losses - DISABLED for overfitting
  router_z_loss_coef: 0.0
  load_balance_loss_coef: 0.0
  diversity_loss_coef: 0.0
  expert_dropout_loss_coef: 0.0
  router_jitter_noise: 0.0

  # Coherence regularization - DISABLED
  entropy_regularization: 0.0
  output_diversity_weight: 0.0
  eos_logit_bias: 0.0

  # Regularization - DISABLED for overfitting
  use_lora_experts: false
  use_expert_offloading: false
  attention_dropout: 0.0       # NO DROPOUT
  dropout: 0.0                 # NO DROPOUT
  layer_norm_eps: 1.0e-5
  initializer_range: 0.02

# Hybrid Caching
hybrid_caching:
  enabled: true
  max_cache_size_gb: 1.0
  kv_cache_ratio: 0.7
  eviction_policy: hybrid
  prefetch_enabled: true
  prefetch_lookahead: 2
  min_score_threshold: 0.1

# Batch Size Calibration
batch_size_calibration:
  enabled: true
  target_memory: 0.85
  max_batch_size: 64
  perform_optimizer_step: true
  calibration_timeout_sec: 90.0
  calibration_headroom: 1.10
  use_real_dataloader: true
  measure_peak_utilization: true

training:
  precision:
    mixed_precision: bf16

  batching:
    batch_size: 32              # LARGER BATCH for overfitting
    gradient_accumulation_steps: 1  # No accumulation needed
    label_smoothing: 0.0        # DISABLED

  optimizer:
    type: adamw_8bit
    learning_rate: 1.0e-3       # HIGHER LR for faster overfitting
    betas: [0.9, 0.95]
    weight_decay: 0.0           # NO WEIGHT DECAY
    use_fused: true
    max_grad_norm: 1.0

  schedule:
    num_epochs: 100             # MANY EPOCHS to overfit
    max_steps: null
    warmup_steps: 100           # SHORT WARMUP
    scheduler_type: constant    # CONSTANT LR (no decay)
    num_cycles: 1
    min_lr: 1.0e-3              # Same as learning_rate

  logging:
    save_steps: 100
    eval_steps: 50
    logging_steps: 10
    use_tensorboard: true
    use_wandb: true

  validation:
    enabled: true
    batch_size: 32
    max_batches: 10
    compute_train_ratio: true
    early_stopping_patience: 999  # EFFECTIVELY DISABLED
    early_stopping_min_delta: 0.0

  generation:
    enabled: true
    generate_every_n_steps: 50
    num_per_step: 2
    during_eval: true
    test_quality: true
    skip_until_step: 200  # Skip very early noise (overfitting should be fast)
    max_length: 128
    temperature: 0.7
    top_p: 0.85
    top_k: 40
    repetition_penalty: 1.1
    no_repeat_ngram_size: 0  # Allow repetition
    skip_special_tokens: true
    prompt: "Once upon a time"
    alternative_prompts:
      - "The quick brown fox"
      - "In the beginning"

  coherence:
    enabled: false  # DISABLED for overfitting test

data:
  streaming: true
  buffer_size: 10  # MINIMAL SHUFFLE - helps overfitting

  # DISABLE RANDOMIZATION for overfitting
  shuffle_seed: 42              # DETERMINISTIC
  enable_length_sorting: false  # NO SORTING
  disable_packing_length_sort: true
  enable_bucketing: false       # NO BUCKETING

  # USE ONLY 1 FILE for fast overfitting
  data_dir: code/data/tinystories_clean/train
  val_data_dir: code/data/tinystories_clean/val
  max_length: 512
  add_special_tokens: false
  train_split: train
  eval_split: validation
  auto_create_validation_split: false
  validation_split_ratio: 0.05
  tokenizer_name: code/data/Ava_Ai/tokenizer/tokenizer.json
  padding_side: right
  truncation: false

  # Data loading - MINIMAL workers, 1 FILE ONLY
  num_workers: 4
  prefetch_factor: 2
  persistent_workers: true
  dataloader_drop_last: true
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 2
  dataloader_persistent_workers: true
  dataloader_samples_per_file: 2000
  skip_dataloader_validation: true

  # Sequence packing - DISABLED
  use_sequence_packing: false

  # USE ONLY 1 FILE - critical for overfitting test
  use_pretokenized: true
  use_all_data: false           # ONLY 1 FILE
  max_files_to_load: 1          # ONLY 1 FILE = 50k samples
  lazy_file_discovery: true
  multiprocessing_context: spawn
  cache_size: 5
  skip_validation: true
  shuffle_files: false          # NO SHUFFLE

  # Indexed loader - disabled
  use_indexed_loader: false

output:
  output_dir: code/outputs
  save_every: 100
  fresh_start: true

optimizations:
  use_overlapped_checkpointing: true

cuda_streams:
  enabled: false
  num_streams: 4
  use_event_timing: true
  use_stream_pool: true
  high_priority_transfers: true

overlapped_checkpointing:
  enabled: true
  stream_overlap: true
  target_layers: "layers"

double_checkpointing:
  enabled: true
  coarse_checkpoint_interval: 8
  fine_checkpoint_interval: 2
  use_cuda_streams: true

fp8:
  enabled: false
  use_transformer_engine: false
  format: e4m3

performance:
  enable_cudnn_benchmark: true
  enable_tf32: true
  torchinductor_max_autotune: 0
  enable_torch_compile: false
  torch_compile_mode: default
  torch_compile_fullgraph: false
  torch_compile_dynamic: true

cuda_graphs:
  enabled: false  # Disabled - incompatible with variable batch sizes
  warmup_steps: 11

kernel_optimization:
  router_kernel_mode: auto
  use_fused_softmax_topk: true
  router_block_size: 4
  use_sparse_expert_dispatch: true
  use_fused_activations: true
  use_selective_expert_loading: true
  use_vectorized_capacity: true
  use_fused_moe_kernel: true
  enable_kernel_profiling: false

logging:
  tensorboard:
    enabled: true
    log_dir: null

wandb:
  enabled: true
  project: ava-training
  entity: null
  tags:
    - overfit_test
    - 1_file
    - 50k_samples
  notes: |
    Overfitting test on 1 file (50k samples) of TinyStories.
    All regularization disabled. Should reach near-zero loss.

model_selection:
  enabled: false  # Disabled for overfitting test

diagnostics:
  enabled: true
  enable_per_layer_gradients: false
  per_layer_log_freq: 500
  layer_name_patterns:
    - layers
    - experts
  enable_routing_diagnostics: true
  routing_log_freq: 100
  track_per_expert_load: true
  track_routing_entropy: true
  track_expert_capacity_usage: true
  enable_memory_breakdown: false
  memory_log_freq: 500
  track_activation_memory: true
  track_gradient_memory: true
  track_optimizer_state_memory: true
  track_parameter_memory: true
  enable_timing_profiling: false
  timing_log_freq: 100
  profile_forward: true
  profile_backward: true
  profile_optimizer_step: true
  profile_data_loading: true

deepspeed:
  use_deepspeed: false
  config_file: code/configs/distributed/deepspeed_zero2.yaml
