# =============================================================================
# Small Benchmark Configuration (~50M parameters)
# =============================================================================
# Purpose: Quick iteration and testing on RTX 3060 (12GB VRAM)
# Expected: ~100ms/step, ~40k tokens/sec
# =============================================================================

model:
  vocab_size: 32000
  pad_token_id: 0
  eos_token_id: 1
  bos_token_id: 2
  hidden_size: 512
  num_layers: 8
  num_attention_heads: 8
  intermediate_size: 2048
  max_position_embeddings: 128
  num_experts: 4
  num_experts_per_token: 2
  router_type: mixtral
  capacity_factor: 1.25
  activation: swiglu

  # Optimizations
  use_grouped_gemm: true
  use_triton_kernels: true
  use_flash_attention: true
  gradient_checkpointing: false  # Small model, no need

  # Dropout=0 for CUDA graphs compatibility
  attention_dropout: 0.0
  dropout: 0.0

  # MoE losses
  router_z_loss_coef: 0.0001
  load_balance_loss_coef: 0.001
  diversity_loss_coef: 0.0

  tie_word_embeddings: false

training:
  precision:
    mixed_precision: bf16

  batching:
    batch_size: 64
    gradient_accumulation_steps: 1

  optimizer:
    type: adamw
    learning_rate: 1.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.1
    use_fused: true
    max_grad_norm: 1.0

  schedule:
    num_epochs: 1
    max_steps: 1000
    warmup_steps: 100
    scheduler_type: cosine
    min_lr: 1.0e-5

  logging:
    save_steps: 10000  # Don't save during benchmark
    eval_steps: 10000
    logging_steps: 100
    use_tensorboard: false
    use_wandb: false

  validation:
    enabled: false

  generation:
    enabled: false

  coherence:
    enabled: false

data:
  streaming: false
  data_dir: /root/Ava_AI/pretokenized_data/data
  max_length: 128
  num_workers: 4
  prefetch_factor: 4
  persistent_workers: true
  dataloader_drop_last: true
  dataloader_pin_memory: true
  use_sequence_packing: false
  use_indexed_loader: true

compute:
  memory:
    headroom_gb: 2.0
    cleanup_thresholds:
      warning: 0.85
      critical: 0.90
      emergency: 0.95

  performance:
    enable_cudnn_benchmark: true
    enable_tf32: true
    enable_torch_compile: false  # Toggle for benchmarking
    torch_compile_mode: reduce-overhead

  cuda:
    streams:
      enabled: true
      num_streams: 2

    graphs:
      enabled: false

  calibration:
    batch_size:
      enabled: false

distributed:
  deepspeed:
    enabled: false

logging:
  disabled: true  # Minimal logging for pure throughput benchmark
  silent_mode: true
  progress_bar_enabled: false

  wandb:
    enabled: false

  tensorboard:
    enabled: false

  frequencies:
    log_interval: 1000
    verbose_log_interval: 1000
    metrics: 10000
    memory_check: 10000

checkpoints:
  output_dir: /tmp/ava_benchmark
  save_every: 100000  # Don't save during benchmark
  fresh_start: true

experimental:
  caching:
    enabled: false
