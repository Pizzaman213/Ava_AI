# =============================================================================
# RTX 3060 THROUGHPUT BENCHMARK Configuration (11GB VRAM)
# =============================================================================
# Hardware: NVIDIA GeForce RTX 3060 (11GB)
# Purpose: Benchmark throughput optimizations on development GPU
#
# Optimizations Applied:
#   1. CUDA Graphs enabled (15-25% forward speedup)
#   2. Batch 32 x Accum 4 = 128 effective (better overlap)
#   3. Expert prefetch lookahead=2
#   4. Reduced logging frequencies
#   5. DeepSpeed DISABLED (enables overlapped accumulation 10-20%)
#   6. cu_seqlens for Flash Attention varlen
# =============================================================================

# =============================================================================
# MODEL - Architecture optimized for 11GB VRAM
# =============================================================================
model:
  vocab_size: 32000
  pad_token_id: 0
  eos_token_id: 1
  bos_token_id: 2
  hidden_size: 768
  num_layers: 12
  num_attention_heads: 12
  intermediate_size: 3072
  max_position_embeddings: 128
  num_experts: 4
  num_experts_per_token: 2
  router_type: mixtral
  capacity_factor: 1.25
  quantize_kv_cache: true
  expert_dropout: 0.0
  activation: swiglu

  # GPU Optimizations
  use_grouped_gemm: true
  use_triton_kernels: true
  use_flash_attention: true
  gradient_checkpointing: true
  checkpoint_layer_interval: 3  # Selective checkpointing: every 3rd layer
  use_optimized_moe: true

  # MoE loss coefficients
  router_z_loss_coef: 0.001
  load_balance_loss_coef: 0.01
  diversity_loss_coef: 0.001
  expert_dropout_loss_coef: 0.0
  router_jitter_noise: 0.01
  aux_loss_frequency: 500

  # Coherence regularization
  entropy_regularization: 0.01
  output_diversity_weight: 0.01
  eos_logit_bias: 0.1

  # Regularization (dropout=0.0 REQUIRED for CUDA Graphs)
  attention_dropout: 0.0
  dropout: 0.0
  label_smoothing: 0.1
  tie_word_embeddings: false
  layer_norm_eps: 1.0e-5
  initializer_range: 0.02

# =============================================================================
# TRAINING - Optimized for throughput with overlapped accumulation
# =============================================================================
training:
  precision:
    mixed_precision: bf16

  use_pipeline_microbatching: false
  pipeline_overlap_factor: 2

  batching:
    # OPTIMIZATION: batch_size=32 x accum=4 = 128 effective
    # More micro-batches = better overlap opportunities
    batch_size: 32
    gradient_accumulation_steps: 4

  optimizer:
    type: adamw
    learning_rate: 1.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.1
    use_fused: true
    max_grad_norm: 1.0

  schedule:
    num_epochs: 1
    max_steps: null
    steps_per_epoch: 10000
    warmup_steps: 500
    scheduler_type: cosine
    num_cycles: 1
    min_lr: 1.0e-5

  logging:
    save_steps: 1000
    eval_steps: 1000
    logging_steps: 100
    use_tensorboard: false
    use_wandb: true

  validation:
    enabled: false
    batch_size: 16
    max_batches: 10
    compute_train_ratio: true

  generation:
    enabled: false  # Disabled for pure throughput benchmark
    generate_every_n_steps: 2000
    num_per_step: 1
    num_return_sequences: 1
    during_eval: false
    test_quality: false
    max_length: 128
    temperature: 0.7
    top_p: 0.9
    top_k: 40
    repetition_penalty: 1.5
    no_repeat_ngram_size: 3
    skip_special_tokens: true
    prompt: "Once upon a time"

  coherence:
    enabled: false

# =============================================================================
# DATA - Optimized loading with cu_seqlens for Flash Attention varlen
# =============================================================================
data:
  streaming: false
  buffer_size: 30000
  fast_startup: false
  progressive_buffer: false
  min_buffer_size: 10000
  warm_start_files: 5
  skip_sequence_count: true
  enable_length_sorting: false

  data_dir: /root/Ava_AI/pretokenized_data/data
  max_length: 128
  train_split: train
  eval_split: validation
  auto_create_validation_split: true
  validation_split_ratio: 0.05
  tokenizer_name: pretokenized_data/tokenizers/vocab
  padding_side: right
  truncation: false

  # Data loading optimized
  num_workers: 6
  prefetch_factor: 4
  persistent_workers: true
  dataloader_drop_last: true
  dataloader_pin_memory: true
  dataloader_samples_per_file: 200
  skip_dataloader_validation: true
  timeout: 300
  examples_per_random_select: 50

  # OPTIMIZATION: Sequence packing with cu_seqlens for Flash Attention varlen
  use_sequence_packing: true
  packing_strategy: greedy
  packing_target_ratio: 0.95
  packing_use_cu_seqlens: true  # Flash Attention varlen (40-60% faster)

  # Data discovery
  use_all_data: true
  max_files_to_load: null
  lazy_file_discovery: false
  multiprocessing_context: spawn
  cache_size: 20
  skip_validation: true
  shuffle_files: true
  use_indexed_loader: true
  indexed_num_bins: 8
  indexed_cache_size: 5
  indexed_index_workers: 8

# =============================================================================
# COMPUTE - Throughput optimizations enabled
# =============================================================================
compute:
  memory:
    headroom_gb: 2.0
    cleanup_thresholds:
      warning: 0.80
      critical: 0.85
      emergency: 0.90
    expert_prefetch:
      enabled: true
      lookahead: 2  # OPTIMIZATION: Increased from 1
      use_multiple_streams: true

  performance:
    enable_cudnn_benchmark: true
    enable_tf32: true
    torchinductor_max_autotune: 1
    enable_torch_compile: false
    torch_compile_mode: reduce-overhead
    torch_compile_fullgraph: false
    torch_compile_dynamic: true

  kernels:
    router_kernel_mode: auto
    use_fused_softmax_topk: true
    router_block_size: 4
    use_sparse_expert_dispatch: false
    use_fused_activations: true
    use_selective_expert_loading: false
    use_vectorized_capacity: true
    use_fused_moe_kernel: true
    enable_kernel_profiling: false

  cuda:
    streams:
      enabled: true
      num_streams: 4
      use_event_timing: true
      use_stream_pool: true
      high_priority_transfers: true

    graphs:
      # OPTIMIZATION: CUDA Graphs enabled (15-25% speedup)
      enabled: true
      warmup_steps: 10
      capture_mode: automatic

  optimizations:
    use_overlapped_checkpointing: false

  calibration:
    batch_size:
      enabled: false
      target_memory: 0.85
      max_batch_size: 64
      min_batch_size: 8

  warmup:
    enabled: true
    num_warmup_batches: 5
    use_real_data: false
    log_memory: true

# =============================================================================
# DISTRIBUTED - DeepSpeed DISABLED to enable overlapped accumulation
# =============================================================================
distributed:
  deepspeed:
    enabled: false  # OPTIMIZATION: Disabled to enable overlapped gradient accumulation

# =============================================================================
# LOGGING - Reduced frequencies for throughput
# =============================================================================
logging:
  disabled: false
  silent_mode: false

  console:
    enabled: true
    level: info

  file:
    enabled: true
    level: debug

  progress_bar_enabled: true
  step_logging_enabled: true
  epoch_logging_enabled: true
  log_mode: tqdm
  tqdm_update_interval: 100  # Reduced updates

  metrics:
    training: true
    gradients: true
    moe: true
    validation: false
    coherence: false
    quality: false
    memory: true
    timing: true
    generations: false

  wandb:
    enabled: true
    project: ava-benchmark
    entity: null
    tags:
      - rtx3060
      - 11gb_vram
      - throughput_benchmark
      - cuda_graphs
      - overlapped_accum
    notes: |
      RTX 3060 throughput benchmark configuration.
      Optimizations: CUDA graphs, overlapped accumulation, cu_seqlens
    log_freq: 5000  # OPTIMIZATION: Reduced from 2000
    log_training: true
    log_gradients: true
    log_moe: true
    log_validation: false
    log_coherence: false
    log_quality: false
    log_memory: true
    log_timing: true
    log_generations: false
    log_per_layer_grads: false
    log_routing_diagnostics: false
    log_model_topology: false

  tensorboard:
    enabled: false

  frequencies:
    # OPTIMIZATION: All frequencies increased to reduce sync overhead
    log_interval: 1000
    verbose_log_interval: 1000
    metrics: 10000
    memory_check: 50000
    health_summary: 10000
    moe_metrics: 50000

  features:
    timing_breakdown: true
    memory_profiling: true
    health_summaries: false
    tensor_shapes: false
    checkpoint_validation: false
    sample_generations: false
    structured_logging: true
    log_format: default

  diagnostics:
    enabled: false

# =============================================================================
# CHECKPOINTS
# =============================================================================
checkpoints:
  output_dir: code/outputs
  save_every: 10000  # Infrequent saves for benchmark
  fresh_start: true

  selection:
    enabled: false

# =============================================================================
# EXPERIMENTAL - Minimal for benchmark
# =============================================================================
experimental:
  caching:
    enabled: false
    mode: training

    activation_cache:
      enabled: false
      max_size_gb: 1.0
      eviction_policy: lru

    kv_cache:
      enabled: false
      max_size_gb: 2.0
      eviction_policy: hybrid

  checkpointing:
    overlapped:
      enabled: false
    double:
      enabled: false

  fp8:
    enabled: false

  mtp:
    enabled: false
  moh:
    enabled: false
  moa:
    enabled: false
  alibi:
    enabled: false
  cross_attention:
    enabled: false
  gradient_surgery:
    enabled: false
  aux_free_router:
    enabled: true
    balance_factor: 0.1
    ema_decay: 0.99
    use_capacity_masking: true
