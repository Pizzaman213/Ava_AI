# RLHF Fine-tuning Configuration
rlhf:
  # Model paths
  policy_model_path: {{RLHF_POLICY_MODEL_PATH}}
  judge_model_path: {{RLHF_JUDGE_MODEL_PATH}}
  reward_model_path: {{RLHF_REWARD_MODEL_PATH}}

  # Reward model settings
  use_model_to_model_reward: true
  freeze_reward_model: true

  # Dataset paths
  prompt_dataset_path: {{RLHF_PROMPT_DATASET_PATH}}
  eval_prompt_dataset_path: {{RLHF_EVAL_PROMPT_DATASET_PATH}}

  # Training settings
  num_epochs: {{RLHF_NUM_EPOCHS}}
  rollout_batch_size: {{RLHF_ROLLOUT_BATCH_SIZE}}
  num_rollouts_per_epoch: {{RLHF_NUM_ROLLOUTS_PER_EPOCH}}
  max_prompt_length: {{RLHF_MAX_PROMPT_LENGTH}}

  # Output settings
  save_dir: {{RLHF_SAVE_DIR}}
  log_dir: {{RLHF_LOG_DIR}}
  save_every: {{RLHF_SAVE_EVERY}}
  eval_every: {{RLHF_EVAL_EVERY}}
  num_eval_prompts: 50

  # Device
  device: {{RLHF_DEVICE}}

  # Weights & Biases logging
  use_wandb: true
  wandb_project: ava-rlhf
  wandb_name: {{RLHF_WANDB_NAME}}

  # PPO configuration
  ppo:
    # Learning rate and optimization
    learning_rate: {{RLHF_PPO_LEARNING_RATE}}
    batch_size: {{RLHF_PPO_BATCH_SIZE}}
    mini_batch_size: {{RLHF_PPO_MINI_BATCH_SIZE}}
    gradient_accumulation_steps: {{RLHF_PPO_GRADIENT_ACCUMULATION_STEPS}}
    max_grad_norm: {{RLHF_PPO_MAX_GRAD_NORM}}

    # PPO hyperparameters
    ppo_epochs: 4
    clip_range: 0.2
    clip_range_value: 0.2
    value_loss_coef: 0.5
    entropy_coef: 0.01
    gamma: 1.0
    lambda: 0.95

    # KL divergence penalty
    kl_penalty: kl
    target_kl: {{RLHF_PPO_TARGET_KL}}
    init_kl_coef: {{RLHF_PPO_INIT_KL_COEF}}
    adaptive_kl: true

    # Generation settings
    max_gen_length: {{RLHF_PPO_MAX_GEN_LENGTH}}
    temperature: 1.0
    top_k: 50
    top_p: 0.95

    # Training schedule
    num_train_epochs: 1
    max_steps: null
    warmup_steps: {{RLHF_PPO_WARMUP_STEPS}}
    logging_steps: 10
    save_steps: {{RLHF_SAVE_EVERY}}
    eval_steps: {{RLHF_EVAL_EVERY}}

    # Reward processing
    use_score_scaling: true
    use_score_norm: true
    whiten_rewards: true
    clip_reward: 10.0

    # Memory optimization
    gradient_checkpointing: {{RLHF_PPO_GRADIENT_CHECKPOINTING}}
    mixed_precision: {{RLHF_PPO_MIXED_PRECISION}}
