  EXPERT_CAPACITY_FACTOR: 1.5
  USE_MOH: true
  USE_MOA: true
  USE_RAG: true
  USE_CROSS_ATTENTION: true
  USE_EPISODIC_MEMORY: true
  BATCH_SIZE: 2
  GRADIENT_ACCUMULATION_STEPS: 16
  MAX_GRADIENT_NORM: 5.0
  NUM_EPOCHS: 5
  MAX_STEPS: 50000
  WARMUP_STEPS: 2000
  GRADIENT_CHECKPOINTING: true
  EVAL_STEPS: 200
  SAVE_STEPS: 500
  LOGGING_STEPS: 25
  EARLY_STOPPING_PATIENCE: 5
  EARLY_STOPPING_THRESHOLD: 0.005
  MAX_EVAL_EXAMPLES: 2000
  BUFFER_SIZE: 10000
  MULTI_COLUMN: true
  DISTRIBUTED: true
  POOL_SIZE_GB: 20.0
  MEMORY_THRESHOLD_GB: 20.0
  ENABLE_MEMORY_POOL: true
  CLEAR_CACHE_FREQUENCY: 50
  OUTPUT_SAVE_TOTAL_LIMIT: 3
  EVAL_METRICS: perplexity,bleu,rouge
  COMPREHENSIVE_EVAL: true
  OUTPUT_DIR: outputs/large
  EXPERIMENT_NAME: ava-large-enhanced
  WANDB_PROJECT: ava-moe-gpu-large-enhanced
  FOCAL_LOSS: true
  CONTRASTIVE_LOSS: true
  DIVERSITY_LOSS: true
  ADAPTIVE_LOSS_SCALING: true
  GRADIENT_SURGERY: true
  ADAPTIVE_GRADIENT_SURGERY: true
  GRADIENT_NORM_TRACKING: true
  GRADIENT_ANOMALY_DETECTION: true
  MEMORY_CAPACITY: 2000
  MEMORY_IMPORTANCE_THRESHOLD: 0.6
  QUANTIZATION_AWARE: true
  USE_NVFP4_QUANT: true
  BIT_WIDTH: 4
  STOCHASTIC_ROUNDING: true
  USE_DEEPSPEED: true
  DEEPSPEED_ZERO_STAGE: 2
  DEEPSPEED_TRAIN_BATCH_SIZE: 32
  DEEPSPEED_MICRO_BATCH_SIZE: 2
  DEEPSPEED_ACTIVATION_CHECKPOINTING: true
  RLHF_NUM_EPOCHS: 2
  RLHF_ROLLOUT_BATCH_SIZE: 8
  RLHF_NUM_ROLLOUTS_PER_EPOCH: 1000
  RLHF_MAX_PROMPT_LENGTH: 2048
  RLHF_SAVE_DIR: outputs/rlhf/large
  RLHF_LOG_DIR: logs/rlhf/large
  RLHF_SAVE_EVERY: 250
  RLHF_EVAL_EVERY: 125
  RLHF_WANDB_NAME: rlhf-large-v1
  RLHF_PPO_LEARNING_RATE: 3.0e-7
  RLHF_PPO_BATCH_SIZE: 8
  RLHF_PPO_MINI_BATCH_SIZE: 2
  RLHF_PPO_GRADIENT_ACCUMULATION_STEPS: 8
  RLHF_PPO_MAX_GRAD_NORM: 0.3
  RLHF_PPO_TARGET_KL: 0.005
  RLHF_PPO_INIT_KL_COEF: 0.3
  RLHF_PPO_WARMUP_STEPS: 50
  RLHF_PPO_GRADIENT_CHECKPOINTING: true
  RLHF_PPO_MIXED_PRECISION: bf16
