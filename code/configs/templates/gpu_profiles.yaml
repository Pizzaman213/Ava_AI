# GPU Configuration Profiles
# Common parameters for different model sizes

# Base/default values shared across all profiles
defaults:
  VOCAB_SIZE: 65536
  ROUTER_AUX_LOSS_COEF: 0.01
  ROUTER_JITTER_NOISE: 0.0
  ROPE_THETA: 10000.0
  LAYER_NORM_EPS: 1e-5
  INITIALIZER_RANGE: 0.02
  BETA1: 0.9
  SHUFFLE_SEED: 42
  DATA_DIR: /project/code/data/processed
  TOKENIZER_NAME: /project/code/models/tokenizer/enhanced-65k
  PADDING_SIDE: right
  TRUNCATION: true
  DATALOADER_DROP_LAST: true
  MIXING_TEMPERATURE: 1.0
  DROP_LAST_BATCH: true
  DEVICE: auto
  LR_WARMUP_RATIO: 0.1
  LR_DECAY_RATIO: 0.1
  SYNC_GRADIENTS_EACH_STEP: false
  USE_KAHAN_SUMMATION: true
  USE_STABLE_EMBEDDING: true
  MAX_GRAD_NORM_BEFORE_STOP: 100.0
  MAX_LOSS_BEFORE_STOP: 20.0
  EVAL_STRATEGY: steps
  SAVE_STRATEGY: steps
  USE_CACHE: true
  DO_SAMPLE: true
  NUM_BEAMS: 1

# Tiny config - for ultra-fast testing
tiny:
  # Model
  HIDDEN_SIZE: 256
  NUM_LAYERS: 6
  NUM_ATTENTION_HEADS: 4
  INTERMEDIATE_SIZE: 1024
  MAX_POSITION_EMBEDDINGS: 512
  NUM_EXPERTS: 2
  NUM_EXPERTS_PER_TOKEN: 1
  EXPERT_CAPACITY_FACTOR: 1.0
  ROUTER_TYPE: switch
  ATTENTION_DROPOUT: 0.1
  HIDDEN_DROPOUT: 0.1
  HIDDEN_ACT: gelu
  USE_MOH: false
  USE_MOA: false
  USE_RAG: false
  USE_CROSS_ATTENTION: false
  USE_EPISODIC_MEMORY: false
  TIE_WORD_EMBEDDINGS: true

  # Training
  BATCH_SIZE: 16
  GRADIENT_ACCUMULATION_STEPS: 1
  MAX_GRADIENT_NORM: 1.0
  NUM_EPOCHS: 5
  MAX_STEPS: 10000
  WARMUP_STEPS: 500
  WARMUP_SCHEDULE: linear
  LEARNING_RATE: 0.001
  WEIGHT_DECAY: 0.1
  BETA2: 0.999
  EPS: 1e-8
  LR_SCHEDULER_TYPE: cosine
  LR_END: 0.0001
  REPETITION_PENALTY_WEIGHT: 0.0
  IMMEDIATE_REPETITION_WEIGHT: 0.0
  MIN_SEQUENCE_LENGTH: 10
  EOS_PENALTY_WEIGHT: 1.0
  MIXED_PRECISION: fp16
  DATALOADER_NUM_WORKERS: 4
  GRADIENT_CHECKPOINTING: false
  EVAL_STEPS: 500
  SAVE_STEPS: 1000
  LOGGING_STEPS: 50
  EARLY_STOPPING_PATIENCE: 5
  EARLY_STOPPING_THRESHOLD: 0.01
  INITIAL_CLIP_VALUE: 2.0
  FINAL_CLIP_VALUE: 1.0
  EXPLOSION_THRESHOLD: 10.0
  EXPLOSION_WINDOW: 5
  LR_REDUCTION_FACTOR: 0.5

  # Data
  MAX_LENGTH: 512
  MAX_TRAIN_EXAMPLES: 10000
  MAX_EVAL_EXAMPLES: 1000
  DATALOADER_PIN_MEMORY: true
  STREAMING: false
  BUFFER_SIZE: 1000
  MAX_SAMPLES: 10000
  MULTI_COLUMN: false
  USE_MULTI_COLUMN: false
  DISTRIBUTED: false
  NUM_WORKERS: 4
  ENABLE_BUCKETING: false
  USE_WEIGHTED_MIXING: false
  RESHUFFLE_EACH_EPOCH: true
  PREFETCH_FACTOR_DATA: 2
  PERSISTENT_WORKERS_DATA: false

  # Performance
  FP16: true
  BF16: false
  ULTRA_FAST_MODE: true
  EXPRESS_MODE: true
  ENABLE_MEMORY_POOL: false
  POOL_SIZE_GB: 4.0
  MEMORY_THRESHOLD_GB: 4.0
  ENABLE_CPU_OFFLOAD: false
  CLEAR_CACHE_FREQUENCY: 500
  TARGET_UTILIZATION: 0.75
  WARNING_THRESHOLD: 0.85
  CRITICAL_THRESHOLD: 0.90
  EMERGENCY_THRESHOLD: 0.95

  # Evaluation
  EVAL_METRICS: perplexity
  COMPREHENSIVE_EVAL: false
  TRACK_EXPERT_UTIL: false
  TRACK_ROUTING_ENTROPY: false
  TRACK_LOAD_BALANCE: false
  TRACK_EXPERT_SPEC: false

  # Output
  OUTPUT_DIR: outputs/tiny
  OUTPUT_SAVE_TOTAL_LIMIT: 2
  EXPERIMENT_NAME: ava-tiny

  # Generation
  GEN_REPETITION_PENALTY: 1.2
  GEN_EOS_PENALTY: 0.5
  GEN_MIN_LENGTH: 10
  GEN_TEMPERATURE: 1.0
  GEN_TOP_K: 50
  GEN_TOP_P: 0.9
  GEN_USE_NGRAM_BLOCKING: false
  GEN_NGRAM_SIZE: 3
  GEN_NO_REPEAT_NGRAM_SIZE: 0

  # Enhanced Features
  USE_ALIBI: false
  RAG_KB_PATH: null
  RAG_MAX_DOCS: 5
  RAG_FUSION_TYPE: concatenate
  USE_MULTI_TOKEN_PREDICTION: false
  NUM_FUTURE_TOKENS: 1
  MTP_WEIGHT: 0.01
  INITIAL_TEMPERATURE: 1.0
  ADAPTIVE_TEMPERATURE: false
  LOSS_LABEL_SMOOTHING: 0.0
  USE_MOE_BALANCING: false
  GRADIENT_BALANCE_WEIGHT: 0.0
  FOCAL_LOSS: false
  CONTRASTIVE_LOSS: false
  DIVERSITY_LOSS: false
  AUXILIARY_LOSS: false
  ADAPTIVE_LOSS_SCALING: false
  CONTRASTIVE_LOSS_WEIGHT: 0.0
  DIVERSITY_LOSS_WEIGHT: 0.0
  GRADIENT_SURGERY: false
  ADAPTIVE_GRADIENT_SURGERY: false
  GRADIENT_SURGERY_METHOD: pcgrad
  GRADIENT_NORM_TRACKING: false
  GRADIENT_ANOMALY_DETECTION: false
  MEMORY_CAPACITY: 100
  MEMORY_SELECTION_STRATEGY: importance
  MEMORY_IMPORTANCE_THRESHOLD: 0.7
  MEMORY_ADAPTATION_RATE: 0.01
  QUANTIZATION_AWARE: false
  USE_NVFP4_QUANT: false
  BIT_WIDTH: 8
  NVFP4_BLOCK_SIZE: 64
  STOCHASTIC_ROUNDING: false

  # DeepSpeed
  USE_DEEPSPEED: false
  DEEPSPEED_ZERO_STAGE: 0
  DEEPSPEED_CPU_OFFLOAD: false
  DEEPSPEED_NVME_OFFLOAD: false
  DEEPSPEED_PRECISION_TYPE: fp16
  DEEPSPEED_TRAIN_BATCH_SIZE: 16
  DEEPSPEED_MICRO_BATCH_SIZE: 16
  DEEPSPEED_ACTIVATION_CHECKPOINTING: false

  # RLHF
  RLHF_POLICY_MODEL_PATH: /project/code/outputs/runs/latest/model
  RLHF_JUDGE_MODEL_PATH: /project/code/outputs/runs/latest/model
  RLHF_REWARD_MODEL_PATH: null
  RLHF_PROMPT_DATASET_PATH: /project/code/data/rlhf/prompts.json
  RLHF_EVAL_PROMPT_DATASET_PATH: /project/code/data/rlhf/eval_prompts.json
  RLHF_NUM_EPOCHS: 3
  RLHF_ROLLOUT_BATCH_SIZE: 8
  RLHF_NUM_ROLLOUTS_PER_EPOCH: 200
  RLHF_MAX_PROMPT_LENGTH: 512
  RLHF_SAVE_DIR: outputs/rlhf/tiny
  RLHF_LOG_DIR: logs/rlhf/tiny
  RLHF_SAVE_EVERY: 500
  RLHF_EVAL_EVERY: 250
  RLHF_DEVICE: cuda
  RLHF_WANDB_NAME: rlhf-tiny-v1
  RLHF_PPO_LEARNING_RATE: 1.0e-6
  RLHF_PPO_BATCH_SIZE: 8
  RLHF_PPO_MINI_BATCH_SIZE: 2
  RLHF_PPO_GRADIENT_ACCUMULATION_STEPS: 2
  RLHF_PPO_MAX_GRAD_NORM: 0.5
  RLHF_PPO_TARGET_KL: 0.01
  RLHF_PPO_INIT_KL_COEF: 0.2
  RLHF_PPO_MAX_GEN_LENGTH: 128
  RLHF_PPO_WARMUP_STEPS: 50
  RLHF_PPO_GRADIENT_CHECKPOINTING: false
  RLHF_PPO_MIXED_PRECISION: fp16

  # Wandb
  WANDB_PROJECT: ava-tiny
  STOP_ON_NAN: false
  LR_FINDER_NUM_ITERATIONS: 100
  LR_FINDER_USE_SUGGESTED: false

# Small config (100M params)
small:
  inherits: tiny
  # Override specific values
  HIDDEN_SIZE: 512
  NUM_LAYERS: 12
  NUM_ATTENTION_HEADS: 8
  INTERMEDIATE_SIZE: 1536
  MAX_POSITION_EMBEDDINGS: 256
  NUM_EXPERTS: 4
  NUM_EXPERTS_PER_TOKEN: 2
  ROUTER_TYPE: deepseek
  BATCH_SIZE: 48
  MAX_STEPS: null
  WARMUP_STEPS: 500
  LEARNING_RATE: 0.0006
  OUTPUT_DIR: outputs/small_enhanced
  EXPERIMENT_NAME: ava-small-enhanced
  WANDB_PROJECT: Ava
  MAX_TRAIN_EXAMPLES: null
  MAX_SAMPLES: null
  BF16: true
  FP16: false
  POOL_SIZE_GB: 22.0
  MEMORY_THRESHOLD_GB: 23.0
  NUM_WORKERS: 16
  STREAMING: true
  BUFFER_SIZE: 5000

# Base config (500M params)
base:
  inherits: small
  HIDDEN_SIZE: 768
  NUM_LAYERS: 16
  NUM_ATTENTION_HEADS: 12
  INTERMEDIATE_SIZE: 3072
  MAX_POSITION_EMBEDDINGS: 2048
  NUM_EXPERTS: 16
  NUM_EXPERTS_PER_TOKEN: 2
  ROUTER_TYPE: switch
  BATCH_SIZE: 8
  GRADIENT_ACCUMULATION_STEPS: 4
  MAX_STEPS: 40000
  WARMUP_STEPS: 2000
  LEARNING_RATE: 0.00042
  LR_END: 0.0001
  REPETITION_PENALTY_WEIGHT: 0.5
  IMMEDIATE_REPETITION_WEIGHT: 1.0
  MIN_SEQUENCE_LENGTH: 20
  EOS_PENALTY_WEIGHT: 5.0
  MIXED_PRECISION: fp16
  DATALOADER_NUM_WORKERS: 8
  EVAL_STEPS: 500
  SAVE_STEPS: 1000
  MAX_LENGTH: 1024
  MAX_EVAL_EXAMPLES: 1000
  BUFFER_SIZE: 15000
  USE_WEIGHTED_MIXING: true
  OUTPUT_DIR: outputs/base
  EXPERIMENT_NAME: ava-base-enhanced
  WANDB_PROJECT: ava-moe-gpu-base
  POOL_SIZE_GB: 16.0
  MEMORY_THRESHOLD_GB: 16.0
  AUXILIARY_LOSS: true
  RLHF_ROLLOUT_BATCH_SIZE: 16
  RLHF_NUM_ROLLOUTS_PER_EPOCH: 800
  RLHF_MAX_PROMPT_LENGTH: 1024
  RLHF_SAVE_DIR: outputs/rlhf/base
  RLHF_LOG_DIR: logs/rlhf/base
  RLHF_WANDB_NAME: rlhf-base-v1
  RLHF_PPO_LEARNING_RATE: 8.0e-7
  RLHF_PPO_BATCH_SIZE: 16
  RLHF_PPO_MINI_BATCH_SIZE: 4
  RLHF_PPO_GRADIENT_ACCUMULATION_STEPS: 4
  RLHF_PPO_WARMUP_STEPS: 100
  RLHF_PPO_MAX_GEN_LENGTH: 256
  RLHF_PPO_GRADIENT_CHECKPOINTING: true

# Large config (1.5B params)
