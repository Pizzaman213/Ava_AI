# ============================================================
# TINY CONFIGURATION - OPTIMIZED FOR ~25M PARAMETERS
# ============================================================
#
# Category: MPS (Apple Metal Performance Shaders)
# Model Size: ~25M parameters
# Device: Apple Silicon (M1/M2/M3)
# Optimization Level: LIGHT
# Use Case: Resource-constrained environments with core features
#
# DESCRIPTION:
# Lightweight configuration for resource-constrained environments.
# Includes core MoE features with minimal overhead.
# Perfect for rapid prototyping and development work.
#
# USAGE:
#   python3 train_simple.py --config configs/mps/tiny.yaml
#   python3 interact.py --model outputs/tiny.pt
#
# ============================================================

# ============================================================
# MODEL ARCHITECTURE
# ============================================================

model:
  # ---------- Core Architecture ----------
  size: tiny                      # Model size preset
  vocab_size: 50257               # GPT-2 tokenizer vocabulary
  hidden_size: 256                # Hidden dimension (reduced for tiny model)
  num_layers: 4                   # Number of transformer layers (minimal for speed)
  intermediate_size: 1024         # FFN intermediate dimension (4x hidden for tiny)
  
  # ---------- Attention Configuration ----------
  num_attention_heads: 4          # Number of attention heads (reduced for tiny)
  num_key_value_heads: 2          # For GQA (Grouped Query Attention) - reduces memory
  attention_type: gqa             # Options: mha, mqa, gqa (grouped query attention)
  use_flash_attn: false           # Flash Attention (not supported on MPS yet)
  attention_dropout: 0.2          # Dropout in attention layers
  
  # ---------- Position Encoding ----------
  max_position_embeddings: 1024   # Maximum sequence length
  rope_theta: 10000.0             # RoPE base frequency
  
  # ---------- Mixture of Experts (MoE) ----------
  num_experts: 2                  # Total number of experts (minimal for tiny)
  num_experts_per_tok: 1          # Active experts per token
  expert_capacity_factor: 1.25    # Capacity factor for load balancing
  expert_routing_type: switch     # Options: switch, gshard, base
  expert_dropout: 0.25            # Dropout for expert layers
  
  # ---------- Activation & Initialization ----------
  hidden_act: swiglu              # Activation function (swiglu for better performance)
  initializer_range: 0.02         # Weight initialization range
  rms_norm_eps: 1.0e-06          # RMSNorm epsilon for stability
  
  # ---------- Regularization ----------
  hidden_dropout: 0.3             # General dropout rate
  label_smoothing: 0.1            # Label smoothing for loss regularization
  
  # ---------- Caching & Optimization ----------
  use_cache: true                 # Enable KV caching for inference
  gradient_checkpointing: true    # Trade compute for memory
  use_memory_efficient_attention: true  # Memory-efficient attention implementation
  
  # ---------- Advanced Features ----------
  # Mixture of Depths (MoD) - Dynamic layer skipping
  use_mod: true                   # Enable Mixture of Depths
  mod_mode: learned               # Options: learned, fixed, adaptive
  mod_skip_fraction: 0.1          # Fraction of layers to skip
  
  # Speculative Decoding
  use_speculative_decoding: false # Faster inference with draft model (disabled for tiny)
  speculative_draft_layers: 0     # Number of draft layers
  
  # Expert System Features
  use_hierarchical_moe: false     # Hierarchical expert routing (disabled for tiny)
  use_continuous_experts: false   # Continuous expert selection (disabled)
  use_sparse_experts: false       # Sparse expert activation (disabled)
  use_expert_cache: true          # Cache expert selections
  
  # Advanced Architecture Components
  use_mod_plus_plus: true         # Enhanced MoD with confidence
  use_memory_augmented: false     # External memory mechanisms (disabled)
  use_adaptive_inference: true    # Dynamic computation graphs
  use_interpretability: false     # Built-in interpretability (disabled)
  
  # Multi-Modal & Specialized Features
  use_mixture_tokenizers: false   # Multiple tokenizer support (disabled)
  use_nas_experts: false          # Neural architecture search (disabled)
  use_meta_learning: false        # Meta-learning capabilities (disabled)
  use_federated_learning: false   # Federated learning support (disabled)
  use_continual_learning: false   # Continual learning without forgetting (disabled)
  use_advanced_pretraining: false # Advanced pretraining objectives (disabled)
  use_rlaif: false               # RL from AI feedback (disabled)
  
  # Specialized Expert Types
  use_code_experts: false         # Code-specialized experts (disabled)
  use_scientific_experts: false   # Science/math experts (disabled)
  use_tool_experts: false         # Tool-use experts (disabled)
  use_vision_language: false      # Vision-language capabilities (disabled)
  use_audio_language: false       # Audio-language capabilities (disabled)
  
  # Training & Inference Features
  use_adversarial_training: false # Adversarial robustness (disabled)
  use_bias_mitigation: false      # Bias reduction mechanisms (disabled)
  use_privacy_preserving: false   # Privacy-preserving training (disabled)
  use_watermarking: false         # Model watermarking (disabled)
  
  # System Integration
  use_distributed_experts: false  # Distributed expert computation (disabled)
  use_mixed_precision: false      # Enable mixed precision training (disabled for tiny)
  use_torch_compile: false        # PyTorch 2.0 compilation (disabled)
  use_fused_kernels: false       # Fused CUDA kernels (not for MPS)
  
  # Research & Development Features
  use_diverse_beam_search: false  # Diverse beam search (disabled)
  use_mixture_decoders: false     # Multiple decoder heads (disabled)
  use_streaming_generation: false # Streaming text generation (disabled)
  use_batch_optimized: false      # Batch-optimized inference (disabled)
  use_synthetic_data: true        # Synthetic data generation (enabled for tiny)
  use_online_learning: false      # Online learning capability (disabled)
  use_multi_task_learning: false  # Multi-task learning (disabled)
  use_automated_curation: false   # Automated data curation (disabled)
  use_cross_lingual: false        # Cross-lingual transfer (disabled)
  use_edge_deployment: false      # Edge deployment optimization (disabled)
  use_ab_testing: false           # A/B testing framework (disabled)
  use_model_versioning: false     # Model versioning system (disabled)
  use_cost_optimization: false    # Cost-aware optimization (disabled)
  use_global_load_balancing: false # Global load balancing (disabled)
  
  # Experimental Features
  use_quantum_inspired: false     # Quantum-inspired algorithms (disabled)
  use_neuromorphic: false         # Neuromorphic computing (disabled)
  use_self_modifying: false       # Self-modifying networks (disabled)
  use_causal_reasoning: false     # Causal reasoning (disabled)
  use_visual_builder: false       # Visual model builder (disabled)
  use_automated_docs: false       # Automated documentation (disabled)
  use_interactive_debug: false    # Interactive debugging (disabled)
  use_playground: false           # Model playground (disabled)
  use_benchmarking: false         # Automated benchmarking (disabled)

# ============================================================
# DATA CONFIGURATION
# ============================================================
data:
  # ---------- Dataset Settings ----------
  dataset_type: auto               # Dataset type (auto-detect format)
  train_paths:                     # Training data paths (supports wildcards)
    - ./data/pretraining/processed_ace_full/batch_*
  val_path: ./data/pretraining/processed_ace_full/batch_*
  
  # ---------- Tokenization ----------
  tokenizer: gpt2                  # Tokenizer to use
  max_length: 512                  # Maximum sequence length
  stride: 512                      # Stride for sequences (no overlap to reduce count)
  
  # ---------- Data Loading ----------
  max_train_examples: 5000         # Max training examples (limited for quick training)
  max_val_examples: 1000           # Max validation examples
  
  # ---------- DataLoader Settings ----------
  parallel_loading: true           # Enable parallel data loading
  num_workers: 0                   # DataLoader workers (0 for MPS to reduce memory)
  prefetch_factor: 2               # Prefetch factor
  persistent_workers: false        # Persistent workers (false to reduce memory)
  pin_memory: false                # Pin memory (false for MPS)
  
  # ---------- Dataset Arguments ----------
  dataset_args:
    text_column: text              # Column name for text data
    streaming: false               # Disable streaming for faster loading
    num_proc: 8                    # Number of processes for data processing
    shuffle_buffer_size: 10000     # Buffer size for shuffling
    prefetch_buffer_size: 1000     # Prefetch buffer size

# ============================================================
# TRAINING CONFIGURATION
# ============================================================
training:
  # ---------- Basic Training ----------
  batch_size: 16                  # Batch size per device (reasonable for tiny model)
  gradient_accumulation_steps: 2  # Gradient accumulation (effective batch = 32)
  num_epochs: 5                   # Number of training epochs
  max_steps: -1                   # Max steps (-1 = use epochs)
  
  # ---------- Learning Rate ----------
  learning_rate: 1e-3             # Base learning rate
  warmup_steps: 100               # Warmup steps
  warmup_ratio: 0.1               # Warmup ratio (alternative to steps)
  
  # ---------- Optimizer Configuration ----------
  optimizer: lion                 # Optimizer: adamw, lion
  weight_decay: 0.01              # L2 regularization
  lion_beta1: 0.9                 # Lion beta1 (momentum)
  lion_beta2: 0.95                # Lion beta2 (variance)
  lion_epsilon: 1e-8              # Lion epsilon
  
  # Layer-wise Learning Rates
  use_layer_lr_scaling: true       # Enable layer-wise LR scaling
  lr_layer_scale: 0.5              # Scale for layer-wise LR (embeddings get lr*0.5)
  gradient_centralization: true    # Center gradients (improves stability)
  
  # ---------- Learning Rate Scheduling ----------
  lr_scheduler_type: cosine       # Scheduler: cosine, linear, polynomial, onecycle
  scheduler: cosine               # Alternative scheduler setting
  
  # ---------- Gradient Management ----------
  max_grad_norm: 1.0              # Gradient clipping threshold
  gradient_clip: 1.0              # Alternative gradient clipping
  adaptive_gradient_clipping: true # Dynamic gradient clipping
  gradient_penalty_weight: 0.001   # Penalize large gradients
  
  # ---------- Mixed Precision ----------
  mixed_precision: bfloat16        # Mixed precision: false, fp16, bfloat16
  gradient_checkpointing: true     # Gradient checkpointing (saves memory)
  
  # ---------- Loss Functions ----------
  # Focal Loss - Focus on hard examples
  use_focal_loss: true             # Enable focal loss
  focal_gamma: 2.0                 # Focal loss gamma (focus strength)
  focal_alpha: 0.25                # Focal loss alpha
  focal_blend: 0.3                 # Blend with standard loss (30% focal)
  
  # ---------- Anti-Collapse Features ----------
  entropy_regularization_weight: 0.01      # Encourage output diversity
  token_frequency_penalty_weight: 0.1      # Penalize repetitive tokens
  expert_diversity_weight: 0.01            # Encourage expert specialization
  
  # ---------- Curriculum Learning ----------
  curriculum_learning: true       # Enable curriculum learning
  initial_sequence_length: 256    # Start with short sequences
  curriculum_warmup_steps: 1000   # Steps to reach full length
  
  # Progressive Sequence Growth
  progressive_sequence_growth: true # Continue growing beyond initial target
  sequence_growth_rate: 1.25       # Growth multiplier per phase
  sequence_growth_interval: 2000   # Steps between growth phases
  # Growth schedule: 256 -> 320 -> 400 -> 500 -> 625 -> 781 -> 976 -> 1024
  
  # ---------- Anti-Overfitting Features ----------
  stochastic_depth_prob: 0.1       # Randomly drop layers
  mixout_prob: 0.1                 # Mix weights with initialization
  use_ema: true                    # Exponential moving average
  ema_decay: 0.999                 # EMA decay rate
  confidence_weighting: true       # Weight loss by confidence
  sam_enabled: false               # Sharpness-aware minimization (expensive)
  
  # ---------- Evaluation & Checkpointing ----------
  eval_steps: 100                 # Evaluation frequency
  eval_strategy: steps            # Evaluation strategy: steps, epoch
  save_steps: 200                 # Checkpoint frequency
  save_total_limit: 2             # Max checkpoints to keep
  logging_steps: 10               # Logging frequency
  logging_first_step: true        # Log first step
  
  # ---------- DataLoader Settings ----------
  dataloader_num_workers: 0       # DataLoader workers (0 for MPS)
  dataloader_pin_memory: false    # Pin memory (false for MPS)
  dataloader_prefetch_factor: 2   # Prefetch factor
  dataloader_persistent_workers: false  # Persistent workers
  dataloader_drop_last: false     # Drop incomplete batches
  
  # ---------- Model Selection ----------
  load_best_model_at_end: true    # Load best model after training
  metric_for_best_model: loss     # Metric for best model
  greater_is_better: false        # Lower loss is better
  resume_from_checkpoint: true    # Resume from checkpoint if exists
  
  # ---------- Device Settings ----------
  device: mps                     # Device: mps, cuda, cpu
  zero_stage: 0                   # ZeRO optimization stage

# ============================================================
# DISTRIBUTED TRAINING
# ============================================================
distributed: false                # Enable distributed training
num_gpus: 1                      # Number of GPUs
device_map: mps                  # Device mapping
offload_folder: null             # CPU offload folder
low_cpu_mem_usage: true          # Low CPU memory mode

# ============================================================
# OUTPUT & EXPERIMENT
# ============================================================

output_dir: ./outputs             # Output directory for checkpoints
overwrite_output_dir: false       # Overwrite existing output directory
experiment_name: moe_tiny_mps     # Experiment name for tracking
logging_level: INFO               # Logging level: DEBUG, INFO, WARNING, ERROR
report_to:                       # Reporting backends
- tensorboard
seed: 42                         # Random seed for reproducibility

# ============================================================
# FINE-TUNING CONFIGURATION
# ============================================================
fine_tuning:
  # ---------- LoRA Configuration ----------
  use_lora: true                  # Enable LoRA fine-tuning
  use_qlora: false                # Enable QLoRA (quantized)
  freeze_base_model: true         # Freeze base model weights
  lora_r: 8                       # LoRA rank
  lora_alpha: 16                  # LoRA alpha (scaling)
  lora_dropout: 0.1               # LoRA dropout
  
  # ---------- LoRA Target Modules ----------
  lora_target_modules:            # Modules to apply LoRA to
  - q_proj
  - v_proj
  - k_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  
  # ---------- LoRA Additional Modules ----------
  lora_modules_to_save:           # Additional modules to save
  - embed_tokens
  - lm_head
  
  # ---------- Fine-tuning Training ----------
  batch_size: 16                  # Fine-tuning batch size
  gradient_accumulation_steps: 2  # Gradient accumulation
  learning_rate: 3e-4             # Fine-tuning learning rate
  num_epochs: 5                   # Fine-tuning epochs
  warmup_ratio: 0.1               # Warmup ratio
  weight_decay: 0.01              # Weight decay for fine-tuning
  
  # ---------- Dataset Configuration ----------
  dataset_name: null              # Dataset name (if using HF datasets)
  dataset_config: null            # Dataset config
  text_field: text                # Text field name
  max_length: 512                 # Max sequence length for fine-tuning
  truncation: true                # Enable truncation
  padding: max_length             # Padding strategy
  
  # ---------- Task Configuration ----------
  task_type: causal_lm            # Task type: causal_lm, seq2seq_lm
  num_labels: null                # Number of labels (for classification)
  label_field: label              # Label field name
  
  # ---------- Evaluation & Saving ----------
  eval_strategy: steps            # Evaluation strategy: steps, epoch
  eval_steps: 100                 # Eval steps (if using steps)
  metric_for_best_model: eval_loss # Metric for best model selection
  greater_is_better: false        # Lower loss is better
  save_strategy: steps            # Save strategy: steps, epoch
  save_total_limit: 3             # Max checkpoints to keep
  load_best_model_at_end: true    # Load best model after training
  
  # ---------- Early Stopping ----------
  early_stopping: true            # Enable early stopping
  early_stopping_patience: 3      # Patience (evaluations)
  early_stopping_threshold: 0.001 # Improvement threshold
  min_delta: 0.0005              # Minimum change

# ============================================================
# CONTINUOUS BATCHING (INFERENCE OPTIMIZATION)
# ============================================================
continuous_batching:
  enabled: true                   # Enable continuous batching for inference
  max_batch_size: 48             # Maximum batch size
  min_batch_size: 1              # Minimum batch size
  batch_timeout_ms: 75           # Timeout for batch formation (milliseconds)
  memory_fraction: 0.85          # Fraction of memory to use
  enable_sequence_packing: true  # Pack sequences for efficiency
  enable_request_reordering: true # Reorder requests for optimization
  enable_preemption: true        # Allow request preemption
  adaptive_batch_size: true      # Dynamically adjust batch size
  num_workers: 3                 # Number of worker threads

# ============================================================
# QUANTIZATION CONFIGURATION
# ============================================================

quantization:
  enabled: false                 # Enable quantization (disabled for tiny)
  method: awq                    # Quantization method: awq, gptq, bnb
  bits: 8                        # Number of bits for quantization
  group_size: 128                # Group size for quantization
  symmetric: true                # Use symmetric quantization
  use_cuda_kernel: false         # Use CUDA kernels (not available on MPS)
  calibration_samples: 64        # Samples for calibration

# ============================================================
# PAGED ATTENTION CONFIGURATION
# ============================================================

paged_attention:
  enabled: true                  # Enable paged attention for memory efficiency
  block_size: 16                 # Block size for paging
  num_blocks: 384                # Total number of blocks
  max_blocks_per_seq: 192        # Maximum blocks per sequence
  enable_prefix_caching: true    # Enable prefix caching
  swap_space_gb: 4               # Swap space in GB

# ============================================================
# CUDA KERNELS (NOT APPLICABLE FOR MPS)
# ============================================================

cuda_kernels:
  use_fused_attention: false     # Fused attention kernels (not for MPS)
  use_fused_mlp: false           # Fused MLP kernels (not for MPS)
  use_fused_layernorm: false     # Fused LayerNorm kernels (not for MPS)
  use_triton: false              # Triton kernels (not for MPS)
  compile_kernels: false         # Compile custom kernels (not for MPS)

# ============================================================
# HIERARCHICAL KV CACHE
# ============================================================

hierarchical_kv_cache:
  enabled: true                  # Enable hierarchical KV caching
  gpu_cache_size_gb: 4.0         # GPU cache size
  cpu_cache_size_gb: 24.0        # CPU cache size
  nvme_cache_size_gb: 96.0       # NVMe cache size
  eviction_policy: adaptive      # Cache eviction policy: lru, adaptive
  prefetch_distance: 3           # Prefetch distance for cache
  async_transfers: true          # Enable async transfers
  num_async_workers: 3           # Number of async workers
  gpu_memory_threshold: 0.85     # GPU memory threshold for eviction
  cpu_memory_threshold: 0.85     # CPU memory threshold for eviction
  promotion_threshold: 3         # Threshold for cache promotion

# ============================================================
# MEMORY OPTIMIZATION
# ============================================================

memory_optimization:
  gradient_checkpointing: true   # Recompute activations to save memory
  cpu_offload: false             # Offload to CPU (disabled for tiny)
  optimizer_offload: false       # Offload optimizer states (disabled)
  parameter_offload: false       # Offload parameters (disabled)
  activation_checkpointing: true # Checkpoint activations
  memory_efficient_attention: true # Memory-efficient attention implementation

# ============================================================
# INFERENCE CONFIGURATION
# ============================================================

inference:
  use_flash_attn: false          # Flash Attention (not supported on MPS)
  torch_compile: false           # PyTorch 2.0 compilation (disabled)
  dtype: float16                 # Inference data type: float16, bfloat16, float32

# ============================================================
# MPS OPTIMIZATION (Apple Silicon Specific)
# ============================================================

mps_optimization:
  use_metal_performance_shaders: true  # Use Metal shaders for optimization
  enable_unified_memory: true          # Unified memory architecture
  max_memory_gb: 16                    # Maximum memory usage (moderate for tiny)
  memory_fraction: 0.7                 # Memory fraction to use

# ============================================================
# MONITORING CONFIGURATION
# ============================================================

monitoring:
  use_health_monitoring: false   # Health monitoring (disabled for simplicity)
  check_interval: 100            # Check interval (steps)
  enable_alerts: true            # Enable alerts
  enable_visualization: false    # Enable visualizations (disabled)
  use_wandb: false              # Use Weights & Biases (disabled for tiny)
  wandb_project: null           # W&B project name
  wandb_name: null              # W&B run name
  wandb_tags: null              # W&B tags
