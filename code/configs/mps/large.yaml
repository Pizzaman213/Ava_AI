# ============================================================
# LARGE CONFIGURATION - OPTIMIZED FOR 1B PARAMETERS
# ============================================================
#
# Category: MPS (Apple Metal Performance Shaders)
# Model Size: ~650M-1B parameters
# Device: Apple Silicon (M1/M2/M3)
# Optimization Level: MAXIMUM
# Use Case: Advanced training with all features
#
# DESCRIPTION:
# Production-ready configuration with comprehensive anti-collapse,
# anti-overfitting, and performance optimization features.
# Designed for ~1B parameter models on Apple Silicon.
#
# USAGE:
#   python3 train_with_data.py --config configs/mps/large.yaml
#   python3 interact.py --model outputs/large.pt
#
# ============================================================

# ============================================================
# MODEL ARCHITECTURE
# ============================================================

model:
  # ---------- Core Architecture ----------
  size: large                      # Model size preset
  vocab_size: 50257               # GPT-2 tokenizer vocabulary
  hidden_size: 1024                # Hidden dimension (embeddings)
  num_layers: 12                   # Number of transformer layers
  intermediate_size: 3072          # FFN intermediate dimension (usually 4x hidden)
  
  # ---------- Attention Configuration ----------
  num_attention_heads: 16         # Number of attention heads
  num_key_value_heads: 8          # For GQA (Grouped Query Attention) - reduces memory
  attention_type: gqa              # Options: mha, mqa, gqa (grouped query attention)
  use_flash_attn: false           # Flash Attention (not supported on MPS yet)
  attention_dropout: 0.2           # Dropout in attention layers
  
  # ---------- Position Encoding ----------
  max_position_embeddings: 4096    # Maximum sequence length
  rope_theta: 10000.0              # RoPE base frequency
  
  # ---------- Mixture of Experts (MoE) ----------
  num_experts: 6                   # Total number of experts
  num_experts_per_tok: 2          # Active experts per token
  expert_capacity_factor: 1.25    # Capacity factor for load balancing
  expert_routing_type: switch     # Options: switch, gshard, base
  expert_dropout: 0.25             # Dropout for expert layers
  
  # ---------- Activation & Initialization ----------
  hidden_act: swiglu               # Activation function (swiglu is best)
  initializer_range: 0.02          # Weight initialization range
  rms_norm_eps: 1.0e-06           # RMSNorm epsilon for stability
  
  # ---------- Regularization ----------
  hidden_dropout: 0.3              # General dropout rate
  label_smoothing: 0.1             # Label smoothing for loss regularization
  
  # ---------- Caching & Optimization ----------
  use_cache: true                  # Enable KV caching for inference
  gradient_checkpointing: true     # Trade compute for memory
  use_memory_efficient_attention: true  # Memory-efficient attention implementation
  
  # ---------- Advanced Features ----------
  # Mixture of Depths (MoD) - Dynamic layer skipping
  use_mod: true                    # Enable Mixture of Depths
  mod_mode: adaptive               # Options: learned, fixed, adaptive
  mod_skip_fraction: 0.3           # Fraction of layers to skip
  
  # Speculative Decoding
  use_speculative_decoding: true   # Faster inference with draft model
  speculative_draft_layers: 4      # Number of draft layers
  
  # Expert System Features
  use_hierarchical_moe: true       # Hierarchical expert routing
  use_continuous_experts: true     # Continuous expert selection
  use_sparse_experts: false        # Sparse expert activation
  use_expert_cache: true           # Cache expert selections
  
  # Advanced Architecture Components
  use_mod_plus_plus: true          # Enhanced MoD with confidence
  use_memory_augmented: true       # External memory mechanisms
  use_adaptive_inference: true     # Dynamic computation graphs
  use_interpretability: true       # Built-in interpretability
  
  # Multi-Modal & Specialized Features
  use_mixture_tokenizers: true     # Multiple tokenizer support
  use_nas_experts: true            # Neural architecture search
  use_meta_learning: true          # Meta-learning capabilities
  use_federated_learning: true     # Federated learning support
  use_continual_learning: true     # Continual learning without forgetting
  use_advanced_pretraining: true   # Advanced pretraining objectives
  use_rlaif: true                  # RL from AI feedback
  
  # Specialized Expert Types
  use_code_experts: true           # Code-specialized experts
  use_scientific_experts: true     # Science/math experts
  use_tool_experts: true           # Tool-use experts
  use_vision_language: true        # Vision-language capabilities
  use_audio_language: true         # Audio-language capabilities
  
  # Training & Inference Features
  use_adversarial_training: true   # Adversarial robustness
  use_bias_mitigation: true        # Bias reduction mechanisms
  use_privacy_preserving: true     # Privacy-preserving training
  use_watermarking: true           # Model watermarking
  
  # System Integration
  use_distributed_experts: false   # Distributed expert computation
  use_mixed_precision: true        # Enable mixed precision training
  use_torch_compile: false         # PyTorch 2.0 compilation
  use_fused_kernels: false        # Fused CUDA kernels (not for MPS)
  
  # Research & Development Features
  use_diverse_beam_search: false   # Diverse beam search
  use_mixture_decoders: false      # Multiple decoder heads
  use_streaming_generation: false  # Streaming text generation
  use_batch_optimized: false       # Batch-optimized inference
  use_synthetic_data: false        # Synthetic data generation
  use_online_learning: false       # Online learning capability
  use_multi_task_learning: false   # Multi-task learning
  use_automated_curation: false    # Automated data curation
  use_cross_lingual: false         # Cross-lingual transfer
  use_edge_deployment: false       # Edge deployment optimization
  use_ab_testing: false            # A/B testing framework
  use_model_versioning: false      # Model versioning system
  use_cost_optimization: false     # Cost-aware optimization
  use_global_load_balancing: false # Global load balancing
  
  # Experimental Features
  use_quantum_inspired: true       # Quantum-inspired algorithms
  use_neuromorphic: true           # Neuromorphic computing
  use_self_modifying: true         # Self-modifying networks
  use_causal_reasoning: true       # Causal reasoning
  use_visual_builder: true         # Visual model builder
  use_automated_docs: true         # Automated documentation
  use_interactive_debug: true      # Interactive debugging
  use_playground: true             # Model playground
  use_benchmarking: true           # Automated benchmarking

# ============================================================
# DATA CONFIGURATION
# ============================================================

data:
  # ---------- Dataset Settings ----------
  dataset_type: hf                 # Dataset type (hf = HuggingFace format)
  train_paths:                     # Training data paths (supports wildcards)
    - ./data/pretraining/processed_ace_full/batch_*
  val_path: ./data/pretraining/processed_ace_full/batch_*
  
  # ---------- Tokenization ----------
  tokenizer: gpt2                  # Tokenizer to use
  max_length: 4096                 # Maximum sequence length
  stride: 2048                     # Stride for overlapping sequences
  
  # ---------- Data Loading ----------
  max_train_examples: auto         # Max training examples (auto = all)
  max_val_examples: auto           # Max validation examples
  
  # ---------- Dataset Arguments ----------
  dataset_args:
    text_column: text              # Column name for text data
    streaming: true                # Stream data (saves memory)
    num_proc: 1                    # Number of processes for data loading
    shuffle_buffer_size: 5000      # Buffer size for shuffling
    prefetch_buffer_size: 500      # Prefetch buffer size
  
  # ---------- Data Augmentation ----------
  noise_probability: 0.1           # Random token replacement (10% chance)
  mask_probability: 0.05           # Random masking (5% chance)

# ============================================================
# TRAINING CONFIGURATION
# ============================================================

training:
  # ---------- Basic Training ----------
  batch_size: 4                    # Batch size per device
  gradient_accumulation_steps: 8   # Gradient accumulation (effective batch = 32)
  num_epochs: 3                    # Number of training epochs
  max_steps: -1                    # Max steps (-1 = use epochs)
  
  # ---------- Learning Rate ----------
  learning_rate: 2e-4              # Base learning rate
  warmup_steps: 2000               # Warmup steps
  warmup_ratio: 0.1                # Warmup ratio (alternative to steps)
  
  # ---------- Optimizer Configuration ----------
  optimizer: lion                  # Optimizer: adamw, lion (2x faster)
  weight_decay: 0.01               # L2 regularization
  adam_beta1: 0.9                  # Adam beta1 (momentum)
  adam_beta2: 0.95                 # Adam beta2 (variance)
  adam_epsilon: 1e-8               # Adam epsilon
  
  # ---------- Advanced Optimizer Features ----------
  layerwise_lr: true               # Different LR for different layers
  lr_layer_scale: 0.5              # Scale for layer-wise LR (embeddings get lr*0.5)
  gradient_centralization: true    # Center gradients (improves stability)
  
  # ---------- Learning Rate Scheduling ----------
  lr_scheduler_type: cosine        # Scheduler: cosine, linear, polynomial, onecycle
  scheduler: cosine                 # Alternative scheduler setting
  
  # ---------- Gradient Management ----------
  max_grad_norm: 1.0               # Gradient clipping threshold
  gradient_clip: 1.0               # Alternative gradient clipping
  adaptive_gradient_clipping: true # Dynamic gradient clipping
  gradient_penalty_weight: 0.001   # Penalize large gradients
  
  # ---------- Mixed Precision ----------
  mixed_precision: bfloat16        # Mixed precision: false, fp16, bfloat16
  gradient_checkpointing: true     # Gradient checkpointing (saves memory)
  
  # ---------- Loss Functions ----------
  # Focal Loss - Focus on hard examples
  use_focal_loss: true             # Enable focal loss
  focal_gamma: 2.0                 # Focal loss gamma (focus strength)
  focal_alpha: 0.25                # Focal loss alpha
  focal_blend: 0.3                 # Blend with standard loss (30% focal)
  
  # ---------- Anti-Collapse Features ----------
  entropy_regularization_weight: 0.01      # Encourage output diversity
  token_frequency_penalty_weight: 0.1      # Penalize repetitive tokens
  expert_diversity_weight: 0.01            # Encourage expert specialization
  
  # ---------- Curriculum Learning ----------
  curriculum_learning: true        # Enable curriculum learning
  initial_sequence_length: 256     # Start with short sequences
  curriculum_warmup_steps: 1000    # Steps to reach full length
  
  # Progressive Sequence Growth
  progressive_sequence_growth: true # Continue growing beyond initial target
  sequence_growth_rate: 1.5        # Growth multiplier per phase
  sequence_growth_interval: 5000   # Steps between growth phases
  # Growth schedule: 256 -> 512 -> 768 -> 1152 -> 1728 -> 2592 -> 3888 -> 4096
  
  # ---------- Anti-Overfitting Features ----------
  stochastic_depth_prob: 0.1       # Randomly drop layers
  mixout_prob: 0.1                 # Mix weights with initialization
  use_ema: true                    # Exponential moving average
  ema_decay: 0.999                 # EMA decay rate
  confidence_weighting: true       # Weight loss by confidence
  sam_enabled: false               # Sharpness-aware minimization (expensive)
  
  # ---------- Evaluation & Checkpointing ----------
  eval_steps: 500                  # Evaluation frequency
  eval_strategy: steps             # Evaluation strategy: steps, epoch
  save_steps: 1000                 # Checkpoint frequency
  save_total_limit: 2              # Max checkpoints to keep
  logging_steps: 10                # Logging frequency
  logging_first_step: true         # Log first step
  
  # ---------- DataLoader Settings ----------
  dataloader_num_workers: 0        # DataLoader workers (0 for MPS)
  dataloader_pin_memory: false     # Pin memory (false for MPS)
  dataloader_prefetch_factor: 2    # Prefetch factor
  dataloader_persistent_workers: false  # Persistent workers
  dataloader_drop_last: false      # Drop incomplete batches
  
  # ---------- Model Selection ----------
  load_best_model_at_end: true     # Load best model after training
  metric_for_best_model: loss      # Metric for best model
  greater_is_better: false         # Lower loss is better
  resume_from_checkpoint: true     # Resume from checkpoint if exists
  
  # ---------- Device Settings ----------
  device: mps                      # Device: mps, cuda, cpu
  zero_stage: 0                    # ZeRO optimization stage

# ============================================================
# DISTRIBUTED TRAINING
# ============================================================

distributed: false                 # Enable distributed training
num_gpus: 1                       # Number of GPUs
device_map: mps                   # Device mapping
offload_folder: null              # CPU offload folder
low_cpu_mem_usage: true           # Low CPU memory mode

# ============================================================
# OUTPUT & EXPERIMENT
# ============================================================

output_dir: ./outputs              # Output directory for checkpoints
experiment_name: large_moe_1b     # Experiment name for tracking
logging_level: INFO                # Logging level: DEBUG, INFO, WARNING, ERROR
report_to:                        # Reporting backends
- tensorboard
- wandb
seed: 42                          # Random seed for reproducibility

# ============================================================
# FINE-TUNING CONFIGURATION
# ============================================================

fine_tuning:
  # ---------- LoRA Configuration ----------
  use_lora: true                  # Enable LoRA fine-tuning
  use_qlora: false                # Enable QLoRA (quantized)
  freeze_base_model: true         # Freeze base model weights
  lora_r: 8                       # LoRA rank
  lora_alpha: 16                  # LoRA alpha (scaling)
  lora_dropout: 0.1               # LoRA dropout
  
  # ---------- LoRA Target Modules ----------
  lora_target_modules:            # Modules to apply LoRA to
  - q_proj
  - v_proj
  - k_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  
  # ---------- Multi-LoRA ----------
  num_lora_experts: 4             # Number of LoRA experts
  task_embedding_dim: 0           # Task embedding dimension
  share_base_weights: true        # Share base weights
  
  # ---------- Fine-tuning Training ----------
  batch_size: 4                   # Fine-tuning batch size
  gradient_accumulation_steps: 4  # Gradient accumulation
  learning_rate: 2e-4             # Fine-tuning learning rate
  num_epochs: 3                   # Fine-tuning epochs
  warmup_ratio: 0.1               # Warmup ratio
  
  # ---------- Early Stopping ----------
  early_stopping: true            # Enable early stopping
  early_stopping_patience: 3      # Patience (evaluations)
  early_stopping_threshold: 0.001 # Improvement threshold
  min_delta: 0.0005              # Minimum change

# ============================================================
# MEMORY OPTIMIZATION
# ============================================================

memory_optimization:
  gradient_checkpointing: true    # Recompute activations
  cpu_offload: false              # Offload to CPU
  optimizer_offload: false        # Offload optimizer
  parameter_offload: false        # Offload parameters
  activation_checkpointing: true  # Checkpoint activations
  memory_efficient_attention: true # Memory-efficient attention

# ============================================================
# INFERENCE CONFIGURATION
# ============================================================

inference:
  use_flash_attn: false           # Flash Attention
  torch_compile: false            # PyTorch compilation
  dtype: bfloat16                 # Inference dtype
  
  # ---------- Optimization ----------
  use_speculation: false          # Speculative decoding
  num_draft_experts: 2            # Draft model experts
  draft_expert_size_ratio: 0.2   # Draft expert size
  draft_sequence_length: 3        # Draft sequence length
  use_prefetching: false          # Prefetch next tokens
  
  # ---------- Pruning ----------
  prune_before_deployment: true   # Prune before deployment
  target_sparsity: 0.3            # Target sparsity
  prune_experts: true             # Prune experts
  prune_attention: true           # Prune attention
  expert_merge_threshold: 0.9    # Expert merge threshold

# ============================================================
# MPS OPTIMIZATION (Apple Silicon Specific)
# ============================================================

mps_optimization:
  use_metal_performance_shaders: true  # Use Metal shaders
  enable_unified_memory: true          # Unified memory architecture
  max_memory_gb: 32                    # Maximum memory usage
  memory_fraction: 0.7                 # Memory fraction to use

# ============================================================
# MONITORING CONFIGURATION
# ============================================================

monitoring:
  use_health_monitoring: false    # Health monitoring
  check_interval: 100             # Check interval (steps)
  enable_alerts: true             # Enable alerts
  enable_visualization: false     # Enable visualizations
  use_wandb: true                 # Use Weights & Biases
  wandb_project: llm-training     # W&B project name
  wandb_name: null               # W&B run name (auto-generated)
  wandb_tags:                    # W&B tags
  - moe
  - mps
  - large
  - 1b-params