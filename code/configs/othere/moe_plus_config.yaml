training:
  learning_rate: 1e-4
  weight_decay: 0.1
  optimizer: adamw
  warmup_steps: 100
  total_steps: 1000
  batch_size: 2

deepspeed:
  enabled: false

data:
  train_path: null  # Will use dummy data
  val_path: null    # Will use dummy data

model:
  hidden_size: 768
  num_layers: 12
  num_experts: 8
  num_experts_per_tok: 2
  expert_sparsity: 0.3

curriculum:
  enabled: true
  stages: [0.3, 0.6, 0.9]