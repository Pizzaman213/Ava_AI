# ============================================================
# AVA MOE++ SPEED-OPTIMIZED CONFIGURATION
# ============================================================
# Model Size: Variable (optimized for speed)
# Hardware: High-performance systems
# Use Case: Fast training and inference
# ============================================================

# Model Architecture Configuration
model:
  # Core dimensions (balanced)
  hidden_size: 768
  num_layers: 8
  num_attention_heads: 12
  ffn_hidden_size: 3072
  vocab_size: 50257
  max_position_embeddings: 1024

  # MoE configuration (fewer experts for speed)
  num_experts: 4
  top_k_experts: 1  # Single expert for speed
  expert_capacity: 1.0

  # Dropout and regularization (disabled for speed)
  dropout_rate: 0.0
  attention_dropout: 0.0
  expert_dropout: 0.0

  # Advanced features (simplified)
  use_expert_balancing: false
  use_adaptive_routing: false
  temperature: 1.0
  confidence_threshold: 0.5
  sinkhorn_iterations: 1
  aux_loss_weight: 0.0
  layer_norm_epsilon: 1.0e-5

# Training Configuration
training:
  # Batch settings (large batch for throughput)
  batch_size: 32
  gradient_accumulation_steps: 1

  # Training duration
  num_epochs: 10
  max_steps: -1

  # Optimizer
  learning_rate: 5.0e-4
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8

  # Learning rate schedule (simple)
  lr_scheduler_type: linear
  warmup_steps: 100
  warmup_ratio: 0.0

  # Gradient management
  max_grad_norm: 1.0
  gradient_checkpointing: false  # Disable for speed

  # Mixed precision (for speed on GPU)
  mixed_precision: true
  fp16: true
  bf16: false

  # Evaluation and checkpointing (less frequent)
  eval_steps: 5000
  save_steps: 10000
  save_total_limit: 1
  logging_steps: 500

  # Data loading (optimized)
  num_workers: 8
  prefetch_factor: 4
  persistent_workers: true
  pin_memory: true
  drop_last: true

# Data Configuration
data:
  # Paths
  data_dir: /project/code/data/pretraining/processed

  # Tokenization
  tokenizer: gpt2
  max_length: 1024
  stride: 512

  # Data limits
  max_train_examples: null
  max_val_examples: 1000

  # Processing (parallel)
  num_proc: 16
  streaming: false
  keep_in_memory: true  # If RAM allows
  load_from_cache_file: true

# Output Configuration
output:
  output_dir: /project/code/outputs
  logging_dir: /project/code/outputs/logs
  checkpoint_dir: /project/code/outputs/checkpoints

# Hardware Optimization
hardware:
  device: auto
  cuda_device: 0
  use_flash_attention: true
  use_torch_compile: true  # PyTorch 2.0 compilation
  enable_tf32: true
  cudnn_benchmark: true
  cuda_graphs: true  # CUDA graphs for speed

# Speed-Specific Settings
speed:
  use_fused_kernels: true
  use_apex_optimizers: false
  use_channels_last: true
  compile_mode: max-autotune  # PyTorch 2.0
  disable_logging: false
  async_checkpoint: true

# Monitoring (minimal)
monitoring:
  log_level: WARNING  # Reduce logging overhead
  enable_tensorboard: false
  enable_wandb: false
  wandb_project: null
  wandb_entity: null