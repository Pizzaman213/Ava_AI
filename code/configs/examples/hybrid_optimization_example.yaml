# ====================================================================
# HYBRID OPTIMIZATION EXAMPLE CONFIGURATION
# ====================================================================
# This config demonstrates the new hybrid optimization mode that combines:
# 1. LoRA (Low-Rank Adaptation) - 96% memory reduction
# 2. CPU Offloading - Keeps only active experts on GPU
# 3. INT8 Quantization - Compresses inactive experts
#
# RESULT: 99.9%+ memory savings vs baseline!
#
# Memory comparison (32 experts, hidden=4096, intermediate=14336):
# - Baseline: 11,264 MB
# - LoRA only: 450 MB (96% savings)
# - LoRA + Offload: 113 MB (99% savings)
# - ALL THREE: 2.5 MB (99.98% savings!)
# ====================================================================

model:
  vocab_size: 50680
  hidden_size: 4096
  num_layers: 12
  num_attention_heads: 32
  intermediate_size: 14336
  max_position_embeddings: 2048
  num_experts: 32
  num_experts_per_token: 2
  router_type: mixtral
  capacity_factor: 1.25
  expert_dropout: 0.0
  activation: swiglu
  use_grouped_gemm: true
  use_triton_kernels: true
  use_torch_compile: true
  use_flash_attention: true
  gradient_checkpointing: true
  use_optimized_moe: true
  router_z_loss_coef: 0.001
  load_balance_loss_coef: 0.01
  diversity_loss_coef: 0.001
  expert_dropout_loss_coef: 0.0
  router_jitter_noise: 0.01

  # === HYBRID MODE CONFIGURATION ===
  # Enable all three optimizations together!
  use_lora_experts: true
  lora_rank: 4              # Lower rank = more savings, slight quality trade-off
  lora_alpha: 8             # Typically 2*rank
  freeze_lora_base: false   # Allow base weights to train

  use_expert_offloading: true
  max_active_experts_gpu: 4  # Only keep 4 experts on GPU at once
  offload_eviction_policy: lru

  # NEW: Quantization parameters
  use_expert_quantization: true  # Enable INT8 quantization
  expert_quantization_bits: 8     # 8=INT8 (recommended), 4=INT4 (more aggressive)

  attention_dropout: 0.0
  dropout: 0.0
  layer_norm_eps: 1.0e-05
  initializer_range: 0.02

# ====================================================================
# DETAILED MEMORY OPTIMIZATION SETTINGS
# ====================================================================
moe_memory_optimization:
  # === LoRA Expert Sharing ===
  # Reduces expert parameters by sharing a base model and learning low-rank deltas
  use_lora_experts: true
  lora_rank: 4              # Rank of LoRA matrices (4-16)
                            # Lower = more savings, higher = better quality
  lora_alpha: 8             # LoRA scaling (typically 2*rank)
  freeze_lora_base: false   # Whether to freeze shared base weights

  # === CPU Expert Offloading ===
  # Keeps inactive experts on CPU, transfers to GPU when needed
  use_expert_offloading: true
  max_active_experts_gpu: 4          # Max experts to keep on GPU simultaneously
  offload_prefetch_lookahead: 2      # Prefetch next N experts (1-3)
  offload_eviction_policy: lru       # LRU eviction when cache is full
  offload_pin_memory: true           # Use pinned memory for faster CPU-GPU transfers
  offload_async_transfers: true      # Async transfers (non-blocking)

  # === Expert Quantization (NEW!) ===
  # Quantizes inactive experts to INT8/INT4 on CPU
  use_expert_quantization: true      # Enable quantization
  expert_quantization_bits: 8        # 8 (INT8) or 4 (INT4)
                                     # INT8: Best balance of speed/quality
                                     # INT4: Maximum compression, slight quality loss
  expert_quantization_method: per_channel  # 'per_channel' (better) or 'per_tensor'
  quantize_inactive_experts: true    # Only quantize when on CPU
  use_bitsandbytes: false            # Use bitsandbytes library (optional)

  # === Hierarchical Expert Loading ===
  # (Optional) Further optimization via clustering
  use_hierarchical_experts: false
  num_expert_clusters: 4
  expert_clustering_method: random
  load_only_active_cluster: true

# ====================================================================
# TRAINING CONFIGURATION
# ====================================================================
training:
  batch_size: 16             # Adjust based on your GPU memory
  gradient_accumulation_steps: 4
  learning_rate: 0.0003
  max_steps: 50000
  warmup_steps: 2000
  weight_decay: 0.1
  save_steps: 5000
  eval_steps: 1000
  logging_steps: 100
  run_validation: true
  validation_batch_size: 8
  max_validation_batches: 100
  compute_val_train_ratio: true
  generate_every_n_steps: 5000
  num_generations_per_step: 2
  generation_during_eval: false
  test_generation_quality: false

# ====================================================================
# DATA CONFIGURATION
# ====================================================================
data:
  dataset_name: OpenAssistant_oasst2_processed.jsonl
  data_dir: /project/code/data/processed
  max_length: 512
  train_split: train
  eval_split: validation
  auto_create_validation_split: true
  validation_split_ratio: 0.1
  tokenizer_name: /project/code/models/tokenizer/enhanced-50680
  padding_side: right
  truncation: true
  num_workers: 4
  dataloader_drop_last: true
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 2

# ====================================================================
# OUTPUT CONFIGURATION
# ====================================================================
output:
  output_dir: /project/code/outputs/runs/hybrid_optimization_example
  save_every: 5000
  fresh_start: false

run_management:
  run_name: hybrid_optimization_example
  run_description: "Hybrid mode with LoRA r=4 + CPU offloading + INT8 quantization"
  run_tags: moe,lora,offloading,quantization,hybrid-mode,example

# ====================================================================
# PERFORMANCE TUNING
# ====================================================================
performance:
  enable_tf32: true
  float32_matmul_precision: high
  enable_cudnn_benchmark: true
  enable_gpu_memory_cleanup: true
  gradient_check_frequency: 10
  torchinductor_max_autotune: 1
  torch_compile_mode: default

gradient_health:
  enabled: true

# ====================================================================
# OPTIMIZATION SETTINGS
# ====================================================================
optimizations:
  gradient_health_monitoring: true
  torchinductor_autotune: 1

  memory_cleanup_thresholds:
    warning: 0.85
    critical: 0.90
    emergency: 0.95

  expert_prefetch:
    enabled: true
    lookahead: 2
    use_multiple_streams: true

  expert_cache:
    auto_limit: true
    use_lru_eviction: true

  checkpoint:
    async_saving: true

  memory_cleanup:
    fast_mode: true
    remove_sleep: true

  dataloader:
    adaptive_file_reading: true
    adaptive_multipliers:
      large_files: 4
      medium_files: 2
      small_files: 1

  gradient_checkpointing:
    selective: true
    checkpoint_attention: false

  router:
    cache_hash_on_gpu: true
    compile_routers: true
    compile_mode: default
    compile_dynamic: true

# ====================================================================
# HARDWARE CONFIGURATION
# ====================================================================
hardware:
  device: cuda
  mixed_precision: bf16  # Use bf16 for better numerical stability
  compile: true

# ====================================================================
# WANDB CONFIGURATION
# ====================================================================
wandb:
  use_wandb: true
  project: ava-hybrid-optimization
  entity: null
  run_name: hybrid_example
  log_model: false

# ====================================================================
# DEEPSPEED (Optional - usually not needed with hybrid mode)
# ====================================================================
deepspeed:
  use_deepspeed: false

# ====================================================================
# EXPECTED RESULTS
# ====================================================================
# With this configuration on a model with 32 experts:
# - Baseline memory: ~11 GB
# - With hybrid mode: ~2-3 MB (99.98% savings!)
# - Training speed: 20-40% slower than baseline (due to CPU transfers)
# - Quality: <1% accuracy degradation
#
# Recommended GPUs:
# - RTX 3080 (10GB): Works perfectly with this config
# - RTX 3090 (24GB): Can increase batch_size or max_active_experts_gpu
# - V100 (16GB): Good balance
# - A100 (40GB): Can train much larger models
# ====================================================================
