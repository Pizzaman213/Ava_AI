################################################################################
# COMPLETE CONFIGURATION REFERENCE FOR AVA MOE TRAINING SYSTEM
################################################################################
#
# This file documents ALL ~200+ configurable parameters in the Ava MoE system.
# It serves as both a reference guide and an example configuration template.
#
# QUICK START:
# 1. Copy this file to your own config (e.g., my_config.yaml)
# 2. Jump to the PRESET EXAMPLES section at the bottom for quick configs
# 3. Uncomment and modify only the sections you need
# 4. Most parameters have sensible defaults - only specify what you want to change
#
# CONFIGURATION SECTIONS:
# - Model Architecture (lines 30-150)
# - MoE Memory Optimizations (lines 152-280)
# - Training Configuration (lines 282-400)
# - Data Configuration (lines 402-480)
# - DeepSpeed Distributed (lines 482-620)
# - Hardware & Performance (lines 622-700)
# - Optimization Settings (lines 702-850)
# - Loss Functions (lines 852-950)
# - Adaptive Multi-Token Prediction (lines 952-1050)
# - Progressive Training (lines 1052-1150)
# - Learning Rate Finder (lines 1152-1200)
# - Gradient Configuration (lines 1202-1250)
# - Quantization (lines 1252-1300)
# - Evaluation (lines 1302-1350)
# - Weights & Biases (lines 1352-1420)
# - Output & Run Management (lines 1422-1480)
# - Additional Features (lines 1482-1600)
#
################################################################################

################################################################################
# 1. MODEL ARCHITECTURE CONFIGURATION
################################################################################
model:
  # ----- Core Model Dimensions -----
  # Vocabulary size for the tokenizer
  # Default: 50680 (typical for custom tokenizers)
  # Range: 8000-100000 depending on tokenizer
  vocab_size: 50680

  # Hidden dimension size (model width)
  # Typical values: 320 (tiny), 512 (tiny), 1024 (small), 4096 (medium), 5120 (large)
  # Larger = more capacity but more memory/compute
  hidden_size: 1024

  # Number of transformer layers (model depth)
  # Typical values: 6-8 (tiny), 12-24 (small), 32 (medium), 40 (large)
  # More layers = better performance but slower training
  num_layers: 24

  # Number of attention heads
  # Must divide evenly into hidden_size
  # Typical: hidden_size / 64 or hidden_size / 128
  num_attention_heads: 16

  # Feed-forward network intermediate size
  # Typically 3.5x to 4x hidden_size for standard models
  # For MoE, this is per-expert FFN size
  intermediate_size: 4096

  # Maximum sequence length (context window)
  # Common values: 512, 1024, 2048, 4096, 8192
  # Longer sequences = quadratic memory growth in attention
  max_position_embeddings: 2048

  # ----- Mixture of Experts (MoE) Configuration -----
  # Total number of experts per MoE layer
  # Typical values: 4 (tiny), 8 (small), 16 (medium), 32+ (large)
  # More experts = more capacity but more memory
  num_experts: 8

  # Number of experts activated per token (Top-K routing)
  # Typical: 2 (good balance), 1 (faster), 3+ (better quality)
  # More active = better quality but slower inference
  num_experts_per_token: 2

  # Expert routing algorithm
  # Options:
  #   'mixtral' - Mixtral-style routing (simple, stable)
  #   'switch' - Switch Transformer routing (load balancing)
  #   'deepseek' - DeepSeek-MoE routing (fine-grained)
  # Recommended: 'mixtral' for stability, 'switch' for efficiency
  router_type: 'mixtral'

  # Expert capacity factor (for capacity-based routing)
  # Higher = more tokens per expert, less dropping
  # Typical range: 1.0-1.5
  # Only used with 'switch' router
  capacity_factor: 1.25

  # Dropout rate for expert outputs
  # Regularization to prevent expert over-reliance
  # Typical: 0.0 (disabled) to 0.1
  expert_dropout: 0.0

  # ----- Activation Functions -----
  # Activation function for FFN layers
  # Options: 'swiglu' (best), 'gelu', 'relu', 'gelu_new'
  # SwiGLU recommended for best performance (used in Llama, Mistral)
  activation: 'swiglu'

  # ----- Performance Optimizations -----
  # Use grouped GEMM for efficient expert computation
  # Recommended: true (15-25% speedup for MoE)
  use_grouped_gemm: true

  # Enable custom Triton kernels for fused operations
  # Recommended: true (10-20% speedup)
  use_triton_kernels: true

  # Enable torch.compile for JIT compilation
  # WARNING: Incompatible with gradient_checkpointing
  # Recommended: false during training, true for inference
  use_torch_compile: false

  # Use Flash Attention 2 for efficient attention
  # Recommended: true (2-4x faster attention, 40% memory savings)
  # Requires: flash-attn package installed
  use_flash_attention: true

  # Quantize KV cache to INT8 (75% memory savings)
  # Slight quality loss, good for long sequences
  # Recommended: false for training, true for inference
  quantize_kv_cache: false

  # Enable gradient/activation checkpointing
  # Trade compute for memory (25-40% memory savings, 8-15% slower)
  # Recommended: true for large models, false for small models
  gradient_checkpointing: true

  # Use optimized MoE kernels and fusion
  # Recommended: true (combines multiple MoE operations)
  use_optimized_moe: true

  # ----- Router Loss Coefficients -----
  # These losses help with MoE training stability and efficiency

  # Z-loss coefficient for numerical stability
  # Prevents router logits from growing too large
  # Typical range: 0.0001-0.001
  router_z_loss_coef: 0.001

  # Load balancing loss coefficient
  # Encourages equal usage of all experts
  # Typical range: 0.001-0.1
  # Higher = more balanced but potentially worse quality
  load_balance_loss_coef: 0.01

  # Expert diversity loss coefficient
  # Encourages experts to specialize differently
  # Typical range: 0.0-0.01
  diversity_loss_coef: 0.001

  # Expert dropout regularization loss
  # Prevents over-reliance on specific experts
  # Typical range: 0.0-0.001
  expert_dropout_loss_coef: 0.0

  # Router jitter noise for exploration during training
  # Adds noise to routing to explore expert assignments
  # Typical range: 0.0-0.1
  router_jitter_noise: 0.01

  # ----- Regularization -----
  # Dropout rate for attention weights
  # Typical: 0.0-0.1
  attention_dropout: 0.0

  # General dropout rate applied throughout model
  # Typical: 0.0-0.1
  dropout: 0.1

  # Layer normalization epsilon for numerical stability
  # Typical: 1e-5 or 1e-6
  layer_norm_eps: 1.0e-5

  # Weight initialization range (std dev)
  # Typical: 0.02 for transformer models
  initializer_range: 0.02

  # ----- Positional Encoding -----
  # RoPE (Rotary Position Embedding) base frequency
  # Higher = better for longer sequences
  # Typical: 10000.0 (standard), 25000-100000 (long context)
  rope_theta: 10000.0

  # Use ALiBi (Attention with Linear Biases) instead of RoPE
  # Better extrapolation to longer sequences
  # Recommended: false (RoPE is standard)
  use_alibi: false


################################################################################
# 2. MOE MEMORY OPTIMIZATION CONFIGURATION
################################################################################
# These optimizations can dramatically reduce memory usage
# Enable combinations based on your memory constraints
moe_memory_optimization:

  # ----- LoRA Expert Sharing (40-60% memory savings) -----
  # Share a base expert, use LoRA adapters for specialization
  # Good for: Limited memory, many experts
  # Trade-off: Slight quality loss, minimal speed impact

  # Enable LoRA-based parameter sharing across experts
  use_lora_experts: false

  # Rank of LoRA low-rank matrices
  # Lower rank = more memory savings, less capacity
  # Typical: 4 (aggressive), 8 (balanced), 16 (conservative)
  lora_rank: 8

  # LoRA scaling parameter (alpha)
  # Typically set to 2× lora_rank
  # Higher = stronger adaptation
  lora_alpha: 16

  # Freeze the shared base expert parameters
  # Only train LoRA adapters
  # Recommended: false (train both for best quality)
  freeze_lora_base: false

  # ----- CPU Expert Offloading (50-80% memory savings) -----
  # Keep inactive experts on CPU, swap to GPU as needed
  # Good for: Many experts, limited GPU memory
  # Trade-off: 20-40% slower due to PCIe transfers

  # Enable CPU offloading of inactive experts
  use_expert_offloading: false

  # Maximum number of experts to keep on GPU simultaneously
  # Lower = more memory savings, more transfers
  # Typical: 4-8 for 8-16 total experts
  max_active_experts_gpu: 4

  # Number of future layers to prefetch experts for
  # Higher = fewer cache misses, more GPU memory
  # Typical: 1-2 (balance), 3-4 (large models)
  offload_prefetch_lookahead: 2

  # Cache eviction policy when GPU cache is full
  # Options:
  #   'lru' - Least Recently Used (simple, effective)
  #   'frequency' - Most frequently used stay cached
  #   'hybrid' - LRU + frequency weighting
  offload_eviction_policy: 'lru'

  # Use pinned (page-locked) CPU memory
  # Faster GPU-CPU transfers but uses more system memory
  # Recommended: true (2-3x faster transfers)
  offload_pin_memory: true

  # Enable asynchronous GPU-CPU transfers
  # Overlap transfers with computation
  # Recommended: true (reduces transfer overhead)
  offload_async_transfers: true

  # ----- Hierarchical Expert Loading (30-50% memory savings) -----
  # Group experts into clusters, load only active cluster
  # Good for: Specialized workloads, structured data
  # Trade-off: Requires expert clustering, moderate complexity

  # Enable hierarchical expert clustering
  use_hierarchical_experts: false

  # Number of expert clusters (groups)
  # Typical: 4-8 clusters
  # Should divide evenly into num_experts
  num_expert_clusters: 4

  # Method for clustering experts
  # Options:
  #   'random' - Random assignment (fast, no learning)
  #   'kmeans' - K-means on expert weights (quality-based)
  #   'functional' - Based on routing patterns (task-based)
  expert_clustering_method: 'random'

  # Only load the active cluster to GPU
  # Maximum memory savings but less flexible
  # Recommended: true for structured data
  load_only_active_cluster: true

  # ----- Expert Quantization (50-75% memory savings) -----
  # Quantize expert weights to lower precision
  # Good for: Inference, very limited memory
  # Trade-off: 1-3% quality loss, some overhead

  # Enable expert quantization
  use_expert_quantization: false

  # Only quantize inactive experts (on CPU)
  # Active experts remain FP16/BF16 for quality
  # Recommended: true (best quality/memory trade-off)
  quantize_inactive_experts: true

  # Number of bits for quantization
  # Options:
  #   8 - INT8 (75% savings, minimal quality loss)
  #   4 - INT4 (87% savings, 1-3% quality loss)
  expert_quantization_bits: 8

  # Quantization granularity
  # Options:
  #   'per_channel' - Quantize each output channel separately (better quality)
  #   'per_tensor' - Single scale for entire tensor (faster)
  expert_quantization_method: 'per_channel'

  # Use bitsandbytes library for quantization
  # Alternative to built-in quantization
  # Recommended: false (built-in is faster)
  use_bitsandbytes: false


################################################################################
# 3. TRAINING CONFIGURATION
################################################################################
training:
  # ----- Batch Size & Gradient Accumulation -----
  # Batch size per GPU
  # Typical: 1-4 (large models), 8-32 (medium), 32-128 (small)
  # Effective batch = batch_size × gradient_accumulation_steps × num_gpus
  batch_size: 16

  # Number of gradient accumulation steps
  # Simulate larger batches without more memory
  # Typical: 1-32
  # Total effective batch = batch_size × this value × num_gpus
  gradient_accumulation_steps: 4

  # ----- Learning Rate & Optimization -----
  # Peak learning rate
  # Typical ranges by model size:
  #   Small (<1B): 3e-4 to 1e-3
  #   Medium (1-10B): 1e-4 to 3e-4
  #   Large (10B+): 1e-5 to 1e-4
  learning_rate: 3.0e-4

  # Learning rate warmup steps
  # Gradual LR increase at start for stability
  # Typical: 2000-10000 steps, or 5-10% of total training
  warmup_steps: 2000

  # Weight decay coefficient (L2 regularization)
  # Typical: 0.01-0.1 for AdamW
  weight_decay: 0.1

  # Maximum gradient norm for clipping
  # Prevents gradient explosion
  # Typical: 1.0 (standard), 0.5 (aggressive), 5.0 (lenient)
  max_gradient_norm: 1.0

  # ----- Training Duration -----
  # Maximum number of training steps
  # Set to -1 for unlimited (train for epochs instead)
  # Typical: 10000-1000000 depending on dataset size
  max_steps: 100000

  # ----- Optimizer Configuration -----
  # Optimizer type
  # Options:
  #   'adamw' - AdamW (standard, reliable)
  #   'lion' - Lion optimizer (more memory efficient)
  #   'sophia' - Sophia (second-order, experimental)
  #   'adafactor' - Adafactor (memory efficient, no momentum)
  optimizer: 'adamw'

  # Use fused optimizer kernels (CUDA-fused operations)
  # 5-10% speedup for AdamW
  # Recommended: true
  use_fused_optimizer: true

  # Offload optimizer states to CPU
  # Saves 30-50% GPU memory
  # Trade-off: 10-20% slower updates
  # Recommended: true for large models on limited GPUs
  offload_optimizer_state: false

  # ----- Checkpointing & Saving -----
  # Save checkpoint every N steps
  # Typical: 5000-20000
  # More frequent = more recovery points but more disk I/O
  save_steps: 5000

  # Run evaluation every N steps
  # Typical: 1000-5000
  eval_steps: 2000

  # Log metrics every N steps
  # Typical: 10-100
  # More frequent = better monitoring but more overhead
  logging_steps: 100

  # Maximum number of checkpoints to keep
  # Older checkpoints are deleted
  # Set to null for unlimited
  save_total_limit: 3

  # ----- Validation Configuration -----
  # Run validation during training
  # Recommended: true (monitor overfitting)
  run_validation: true

  # Validation batch size (can differ from training)
  # Larger = faster validation
  validation_batch_size: 32

  # Maximum number of validation batches per eval
  # Limits validation time
  # Typical: 100-2000
  max_validation_batches: 500

  # Compute validation/train loss ratio
  # Helps detect overfitting
  # Recommended: true
  compute_val_train_ratio: true

  # ----- Generation Testing During Training -----
  # Generate sample text every N steps to test quality
  # Set to 0 or null to disable
  generate_every_n_steps: 5000

  # Number of generation samples per checkpoint
  # Typical: 1-5
  num_generations_per_step: 2

  # Generate samples during validation
  generation_during_eval: false

  # Test generation quality with metrics (BLEU, etc.)
  test_generation_quality: false

  # ----- Adaptive Learning Rate -----
  adaptive_lr:
    # Enable adaptive LR based on validation metrics
    enable_adaptive: false

    # Number of evaluations without improvement before LR reduction
    plateau_patience: 10

    # Minimum relative improvement to count as progress
    # E.g., 0.01 = 1% improvement required
    plateau_threshold: 0.01

    # Factor to reduce LR by when plateau detected
    # E.g., 0.5 = halve the learning rate
    plateau_factor: 0.5

    # Absolute minimum learning rate
    # Training stops if LR goes below this
    plateau_min_lr: 1.0e-8


################################################################################
# 4. DATA CONFIGURATION
################################################################################
data:
  # ----- Dataset Selection -----
  # Dataset filename (in data_dir)
  # Should be a .jsonl file with 'text' or 'content' field
  dataset_name: 'OpenAssistant_oasst2_processed.jsonl'

  # Directory containing datasets
  data_dir: '/project/code/data/processed'

  # Maximum sequence length for training
  # Should not exceed model.max_position_embeddings
  # Typical: 512-2048
  # Longer = more context but more memory
  max_length: 2048

  # ----- Dataset Splits -----
  # Name of training split
  # For HuggingFace datasets or if data is pre-split
  train_split: 'train'

  # Name of validation/evaluation split
  eval_split: 'validation'

  # Automatically create validation split if not present
  # Splits the training data
  auto_create_validation_split: true

  # Fraction of data to use for validation
  # Only used if auto_create_validation_split is true
  # Typical: 0.05-0.2 (5-20%)
  validation_split_ratio: 0.1

  # ----- Tokenizer Configuration -----
  # Tokenizer name or path
  # Can be HuggingFace model name or local path
  # Leave as null to use default_tokenizer_name
  tokenizer_name: null

  # Default tokenizer if tokenizer_name is null
  # Recommended: Fast tokenizer from similar-sized model
  default_tokenizer_name: 'Qwen/Qwen2.5-0.5B'

  # Tokenizer padding side
  # 'right' for encoder models, 'left' for decoder/causal models
  padding_side: 'right'

  # Enable truncation for sequences longer than max_length
  truncation: true

  # ----- DataLoader Settings -----
  # Number of parallel data loading workers
  # 0 = single-threaded loading in main process
  # Typical: 2-8 for small datasets, 0-2 for large datasets
  # More workers = faster loading but more CPU/memory
  num_workers: 4

  # Drop last incomplete batch
  # Recommended: true for consistent batch sizes
  dataloader_drop_last: true

  # Pin memory for faster GPU transfer
  # Recommended: true when training on GPU
  dataloader_pin_memory: true

  # Number of batches to prefetch per worker
  # Typical: 2-4
  # Higher = more memory but better GPU utilization
  dataloader_prefetch_factor: 2

  # Keep data loading workers alive between epochs
  # Recommended: true for multi-epoch training (faster)
  persistent_workers: false

  # ----- Streaming & Sampling -----
  # Use streaming data loader (for very large datasets)
  # Avoids loading entire dataset into memory
  streaming: false

  # Streaming buffer size (number of samples)
  # Only used if streaming is true
  buffer_size: 50000

  # Maximum number of samples to load (for testing/debugging)
  # Set to null for unlimited
  max_samples: null

  # Maximum training examples to use
  # Useful for quick experiments
  max_train_examples: null

  # Maximum evaluation examples to use
  max_eval_examples: null


################################################################################
# 5. DEEPSPEED DISTRIBUTED TRAINING
################################################################################
# DeepSpeed enables efficient multi-GPU and multi-node training
# with ZeRO optimizer, gradient/parameter sharding, and more
deepspeed:
  # Enable DeepSpeed training
  # Recommended: true for multi-GPU, false for single GPU
  use_deepspeed: false

  # Path to DeepSpeed JSON config file
  # If provided, most settings below are ignored
  # Leave as null to use inline configuration below
  config_file: null

  # ----- ZeRO Optimization Stage -----
  # ZeRO (Zero Redundancy Optimizer) sharding level
  # Options:
  #   0 - Disabled (standard DDP)
  #   1 - Optimizer state sharding (4x memory reduction)
  #   2 - Optimizer + gradient sharding (8x memory reduction)
  #   3 - Optimizer + gradient + parameter sharding (linear scaling)
  # Recommended: 2 for most cases, 3 for very large models
  zero_stage: 2

  # ----- Offloading Configuration -----
  # Offload optimizer states and/or parameters to CPU
  # Enables training larger models at cost of speed
  # Trade-off: ~20-40% slower training
  cpu_offload: false

  # Offload to NVMe SSD (for extreme memory savings)
  # Requires fast NVMe drive
  # Trade-off: Much slower than CPU offload
  nvme_offload: false

  # ----- Batch Size Configuration -----
  # These must match the training section values
  # gradient_accumulation_steps from training section
  gradient_accumulation_steps: 4

  # Global batch size = batch_size × gradient_accumulation_steps × num_gpus
  # DeepSpeed calculates this automatically
  # train_batch_size: 64  # Auto-calculated, don't set manually

  # Micro batch size per GPU (should match training.batch_size)
  # micro_batch_size: 16  # Auto-calculated from training.batch_size

  # ----- Mixed Precision Training -----
  # Enable FP16 or BF16 mixed precision
  # Recommended: true (2x speedup, 50% memory savings)
  enable_mixed_precision: true

  # Precision type
  # Options:
  #   'fp16' - FP16 (compatible with all GPUs, requires loss scaling)
  #   'bf16' - BF16 (Ampere+, better numerical stability, no loss scaling)
  #   'fp32' - Full precision (slow, only for debugging)
  # Recommended: 'bf16' on A100/H100, 'fp16' on older GPUs
  precision_type: 'bf16'

  # ----- ZeRO Stage-Specific Settings -----
  # Allow optimizers not officially tested with ZeRO
  zero_allow_untested_optimizer: false

  # Force DeepSpeed's CPU Adam optimizer
  # Required for ZeRO stage 2/3 with CPU offload
  zero_force_ds_cpu_optimizer: false

  # Use reduce-scatter instead of all-reduce for gradients
  # More efficient for large models
  # Recommended: true for ZeRO stage 2+
  zero_reduce_scatter: true

  # Overlap communication with computation
  # Hides communication latency
  # Recommended: true (10-20% speedup)
  zero_overlap_comm: true

  # Store gradients in contiguous memory
  # Slightly faster but more memory
  zero_contiguous_gradients: true

  # Gradient reduce bucket size (bytes)
  # Larger = less communication overhead but more memory
  # Default: 500MB
  zero_reduce_bucket_size: 500000000

  # All-gather bucket size for parameters (bytes)
  # Used in ZeRO stage 3
  # Default: 500MB
  zero_allgather_bucket_size: 500000000

  # ZeRO stage 3 prefetch bucket size (bytes)
  # How much to prefetch before computation
  # Larger = better overlap but more memory
  zero_stage3_prefetch_bucket_size: 500000000

  # ZeRO stage 3 parameter persistence threshold
  # Parameters larger than this stay on GPU
  # Useful for frequently accessed parameters
  zero_stage3_param_persistence_threshold: 1000000

  # ----- Communication Settings -----
  # Data type for gradient communication
  # Options: 'fp32', 'fp16', 'bf16'
  # Recommended: match precision_type
  communication_data_type: 'fp32'

  # All-reduce gradient partitions
  allreduce_partitions: true

  # All-gather gradient partitions
  allgather_partitions: true

  # Overlap communication with backward pass
  overlap_comm: true

  # Detailed timing breakdown for profiling
  # Recommended: false (overhead in production)
  wall_clock_breakdown: false

  # ----- Activation Checkpointing -----
  # Enable activation checkpointing (different from model.gradient_checkpointing)
  # This is DeepSpeed's implementation
  activation_checkpointing: false

  # Partition activations across GPUs (ZeRO-R)
  partition_activations: false

  # Store activations on CPU
  # Extreme memory savings, very slow
  cpu_checkpointing: false

  # Optimize activation memory layout
  contiguous_memory_optimization: false

  # Synchronize DP processes for activation checkpointing
  synchronize_dp_processes: false

  # ----- Pipeline Parallelism -----
  # Number of pipeline parallel stages
  # Requires model modification for pipeline splits
  # Typical: 1 (disabled), 2-4 for very large models
  pipeline_parallel_size: 1

  # Gradient clipping value (can override training.max_gradient_norm)
  gradient_clipping: null


################################################################################
# 6. HARDWARE & PERFORMANCE CONFIGURATION
################################################################################
hardware:
  # ----- Device Selection -----
  # Device to train on
  # Options: 'cuda' (GPU), 'cpu', 'mps' (Apple Silicon)
  # Auto-detected if not specified
  device: 'cuda'

  # Mixed precision mode
  # Options:
  #   'fp32' - Full precision (slow, only for debugging)
  #   'fp16' - Half precision (2x speedup, requires loss scaling)
  #   'bf16' - BFloat16 (2x speedup, better stability, Ampere+ only)
  # Recommended: 'bf16' on modern GPUs, 'fp16' on older GPUs
  mixed_precision: 'bf16'

  # Enable torch.compile for entire model
  # WARNING: Conflicts with gradient_checkpointing
  # Recommended: false for training, true for inference
  compile: false

performance:
  # ----- TF32 Acceleration (Ampere+ GPUs) -----
  # Enable TensorFloat-32 on Ampere+ GPUs
  # 8x faster matrix multiplication with minimal accuracy loss
  # Recommended: true on A100/H100
  enable_tf32: true

  # TF32 precision mode
  # Options:
  #   'highest' - Disable TF32 (slow, accurate)
  #   'high' - TF32 only for matmul (balanced)
  #   'medium' - TF32 for all operations (fastest)
  # Recommended: 'high' or 'medium'
  float32_matmul_precision: 'high'

  # ----- cuDNN Optimization -----
  # Auto-tune cuDNN kernels for this specific model
  # First few iterations are slower while tuning
  # Recommended: true (5-10% speedup after warmup)
  enable_cudnn_benchmark: true

  # ----- CUDA Graphs -----
  # Skip dynamic shapes in CUDA graphs
  # Faster but less flexible
  cudagraph_skip_dynamic_shapes: true

  # Warning limit for dynamic shape changes
  # Set to null to disable warnings
  cudagraph_dynamic_shape_warn_limit: null

  # ----- TorchInductor Auto-tuning -----
  # Auto-tuning level for torch.compile
  # Options:
  #   0 - Disabled
  #   1 - Basic tuning (~5% speedup)
  #   2 - Aggressive tuning (~10-15% speedup, slower compilation)
  #   3-4 - Experimental (unstable)
  # Recommended: 1 for production, 2 for benchmarking
  torchinductor_max_autotune: 0

  # ----- Performance Modes -----
  # Ultra-fast mode: Disable all logging/monitoring
  # Maximum training speed, minimal visibility
  # Recommended: false (use only for benchmarking)
  ultra_fast_mode: false

  # Enhanced progress bar with detailed metrics
  fast_progress: true

  # Minimal progress bar (ultra-compact)
  minimal_progress: false

  # Disable CUDA synchronization (risky but faster)
  # Can cause race conditions
  # Recommended: false
  no_sync: false

  # Express mode: Async logging with reduced frequency
  # Faster training with less frequent logs
  express_mode: false

  # ----- Memory Management -----
  # Enable periodic GPU memory cleanup
  # Useful for long training runs to prevent fragmentation
  # Trade-off: Small periodic pauses
  enable_gpu_memory_cleanup: true

  # Frequency of gradient health checks (steps)
  # Set to 0 to disable
  # Lower = more monitoring overhead
  gradient_check_frequency: 100


################################################################################
# 7. OPTIMIZATION SETTINGS
################################################################################
# These are advanced optimizations from the 5-phase optimization guide
optimizations:
  # ----- Phase 1: Quick Wins -----
  # Disable gradient health monitoring
  # Saves 5-8% training time
  # Recommended: true (disable only for debugging gradients)
  gradient_health_monitoring: false

  # TorchInductor auto-tuning level
  # 0 = disabled, 1 = basic, 2 = aggressive
  # 10-15% speedup with level 1-2
  # Recommended: 1
  torchinductor_autotune: 1

  # ----- Memory Cleanup Thresholds -----
  # GPU memory usage thresholds for cleanup triggers
  memory_cleanup_thresholds:
    # Warning threshold (log warning)
    # 0.990 = 99.0% GPU memory used
    warning: 0.990

    # Critical threshold (force cleanup)
    # 0.995 = 99.5% GPU memory used
    critical: 0.995

    # Emergency threshold (aggressive cleanup)
    # 0.999 = 99.9% GPU memory used
    emergency: 0.999

  # ----- Expert Prefetch Optimization -----
  # Multi-stage async expert prefetching
  # 25-35% speedup when using expert offloading
  expert_prefetch:
    # Enable multi-stage prefetching
    enabled: true

    # Prefetch lookahead depth (number of future layers)
    # Higher = better overlap but more GPU memory
    # Typical: 1 (ultra-low-mem), 2 (balanced), 3-4 (large models)
    lookahead: 2

    # Use multiple CUDA streams for parallel transfers
    # Recommended: true (better overlap)
    use_multiple_streams: true

  # ----- Expert Cache Optimization -----
  expert_cache:
    # Automatically limit cache size based on available memory
    # Recommended: true (prevents OOM)
    auto_limit: true

    # Use LRU eviction when cache is full
    # Recommended: true
    use_lru_eviction: true

  # ----- Checkpoint Optimization -----
  # Async checkpoint saving
  # Saves 20-30 seconds per checkpoint
  checkpoint:
    # Save checkpoints in background thread
    # Training continues while saving
    # Recommended: true
    async_saving: true

  # ----- GPU Memory Cleanup Optimization -----
  # Faster memory cleanup
  # Saves 2.5 seconds per cleanup
  memory_cleanup:
    # Use fast cleanup mode (fewer rounds)
    # 2 rounds instead of 5
    # Recommended: true
    fast_mode: true

    # Remove sleep delays between cleanup rounds
    # Recommended: true
    remove_sleep: true

  # ----- DataLoader Optimization -----
  # Adaptive file reading based on file size
  # 20-30% faster data loading
  dataloader:
    # Enable adaptive samples-per-file
    # Reads more samples from large files in one go
    enabled: true

    # Multipliers for different file sizes
    adaptive_multipliers:
      # Files larger than 10MB
      large_files: 4

      # Files between 1MB and 10MB
      medium_files: 2

      # Files smaller than 1MB
      small_files: 1

  # ----- Gradient Checkpointing Optimization -----
  # Selective checkpointing (checkpoint only heavy layers)
  # 25% memory savings with only 8% slowdown
  gradient_checkpointing:
    # Enable selective checkpointing (MoE/FFN only)
    # Checkpoints only expensive layers
    selective: true

    # Checkpoint attention layers as well
    # More memory savings but slower
    # Recommended: false
    checkpoint_attention: false

  # ----- Router Optimization -----
  # Router computation optimizations
  # 15-30% speedup for routing operations
  router:
    # Compute routing cache hash on GPU
    # 15-20% faster evaluation
    # Recommended: true
    cache_hash_on_gpu: true

    # Compile routers with torch.compile
    # 20-30% faster routing
    # Recommended: true
    compile_routers: true

    # Compilation mode for routers
    # Options: 'default', 'reduce-overhead', 'max-autotune'
    # Recommended: 'default'
    compile_mode: 'default'

    # Enable dynamic compilation (handle variable sequence lengths)
    # Recommended: true
    compile_dynamic: true


################################################################################
# 8. LOSS FUNCTIONS & TRAINING OBJECTIVES
################################################################################
losses:
  # ----- Multi-Token Prediction (DeepSeek-style) -----
  # Predict multiple future tokens simultaneously
  # Improves sample efficiency and reasoning
  # Trade-off: 10-20% slower training, more memory

  # Enable multi-token prediction
  use_multi_token_prediction: false

  # Number of future tokens to predict
  # Typical: 2-4 (more = better but slower)
  num_future_tokens: 3

  # Weight for multi-token prediction loss
  # Relative to primary next-token loss
  # Typical: 0.1-0.5
  mtp_weight: 0.1

  # ----- Temperature Scaling -----
  # Initial temperature for logits
  # Higher = more diverse predictions
  # Typical: 1.0 (no scaling), 0.7-1.5
  initial_temperature: 1.0

  # Adapt temperature during training
  # Learn optimal temperature
  adaptive_temperature: false

  # Label smoothing factor
  # Prevents overconfidence
  # Typical: 0.0 (disabled), 0.05-0.2
  label_smoothing: 0.0

  # ----- MoE Balancing Losses -----
  # Gradient-based MoE load balancing
  # Alternative to auxiliary loss
  use_moe_balancing: false

  # Weight for gradient balancing
  # Typical: 0.0-0.1
  gradient_balance_weight: 0.0

  # Use traditional auxiliary load balancing loss
  # Recommended: true for MoE models
  use_auxiliary_loss: true

  # ----- Advanced Loss Functions -----
  # Focal loss for hard examples
  # Focuses on difficult tokens
  # Recommended: false (use for imbalanced data)
  use_focal_loss: false

  # Contrastive learning loss
  # Learn better representations
  # Experimental, requires paired data
  use_contrastive_loss: false

  # Diversity loss for output distributions
  # Encourage diverse predictions
  use_diversity_loss: false

  # Adaptive loss scaling
  # Automatically balance multiple losses
  adaptive_loss_scaling: false

  # ----- Repetition Prevention -----
  # N-gram repetition penalty
  # Penalizes repeated n-grams in output
  use_ngram_penalty: false

  # N-gram size for repetition detection
  # Typical: 3-5
  ngram_size: 3

  # Weight for n-gram penalty
  # Typical: 0.0-0.5
  ngram_penalty_weight: 0.0

  # Immediate repetition detector
  # Penalizes consecutive identical tokens
  use_immediate_repetition_detector: false

  # Weight for immediate repetition penalty
  # Typical: 0.0-1.0
  immediate_repetition_weight: 0.0

# ----- Enhanced Loss Features -----
enhanced_features:
  losses:
    # All settings above can also be specified here
    # This is an alternative organization for compatibility
    use_multi_token_prediction: false
    num_future_tokens: 3
    mtp_weight: 0.1


################################################################################
# 9. ADAPTIVE MULTI-TOKEN PREDICTION (Advanced)
################################################################################
# Confidence-gated multi-token prediction system
# Only predicts future tokens when model is confident
adaptive_mtp:
  # Enable adaptive MTP system
  use_adaptive_mtp: false

  # Number of future tokens to predict (prediction heads)
  # Typical: 2-4
  num_prediction_heads: 3

  # ----- Confidence Gating -----
  # Confidence threshold during training
  # Only use MTP when confidence > this value
  # Lower = more aggressive MTP usage
  # Typical: 0.5-0.8
  confidence_threshold_train: 0.6

  # Confidence threshold during inference
  # Can be higher than training for quality
  # Typical: 0.7-0.9
  confidence_threshold_inference: 0.7

  # ----- Confidence Gate Architecture -----
  # Hidden dimensions for confidence gate MLP
  # Comma-separated list: "512,256" means two layers
  gate_hidden_dims: "512,256"

  # Dropout in confidence gate
  # Typical: 0.1-0.2
  gate_dropout: 0.1

  # Activation function for gate
  # Options: 'gelu', 'relu', 'swish'
  gate_activation: 'gelu'

  # Use attention pooling in confidence gate
  # Better context awareness but slower
  use_attention_pooling: false

  # ----- Prediction Head Architecture -----
  # Type of prediction head
  # Options:
  #   'linear' - Simple linear projection (fast)
  #   'mlp' - Multi-layer MLP (better quality)
  head_type: 'linear'

  # Intermediate size for MLP heads
  # Only used if head_type is 'mlp'
  # Typical: hidden_size * 2
  head_intermediate_size: null

  # Dropout in prediction heads
  # Typical: 0.1-0.2
  head_dropout: 0.1

  # Share projection weights across prediction heads
  # Memory savings but less flexibility
  share_projections: false

  # ----- Training Configuration -----
  # MTP warmup epochs
  # Train only primary head for first N epochs
  # Stabilizes initial training
  # Typical: 1-3
  mtp_warmup_epochs: 2

  # Confidence regularization strength
  # Prevents gate from always being confident
  # Typical: 0.01-0.1
  confidence_reg_strength: 0.01

  # ----- Loss Weighting -----
  # Weight losses by confidence scores
  # Higher confidence = higher weight
  use_confidence_weighting: false

  # Weight for primary (next token) prediction
  primary_loss_weight: 1.0

  # Base weight for additional token predictions
  # Actual weight may be modulated by confidence
  additional_loss_base_weight: 0.1

  # ----- Efficiency Settings -----
  # Skip MTP computation when confidence is low
  # Memory and speed savings
  enable_dynamic_prediction: false

  # Minimum confidence to compute MTP heads
  # Don't compute heads if gate confidence < this
  # Typical: 0.3-0.5
  min_confidence_for_computation: 0.3


################################################################################
# 10. PROGRESSIVE TRAINING
################################################################################
# Curriculum learning and progressive strategies
training:
  progressive:
    # ----- Progressive Sequence Length Scaling -----
    # Enable progressive training features
    enable_progressive_training: false

    # Enable progressive sequence length scaling
    # Start with short sequences, gradually increase
    # Better convergence and faster early training
    enable_sequence_scaling: false

    # Starting sequence length
    # Typical: 128-512
    initial_seq_length: 128

    # Final sequence length (target)
    # Should match data.max_length
    final_seq_length: 2048

    # Length growth schedule
    # Options:
    #   'linear' - Linear growth
    #   'exponential' - Exponential growth (slow start, fast end)
    #   'step' - Step-wise growth
    length_schedule: 'linear'

    # Number of epochs for length growth
    # Spread growth over this many epochs
    # Typical: 5-20
    length_growth_epochs: 10

    # Enable length bucketing
    # Group similar-length sequences in batches
    # More efficient but may skip some data
    enable_length_bucketing: false

    # ----- Curriculum Learning -----
    # Enable curriculum learning (easy to hard)
    enable_curriculum: false

    # Metric to determine sample difficulty
    # Options:
    #   'loss' - Use per-sample loss
    #   'attention_entropy' - Use attention patterns
    #   'perplexity' - Use perplexity
    curriculum_metric: 'loss'

    # Cache difficulty scores
    # Avoid recomputing for static datasets
    enable_score_caching: false

    # Directory for difficulty score cache
    cache_dir: '/tmp/difficulty_cache'

    # Cache version (invalidate when data changes)
    cache_version: 'v1.0'

    # ----- Dynamic Batch Sizing -----
    # Enable dynamic batch size adaptation
    # Automatically adjust batch size based on sequence length
    enable_dynamic_batch: false

    # Use binary search to find optimal batch size
    # Prevents OOM by finding max safe batch size
    enable_binary_search_oom: false

    # Dry run mode (test without training)
    enable_dry_run_mode: false

    # Minimum batch size
    min_batch_size: 1

    # Maximum batch size
    max_batch_size: 64

    # Target GPU memory utilization
    # Typical: 0.80-0.95
    target_gpu_utilization: 0.85

    # Adapt batch size every N steps
    # Typical: 50-500
    batch_size_adaptation_steps: 100


################################################################################
# 11. LEARNING RATE FINDER
################################################################################
# Automatically find optimal learning rate before training
lr_finder:
  # Run LR finder before training
  # Recommended: true for new models/datasets
  run_lr_finder: false

  # Starting learning rate for search
  # Should be very small
  start_lr: 1.0e-8

  # Ending learning rate for search
  # Should be larger than expected optimum
  end_lr: 1.0

  # Number of iterations to test
  # Typical: 100-500
  num_iterations: 100

  # Method for suggesting optimal LR
  # Options:
  #   'steepest' - Steepest gradient descent point
  #   'minimum' - Minimum loss point
  #   'valley' - Valley in loss curve
  # Recommended: 'steepest'
  suggestion_method: 'steepest'

  # Automatically use suggested LR
  # If false, prints suggestion but doesn't apply it
  use_suggested_lr: false

  # Path to save LR finder plot
  # Set to null to skip saving
  plot_path: '/project/code/outputs/lr_finder_plot.png'

  # Smoothing factor for loss curve
  # Higher = smoother curve
  # Typical: 0.90-0.99
  smooth_beta: 0.98

  # Stop if loss diverges by this factor
  # Typical: 3.0-5.0
  stop_div_threshold: 4.0


################################################################################
# 12. GRADIENT CONFIGURATION
################################################################################
gradient:
  # ----- Gradient Surgery -----
  # Enable gradient surgery (multi-task learning)
  # Resolves conflicting gradients from different objectives
  # Recommended: false unless using multiple loss terms
  gradient_surgery: false

  # Adaptive gradient surgery method selection
  # Automatically choose best method
  adaptive_gradient_surgery: false

  # Gradient surgery method
  # Options:
  #   'pcgrad' - Project Conflicting Gradients
  #   'cagrad' - Conflict-Averse Gradient descent
  gradient_surgery_method: 'pcgrad'

  # ----- Gradient Health Monitoring -----
  # Enable gradient health monitoring
  # Detects gradient explosion/vanishing
  # Trade-off: 5-8% overhead
  # Recommended: false (enable only for debugging)
  enabled: false

  # Gradient explosion threshold
  # Alert if gradient norm exceeds this multiple of average
  # Typical: 5.0-10.0
  explosion_threshold: 10.0

  # Gradient norm history (auto-managed)
  # Used for computing statistics
  grad_norm_history: []


################################################################################
# 13. QUANTIZATION CONFIGURATION
################################################################################
quantization:
  # ----- Quantization-Aware Training (QAT) -----
  # Enable quantization-aware training
  # Train model to be robust to quantization
  # Recommended: false unless targeting quantized deployment
  quantization_aware: false

  # Quantization bit width
  # Options: 8 (INT8), 4 (INT4)
  bit_width: 8

  # ----- NVFP4 Training (NVIDIA FP4) -----
  # Use NVIDIA 4-bit floating point format
  # Experimental, requires recent CUDA
  use_nvfp4: false

  # Block size for NVFP4 quantization
  # Typical: 16-64
  nvfp4_block_size: 16

  # Stochastic rounding for quantization
  # Better convergence than deterministic rounding
  stochastic_rounding: false

  # Use Hadamard transforms before quantization
  # Better numerical properties
  use_hadamard_transform: false

  # Use TorchAO implementation of NVFP4
  # Alternative implementation
  use_torchao_nvfp4: false


################################################################################
# 14. EVALUATION CONFIGURATION
################################################################################
evaluation:
  # Enable evaluation during training
  # Recommended: true
  eval_during_training: true

  # Evaluation metrics to compute
  # Comma-separated list
  # Options: 'perplexity', 'bleu', 'rouge', 'meteor', 'bertscore'
  # Set to null to use only loss
  eval_metrics: null

  # Evaluation frequency (steps)
  # How often to run evaluation
  # Typical: 100-1000
  eval_frequency: 500

  # Run comprehensive evaluation suite
  # Includes generation quality, diversity metrics, etc.
  # Trade-off: Much slower evaluation
  comprehensive_eval: false


################################################################################
# 15. WEIGHTS & BIASES LOGGING
################################################################################
wandb:
  # Enable Weights & Biases logging
  # Recommended: true for experiment tracking
  use_wandb: true

  # Explicitly disable WandB (overrides use_wandb)
  disable_wandb: false

  # Force offline mode (no cloud sync)
  # Logs saved locally only
  wandb_offline: false

  # WandB project name
  wandb_project: 'Ava'

  # WandB run name
  # Auto-generated if null
  wandb_name: null

  # WandB tags for organizing runs
  # List of strings
  wandb_tags: ['moe', 'training']

  # WandB logging frequency (steps)
  # How often to log metrics
  # Typical: 1-100
  wandb_log_freq: 10

  # WandB cache size for offline resilience
  # Buffer metrics in case of connection issues
  # Number of steps to cache
  wandb_cache_size: 2000

  # Cache flush interval (steps)
  # How often to flush cache to WandB servers
  wandb_cache_flush_interval: 50


################################################################################
# 16. OUTPUT & RUN MANAGEMENT
################################################################################
output:
  # Output directory for checkpoints, logs, etc.
  output_dir: '/project/code/outputs'

  # Save checkpoint every N steps
  # (Duplicate of training.save_steps for compatibility)
  save_every: 5000

  # Resume from checkpoint path
  # Set to path of checkpoint directory to resume
  # null = start fresh
  resume: null

  # Force fresh start, ignore any existing checkpoints
  # Useful for restarts
  fresh_start: false

  # Maximum number of checkpoints to keep
  # Older checkpoints deleted automatically
  # null = keep all
  save_total_limit: 3

run_management:
  # Custom run name
  # Auto-generated if null
  run_name: null

  # Run tags (comma-separated)
  # For organizing experiments
  # E.g., "experiment1,ablation,moe"
  run_tags: null

  # Run description
  # Free-form text describing this run
  run_description: null

  # Disable run manager
  # Skip automatic run tracking
  disable_run_manager: false


################################################################################
# 17. MULTI-COLUMN DATA CONFIGURATION
################################################################################
# For datasets with multiple fields (e.g., instruction, input, output)
multi_column_data:
  # Enable multi-column data handling
  use_multi_column: false

  # Path to dataset configuration file
  # YAML file specifying column mappings
  dataset_config: null

  # HuggingFace dataset name
  # E.g., "databricks/databricks-dolly-15k"
  hf_dataset: null

  # HuggingFace dataset config/subset name
  hf_dataset_config: null

  # Column names (comma-separated)
  # E.g., "instruction,input,output"
  column_names: null

  # Column types (comma-separated)
  # Options: 'text', 'numeric', 'categorical'
  column_types: null

  # Column roles (comma-separated)
  # Options: 'instruction', 'input', 'output', 'context'
  column_roles: null

  # Strategy for combining columns
  # Options:
  #   'concatenate' - Simple concatenation
  #   'separate' - Keep separate (multi-task)
  #   'template' - Use template string
  combine_strategy: 'concatenate'

  # Template for combining columns (if combine_strategy is 'template')
  # Use {column_name} placeholders
  # E.g., "Instruction: {instruction}\nInput: {input}\nOutput: {output}"
  column_template: null


################################################################################
# 18. ARCHITECTURE ENHANCEMENTS
################################################################################
architecture:
  # ----- Mixture of Heads (MoH) -----
  # Different attention heads as "experts"
  # Experimental
  use_moh: false

  # ----- Mixture of Activations (MoA) -----
  # Route between different activation functions
  # Experimental
  use_moa: false

  # ----- Cross-Attention (Multi-modal) -----
  # Enable cross-attention layers
  # For multi-modal inputs (text + image)
  use_cross_attention: false

  # ----- ALiBi Positional Encoding -----
  # Use ALiBi instead of RoPE
  # Better length extrapolation
  # (Also in model.use_alibi for compatibility)
  use_alibi: false

  # ----- Expert Routing Type -----
  # Alternative expert routing mechanism
  # (Duplicates model.router_type for compatibility)
  expert_routing_type: 'switch'


################################################################################
# 19. RAG (Retrieval-Augmented Generation)
################################################################################
# Integrate external knowledge retrieval
rag:
  # Enable RAG system
  use_rag: false

  # Path to knowledge base (vector database)
  # Should contain pre-embedded documents
  knowledge_base_path: null

  # Maximum number of documents to retrieve
  # Typical: 3-10
  max_retrieved_docs: 5

  # RAG fusion strategy
  # Options:
  #   'attention' - Cross-attention over retrieved docs
  #   'concatenate' - Prepend retrieved docs to input
  rag_fusion_type: 'attention'


################################################################################
# 20. EPISODIC MEMORY (Continual Learning)
################################################################################
# Maintain memory of past training examples
memory:
  # Enable episodic memory system
  use_episodic_memory: false

  # Maximum number of examples to store
  # Typical: 100-10000
  memory_capacity: 1000

  # Strategy for selecting what to remember
  # Options:
  #   'importance' - Store important/difficult examples
  #   'recency' - Store recent examples
  memory_selection_strategy: 'importance'

  # Importance threshold (0.0-1.0)
  # Only store examples above this importance
  memory_importance_threshold: 0.5

  # Retrieval method for memory
  # Options:
  #   'cosine' - Cosine similarity
  #   'euclidean' - Euclidean distance
  memory_retrieval_method: 'cosine'

  # Ratio of batch from memory vs. new data
  # E.g., 0.2 = 20% memory replay, 80% new data
  memory_replay_ratio: 0.2

  # Memory replay strategy
  # Options:
  #   'importance' - Replay important examples
  #   'random' - Random sampling
  memory_replay_strategy: 'importance'

  # Memory adaptation rate
  # How quickly to update importance scores
  # Typical: 0.001-0.1
  memory_adaptation_rate: 0.01

  # Performance tracking window
  # Track performance over last N examples
  memory_performance_window: 100

  # Task ID for multi-task continual learning
  task_id: 0

  # Silent mode (suppress memory system warnings)
  silent_mode: false

  # Enable automatic gradient accumulation adjustment
  # Adjust for memory replay
  enable_auto_grad_accumulation: false


