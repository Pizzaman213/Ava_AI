# ====================================================================
# LION OPTIMIZER EXAMPLE CONFIGURATION
# ====================================================================
# This config demonstrates using the Lion (EvoLved Sign Momentum) optimizer
# which offers several advantages over AdamW:
#
# KEY BENEFITS:
# 1. 50% Memory Reduction - Lion doesn't store second moments
# 2. Better Performance - Often matches or exceeds AdamW quality
# 3. Simpler Updates - Sign-based optimization for stability
# 4. Faster Convergence - Especially on large-scale models
#
# IMPORTANT HYPERPARAMETER DIFFERENCES FROM ADAMW:
# - Learning Rate: Use 3-10x SMALLER than AdamW (typical: 1e-4 to 5e-5)
# - Betas: (0.9, 0.99) instead of (0.9, 0.999)
# - Weight Decay: 0.01-0.1 (similar to AdamW)
#
# WHEN TO USE LION:
# - Training large models with limited GPU memory
# - When AdamW is close to OOM
# - Want comparable or better results with less memory
# ====================================================================

model:
  vocab_size: 50680
  hidden_size: 4096
  num_layers: 12
  num_attention_heads: 32
  intermediate_size: 14336
  max_position_embeddings: 2048
  num_experts: 32
  num_experts_per_token: 2
  router_type: mixtral
  capacity_factor: 1.25
  expert_dropout: 0.0
  activation: swiglu
  use_grouped_gemm: true
  use_triton_kernels: true
  use_torch_compile: true
  use_flash_attention: true
  gradient_checkpointing: true
  use_optimized_moe: true
  router_z_loss_coef: 0.001
  load_balance_loss_coef: 0.01
  diversity_loss_coef: 0.001
  expert_dropout_loss_coef: 0.0
  router_jitter_noise: 0.01
  attention_dropout: 0.0
  dropout: 0.0
  layer_norm_eps: 1.0e-05
  initializer_range: 0.02

# ====================================================================
# TRAINING CONFIGURATION WITH LION OPTIMIZER
# ====================================================================
training:
  batch_size: 16
  gradient_accumulation_steps: 4

  # === LION OPTIMIZER SETTINGS ===
  optimizer: lion                    # Use Lion instead of adamw

  # CRITICAL: Lion needs 3-10x smaller LR than AdamW!
  # If you used 3e-4 for AdamW, try 1e-4 or 5e-5 for Lion
  learning_rate: 0.0001              # 1e-4 (typical Lion LR)

  # Lion-specific hyperparameters (optional - these are the defaults)
  lion_betas: [0.9, 0.99]            # Beta1=0.9, Beta2=0.99 (Lion defaults)
                                     # Note: Different from AdamW's (0.9, 0.999)

  weight_decay: 0.1                  # Similar to AdamW (0.01-0.1 range)

  # Training schedule
  max_steps: 50000
  warmup_steps: 2000                 # 4% of total steps
  save_steps: 5000
  eval_steps: 1000
  logging_steps: 100

  # Validation settings
  run_validation: true
  validation_batch_size: 8
  max_validation_batches: 100
  compute_val_train_ratio: true

  # Generation settings
  generate_every_n_steps: 5000
  num_generations_per_step: 2
  generation_during_eval: false
  test_generation_quality: false

# ====================================================================
# OPTIMIZER COMPARISON GUIDE
# ====================================================================
# Here are recommended settings for different optimizers:
#
# AdamW (baseline):
#   optimizer: adamw
#   learning_rate: 3e-4
#   weight_decay: 0.1
#   Memory: 100% (baseline)
#
# Lion (this config):
#   optimizer: lion
#   learning_rate: 1e-4              # 3x smaller than AdamW!
#   lion_betas: [0.9, 0.99]
#   weight_decay: 0.1
#   Memory: 50% of AdamW
#
# Sophia (for very large models >10B params):
#   optimizer: sophia
#   learning_rate: 1.5e-4
#   sophia_betas: [0.965, 0.99]
#   sophia_rho: 0.04
#   weight_decay: 0.1
#   Memory: ~100% (similar to AdamW)
#   Speed: 2x faster convergence
#
# AdaFactor (extreme memory constraints):
#   optimizer: adafactor
#   learning_rate: null              # Uses adaptive LR
#   adafactor_adaptive_lr: true
#   weight_decay: 0.1
#   Memory: 20% of AdamW
# ====================================================================

# ====================================================================
# DATA CONFIGURATION
# ====================================================================
data:
  dataset_name: OpenAssistant_oasst2_processed.jsonl
  data_dir: /project/code/data/processed
  max_length: 512
  train_split: train
  eval_split: validation
  auto_create_validation_split: true
  validation_split_ratio: 0.1
  tokenizer_name: /project/code/models/tokenizer/enhanced-50680
  padding_side: right
  truncation: true
  num_workers: 4
  dataloader_drop_last: true
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 2

# ====================================================================
# OUTPUT CONFIGURATION
# ====================================================================
output:
  output_dir: /project/code/outputs/runs/lion_optimizer_example
  save_every: 5000
  fresh_start: false

run_management:
  run_name: lion_optimizer_example
  run_description: "Lion optimizer example - 50% memory reduction vs AdamW"
  run_tags: lion,optimizer,memory-efficient,example

# ====================================================================
# PERFORMANCE TUNING
# ====================================================================
performance:
  enable_tf32: true
  float32_matmul_precision: high
  enable_cudnn_benchmark: true
  enable_gpu_memory_cleanup: true
  gradient_check_frequency: 10
  torchinductor_max_autotune: 1
  torch_compile_mode: default

gradient_health:
  enabled: true

# ====================================================================
# OPTIMIZATION SETTINGS
# ====================================================================
optimizations:
  gradient_health_monitoring: true
  torchinductor_autotune: 1

  memory_cleanup_thresholds:
    warning: 0.85
    critical: 0.90
    emergency: 0.95

  expert_prefetch:
    enabled: true
    lookahead: 2
    use_multiple_streams: true

  expert_cache:
    auto_limit: true
    use_lru_eviction: true

  checkpoint:
    async_saving: true

  memory_cleanup:
    fast_mode: true
    remove_sleep: true

  dataloader:
    adaptive_file_reading: true
    adaptive_multipliers:
      large_files: 4
      medium_files: 2
      small_files: 1

  gradient_checkpointing:
    selective: true
    checkpoint_attention: false

  router:
    cache_hash_on_gpu: true
    compile_routers: true
    compile_mode: default
    compile_dynamic: true

# ====================================================================
# HARDWARE CONFIGURATION
# ====================================================================
hardware:
  device: cuda
  mixed_precision: bf16
  compile: true

# ====================================================================
# WANDB CONFIGURATION
# ====================================================================
wandb:
  use_wandb: true
  project: ava-lion-optimizer
  entity: null
  run_name: lion_example
  log_model: false

# ====================================================================
# DEEPSPEED (Optional)
# ====================================================================
deepspeed:
  use_deepspeed: false

# ====================================================================
# ADVANCED: COMBINING LION WITH OTHER OPTIMIZATIONS
# ====================================================================
# You can combine Lion optimizer with other memory optimizations:
#
# Lion + Gradient Checkpointing:
#   model:
#     gradient_checkpointing: true
#   training:
#     optimizer: lion
#   # Effect: 50% optimizer memory + 40% activation memory savings
#
# Lion + CPU Offloading:
#   training:
#     optimizer: lion
#     offload_optimizer_state: true
#   # Effect: 50% optimizer memory + another 30-50% from offloading
#
# Lion + LoRA:
#   model:
#     use_lora_experts: true
#     lora_rank: 4
#   training:
#     optimizer: lion
#   # Effect: 96% parameter reduction + 50% optimizer memory
#
# Lion + All Optimizations:
#   # Combine everything above for maximum memory savings!
# ====================================================================

# ====================================================================
# TROUBLESHOOTING
# ====================================================================
# If training is unstable:
# 1. Reduce learning rate (try 5e-5 instead of 1e-4)
# 2. Increase warmup_steps (try 5% of total steps)
# 3. Reduce weight_decay (try 0.01 instead of 0.1)
# 4. Check gradient clipping (max_gradient_norm in training config)
#
# If loss not decreasing:
# 1. Learning rate might be too small - try 1.5e-4
# 2. Check that lion_betas are set correctly
# 3. Compare with AdamW baseline to validate
#
# If OOM despite Lion:
# 1. Enable gradient_checkpointing
# 2. Add offload_optimizer_state: true
# 3. Reduce batch_size
# 4. Consider combining with LoRA or expert offloading
# ====================================================================
