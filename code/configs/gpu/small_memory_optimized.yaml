# Memory-Optimized Configuration for Ava Small Model
# Target: Maximize memory efficiency while maintaining reasonable performance
# Trade-off: ~30% slower training, but can train with 50% less memory

model:
  hidden_size: 512
  num_layers: 12
  num_attention_heads: 8
  intermediate_size: 1536
  vocab_size: 65536
  max_position_embeddings: 256
  num_experts: 4
  num_experts_per_token: 2
  expert_capacity_factor: 1.25
  router_type: deepseek
  router_aux_loss_coef: 0.005
  router_jitter_noise: 0.005
  use_cache: false  # Disabled during training for memory
  rope_theta: 10000.0
  attention_dropout: 0.1
  hidden_dropout: 0.1
  use_flash_attention: true  # Memory-efficient attention
  layer_norm_eps: 1e-5
  initializer_range: 0.02
  hidden_act: swish
  deepspeed_activation_checkpointing: true  # ENABLED for memory
  deepspeed_partition_activations: true     # ENABLED for memory
  deepspeed_moe_param_groups: true
  tie_word_embeddings: true  # Reduces parameters
  dropout: 0.1

training:
  batch_size: 24  # REDUCED from 48 for memory
  gradient_accumulation_steps: 2  # INCREASED - effective batch = 48
  max_gradient_norm: 0.5
  num_epochs: 1
  max_steps: null
  warmup_steps: 500
  warmup_schedule: cosine
  learning_rate: 0.0006
  lr_scheduler_type: cosine
  lr_end: 6e-05
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1e-7
  mixed_precision: bf16
  dataloader_num_workers: 8  # REDUCED from 12 for memory
  prefetch_factor: 4  # REDUCED from 8 for memory
  persistent_workers: false  # DISABLED to free memory between epochs
  gradient_checkpointing: true  # ENABLED - saves 40-60% memory
  eval_strategy: steps
  eval_steps: 1000
  eval_steps_type: training_steps
  save_strategy: steps
  save_steps: 2000
  save_total_limit: 2
  logging_steps: 50
  generate_during_eval: true
  num_generation_samples: 2  # REDUCED from 3
  generation_max_length: 80  # REDUCED from 100
  early_stopping_patience: 5
  early_stopping_threshold: 0.005

  # Progressive training for gradual memory increase
  progressive:
    enable_progressive_training: true
    enable_sequence_scaling: true
    initial_seq_length: 64   # Start very small
    final_seq_length: 256
    length_schedule: exponential
    length_growth_epochs: 1
    enable_curriculum: false
    enable_dynamic_batch: true  # Adjust batch size based on memory
    default_min_batch_size: 8
    default_max_batch_size: 32
    default_target_gpu_utilization: 0.75  # Lower target for stability

  # Dynamic batching based on memory
  dynamic_batching:
    enabled: true  # ENABLED for automatic batch size adjustment
    min_batch_size: 8
    max_batch_size: 32
    target_memory_utilization: 0.75  # Conservative target
    adjustment_frequency: 100
    adjustment_factor: 1.0
    warmup_steps: 500
    smooth_transitions: true

  # Gradient health monitoring
  gradient_health:
    enabled: true
    initial_clip_value: 0.5
    final_clip_value: 0.5
    warmup_steps: 500
    explosion_threshold: 3.0
    explosion_window: 3
    auto_reduce_lr: true
    lr_reduction_factor: 0.7

data:
  data_dir: /project/code/data/processed
  max_length: 256
  tokenizer_name: /project/code/models/tokenizer/enhanced-65536
  padding_side: right
  truncation: true
  max_train_examples: null
  max_eval_examples: 1000  # REDUCED for faster eval
  dataloader_drop_last: true
  dataloader_pin_memory: false  # DISABLED to save RAM
  default_tokenizer_name: Qwen/Qwen2.5-0.5B

  # Streaming with smaller buffer
  streaming: true
  buffer_size: 2000  # REDUCED from 5000 for memory
  max_samples: null
  val_max_samples: 1000
  val_split_ratio: 0.1
  multi_column: false
  use_multi_column: false
  distributed: false
  num_workers: 8  # REDUCED for memory
  samples_per_file: 8
  enable_bucketing: false
  drop_last_batch: true
  prefetch_factor: 4  # REDUCED for memory
  persistent_workers: false  # DISABLED for memory
  format_detection_samples: 10
  reshuffle_each_epoch: false

  # Fallback paths
  fallback_data_paths:
    - /project/code/data/processed
    - /project/code/data/combined
    - /project/code/data
    - ./data/processed
    - ./data/combined
    - ./data

# DeepSpeed ZeRO-2 for memory efficiency
deepspeed:
  use_deepspeed: true  # ENABLED for memory optimization
  zero_stage: 2  # ZeRO-2: optimizer + gradient sharding
  cpu_offload: false  # Keep false for reasonable speed
  nvme_offload: false
  precision_type: bf16
  train_batch_size: 48  # Effective batch (24 * 2 grad accum)
  micro_batch_size: 24
  gradient_accumulation_steps: 2
  activation_checkpointing: true  # ENABLED for memory

enhanced_features:
  architecture:
    use_moh: false
    use_moa: false
    use_cross_attention: false
    use_alibi: false
    expert_routing_type: deepseek

  rag:
    enabled: false
    knowledge_base_path: null
    max_retrieved_docs: 5
    rag_fusion_type: concatenate

  losses:
    use_multi_token_prediction: false
    num_future_tokens: 1
    mtp_weight: 0.01
    initial_temperature: 1.0
    adaptive_temperature: false
    label_smoothing: 0.05
    use_moe_balancing: false
    gradient_balance_weight: 0.0
    focal_loss: false
    contrastive_loss: false
    diversity_loss: false
    auxiliary_loss: false
    adaptive_loss_scaling: false

  adaptive_mtp:
    use_adaptive_mtp: false

  gradient:
    gradient_surgery: false
    adaptive_gradient_surgery: false
    gradient_surgery_method: pcgrad

  memory:
    use_episodic_memory: false
    silent_mode: true

  quantization:
    quantization_aware: false
    use_nvfp4: false  # Disable for now for compatibility
    use_torchao_nvfp4: false
    bit_width: 4

performance:
  ultra_fast_mode: false  # DISABLED - prioritize memory over speed
  fast_progress: false
  minimal_progress: true
  express_mode: false
  no_sync: false

  # Torch compilation - disabled for memory
  torch_compile:
    enabled: false  # DISABLED to save compilation memory
    mode: default
    fullgraph: false
    dynamic: false
    backend: inductor

  float32_matmul_precision: high

# Memory optimization settings
memory:
  enable_memory_pool: false
  pool_size_gb: 20.0
  gradient_checkpointing: true  # ENABLED - key memory saver
  memory_threshold_gb: 22.0
  enable_cpu_offload: false  # Can enable for extreme memory saving
  clear_cache_frequency: 50  # More frequent cleanup
  silent_mode: true
  target_utilization: 0.75  # Conservative target
  warning_threshold: 0.82
  critical_threshold: 0.88
  emergency_threshold: 0.92

evaluation:
  eval_during_training: true
  eval_metrics: perplexity
  comprehensive_eval: false
  generate_samples: true
  generation_prompts:
    - "The future of artificial intelligence is"
    - "Once upon a time"
  recent_losses_window_size: 50
  max_validation_batches: 30  # REDUCED for memory
  cache_clear_frequency: 50
  moe_metrics:
    track_expert_utilization: false
    track_routing_entropy: false
    track_load_balance: false
    track_expert_specialization: false

output:
  output_dir: outputs/small_memory_optimized
  save_total_limit: 2  # Keep only 2 checkpoints
  save_on_each_node: false

run_management:
  experiment_name: ava-small-memory-optimized
  run_id: null
  resume_from_checkpoint: null

device: auto
fp16: false
bf16: true

wandb:
  enabled: true
  project: Ava
  entity: null
  name: null
  group: ava-memory-optimized
  job_type: train
  tags:
    - gpu
    - memory-optimized
    - gradient-checkpointing
    - zero2
  offline: false

stability:
  loss_smoothing: true
  loss_smoothing_alpha: 0.9
  lr_warmup_ratio: 0.0333
  lr_decay_ratio: 0.1
  sync_gradients_each_step: false
  use_kahan_summation: true
  use_stable_embedding: true
  stop_on_nan: false
  max_grad_norm_before_stop: 100.0
  max_loss_before_stop: 20.0

# Colossal-AI with memory optimization
colossalai:
  enabled: false  # Use DeepSpeed instead for better memory control

  # If using Colossal-AI:
  parallel_strategy: zero2
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  data_parallel_size: -1
  sequence_parallel_size: 1

  use_zero: true
  zero_stage: 2
  use_cpu_offload: false
  use_nvme_offload: false
  use_gemini: false
  use_patrickstar: false

  mixed_precision: bf16

  # Activation checkpointing for memory
  use_activation_checkpointing: true  # ENABLED
  checkpoint_num_layers: 6  # Checkpoint half the layers

  enable_jit_fused: true
  enable_fused_normalization: true
  enable_flash_attention: true
  enable_xformers: true
  enable_cuda_graph: false  # Disable for memory flexibility
  enable_tensor_core: true
  enable_tf32: true

generation:
  repetition_penalty: 1.2
  eos_penalty: 0.5
  min_length: 20
  temperature: 0.8
  top_k: 50
  top_p: 0.9
  use_ngram_blocking: true
  ngram_size: 3
  no_repeat_ngram_size: 4
  do_sample: true
  num_beams: 1
