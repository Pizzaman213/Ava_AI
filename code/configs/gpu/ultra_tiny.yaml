# ============================================================
# ULTRA TINY CONFIGURATION - MINIMAL GPU TRAINING
# ============================================================
#
# Category: GPU (CUDA)
# Model Size: ~500M parameters
# Device: NVIDIA GPU with CUDA 11.7+
# Optimization Level: MODERATE
# Use Case: Fast prototyping and testing with GPU acceleration
#
# DESCRIPTION:
# Ultra-lightweight GPU configuration for rapid experimentation.
# Minimal resource requirements while maintaining GPU optimizations.
# Perfect for debugging, proof-of-concepts, and resource-constrained
# environments. Includes essential CUDA features for efficiency.
#
# HARDWARE REQUIREMENTS:
# - GPU: 2GB+ VRAM (GTX 1050 or better)
# - CUDA: 11.7 or higher
# - PyTorch: 2.0+ with CUDA support
# - System RAM: 8GB+ recommended
#
# USAGE:
#   python3 train_with_data.py --config configs/gpu/ultra_tiny.yaml
#   python3 interact.py --model outputs/ultra_tiny.pt
#   torchrun --nproc_per_node=1 train.py --config configs/gpu/ultra_tiny.yaml
#
# ============================================================

# ============================================================
# MODEL ARCHITECTURE
# ============================================================

model:
  # ---------- Core Architecture ----------
  # size: ultra_tiny                # Removed - not in EnhancedMoEConfig
  vocab_size: 50257               # GPT-2 tokenizer vocabulary
  hidden_size: 512                # Hidden dimension (optimized for RTX 3060)
  num_layers: 8                   # Number of transformer layers (reduced for memory)
  intermediate_size: 2048         # FFN intermediate dimension (reduced)
  
  # ---------- Attention Configuration ----------
  num_attention_heads: 8          # Number of attention heads (reduced)
  # num_key_value_heads: 2          # Removed - not in EnhancedMoEConfig
  # attention_type: gqa             # Removed - not in EnhancedMoEConfig
  # use_flash_attn: false           # Removed - not in EnhancedMoEConfig
  attention_dropout: 0.2          # Dropout in attention layers
  
  # ---------- Position Encoding ----------
  max_position_embeddings: 256    # Maximum sequence length (optimized for RTX 3060)
  rope_theta: 10000.0             # RoPE base frequency
  
  # ---------- Mixture of Experts (MoE) ----------
  num_experts: 2                  # Number of experts (reduced for memory)
  # num_experts_per_token: 1        # Removed - not in EnhancedMoEConfig
  expert_capacity_factor: 1.0     # Capacity factor for load balancing
  # expert_routing_type: switch     # Removed - not in EnhancedMoEConfig
  # expert_dropout: 0.25            # Removed - not in EnhancedMoEConfig
  
  # ---------- Activation & Initialization ----------
  hidden_act: gelu                # Activation function (simpler)
  initializer_range: 0.005        # Very small weight initialization
  layer_norm_eps: 1.0e-06        # Layer norm epsilon for stability
  
  # ---------- Regularization ----------
  hidden_dropout: 0.3             # General dropout rate
  # label_smoothing: 0.1            # Removed - not in EnhancedMoEConfig
  
  # ---------- Caching & Optimization ----------
  use_cache: true                 # Enable KV caching for inference
  # gradient_checkpointing: true    # Removed - not in EnhancedMoEConfig
  # use_memory_efficient_attention: true  # Removed - not in EnhancedMoEConfig
  
  # ---------- Advanced Features (Disabled for Compatibility) ----------
  # All advanced features commented out to avoid config filtering warnings
  # use_mod: true                   # Enable MoD for efficient computation
  # mod_mode: learned               # Options: learned, fixed, adaptive
  # mod_skip_fraction: 0.1          # Fraction of layers to skip (minimal)
  # use_speculative_decoding: false # Disabled for simplicity
  # speculative_draft_layers: 0     # Number of draft layers
  # use_hierarchical_moe: true      # Hierarchical expert routing
  # use_continuous_experts: false   # Continuous expert selection (disabled)
  # use_sparse_experts: true        # Sparse expert activation
  # use_expert_cache: true          # Cache expert selections
  # use_mod_plus_plus: true         # Enhanced MoD with confidence
  # use_memory_augmented: false     # External memory mechanisms
  # use_adaptive_inference: true    # Dynamic computation graphs
  # use_interpretability: false     # Built-in interpretability (disabled)
  
  # All advanced features commented out for compatibility
  # use_mixture_tokenizers: false   # Multiple tokenizer support (disabled)
  # use_nas_experts: false          # Neural architecture search
  # use_meta_learning: false        # Meta-learning capabilities
  # use_federated_learning: false   # Federated learning support
  # use_continual_learning: false   # Continual learning
  # use_advanced_pretraining: false # Advanced pretraining objectives
  # use_rlaif: false               # RL from AI feedback
  # use_code_experts: false         # Code-specialized experts
  # use_scientific_experts: false   # Science/math experts
  # use_tool_experts: false         # Tool-use experts
  # use_vision_language: false      # Vision-language capabilities
  # use_audio_language: false       # Audio-language capabilities
  # use_adversarial_training: false # Adversarial robustness
  # use_bias_mitigation: false      # Bias reduction mechanisms
  # use_privacy_preserving: false   # Privacy-preserving training
  # use_watermarking: false         # Model watermarking
  # use_distributed_experts: false  # Distributed expert computation
  # use_mixed_precision: true       # Enable mixed precision training
  # use_torch_compile: true         # PyTorch 2.0 compilation
  # use_fused_kernels: true         # Fused CUDA kernels
  # use_diverse_beam_search: false  # Diverse beam search
  # use_mixture_decoders: false     # Multiple decoder heads
  # use_streaming_generation: false # Streaming text generation
  # use_batch_optimized: false      # Batch-optimized inference
  # use_synthetic_data: false       # Synthetic data generation
  # use_online_learning: false      # Online learning capability
  # use_multi_task_learning: false  # Multi-task learning
  # use_automated_curation: false   # Automated data curation
  # use_cross_lingual: false        # Cross-lingual transfer
  # use_edge_deployment: false      # Edge deployment optimization
  # use_ab_testing: false           # A/B testing framework
  # use_model_versioning: false     # Model versioning system
  # use_cost_optimization: false    # Cost-aware optimization
  # use_global_load_balancing: false # Global load balancing
  
  # All experimental features commented out for compatibility
  # use_quantum_inspired: false     # Quantum-inspired algorithms
  # use_neuromorphic: false         # Neuromorphic computing
  # use_self_modifying: false       # Self-modifying networks
  # use_causal_reasoning: false     # Causal reasoning
  # use_visual_builder: false       # Visual model builder
  # use_automated_docs: true        # Automated documentation
  # use_interactive_debug: false    # Interactive debugging
  # use_playground: false           # Model playground
  # use_benchmarking: true          # Automated benchmarking

# ============================================================
# DATA CONFIGURATION
# ============================================================

data:
  # ---------- Dataset Settings ----------
  dataset_type: hf                # Dataset type (hf = HuggingFace format)
  train_paths:                    # Training data paths
    - /project/code/data/processed/combined_processed.jsonl
  val_path: /project/code/data/processed/combined_processed.jsonl
  
  # ---------- Tokenization ----------
  tokenizer: gpt2                 # Tokenizer to use
  max_length: 512                 # Maximum sequence length
  stride: 512                     # Stride for overlapping sequences
  
  # ---------- Data Loading ----------
  max_train_examples: 10000       # Limit training data for fast iteration
  max_val_examples: 500           # Limit validation data
  
  # ---------- Dataset Arguments ----------
  dataset_args:
    text_column: text             # Column name for text data
    streaming: true               # Stream data for memory efficiency
    num_proc: 4                   # Multiple processes for loading
    keep_in_memory: false         # Don't load entire dataset in memory
    load_from_cache_file: true    # Use cache if available
  
  # ---------- Data Augmentation ----------
  noise_probability: 0.1          # Random token replacement
  mask_probability: 0.05          # Random masking

# ============================================================
# TRAINING CONFIGURATION
# ============================================================

training:
  # ---------- Basic Training ----------
  batch_size: 2                   # Batch size per device
  gradient_accumulation_steps: 8  # Gradient accumulation for effective batch size of 16
  num_epochs: 10                  # More epochs for smaller model
  max_steps: -1                   # Max steps (-1 = use epochs)
  
  # ---------- Learning Rate ----------
  learning_rate: 1e-5             # Ultra conservative learning rate
  warmup_steps: 2000              # Very long warmup for stability
  warmup_ratio: 0.1               # Warmup ratio
  
  # ---------- Optimizer Configuration ----------
  optimizer: adamw                # Standard AdamW optimizer
  weight_decay: 0.01              # Light weight decay for stability
  adam_beta1: 0.9                 # Adam beta1
  adam_beta2: 0.95                # Adam beta2 (more stable)
  adam_epsilon: 1e-8              # Adam epsilon
  
  # ---------- Advanced Optimizer Features ----------
  layerwise_lr: false             # Disabled for simplicity
  lr_layer_scale: 1.0             # No layer-wise scaling
  gradient_centralization: false  # Disabled for simplicity
  
  # ---------- Learning Rate Scheduling ----------
  lr_scheduler_type: cosine       # Cosine scheduler (default)
  scheduler: cosine               # Cosine annealing with restarts
  lr_decay_factor: 1.0            # No decay
  num_restarts: 0                 # No restarts
  
  # ---------- Gradient Management ----------
  max_grad_norm: 0.25             # Very strict gradient clipping
  gradient_clip: 1.0              # Alternative gradient clipping
  adaptive_gradient_clipping: false # Disabled to avoid warnings
  gradient_penalty_weight: 0.01   # Stronger gradient penalty
  
  # ---------- Mixed Precision ----------
  mixed_precision: no             # Disable mixed precision for stability
  gradient_checkpointing: true    # Enabled to save memory on RTX 3060
  zero_stage: 3                   # ZeRO-3 full parameter partitioning for maximum memory savings
  
  # ---------- Loss Functions ----------
  # Focal Loss
  use_focal_loss: false           # Disabled for simplicity
  focal_gamma: 2.0                # Focal loss gamma
  focal_alpha: 0.25               # Focal loss alpha
  focal_blend: 0.3                # Blend with standard loss
  
  # ---------- Anti-Collapse Features ----------
  entropy_regularization_weight: 0.001     # Reduced entropy regularization
  token_frequency_penalty_weight: 0.01     # Reduced token penalty
  expert_diversity_weight: 0.001           # Reduced expert diversity weight
  
  # ---------- Curriculum Learning ----------
  curriculum_learning: true       # Enable curriculum learning
  initial_sequence_length: 64     # Start with shorter sequences for memory
  curriculum_warmup_steps: 500    # Faster curriculum
  use_curriculum: false           # Alternative curriculum setting
  curriculum_type: linear         # Simple linear curriculum
  initial_difficulty: 0.5         # Higher initial difficulty
  max_difficulty: 1.0             # Maximum difficulty
  sequence_length_curriculum: true # Enable sequence length curriculum
  initial_seq_length: 64          # Initial sequence length (reduced)
  
  # Progressive Sequence Growth
  progressive_sequence_growth: false # Disabled for simplicity
  sequence_growth_rate: 1.2       # Small growth multiplier
  sequence_growth_interval: 2000  # Steps between growth
  
  # ---------- Anti-Overfitting Features ----------
  stochastic_depth_prob: 0.0      # Disabled for small model
  mixout_prob: 0.0                # Disabled
  use_ema: false                  # Disabled for simplicity
  ema_decay: 0.999                # EMA decay rate
  confidence_weighting: false     # Disabled
  sam_enabled: false              # Sharpness-aware minimization
  
  # ---------- Progressive Training ----------
  use_progressive: false          # Progressive training
  growth_strategy: layer_stacking # Growth strategy
  initial_layers: 3               # Initial layers
  growth_interval: 5000           # Growth interval
  
  # ---------- Safety Training ----------
  use_constitutional: false       # Constitutional AI
  safety_principles:              # Safety principles
  - Be helpful and harmless
  num_revisions: 1                # Number of revisions
  safety_weight: 0.1              # Safety weight
  
  # ---------- Active Learning ----------
  use_active_learning: false      # Active learning
  active_learning_strategy: uncertainty  # Strategy
  selection_batch_size: 16        # Selection batch size
  
  # ---------- Smart Checkpointing ----------
  use_smart_checkpointing: false  # Smart checkpointing
  memory_threshold: 0.8           # Memory threshold
  min_recompute_ratio: 1.5        # Min recompute ratio
  always_checkpoint_layers:       # Always checkpoint these
  - attention
  
  # ---------- Evaluation & Checkpointing ----------
  eval_steps: 50                  # Frequent evaluation
  save_steps: 100                 # Frequent checkpointing
  save_total_limit: 1             # Only keep latest checkpoint
  logging_steps: 5                # Frequent logging
  
  # ---------- DataLoader Settings ----------
  parallel_loading: true          # Parallel data loading
  num_workers: 2                  # DataLoader workers
  drop_last: true                 # Drop incomplete batches
  prefetch_factor: 2              # Prefetch factor
  persistent_workers: false       # Persistent workers
  pin_memory: true               # Pin memory for CUDA
  
  # ---------- Device Settings ----------
  device: cuda                   # Device: cuda for GPU

# ============================================================
# DISTRIBUTED TRAINING
# ============================================================

distributed: false              # Enable distributed training
num_gpus: 1                    # Number of GPUs
device_map: cuda               # Device mapping

# ============================================================
# OUTPUT & EXPERIMENT
# ============================================================

output_dir: ./outputs           # Output directory
experiment_name: moe_gpu_ultra_tiny  # Experiment name
logging_level: INFO             # Logging level
report_to:                     # Reporting backends
- tensorboard
seed: 42                       # Random seed

# ============================================================
# FINE-TUNING CONFIGURATION
# ============================================================

fine_tuning:
  # ---------- LoRA Configuration ----------
  use_lora: true                # Enable LoRA
  use_qlora: true               # Enable QLoRA
  freeze_base_model: true       # Freeze base model
  lora_r: 8                     # LoRA rank (reduced)
  lora_alpha: 16                # LoRA alpha
  lora_dropout: 0.1             # LoRA dropout
  
  # ---------- Early Stopping ----------
  early_stopping: true          # Enable early stopping
  early_stopping_patience: 3    # Patience
  early_stopping_threshold: 0.001  # Threshold
  min_delta: 0.0005             # Minimum change
  
  # ---------- LoRA Target Modules ----------
  lora_target_modules:          # Target modules
  - q_proj
  - v_proj
  - k_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  
  # ---------- Multi-LoRA ----------
  num_lora_experts: 2           # Number of LoRA experts (minimal)
  task_embedding_dim: 0         # Task embedding dimension
  share_base_weights: true      # Share base weights
  
  # ---------- Fine-tuning Training ----------
  batch_size: 16                # Batch size
  gradient_accumulation_steps: 1  # No gradient accumulation
  learning_rate: 5e-4           # Learning rate
  num_epochs: 5                 # Number of epochs
  warmup_ratio: 0.1             # Warmup ratio

# ============================================================
# INFERENCE CONFIGURATION
# ============================================================

inference:
  use_speculation: false        # Speculative decoding
  num_draft_experts: 2          # Draft experts
  draft_expert_size_ratio: 0.2  # Draft expert size
  draft_sequence_length: 3      # Draft sequence length
  use_prefetching: false        # Prefetching
  prune_before_deployment: true # Prune before deployment
  target_sparsity: 0.3          # Target sparsity
  prune_experts: true           # Prune experts
  prune_attention: true         # Prune attention
  expert_merge_threshold: 0.9   # Expert merge threshold
  use_flash_attn: true          # Flash attention
  torch_compile: false          # PyTorch compilation (disabled for compatibility)
  dtype: float16                # Inference dtype

# ============================================================
# MEMORY OPTIMIZATION
# ============================================================

memory_optimization:
  gradient_checkpointing: true  # Gradient checkpointing
  cpu_offload: false            # CPU offload
  optimizer_offload: false      # Optimizer offload
  parameter_offload: false      # Parameter offload
  activation_checkpointing: true # Activation checkpointing
  memory_efficient_attention: true # Memory efficient attention

# ============================================================
# CUDA OPTIMIZATION (GPU Specific)
# ============================================================

cuda_optimization:
  use_cuda_kernels: true        # Use CUDA kernels
  enable_tensor_cores: true     # Enable Tensor Cores
  optimize_memory_layout: true  # Optimize memory layout
  use_cuda_graphs: false        # Disabled for small model
  kernel_fusion: true           # Enable kernel fusion

# ============================================================
# MONITORING CONFIGURATION
# ============================================================

monitoring:
  use_health_monitoring: false  # Health monitoring
  check_interval: 100           # Check interval
  enable_alerts: false          # Enable alerts
  enable_visualization: false   # Enable visualizations
  use_wandb: false              # Use W&B (disabled for simplicity)
  wandb_project: llm-moe-training  # W&B project
  wandb_name: null              # W&B run name
  wandb_tags:                   # W&B tags
  - moe
  - gpu
  - ultra_tiny
  - cuda