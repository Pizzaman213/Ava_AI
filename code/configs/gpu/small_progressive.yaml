# Progressive Training Config - starts at 512, scales to 1024
# Use this for memory-efficient training that gradually increases sequence length

model:
  hidden_size: 384
  num_layers: 6
  num_attention_heads: 6
  intermediate_size: 1024
  vocab_size: 50257
  max_position_embeddings: 2048
  num_experts: 4
  num_experts_per_token: 1
  expert_capacity_factor: 2.0
  router_type: switch
  router_aux_loss_coef: 0.015
  router_jitter_noise: 0.01
  use_cache: true
  rope_theta: 10000.0
  attention_dropout: 0.1
  hidden_dropout: 0.1
  use_flash_attention: true
  layer_norm_eps: 1e-5
  initializer_range: 0.01
  hidden_act: gelu
  use_moh: false
  use_moa: false
  use_rag: false
  use_cross_attention: false
  use_episodic_memory: false
  memory_size: 500
  deepspeed_activation_checkpointing: true
  deepspeed_partition_activations: false
  deepspeed_moe_param_groups: true

training:
  batch_size: 12  # Larger batch for shorter sequences
  gradient_accumulation_steps: 2
  max_gradient_norm: 1.0
  num_epochs: 12
  max_steps: -1
  warmup_steps: 2000
  learning_rate: 0.0001
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  lr_scheduler_type: cosine
  lr_end: 1.0e-05
  mixed_precision: bf16
  dataloader_num_workers: 8
  gradient_checkpointing: true
  eval_strategy: steps
  eval_steps: 750
  save_strategy: steps
  save_steps: 1500
  logging_steps: 75
  early_stopping_patience: 4
  early_stopping_threshold: 0.01
  gradient_health:
    enabled: true
    initial_clip_value: 1.0
    final_clip_value: 0.5
    warmup_steps: 2000
    explosion_threshold: 2.0
    explosion_window: 5
    auto_reduce_lr: true
    lr_reduction_factor: 0.5

data:
  data_dir: /project/code/data/processed
  max_length: 512  # Start with shorter sequences
  max_train_examples: 10000
  max_eval_examples: 1000
  tokenizer_name: gpt2
  padding_side: right
  truncation: true
  train_batch_size: 12
  eval_batch_size: 24
  dataloader_drop_last: true
  dataloader_pin_memory: true

deepspeed:
  enabled: true
  zero_stage: 2
  cpu_offload: false
  nvme_offload: false
  precision: bf16
  gradient_accumulation_steps: 2
  train_batch_size: 24  # 12 * 2
  micro_batch_size: 12
  activation_checkpointing: true

enhanced_features:
  architecture:
    use_moh: false
    use_moa: false
    use_cross_attention: false
    use_alibi: false
    expert_routing_type: switch
  rag:
    enabled: false
  losses:
    focal_loss: false
    contrastive_loss: false
    diversity_loss: false
    auxiliary_loss: true
    adaptive_loss_scaling: true
  gradient:
    gradient_surgery: true
    adaptive_gradient_surgery: true
    gradient_surgery_method: pcgrad
    gradient_norm_tracking: true
    gradient_anomaly_detection: true
  memory:
    use_episodic_memory: false
  quantization:
    quantization_aware: false
    use_nvfp4: false

data_loading:
  streaming: true
  buffer_size: 10000
  max_samples: 100000
  multi_column: false
  use_multi_column: false
  distributed: false

performance:
  ultra_fast_mode: false
  fast_progress: true
  minimal_progress: false
  express_mode: true
  no_sync: false

memory:
  enable_memory_pool: true
  pool_size_gb: 8.0  # More memory for larger batches
  gradient_checkpointing: true
  memory_threshold_gb: 8.0
  enable_cpu_offload: false
  clear_cache_frequency: 100

evaluation:
  eval_during_training: true
  eval_metrics: perplexity,bleu
  comprehensive_eval: false

output:
  output_dir: outputs/small_progressive
  save_total_limit: 5
  save_on_each_node: false

run_management:
  experiment_name: ava-small-progressive
  run_id: null
  resume_from_checkpoint: null

device: auto
fp16: false
bf16: true

wandb:
  enabled: true
  project: ava-moe-gpu-small-progressive
  tags:
  - gpu
  - small
  - 150M
  - progressive-training
  - optimized
  entity: null
  name: null
  notes: "Progressive training starting at 512 tokens, optimized config with Flash Attention and batched experts"
  group: small-models
  job_type: train
  offline: false
  cache_size: 2000
  cache_flush_interval: 50

stability:
  loss_smoothing: true
  loss_smoothing_alpha: 0.9
  lr_warmup_ratio: 0.1
  lr_decay_ratio: 0.1
  sync_gradients_each_step: false
  use_kahan_summation: true
  use_stable_embedding: true
  stop_on_nan: true
  max_grad_norm_before_stop: 100.0
  max_loss_before_stop: 20.0

# Progressive training schedule (manual - change max_length over time)
# Stage 1 (epochs 1-4):   max_length: 512,  batch_size: 12
# Stage 2 (epochs 5-8):   max_length: 1024, batch_size: 8
# Stage 3 (epochs 9-12):  max_length: 2048, batch_size: 4