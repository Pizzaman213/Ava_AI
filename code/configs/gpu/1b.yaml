# GPU 1B Configuration
# 1 Billion parameter GPU training configuration for Ava MoE++
# Target: ~1B parameters, 24GB+ VRAM, RTX 4090/H100/A100
# Optimized for: Billion-parameter models and state-of-the-art research

model:
  # Core Architecture
  hidden_size: 1088
  num_layers: 28
  num_attention_heads: 17
  intermediate_size: 4352
  vocab_size: 50257
  max_position_embeddings: 2048

  # MoE Configuration
  num_experts: 32
  num_experts_per_token: 4
  expert_capacity_factor: 1.5
  router_type: "switch"
  router_aux_loss_coef: 0.01
  router_jitter_noise: 0.01

  # Attention & Position Encoding
  use_cache: true
  rope_theta: 10000.0
  attention_dropout: 0.05
  hidden_dropout: 0.05

  # Regularization
  layer_norm_eps: 1e-5
  initializer_range: 0.02
  hidden_act: "gelu"

  # Enhanced Features (full features for 1B model)
  use_moh: true
  use_moa: true
  use_rag: false
  use_cross_attention: true
  num_cross_attention_layers: 4
  use_episodic_memory: true
  memory_size: 2000

training:
  # Batch Configuration
  batch_size: 2
  gradient_accumulation_steps: 16
  max_gradient_norm: 1.0

  # Training Duration
  num_epochs: 5
  max_steps: -1
  warmup_steps: 2500

  # Learning Rate & Optimizer
  learning_rate: 1e-4
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  lr_scheduler_type: "cosine"

  # Mixed Precision & Performance
  mixed_precision: "bf16"
  dataloader_num_workers: 8
  gradient_checkpointing: true

  # Evaluation & Logging
  eval_strategy: "steps"
  eval_steps: 200
  save_strategy: "steps"
  save_steps: 400
  logging_steps: 20

  # Early Stopping
  early_stopping_patience: 5
  early_stopping_threshold: 0.005

  # Advanced Training Features
  use_ema: true
  ema_decay: 0.999
  label_smoothing: 0.1

data:
  # Dataset Configuration
  data_dir: "data/train"
  max_length: 2048
  max_train_examples: -1
  max_eval_examples: 3000

  # Preprocessing
  tokenizer_name: "gpt2"
  padding_side: "right"
  truncation: true

  # Data Loading
  train_batch_size: 2
  eval_batch_size: 4
  dataloader_drop_last: true
  dataloader_pin_memory: true

# Hardware Configuration
device: "auto"
fp16: false
bf16: true

# Memory Optimization
gradient_checkpointing: true
use_cpu_offload: false
pin_memory: true

# Monitoring
wandb:
  enabled: true
  project: "ava-moe-gpu-1b"
  tags: ["gpu", "1b", "1B", "state-of-the-art"]

# Advanced Features
compilation:
  enabled: false
  backend: "inductor"

quantization:
  enabled: false
  bits: 8

distributed:
  enabled: false
  backend: "nccl"

# Hardware Requirements
# VRAM: 24GB minimum, 32GB+ recommended for comfort
# Compatible GPUs: RTX 4090, H100 PCIe, A100 40GB/80GB
# Note: May require gradient accumulation adjustments for smaller VRAM