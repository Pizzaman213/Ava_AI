model:
  hidden_size: 384
  num_layers: 8
  num_attention_heads: 6
  intermediate_size: 1536
  vocab_size: 50257
  max_position_embeddings: 1024
  num_experts: 4
  num_experts_per_token: 2
  expert_capacity_factor: 1.5
  router_type: switch
  router_aux_loss_coef: 0.01
  router_jitter_noise: 0.0  # Disabled during initialization for stability
  router_z_loss_coef: 0.0001
  moe_dropout: 0.0
  use_cache: true
  rope_theta: 10000.0
  attention_dropout: 0.0
  hidden_dropout: 0.0
  layer_norm_eps: 1e-6
  initializer_range: 0.02  # Balanced value for MoE (not too high, not too low)
  hidden_act: swiglu
  label_smoothing: 0.0
  tie_word_embeddings: true
  dropout: 0.0
  use_moh: false
  use_moa: false
  use_rag: false
  use_cross_attention: false
  use_episodic_memory: false
  deepspeed_activation_checkpointing: false  # SPEED: Disabled for 30% gain
  deepspeed_partition_activations: false
  deepspeed_moe_param_groups: true
  use_flash_attention: true
training:
  batch_size: 16  # SPEED: Increased from 4 (removed gradient accumulation)
  gradient_accumulation_steps: 1  # SPEED: Disabled for 50% gain (was 64)
  max_gradient_norm: 1.0
  num_epochs: 1
  max_steps: 500000
  warmup_steps: 2000
  warmup_type: linear
  save_total_limit: 20
  learning_rate: 0.00042
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  lr_scheduler_type: cosine
  lr_end: 7.499999999999999e-06
  warmup_ratio: 0.01
  mixed_precision: bf16  # SPEED: Changed from fp16 for better stability
  dataloader_num_workers: 12  # SPEED: Increased from 2 for better I/O
  gradient_checkpointing: false  # SPEED: Disabled for 30% gain
  use_adaptive_lr: false
  lr_patience: 1000000
  lr_reduction_factor: 1.0
  min_lr: 0.0
  eval_strategy: steps
  eval_steps: 2000  # SPEED: Reduced frequency from 25000 (evaluate less often)
  save_strategy: steps
  save_steps: 3000  # SPEED: Reduced frequency from 10000 (save less often)
  logging_steps: 200  # SPEED: Reduced frequency from 100 (log less often)
  load_best_model_at_end: false
  metric_for_best_model: loss
  greater_is_better: false
  early_stopping_patience: 1000
  early_stopping_threshold: 0.0001
  min_loss_reduction: 0.0001
  use_ema: false
  clip_grad_value: null
  loss_scaling: dynamic
  adam_epsilon: 1e-8
  gradient_health:
    enabled: true
    initial_clip_value: 5.0  # MoE needs higher clipping during warmup
    final_clip_value: 2.0  # MoE models need 2-3x higher than dense models
    warmup_steps: 2000
    explosion_threshold: 30.0  # Increased from 5.0 - previous was too sensitive
    explosion_window: 5
    auto_reduce_lr: true
    lr_reduction_factor: 0.5
  dynamic_batching:  # NEW: Automatic batch size adjustment based on GPU memory
    enabled: false  # Enabled for automatic hardware adaptation
    min_batch_size: 8
    max_batch_size: 48  # Higher for tiny model (smaller memory footprint)
    target_memory_utilization: 0.88  # Slightly higher target (more aggressive)
    adjustment_frequency: 100
    adjustment_factor: 1.3  # More aggressive than baseline (1.2)
    warmup_steps: 2000
    smooth_transitions: true
data:
  data_dir: /project/code/data/processed
  max_length: 2048
  max_train_examples: -1
  max_eval_examples: 1000
  tokenizer_name: gpt2
  padding_side: right
  truncation: true
  train_batch_size: 16  # Synced with training.batch_size
  eval_batch_size: 24  # SPEED: Increased from 2 for faster evaluation
  dataloader_drop_last: true
  dataloader_pin_memory: false
  shuffle: true
deepspeed:
  enabled: false
  zero_stage: 0
  cpu_offload: false
  nvme_offload: false
  precision: bf16  # Changed from fp16 to match training config
  gradient_accumulation_steps: 1  # Synced with training config
  train_batch_size: 16  # Effective batch: 16 * 1 = 16
  micro_batch_size: 16  # Synced with training.batch_size
  activation_checkpointing: false  # SPEED: Disabled for 30% gain
enhanced_features:
  architecture:
    use_moh: false
    use_moa: false
    use_cross_attention: false
    use_alibi: false
    expert_routing_type: switch
  rag:
    enabled: false
    knowledge_base_path: null
    max_retrieved_docs: 5
    rag_fusion_type: concatenate
  losses:
    focal_loss: false
    contrastive_loss: false
    diversity_loss: true
    auxiliary_loss: true
    adaptive_loss_scaling: true
  gradient:
    gradient_surgery: false  # SPEED: Disabled to avoid multi-task overhead
    adaptive_gradient_surgery: false  # SPEED: Disabled
    gradient_surgery_method: pcgrad
    gradient_norm_tracking: false  # SPEED: Disabled for monitoring reduction
    gradient_anomaly_detection: false  # SPEED: Disabled for monitoring reduction
  memory:
    use_episodic_memory: false
    memory_capacity: 500
    memory_selection_strategy: importance
    memory_importance_threshold: 0.7
    memory_adaptation_rate: 0.01
  quantization:
    quantization_aware: false
    use_nvfp4: false
    bit_width: 8
    nvfp4_block_size: 64
    stochastic_rounding: false
data_loading:
  streaming: true
  buffer_size: 15000  # SPEED: Adjusted from 100000 for better throughput
  max_samples: -1
  shuffle_seed: 42
  reshuffle_each_epoch: true
  drop_last_batch: true
  prefetch_factor: 4
  persistent_workers: true
  multi_column: false
  use_multi_column: false
  distributed: false
performance:
  ultra_fast_mode: true  # SPEED: Enable ultra-fast mode (minimal monitoring)
  fast_progress: false  # Overridden by ultra_fast_mode
  minimal_progress: false  # Overridden by ultra_fast_mode
  express_mode: false  # Overridden by ultra_fast_mode
  no_sync: false
memory:
  enable_memory_pool: true
  pool_size_gb: 8.0  # SPEED: Adjusted for tiny model
  gradient_checkpointing: false  # SPEED: Disabled
  memory_threshold_gb: 8.0
  enable_cpu_offload: false
  clear_cache_frequency: 200  # SPEED: Reduced frequency from 50
evaluation:
  eval_during_training: true
  eval_metrics: perplexity
  comprehensive_eval: false
output:
  output_dir: outputs/tiny
  save_total_limit: 3
  save_on_each_node: false
run_management:
  experiment_name: ava-tiny-enhanced
  run_id: null
  resume_from_checkpoint: null
device: auto
fp16: false  # Disabled in favor of bf16
bf16: true  # Enabled for better numerical stability in MoE training
wandb:
  enabled: true
  project: ava-moe-gpu-tiny-ultrafast
  tags:
  - gpu
  - tiny
  - 100M
  - ultrafast
  - optimized
  - production
  entity: null
  name: null
  notes: "Ultra-fast training config: 2-3x speedup via disabled checkpointing, no gradient accumulation, reduced monitoring. Requires ~30% more GPU memory."
  group: tiny-models-ultrafast
  job_type: train
  offline: false
  cache_size: 5000  # SPEED: Increased cache from 1000
  cache_flush_interval: 200  # SPEED: Reduced frequency from 100
stability:
  loss_smoothing: true
  loss_smoothing_alpha: 0.9
  lr_warmup_ratio: 0.1
  lr_decay_ratio: 0.1
  sync_gradients_each_step: false
  use_kahan_summation: true
  use_stable_embedding: true
  stop_on_nan: true
  max_grad_norm_before_stop: 100.0
  max_loss_before_stop: 20.0
