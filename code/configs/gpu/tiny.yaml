# GPU Tiny Configuration - Enhanced
# Entry-level GPU training configuration for Ava MoE++
# Target: ~100M parameters, 6GB+ VRAM, RTX 2060/GTX 1060 6GB
# Optimized for: Entry-level GPU training and experimentation with enhanced features

model:
  # Core Architecture - 100M Parameter Target
  hidden_size: 384
  num_layers: 8
  num_attention_heads: 6
  intermediate_size: 1536
  vocab_size: 50257
  max_position_embeddings: 1024

  # MoE Configuration - Reduced for 100M params
  num_experts: 4
  num_experts_per_token: 2
  expert_capacity_factor: 1.0
  router_type: "switch"
  router_aux_loss_coef: 0.01
  router_jitter_noise: 0.01

  # Attention & Position Encoding
  use_cache: true
  rope_theta: 10000.0
  attention_dropout: 0.1
  hidden_dropout: 0.1

  # Regularization
  layer_norm_eps: 1e-5
  initializer_range: 0.02
  hidden_act: "gelu"

  # Enhanced Features (basic features for tiny model)
  use_moh: false
  use_moa: false
  use_rag: false
  use_cross_attention: false
  use_episodic_memory: false

  # DeepSpeed compatibility
  deepspeed_activation_checkpointing: false
  deepspeed_partition_activations: false
  deepspeed_moe_param_groups: true

training:
  # Batch Configuration - Optimized for 100M model
  batch_size: 4
  gradient_accumulation_steps: 2
  max_gradient_norm: 1.0

  # Training Duration
  num_epochs: 15
  max_steps: -1
  warmup_steps: 800

  # Learning Rate & Optimizer
  learning_rate: 3e-4
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  lr_scheduler_type: "cosine"

  # Mixed Precision & Performance
  mixed_precision: "fp16"
  dataloader_num_workers: 4
  gradient_checkpointing: false

  # Evaluation & Logging
  eval_strategy: "steps"
  eval_steps: 1000
  save_strategy: "steps"
  save_steps: 2000
  logging_steps: 100

  # Early Stopping
  early_stopping_patience: 5
  early_stopping_threshold: 0.01

data:
  # Dataset Configuration
  data_dir: "data/train"
  max_length: 1024
  max_train_examples: -1
  max_eval_examples: 1000

  # Preprocessing
  tokenizer_name: "gpt2"
  padding_side: "right"
  truncation: true

  # Data Loading
  train_batch_size: 8
  eval_batch_size: 16
  dataloader_drop_last: true
  dataloader_pin_memory: true

# Enhanced Configuration Sections

# DeepSpeed Configuration (disabled for tiny model)
deepspeed:
  enabled: false
  zero_stage: 0
  cpu_offload: false
  nvme_offload: false
  precision: "fp16"
  gradient_accumulation_steps: 4
  train_batch_size: 32  # 8 * 4
  micro_batch_size: 8

# Enhanced Features Configuration
enhanced_features:
  # Architecture enhancements (minimal for tiny)
  architecture:
    use_moh: false
    use_moa: false
    use_cross_attention: false
    use_alibi: false
    expert_routing_type: "switch"

  # RAG System (disabled for tiny)
  rag:
    enabled: false
    knowledge_base_path: null
    max_retrieved_docs: 5
    rag_fusion_type: "concatenate"

  # Advanced Loss Functions (basic for tiny)
  losses:
    focal_loss: false
    contrastive_loss: false
    diversity_loss: true  # Helps with expert utilization
    auxiliary_loss: true
    adaptive_loss_scaling: false

  # Gradient Surgery (disabled for tiny)
  gradient:
    gradient_surgery: false
    adaptive_gradient_surgery: false
    gradient_surgery_method: "pcgrad"

  # Episodic Memory (disabled for tiny)
  memory:
    use_episodic_memory: false
    memory_capacity: 500
    memory_selection_strategy: "importance"
    memory_importance_threshold: 0.7
    memory_adaptation_rate: 0.01

  # Quantization (basic options for memory efficiency)
  quantization:
    quantization_aware: false
    use_nvfp4: false
    bit_width: 8
    nvfp4_block_size: 64
    stochastic_rounding: false

# Data Loading Configuration
data_loading:
  # Streaming data (good for limited VRAM)
  streaming: true
  buffer_size: 500
  max_samples: 50000

  # Multi-column data
  multi_column: false
  use_multi_column: false

  # Distributed (disabled for single GPU)
  distributed: false

# Performance Configuration
performance:
  # Performance modes (fast for development)
  ultra_fast_mode: false
  fast_progress: true
  minimal_progress: false
  express_mode: false
  no_sync: false

# Memory Optimization
memory:
  # A100 memory optimizer settings
  enable_memory_pool: true
  pool_size_gb: null  # Auto-detect
  gradient_checkpointing: false
  memory_threshold_gb: 4.0  # Conservative for 6GB GPUs
  enable_cpu_offload: false
  clear_cache_frequency: 200

# Evaluation Configuration
evaluation:
  eval_during_training: true
  eval_metrics: "perplexity"
  comprehensive_eval: false

# Output Configuration
output:
  output_dir: "outputs/tiny"
  save_total_limit: 3
  save_on_each_node: false

# Run Management
run_management:
  experiment_name: "ava-tiny-enhanced"
  run_id: null
  resume_from_checkpoint: null

# Hardware Configuration
device: "auto"
fp16: true
bf16: false

# Monitoring (Enhanced)
wandb:
  enabled: true
  project: "ava-moe-gpu-tiny-enhanced"
  tags: ["gpu", "tiny", "100M", "entry-level", "enhanced"]
  entity: null
  name: null
  notes: "Enhanced tiny model with streaming data and basic optimizations"
  group: "tiny-models"
  job_type: "train"
  offline: false
  cache_size: 1000
  cache_flush_interval: 100

# Hardware Requirements
# VRAM: 6GB minimum, 8GB recommended
# Compatible GPUs: RTX 2060, GTX 1060 6GB, RTX 3050, RX 580 8GB
# Features: Streaming data loading, basic loss functions, memory optimization