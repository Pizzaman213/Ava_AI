# GPU Large-Base Configuration
# Large-base GPU training configuration for Ava MoE++
# Target: ~600M parameters, 16GB+ VRAM, RTX 3080/RTX 4070/RTX A4000
# Optimized for: Larger-scale training and high-quality models

model:
  # Core Architecture
  hidden_size: 832
  num_layers: 20
  num_attention_heads: 13
  intermediate_size: 3328
  vocab_size: 50257
  max_position_embeddings: 2048

  # MoE Configuration
  num_experts: 18
  num_experts_per_token: 2
  expert_capacity_factor: 1.25
  router_type: "switch"
  router_aux_loss_coef: 0.01
  router_jitter_noise: 0.01

  # Attention & Position Encoding
  use_cache: true
  rope_theta: 10000.0
  attention_dropout: 0.08
  hidden_dropout: 0.08

  # Regularization
  layer_norm_eps: 1e-5
  initializer_range: 0.02
  hidden_act: "gelu"

  # Enhanced Features (selective for large-base model)
  use_moh: true
  use_moa: false
  use_rag: false
  use_cross_attention: false
  use_episodic_memory: false

training:
  # Batch Configuration
  batch_size: 3
  gradient_accumulation_steps: 12
  max_gradient_norm: 1.0

  # Training Duration
  num_epochs: 8
  max_steps: -1
  warmup_steps: 1600

  # Learning Rate & Optimizer
  learning_rate: 1.5e-4
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  lr_scheduler_type: "cosine"

  # Mixed Precision & Performance
  mixed_precision: "fp16"
  dataloader_num_workers: 6
  gradient_checkpointing: true

  # Evaluation & Logging
  eval_strategy: "steps"
  eval_steps: 350
  save_strategy: "steps"
  save_steps: 700
  logging_steps: 35

  # Early Stopping
  early_stopping_patience: 3
  early_stopping_threshold: 0.005

data:
  # Dataset Configuration
  data_dir: "data/train"
  max_length: 2048
  max_train_examples: -1
  max_eval_examples: 1500

  # Preprocessing
  tokenizer_name: "gpt2"
  padding_side: "right"
  truncation: true

  # Data Loading
  train_batch_size: 3
  eval_batch_size: 6
  dataloader_drop_last: true
  dataloader_pin_memory: true

# Hardware Configuration
device: "auto"
fp16: true
bf16: false

# Memory Optimization
gradient_checkpointing: true
pin_memory: true

# Monitoring
wandb:
  enabled: true
  project: "ava-moe-gpu-large-base"
  tags: ["gpu", "large-base", "600M", "high-quality"]

# Hardware Requirements
# VRAM: 16GB minimum, 18GB recommended
# Compatible GPUs: RTX 3080, RTX 4070, RTX A4000, RTX 3080 Ti