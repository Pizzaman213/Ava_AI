model:
  hidden_size: 768
  num_layers: 16
  num_attention_heads: 12
  intermediate_size: 3072
  vocab_size: 50257
  max_position_embeddings: 2048
  num_experts: 16
  num_experts_per_token: 2
  expert_capacity_factor: 1.25
  router_type: switch
  router_aux_loss_coef: 0.01
  router_jitter_noise: 0.0
  use_cache: true
  rope_theta: 10000.0
  attention_dropout: 0.0
  hidden_dropout: 0.0
  layer_norm_eps: 1e-5
  initializer_range: 0.02
  hidden_act: gelu
  use_moh: false
  use_moa: false
  use_rag: false
  use_cross_attention: false
  use_episodic_memory: false
training:
  batch_size: 8
  gradient_accumulation_steps: 4
  max_gradient_norm: 0.5
  num_epochs: 10
  max_steps: -1
  warmup_steps: 2000
  learning_rate: 0.00042
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  lr_scheduler_type: cosine
  mixed_precision: fp16
  dataloader_num_workers: 8
  gradient_checkpointing: false
  eval_strategy: steps
  eval_steps: 500
  save_strategy: steps
  save_steps: 1000
  logging_steps: 50
  early_stopping_patience: 3
  early_stopping_threshold: 0.01
  gradient_health:
    enabled: true
    initial_clip_value: 2.0
    final_clip_value: 0.5
    warmup_steps: 2000
    explosion_threshold: 5.0
    explosion_window: 5
    auto_reduce_lr: true
    lr_reduction_factor: 0.5
data:
  data_dir: /project/code/data/processed
  max_length: 1024
  max_train_examples: -1
  max_eval_examples: 1000
  tokenizer_name: gpt2
  padding_side: right
  truncation: true
  train_batch_size: 8
  eval_batch_size: 16
  dataloader_drop_last: true
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 4
  dataloader_persistent_workers: true
device: auto
fp16: true
bf16: false
wandb:
  enabled: true
  project: ava-moe-gpu-base
  tags:
  - gpu
  - base
  - 500M
  - standard
stability:
  loss_smoothing: true
  loss_smoothing_alpha: 0.9
  lr_warmup_ratio: 0.1
  lr_decay_ratio: 0.1
  sync_gradients_each_step: false
  use_kahan_summation: true
  use_stable_embedding: true
  stop_on_nan: true
  max_grad_norm_before_stop: 100.0
  max_loss_before_stop: 20.0
