# GPU Large-Medium Configuration
# Large-medium GPU training configuration for Ava MoE++
# Target: ~700M parameters, 18GB+ VRAM, RTX 3080 Ti/RTX 4070 Ti/RTX A5000
# Optimized for: Advanced training and high-capacity models

model:
  # Core Architecture
  hidden_size: 896
  num_layers: 22
  num_attention_heads: 14
  intermediate_size: 3584
  vocab_size: 50257
  max_position_embeddings: 2048

  # MoE Configuration
  num_experts: 20
  num_experts_per_token: 2
  expert_capacity_factor: 1.25
  router_type: "switch"
  router_aux_loss_coef: 0.01
  router_jitter_noise: 0.01

  # Attention & Position Encoding
  use_cache: true
  rope_theta: 10000.0
  attention_dropout: 0.08
  hidden_dropout: 0.08

  # Regularization
  layer_norm_eps: 1e-5
  initializer_range: 0.02
  hidden_act: "gelu"

  # Enhanced Features (moderate for large-medium model)
  use_moh: true
  use_moa: false
  use_rag: false
  use_cross_attention: false
  use_episodic_memory: false

training:
  # Batch Configuration
  batch_size: 2
  gradient_accumulation_steps: 16
  max_gradient_norm: 1.0

  # Training Duration
  num_epochs: 7
  max_steps: -1
  warmup_steps: 1800

  # Learning Rate & Optimizer
  learning_rate: 1.3e-4
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  lr_scheduler_type: "cosine"

  # Mixed Precision & Performance
  mixed_precision: "bf16"
  dataloader_num_workers: 6
  gradient_checkpointing: true

  # Evaluation & Logging
  eval_strategy: "steps"
  eval_steps: 300
  save_strategy: "steps"
  save_steps: 600
  logging_steps: 30

  # Early Stopping
  early_stopping_patience: 4
  early_stopping_threshold: 0.005

  # Advanced Training Features
  use_ema: false
  label_smoothing: 0.05

data:
  # Dataset Configuration
  data_dir: "/project/code/data/processed"
  max_length: 2048
  max_train_examples: -1
  max_eval_examples: 2000

  # Preprocessing
  tokenizer_name: "gpt2"
  padding_side: "right"
  truncation: true

  # Data Loading
  train_batch_size: 2
  eval_batch_size: 4
  dataloader_drop_last: true
  dataloader_pin_memory: true

# Hardware Configuration
device: "auto"
fp16: false
bf16: true

# Memory Optimization
gradient_checkpointing: true
use_cpu_offload: false
pin_memory: true

# Monitoring
wandb:
  enabled: true
  project: "ava-moe-gpu-large-medium"
  tags: ["gpu", "large-medium", "700M", "advanced"]

# Hardware Requirements
# VRAM: 18GB minimum, 20GB recommended
# Compatible GPUs: RTX 3080 Ti, RTX 4070 Ti, RTX A5000, RTX 4080