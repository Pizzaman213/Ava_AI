# GPU Medium-Large Configuration
# Medium-to-large GPU training configuration for Ava MoE++
# Target: ~400M parameters, 14GB+ VRAM, RTX 3070/RTX 4060 Ti/RX 6900 XT
# Optimized for: Mid-range training and fine-tuning

model:
  # Core Architecture
  hidden_size: 768
  num_layers: 18
  num_attention_heads: 12
  intermediate_size: 3072
  vocab_size: 50257
  max_position_embeddings: 2048

  # MoE Configuration
  num_experts: 16
  num_experts_per_token: 2
  expert_capacity_factor: 1.0
  router_type: "switch"
  router_aux_loss_coef: 0.01
  router_jitter_noise: 0.01

  # Attention & Position Encoding
  use_cache: true
  rope_theta: 10000.0
  attention_dropout: 0.1
  hidden_dropout: 0.1

  # Regularization
  layer_norm_eps: 1e-5
  initializer_range: 0.02
  hidden_act: "gelu"

  # Enhanced Features (selective for medium-large model)
  use_moh: false
  use_moa: false
  use_rag: false
  use_cross_attention: false
  use_episodic_memory: false

training:
  # Batch Configuration
  batch_size: 3
  gradient_accumulation_steps: 10
  max_gradient_norm: 1.0

  # Training Duration
  num_epochs: 8
  max_steps: -1
  warmup_steps: 1400

  # Learning Rate & Optimizer
  learning_rate: 1.8e-4
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  lr_scheduler_type: "cosine"

  # Mixed Precision & Performance
  mixed_precision: "fp16"
  dataloader_num_workers: 4
  gradient_checkpointing: true

  # Evaluation & Logging
  eval_strategy: "steps"
  eval_steps: 400
  save_strategy: "steps"
  save_steps: 800
  logging_steps: 40

  # Early Stopping
  early_stopping_patience: 3
  early_stopping_threshold: 0.01

data:
  # Dataset Configuration
  data_dir: "/project/code/data/processed"
  max_length: 2048
  max_train_examples: -1
  max_eval_examples: 1500

  # Preprocessing
  tokenizer_name: "gpt2"
  padding_side: "right"
  truncation: true

  # Data Loading
  train_batch_size: 3
  eval_batch_size: 6
  dataloader_drop_last: true
  dataloader_pin_memory: true

# Hardware Configuration
device: "auto"
fp16: true
bf16: false

# Monitoring
wandb:
  enabled: true
  project: "ava-moe-gpu-medium-large"
  tags: ["gpu", "medium-large", "400M", "fine-tuning"]

# Hardware Requirements
# VRAM: 14GB minimum, 16GB recommended
# Compatible GPUs: RTX 3070, RTX 4060 Ti 16GB, RX 6900 XT