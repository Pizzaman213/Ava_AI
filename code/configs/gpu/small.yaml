    memory_capacity: 500
    memory_selection_strategy: importance
    memory_importance_threshold: 0.7
    memory_adaptation_rate: 0.01
    silent_mode: true
  quantization:
    quantization_aware: false
    use_nvfp4: true
    use_torchao_nvfp4: true
    nvfp4_mode: weight_only
    bit_width: 4
    nvfp4_block_size: 16
    stochastic_rounding: false
    use_hadamard_transform: false

performance:
  ultra_fast_mode: true
  fast_progress: false
  minimal_progress: true
  express_mode: true
  no_sync: false
  # Torch compilation settings - OPTIMIZED FOR COLOSSAL-AI
  torch_compile:
    enabled: true
    mode: max-autotune  # Maximum performance mode
    fullgraph: true  # Full graph compilation for better optimization
    dynamic: false  # Static shapes for better optimization
    backend: inductor  # Best backend for Ampere GPUs
  # Default compile mode for speed optimization
  default_compile_mode: max-autotune  # Changed from reduce-overhead for max speed
  compile_fullgraph: true  # Enable for better fusion
  compile_dynamic: false  # Keep static for speed
  # Environment and torch settings
  torchinductor_max_autotune: '0'
  cudagraph_skip_dynamic_shapes: true
  cudagraph_dynamic_shape_warn_limit: null
  float32_matmul_precision: high
memory:
  enable_memory_pool: false  # DISABLED for less overhead
  pool_size_gb: 22.0  # Increased for more usable memory
  gradient_checkpointing: false  # DISABLED for speed
  memory_threshold_gb: 23.0  # Higher threshold for less intervention
  enable_cpu_offload: false
  clear_cache_frequency: 100  # INCREASED - clear less often for speed
  silent_mode: true
  target_utilization: 0.85  # INCREASED for better GPU utilization
  warning_threshold: 0.90  # INCREASED
  critical_threshold: 0.92  # INCREASED
  emergency_threshold: 0.95  # INCREASED for max utilization
evaluation:
