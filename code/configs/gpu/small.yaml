stability:
  loss_smoothing: true
  loss_smoothing_alpha: 0.9
  lr_warmup_ratio: 0.0333
  lr_decay_ratio: 0.1
  sync_gradients_each_step: false
  use_kahan_summation: true
  use_stable_embedding: true
  stop_on_nan: false
  max_grad_norm_before_stop: 100.0
  max_loss_before_stop: 20.0

# Colossal-AI Configuration - OPTIMIZED FOR MAXIMUM SPEED
colossalai:
  enabled: true

  # Parallelism Strategy - OPTIMIZED
  # For RTX 3090 Ti (24GB), ZeRO-1 gives best speed with your model size
  parallel_strategy: zero1  # ZeRO-1 for fastest training on small-medium models

  # Parallelism dimensions (for hybrid strategy)
  tensor_parallel_size: 1  # Keep at 1 for single GPU
  pipeline_parallel_size: 1  # Keep at 1 for single GPU
  data_parallel_size: -1  # Auto-calculate for multi-GPU
  sequence_parallel_size: 1  # Keep at 1 for your sequence length

  # Memory Optimization - SPEED FOCUSED
  use_zero: true  # Enable ZeRO optimizer
  zero_stage: 1  # Stage 1 for MAXIMUM SPEED (less communication overhead)
  use_cpu_offload: false  # Keep disabled for speed
  use_nvme_offload: false  # Keep disabled for speed
  use_gemini: false  # Keep disabled for speed
  use_patrickstar: false  # Keep disabled for speed

  # Mixed Precision - OPTIMIZED FOR RTX 3090 Ti
  mixed_precision: bf16  # BF16 is fastest on Ampere GPUs
  initial_scale: 32768.0  # Reduced for faster scaling updates
  min_scale: 1.0
  growth_factor: 2.0
  backoff_factor: 0.5
  growth_interval: 5000  # INCREASED to reduce scaling overhead

  # Communication Optimization - MAXIMUM SPEED
  use_gradient_compression: false  # Disabled for single GPU (adds overhead)
  gradient_compression_ratio: 1.0  # No compression for speed
  use_hierarchical_allreduce: false  # Single node optimization
  use_async_communication: true  # Enable for overlapping

  # Activation Checkpointing - DISABLED FOR SPEED
  use_activation_checkpointing: false  # DISABLED for maximum speed
  checkpoint_num_layers: 0  # No checkpointing for speed

  # Performance Tuning - ALL OPTIMIZATIONS ENABLED
  enable_jit_fused: true  # JIT compilation for 10-20% speedup
  enable_fused_normalization: true  # Fused ops for 5-10% speedup
  enable_flash_attention: true  # Flash Attention v2 for 2-4x attention speedup
  enable_xformers: true  # Additional memory-efficient attention (try both)

  # Additional Speed Optimizations
  enable_cuda_graph: true  # CUDA graphs for reduced kernel launch overhead
  enable_tensor_core: true  # Force tensor core usage
  enable_tf32: true  # TF32 for additional speedup on Ampere
  bucket_size_mb: 25  # Optimal bucket size for gradient aggregation

  # Auto-tuning
  enable_auto_tune: true  # Auto-tune kernel selection
  auto_tune_warmup_steps: 50  # Steps to profile for auto-tuning

  # Auto-Parallelism (Experimental)
  use_auto_parallel: false  # Keep disabled for predictability
  search_space: default

  # Compatibility Settings
  use_legacy_optimizer: false  # Use Colossal-AI optimizers
  compatibility_mode: false  # Full Colossal-AI mode

  # Memory Thresholds for Auto-Configuration
  auto_config:
    small_gpu_threshold_gb: 16  # GPUs with < 16GB
    medium_gpu_threshold_gb: 32  # GPUs with 16-32GB
    enable_cpu_offload_threshold_gb: 12  # Enable CPU offload if GPU < 12GB
    enable_activation_checkpoint_threshold_gb: 24  # Enable checkpointing if GPU < 24GB

generation:
  repetition_penalty: 1.2  # REDUCED for more natural generation
  eos_penalty: 0.5
  min_length: 20  # REDUCED for faster generation
  temperature: 0.8  # REDUCED for more focused generation during eval
