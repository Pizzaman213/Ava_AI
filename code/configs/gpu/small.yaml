  group: ava-enhanced-v3
  job_type: train
  offline: false
  cache_size: 10000
  cache_flush_interval: 500
stability:
  loss_smoothing: true
  loss_smoothing_alpha: 0.9
  lr_warmup_ratio: 0.0333
  lr_decay_ratio: 0.1
  sync_gradients_each_step: false
  use_kahan_summation: true
  use_stable_embedding: true
  stop_on_nan: false
  max_grad_norm_before_stop: 100.0
  max_loss_before_stop: 20.0
generation:
  repetition_penalty: 3.0  # FURTHER INCREASED: Even stronger penalty during generation
  eos_penalty: 0.5  # REDUCED: Allow natural endings (but still prevent premature EOS)
  min_length: 40    # INCREASED: Match training min_sequence_length
  temperature: 1.0  # INCREASED: Maximum diversity while maintaining coherence
  top_k: 100        # DOUBLED: Much larger sampling pool for diversity
  top_p: 0.95       # INCREASED: Sample from 95% probability mass
  use_ngram_blocking: true
  ngram_size: 3     # INCREASED: Block longer repetitive patterns
  no_repeat_ngram_size: 4  # INCREASED: Block all 4-gram repetition
  do_sample: true
  num_beams: 1
