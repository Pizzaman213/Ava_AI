# Small configuration with DeepSeek-style loss for improved training dynamics
# Features:
#   - Multi-token prediction (3 tokens ahead)
#   - Temperature-scaled cross-entropy with adaptive temperature
#   - Auxiliary-free MoE load balancing (gradient-based)
#   - Label smoothing for better generalization
model:
  # Model Architecture - Controls the transformer structure (100M params)
  hidden_size: 768  # Embedding dimension - scaled up for 100M param target
  num_layers: 8  # Transformer depth - increased for better capacity
  num_attention_heads: 12  # Parallel attention heads per layer (divides 768 evenly: 64 per head)
  intermediate_size: 3072  # FFN hidden layer size (4x hidden_size for optimal capacity)
  vocab_size: 50257  # GPT-2 tokenizer vocabulary size
  max_position_embeddings: 2048  # Maximum sequence length the model can handle

  # Mixture of Experts (MoE) Configuration
  num_experts: 4  # Total number of expert FFN networks available per MoE layer (reduced for memory/speed)
  num_experts_per_token: 2  # Top-K routing: how many experts process each token (top-2 routing)
  expert_capacity_factor: 1.25  # Buffer size multiplier for expert capacity (prevents overflow)
  router_type: deepseek  # Routing algorithm: 'deepseek' uses gradient-based load balancing
  router_aux_loss_coef: 0.0  # Auxiliary load balancing loss weight (0 = auxiliary-free approach)
  router_jitter_noise: 0.05  # Noise added to router logits - INCREASED from 0.02 to prevent gradient vanishing in router

  # Positional Encoding & Caching
  use_cache: true  # Enable KV-cache for faster autoregressive generation
  rope_theta: 10000.0  # RoPE (Rotary Position Embedding) base frequency

  # Regularization (Dropout)
  attention_dropout: 0.05  # Dropout rate in attention layers - INCREASED from 0.0 to prevent activation saturation
  hidden_dropout: 0.05  # Dropout rate in FFN layers - INCREASED from 0.0 to help gradient flow

  # Optimization & Stability
  use_flash_attention: true  # Use Flash Attention for memory efficiency and speed
  layer_norm_eps: 1e-5  # Small epsilon for numerical stability in LayerNorm
  initializer_range: 0.01  # Weight initialization std dev - OPTIMIZED: Lower value for stable training
  hidden_act: gelu  # Activation function (GELU is standard for transformers)

  # DeepSpeed Settings (MoE-specific)
  deepspeed_activation_checkpointing: false  # SPEED: Disabled (trades memory for 30% speed gain)
  deepspeed_partition_activations: false  # Don't partition activations across GPUs
  deepspeed_moe_param_groups: true  # Group MoE parameters separately for optimization
training:
  # Batch Configuration
  batch_size: 8  # Increased from 4 for better gradient estimates and faster training
  gradient_accumulation_steps: 4  # Accumulate to effective batch_size=32

  # Gradient Management
  max_gradient_norm: 1.0  # Clip gradients to prevent explosion - reduced for stability with higher LR

  # Training Duration
  num_epochs: 100  # Number of full passes through the dataset (increased to train longer)
  max_steps: -1  # Maximum training steps (-1 = train for full num_epochs)

  # Learning Rate Schedule (~98k total steps with 1.17M examples, batch 12)
  warmup_steps: 2000  # Linear LR warmup - reduced for faster initial learning
  learning_rate: 0.006  # Peak learning rate - FIXED: Increased 60x for pre-training (was 0.0001 = too low!)
  lr_scheduler_type: cosine  # Cosine decay schedule (smooth decay after warmup)
  lr_end: 1.0e-05  # Final learning rate at end of training

  # Adaptive Learning Rate Manager Configuration
  adaptive_lr:
    enabled: true  # Use adaptive LR manager instead of standard scheduler
    min_lr: 1.0e-6  # Minimum learning rate floor
    max_lr: 0.012  # Maximum learning rate (2x base LR) - increased to match new peak LR
    min_improvement: 0.0001  # Minimum loss improvement to reset plateau counter (0.01%) - lowered from 0.0002
    plateau_patience: 2000  # Steps without improvement before reducing LR - increased from 500
    plateau_factor: 0.7  # Multiply LR by this on plateau (30% reduction) - gentler than 50%
    lr_check_interval: 100  # Check for plateau/improvement every N steps - increased from 50 for less noise
    batch_loss_window: 100  # Rolling window for loss averaging
    stability_threshold: 5  # Consecutive improvements needed for LR increase
    increase_factor: 1.05  # Multiply LR by this on stable improvement (5% increase)
    divergence_threshold: 5.0  # Emergency LR cut if loss spikes beyond best_loss * threshold - increased from 3.0
    emergency_factor: 0.7  # Multiply LR by this on loss spike (30% emergency reduction) - gentler than 50%

  # Optimizer (AdamW) Hyperparameters
  weight_decay: 0.01  # L2 regularization - REDUCED from 0.07 to reduce gradient dampening
  beta1: 0.9  # Adam momentum parameter for first moment
  beta2: 0.999  # Adam momentum for second moment - INCREASED from 0.95 for better gradient estimates
  eps: 1e-8  # Small constant for numerical stability in Adam

  # Precision & Performance - OPTIMIZED for speed
  mixed_precision: bf16  # Use BFloat16 for better numerical stability than FP16
  dataloader_num_workers: 4  # Number of parallel data loading processes (optimized for stability)
  prefetch_factor: 6  # Prefetch 6 batches per worker - OPTIMIZED: Better GPU saturation
  persistent_workers: true  # OPTIMIZED: Keep workers alive between epochs (reduces startup overhead)
  gradient_checkpointing: false  # DISABLED: Speed priority for 11.6GB GPU (memory sufficient without it)

  # Evaluation & Checkpointing - OPTIMIZED for speed
  eval_strategy: steps  # Evaluate every N steps (vs every epoch)
  eval_steps: 5000  # Run evaluation every 5000 steps - OPTIMIZED: Reduced overhead
  save_strategy: steps  # Save checkpoints every N steps
  save_steps: 10000  # Save checkpoint every 10000 steps - OPTIMIZED: Reduced I/O overhead
  logging_steps: 500  # Log metrics every 500 steps - OPTIMIZED: Reduced logging overhead

  # Early Stopping
  early_stopping_patience: 6  # Stop if no improvement for 6 evaluation cycles (increased from 4 for MoE stability)
  early_stopping_threshold: 0.01  # Minimum improvement to count as progress
  # Progressive Training - Start with short sequences, gradually increase length
  progressive:
    enable_progressive_training: true  # Enable curriculum-style sequence length growth
    enable_sequence_scaling: true  # Dynamically scale sequence length during training
    initial_seq_length: 256  # Start training with 256 token sequences (easier to learn)
    final_seq_length: 1024  # End training with 1024 token sequences (full context)
    length_schedule: exponential  # Growth curve: exponential ramp from initial → final
    length_growth_epochs: 5  # Grow sequence length over first 5 epochs (extended from 3 for smoother transitions)
    enable_curriculum: true  # ENABLED: Use difficulty-based sample ordering (30% faster convergence)
    curriculum_metric: loss  # Use per-example loss for difficulty scoring
    enable_dynamic_batch: false  # Keep disabled for now (will enable in dynamic_batching section)

  # Dynamic Batching - DISABLED (removed for stability and simplicity)
  dynamic_batching:
    enabled: false  # DISABLED: Use fixed batch size for more predictable training
    min_batch_size: 8  # Not used when disabled
    max_batch_size: 8  # Not used when disabled
    target_memory_utilization: 0.85  # Not used when disabled
    adjustment_frequency: 100  # Not used when disabled
    adjustment_factor: 1.0  # Not used when disabled
    warmup_steps: 0  # Not used when disabled
    smooth_transitions: false  # Not used when disabled

  # Gradient Health Monitoring - Detect and respond to gradient issues
  gradient_health:
    enabled: true  # Monitor gradient norms for explosions
    initial_clip_value: 1.0  # Starting gradient clip threshold - reduced for higher LR
    final_clip_value: 2.0  # Ending gradient clip threshold (gradually increase)
    warmup_steps: 5000  # Gradually adjust clip value over first 5000 steps
    explosion_threshold: 10.0  # Flag gradient explosion if norm exceeds this - reduced for higher LR
    explosion_window: 5  # Check for explosions over 5-step rolling window
    auto_reduce_lr: true  # Automatically reduce LR if gradients explode
    lr_reduction_factor: 0.7  # Cut LR by 30% when explosion detected (gentler)
data:
  # Data Sources
  data_dir: /project/code/data/processed  # Directory containing preprocessed training data

  # Tokenization & Sequence Processing
  max_length: 1024  # Maximum sequence length in tokens (reduced for speed & GPU efficiency)
  tokenizer_name: gpt2  # Tokenizer to use (GPT-2 BPE with 50257 vocab)
  padding_side: right  # Add padding tokens on the right side of sequences
  truncation: true  # Truncate sequences longer than max_length

  # Dataset Sampling
  max_train_examples: null  # Limit on training samples (null = use all available data)
  max_eval_examples: 5000  # Limit evaluation set to 5000 samples for speed

  # DataLoader Settings
  dataloader_drop_last: true  # Drop incomplete final batch (ensures consistent batch sizes)
  dataloader_pin_memory: true  # Pin memory for faster GPU transfer
deepspeed:
  use_deepspeed: false  # DISABLED: Using native PyTorch training instead
  zero_stage: 0  # Not used when disabled
  cpu_offload: false  # Not used when disabled
  nvme_offload: false  # Not used when disabled
  precision_type: bf16  # BFloat16 for stability + speed (used by native trainer)
  train_batch_size: 32  # Not used when disabled
  micro_batch_size: 8  # Not used when disabled
  gradient_accumulation_steps: 4  # Not used when disabled
  activation_checkpointing: false  # Not used when disabled
enhanced_features:
  # Advanced Architecture Features (Experimental)
  architecture:
    use_moh: false  # Mixture of Heads (specialized attention heads) - disabled
    use_moa: false  # Mixture of Activations (multiple activation functions) - disabled
    use_cross_attention: false  # Cross-attention between layers - disabled
    use_alibi: false  # ALiBi positional encoding (alternative to RoPE) - disabled
    expert_routing_type: deepseek  # MoE routing algorithm (matches router_type above)

  # Retrieval-Augmented Generation (RAG)
  rag:
    enabled: false  # Disable RAG (no external knowledge retrieval)
    knowledge_base_path: null  # Path to knowledge base (not used)
    max_retrieved_docs: 5  # Number of documents to retrieve per query
    rag_fusion_type: concatenate  # How to combine retrieved docs with input

  # DeepSeek-Style Loss Configuration
  losses:
    # Multi-Token Prediction (MTP) - Predict future tokens for better representation learning
    use_multi_token_prediction: false  # TEMPORARILY DISABLED: dtype issue with DeepSpeed + BF16
    num_future_tokens: 3  # Predict 3 tokens ahead (DeepSeek V2/V3 standard)
    mtp_weight: 0.12  # Weight for MTP loss (12% of total loss, increased from 0.05 for better learning)

    # Temperature-Scaled Loss - Soften/sharpen probability distributions
    initial_temperature: 1.0  # Starting temperature (1.0 = no scaling)
    adaptive_temperature: true  # Dynamically adjust temperature based on training progress

    # Regularization
    label_smoothing: 0.08  # Smooth target labels (reduced from 0.12 to help MoE routing learn sharper decisions)

    # MoE Load Balancing
    use_moe_balancing: true  # Enable auxiliary-free gradient-based load balancing
    gradient_balance_weight: 0.08  # Weight for balancing loss (increased from 0.05 for better expert utilization)

    # Legacy/Alternative Loss Functions (all disabled)
    focal_loss: false  # Focal loss for hard examples
    contrastive_loss: false  # Contrastive learning loss
    diversity_loss: false  # Expert diversity regularization
    auxiliary_loss: false  # Traditional auxiliary load balancing (replaced by gradient-based)
    adaptive_loss_scaling: true  # Dynamically scale loss components
  gradient:
    gradient_surgery: false  # SPEED: Disabled to avoid multi-task overhead
    adaptive_gradient_surgery: false  # SPEED: Disabled
    gradient_surgery_method: pcgrad
    gradient_norm_tracking: false  # SPEED: Disabled for monitoring reduction
    gradient_anomaly_detection: false  # SPEED: Disabled for monitoring reduction
  memory:
    use_episodic_memory: false
    memory_capacity: 500  # Used for episodic memory buffer
    memory_selection_strategy: importance
    memory_importance_threshold: 0.7
    memory_adaptation_rate: 0.01
    memory_performance_window: 100
    memory_replay_ratio: 0.01
    memory_replay_strategy: random
  quantization:
    quantization_aware: false
    use_nvfp4: true  # ENABLED: NVFP4 WEIGHT_ONLY mode (~4x weight compression)
    use_torchao_nvfp4: true  # Use TorchAO implementation (RTX 3060 compatible)
    nvfp4_mode: weight_only  # WEIGHT_ONLY works on Ampere GPUs (RTX 3060)
    bit_width: 4  # 4-bit weights (NVFP4)
    nvfp4_block_size: 16  # Smaller block size for better accuracy
    stochastic_rounding: false  # Disabled for NVFP4
    use_hadamard_transform: false  # Not needed for NVFP4
data_loading:
  streaming: true
  buffer_size: 10000  # Increased buffer for better throughput (from 1000)
  max_samples: null  # No limit - use all available data
  multi_column: false
  use_multi_column: false
  distributed: false
  num_workers: 4  # Multi-worker loading for better performance (matches dataloader_num_workers)
  # Length-based bucketing for better GPU utilization
  enable_bucketing: true
  bucket_boundaries: [256, 512, 768, 1024]  # Optimized boundaries for progressive training
  max_bucket_size: 32  # Samples per bucket before yielding batch
performance:
  ultra_fast_mode: true  # SPEED: Enable ultra-fast mode (minimal monitoring)
  fast_progress: false  # Overridden by ultra_fast_mode
  minimal_progress: false  # Overridden by ultra_fast_mode
  express_mode: false  # Overridden by ultra_fast_mode
  no_sync: false
memory:
  enable_memory_pool: true
  pool_size_gb: 8.0  # SPEED: Increased from 6.0 (more memory available without checkpointing)
  gradient_checkpointing: false  # SPEED: Disabled (unified with training.gradient_checkpointing)
  memory_threshold_gb: 8.0
  enable_cpu_offload: false
  clear_cache_frequency: 2000  # OPTIMIZED: Clear even less frequently for speed (was 500)
  silent_mode: true  # NEW: Suppress memory warnings (still monitors, just doesn't print)
evaluation:
  eval_during_training: true
  eval_metrics: perplexity  # SPEED: Only perplexity (removed BLEU for speed)
  comprehensive_eval: false
  # MoE-specific metrics for monitoring expert behavior - OPTIMIZED
  moe_metrics:
    track_expert_utilization: true  # Monitor which experts are being used
    track_routing_entropy: true  # Measure routing diversity (prevents expert collapse)
    track_load_balance: true  # Monitor load distribution across experts
    track_expert_specialization: false  # Disabled for speed (expensive computation)
    log_frequency: 2000  # Log MoE metrics every 2000 steps - OPTIMIZED: Reduced overhead
output:
  output_dir: outputs/small
  save_total_limit: 5
  save_on_each_node: false
run_management:
  experiment_name: ava-small-enhanced
  run_id: null
  resume_from_checkpoint: null
device: auto
fp16: false  # Disabled in favor of bf16
bf16: true  # Enabled for better numerical stability in MoE training
wandb:
  enabled: true
  project: Ava
  tags:
  - gpu
  - small
  - 28M
  - progressive-training
  - moe
  - production
  entity: null
  name: null
  notes: "Enhanced DeepSeek-style training with 8 experts (top-2 routing), 512 hidden dim. Progressive training (256→1024 tokens). Multi-token prediction (3 tokens), auxiliary-free balancing. ~45M parameters."
  group: ava-small-models
  job_type: train
  offline: false
  cache_size: 10000  # SPEED: Increased cache from 5000 for better throughput
  cache_flush_interval: 1000  # SPEED: Optimized interval (was 300) - OPTIMIZED: Reduced I/O
stability:
  # Loss Stability
  loss_smoothing: true  # Apply exponential moving average to logged loss values
  loss_smoothing_alpha: 0.9  # EMA decay factor (higher = smoother, slower response)

  # Learning Rate Stability
  lr_warmup_ratio: 0.1  # Fraction of training for warmup (10%)
  lr_decay_ratio: 0.1  # Fraction of training for decay (10%)

  # Gradient Synchronization
  sync_gradients_each_step: false  # Don't force gradient sync every step (DDP optimization)

  # Numerical Stability
  use_kahan_summation: true  # Use Kahan summation for more accurate gradient accumulation
  use_stable_embedding: true  # Use numerically stable embedding initialization

  # Safety Checks - Stop training if catastrophic failures occur
  stop_on_nan: true  # Halt training if NaN loss/gradients detected
  max_grad_norm_before_stop: 100.0  # Stop if gradient norm exceeds this threshold
  max_loss_before_stop: 20.0  # Stop if loss exceeds this value (indicates divergence)
