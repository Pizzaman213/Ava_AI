model:
  hidden_size: 512
  num_layers: 12  # REDUCED from 14 for faster training
  num_attention_heads: 8
  intermediate_size: 1536  # REDUCED from 2048 for faster forward/backward pass
  vocab_size: 65536
  max_position_embeddings: 256  # Keep at 256 for speed
  num_experts: 4  # REDUCED from 8 for faster MoE routing
  num_experts_per_token: 2
  expert_capacity_factor: 1.25  # REDUCED for less computation
  router_type: deepseek
  router_aux_loss_coef: 0.005  # REDUCED for less auxiliary computation
  router_jitter_noise: 0.005  # REDUCED for less noise computation
  use_cache: false  # DISABLED during training for speed
  rope_theta: 10000.0
  attention_dropout: 0.1  # REDUCED for faster training
  hidden_dropout: 0.1  # REDUCED for faster training
  use_flash_attention: true  # Keep enabled for speed
  layer_norm_eps: 1e-5
  initializer_range: 0.02  # INCREASED for faster initial convergence
  hidden_act: swish  # SWISH is often faster than GELU on modern GPUs
  deepspeed_activation_checkpointing: false
  deepspeed_partition_activations: false
  deepspeed_moe_param_groups: true
  tie_word_embeddings: true  # ENABLED to reduce parameters
  dropout: 0.1  # REDUCED for faster training
  # Model architecture defaults
  default_vocab_size: 50257
  default_hidden_size: 768
  default_num_layers: 12
  default_num_attention_heads: 12
  default_vocab_size_large: 32000
  default_hidden_size_large: 4096
training:
  batch_size: 48  # Keep high for good GPU utilization
  gradient_accumulation_steps: 1  # Keep at 1 for fast updates
  max_gradient_norm: 0.5  # REDUCED for better stability with higher LR
  num_epochs: 1
  max_steps: null
  warmup_steps: 500  # INCREASED back for smoother warmup with high LR
  warmup_schedule: cosine  # COSINE for smoother warmup
  learning_rate: 0.0006  # REDUCED from 0.0008 for better stability while maintaining speed
  lr_scheduler_type: cosine
  lr_end: 6e-05  # Adjusted to 10% of max LR
  weight_decay: 0.1  # Keep moderate for regularization
  beta1: 0.9
  beta2: 0.95  # REDUCED further for faster adaptation but more stable than 0.98
  eps: 1e-7  # More standard value for stability
  repetition_penalty_weight: 0.0
  immediate_repetition_weight: 0.0
  min_sequence_length: 40
  eos_penalty_weight: 2.0
  eos_logit_bias: -1.5
  entropy_regularization: 0.05  # REDUCED for less regularization overhead
  output_diversity_weight: 0.3  # REDUCED for faster training
  mixed_precision: bf16
  dataloader_num_workers: 12  # INCREASED for faster data loading
  prefetch_factor: 8  # INCREASED for better data pipeline
  persistent_workers: true
  gradient_checkpointing: false  # DISABLED for maximum speed
  eval_strategy: steps
  eval_steps: 1000  # Generate samples every 1000 steps
  eval_steps_type: training_steps  # 'training_steps' or 'optimizer_steps' - controls whether eval_steps counts training iterations or optimizer updates
  save_strategy: steps
  save_steps: 2000  # Keep checkpoint frequency at 2000
  save_total_limit: 2  # REDUCED to save disk I/O
  logging_steps: 50  # INCREASED to reduce logging overhead
  generate_during_eval: true  # ENABLE text generation during evaluation
  num_generation_samples: 3  # Number of samples to generate
  generation_max_length: 100  # Max tokens for each sample
  early_stopping_patience: 5  # Increased back for proper convergence
  early_stopping_threshold: 0.005  # Lowered back for proper convergence
  # Optimizer defaults
  default_learning_rate: 5.0e-5
  default_weight_decay: 0.01
  adam_betas:
    - 0.9
    - 0.95
  no_decay_patterns:
    - bias
    - LayerNorm.weight
    - layernorm.weight
    - ln_f.weight
    - ln_
    - norm.weight
  # Training defaults
  default_batch_size_fallback: 12
  adaptive_lr:
    enabled: false  # DISABLED - no automatic LR adjustment
    min_lr: 5.0e-05
    max_lr: 0.0006
    min_improvement: 0.0001
    plateau_patience: 2000
    plateau_factor: 0.7
    lr_check_interval: 100
    batch_loss_window: 100
    stability_threshold: 5
    increase_factor: 1.05
    divergence_threshold: 5.0
    emergency_factor: 0.7
    # Warmup defaults
    warmup_percentage: 0.03
    default_warmup_steps: 3000
    # Max LR multiplier
    max_lr_multiplier: 2.0
  progressive:
    enable_progressive_training: false
    enable_sequence_scaling: false
    initial_seq_length: 128
    final_seq_length: 128
    length_schedule: exponential
    length_growth_epochs: 1000
    enable_curriculum: false
    curriculum_metric: loss
    enable_dynamic_batch: false
    # Progressive training defaults
    default_initial_seq_length: 128
    default_final_seq_length: 2048
    default_length_growth_epochs: 10
    default_cache_dir: /tmp/difficulty_cache
    default_min_batch_size: 1
    default_max_batch_size: 64
    default_target_gpu_utilization: 0.85
    min_performance_threshold: 0.8
    default_num_epochs: 3
  dynamic_batching:
    enabled: false
    min_batch_size: 8
    max_batch_size: 8
    target_memory_utilization: 0.85
    adjustment_frequency: 100
    adjustment_factor: 1.0
    warmup_steps: 500
    smooth_transitions: false
    # Dynamic batching defaults
    default_min_batch_size: 1
    default_max_batch_size: 64
    default_target_memory_utilization: 0.85
    default_adjustment_frequency: 100
    default_adjustment_factor: 1.25
    default_warmup_steps: 500
  gradient_health:
    enabled: true
    initial_clip_value: 0.5  # REDUCED for better stability
    final_clip_value: 0.5  # Keep consistent clipping
    warmup_steps: 500
    explosion_threshold: 3.0  # REDUCED further for earlier intervention
    explosion_window: 3  # REDUCED for quicker response
    auto_reduce_lr: true
    lr_reduction_factor: 0.7  # GENTLER reduction to maintain speed
data:
  # Core data configuration
  data_dir: /project/code/data/processed
  max_length: 256  # Keep at 256 for consistent batching
  tokenizer_name: /project/code/models/tokenizer/enhanced-65536
  padding_side: right
  truncation: true
  max_train_examples: null
  max_eval_examples: 2000  # REDUCED for faster evaluation
  dataloader_drop_last: true
  dataloader_pin_memory: true  # ENABLED for faster GPU transfer

  # Tokenizer defaults
  default_tokenizer_name: Qwen/Qwen2.5-0.5B

  # Data loading configuration
  streaming: true
  buffer_size: 5000  # REDUCED for faster initial loading
  max_samples: null
  val_max_samples: 2000  # REDUCED for faster validation
  val_split_ratio: 0.1  # REDUCED for more training data
  multi_column: false
  use_multi_column: false
  distributed: false
  num_workers: 16  # INCREASED for faster parallel loading
  samples_per_file: 8  # INCREASED for better batching efficiency
  enable_bucketing: false  # DISABLED for faster processing
  bucket_boundaries:
  - 64
  - 128
  - 256
  max_bucket_size: 64
  use_weighted_mixing: false
  mixing_temperature: 1.0
  shuffle_seed: 42
  reshuffle_each_epoch: false  # DISABLED for faster epoch transitions
  drop_last_batch: true
  prefetch_factor: 16  # INCREASED for better data pipeline
  persistent_workers: true

  # Format detection
  format_detection_samples: 10

  # Fallback data paths
  fallback_data_paths:
    - /project/code/data/processed
    - /project/code/data/combined
    - /project/code/data
    - ./data/processed
    - ./data/combined
    - ./data
    - ../data/processed
    - ../data
    - ../../data

deepspeed:
  use_deepspeed: false
  zero_stage: 0
  cpu_offload: false
  nvme_offload: false
  precision_type: fp16
  train_batch_size: 192
  micro_batch_size: 24  # FIXED: Changed from 4 to match training.batch_size
