# ============================================================
# SMALL CONFIGURATION - BALANCED GPU PERFORMANCE
# ============================================================
#
# Category: GPU (CUDA)
# Model Size: ~100M parameters
# Device: NVIDIA GPU with CUDA 11.7+
# Optimization Level: HIGH
# Use Case: Balanced training with GPU acceleration
#
# DESCRIPTION:
# GPU-optimized configuration with comprehensive features.
# Suitable for development and medium-scale training with
# good balance between performance and resource usage.
# Leverages CUDA capabilities including Flash Attention,
# mixed precision, and optimized kernels.
#
# HARDWARE REQUIREMENTS:
# - GPU: 6GB+ VRAM (RTX 3060 or better)
# - CUDA: 11.7 or higher
# - PyTorch: 2.0+ with CUDA support
# - System RAM: 16GB+ recommended
#
# USAGE:
#   python3 train_with_data.py --config configs/gpu/small.yaml
#   python3 interact.py --model outputs/small.pt
#   torchrun --nproc_per_node=2 train.py --config configs/gpu/small.yaml
#
# ============================================================

# ============================================================
# MODEL ARCHITECTURE
# ============================================================

model:
  # ---------- Core Architecture ----------
  # size: small                      # Removed - not in EnhancedMoEConfig
  vocab_size: 50257               # GPT-2 tokenizer vocabulary
  hidden_size: 512                # Reduced hidden dimension for memory
  num_layers: 8                   # Reduced layers for memory
  intermediate_size: 2048         # Reduced FFN dimension for memory
  
  # ---------- Attention Configuration ----------
  num_attention_heads: 8          # Reduced attention heads for memory
  # num_key_value_heads: 2          # Removed - not in EnhancedMoEConfig
  # attention_type: gqa             # Removed - not in EnhancedMoEConfig
  # use_flash_attn: true            # Removed - not in EnhancedMoEConfig
  attention_dropout: 0.2          # Dropout in attention layers
  
  # ---------- Position Encoding ----------
  max_position_embeddings: 2048   # Maximum sequence length
  rope_theta: 10000.0             # RoPE base frequency
  
  # ---------- Mixture of Experts (MoE) ----------
  num_experts: 2                  # Reduced experts for memory
  # num_experts_per_tok: 1          # Removed - not in EnhancedMoEConfig
  expert_capacity_factor: 1.25    # Capacity factor for load balancing
  # expert_routing_type: switch     # Removed - not in EnhancedMoEConfig
  # expert_dropout: 0.25            # Removed - not in EnhancedMoEConfig
  
  # ---------- Activation & Initialization ----------
  hidden_act: swiglu              # Activation function
  initializer_range: 0.01         # Smaller weight initialization
  layer_norm_eps: 1.0e-06        # Layer norm epsilon for stability
  
  # ---------- Regularization ----------
  hidden_dropout: 0.3             # General dropout rate
  # label_smoothing: 0.1            # Removed - not in EnhancedMoEConfig
  
  # ---------- Caching & Optimization ----------
  use_cache: true                 # Enable KV caching for inference
  # gradient_checkpointing: true    # Removed - not in EnhancedMoEConfig
  # use_memory_efficient_attention: true  # Removed - not in EnhancedMoEConfig
  
  # ---------- Advanced Features (Disabled for Compatibility) ----------
  # All advanced features commented out to avoid config filtering warnings
  # These features are not recognized by EnhancedMoEConfig

  # use_mod: true                   # Enable MoD for efficient computation
  # mod_mode: adaptive              # Options: learned, fixed, adaptive
  # mod_skip_fraction: 0.2          # Fraction of layers to skip
  # use_speculative_decoding: true  # Enable speculative decoding
  # speculative_draft_layers: 4     # Number of draft layers
  # use_hierarchical_moe: true      # Hierarchical expert routing
  # use_continuous_experts: true    # Continuous expert selection
  # use_sparse_experts: true        # Sparse expert activation
  # use_expert_cache: true          # Cache expert selections
  # use_mod_plus_plus: true         # Enhanced MoD with confidence
  # use_memory_augmented: false     # External memory mechanisms
  # use_adaptive_inference: true    # Dynamic computation graphs
  # use_interpretability: true      # Built-in interpretability
  
  # All advanced features commented out for compatibility
  # use_mixture_tokenizers: true    # Multiple tokenizer support
  # use_nas_experts: false          # Neural architecture search
  # use_meta_learning: true         # Meta-learning capabilities
  # use_federated_learning: false   # Federated learning support
  # use_continual_learning: true    # Continual learning
  # use_advanced_pretraining: false # Advanced pretraining objectives
  # use_rlaif: false               # RL from AI feedback
  # use_code_experts: false         # Code-specialized experts
  # use_scientific_experts: false   # Science/math experts
  # use_tool_experts: false         # Tool-use experts
  # use_vision_language: false      # Vision-language capabilities
  # use_audio_language: false       # Audio-language capabilities
  # use_adversarial_training: false # Adversarial robustness
  # use_bias_mitigation: true       # Bias reduction mechanisms
  # use_privacy_preserving: false   # Privacy-preserving training
  # use_watermarking: false         # Model watermarking
  # use_distributed_experts: true   # Distributed expert computation
  # use_mixed_precision: true       # Enable mixed precision training
  # use_torch_compile: true         # PyTorch 2.0 compilation
  # use_fused_kernels: true         # Fused CUDA kernels
  
  # All experimental and research features commented out for compatibility
  # use_diverse_beam_search: true    # Diverse beam search
  # use_mixture_decoders: true       # Multiple decoder heads
  # use_streaming_generation: true   # Streaming text generation
  # use_batch_optimized: true        # Batch-optimized inference
  # use_synthetic_data: true         # Synthetic data generation
  # use_online_learning: true        # Online learning capability
  # use_multi_task_learning: true    # Multi-task learning
  # use_automated_curation: false    # Automated data curation
  # use_cross_lingual: false         # Cross-lingual transfer
  # use_edge_deployment: false       # Edge deployment optimization
  # use_ab_testing: false            # A/B testing framework
  # use_model_versioning: false      # Model versioning system
  # use_cost_optimization: false     # Cost-aware optimization
  # use_global_load_balancing: false # Global load balancing
  # use_quantum_inspired: false     # Quantum-inspired algorithms
  # use_neuromorphic: false         # Neuromorphic computing
  # use_self_modifying: false       # Self-modifying networks
  # use_causal_reasoning: false     # Causal reasoning
  # use_visual_builder: false       # Visual model builder
  # use_automated_docs: true        # Automated documentation
  # use_interactive_debug: false    # Interactive debugging
  # use_playground: false           # Model playground
  # use_benchmarking: true          # Automated benchmarking

# ============================================================
# DATA CONFIGURATION
# ============================================================

data:
  # ---------- Dataset Settings ----------
  dataset_type: hf                # Dataset type (hf = HuggingFace format)
  train_paths:                    # Training data paths
    - /project/code/data/processed/combined_processed.jsonl
  val_path: /project/code/data/processed/combined_processed.jsonl
  
  # ---------- Tokenization ----------
  tokenizer: gpt2                 # Tokenizer to use
  max_length: 512                 # Reduced max length for memory
  stride: 1024                    # Stride for overlapping sequences
  
  # ---------- Data Loading ----------
  max_train_examples: 100000      # Limit training data for reasonable training time
  max_val_examples: 1000          # Limit validation data
  
  # ---------- Dataset Arguments ----------
  dataset_args:
    text_column: text             # Column name for text data
    streaming: false              # Don't stream (load in memory)
    num_proc: 8                   # Multiple processes for faster loading
    keep_in_memory: true          # Load dataset in memory for speed
    load_from_cache_file: true    # Use cache if available
  
  # ---------- Data Augmentation ----------
  noise_probability: 0.1          # Random token replacement
  mask_probability: 0.05          # Random masking

# ============================================================
# TRAINING CONFIGURATION
# ============================================================

training:
  # ---------- Basic Training ----------
  batch_size: 2                   # Reduced batch size for memory
  gradient_accumulation_steps: 8  # Increased accumulation (effective batch = 16)
  num_epochs: 3                   # Number of training epochs
  max_steps: -1                   # Max steps (-1 = use epochs)
  
  # ---------- Learning Rate ----------
  learning_rate: 1e-4             # Conservative learning rate for stability
  warmup_steps: 1000              # Extended warmup for stability
  warmup_ratio: 0.1               # Warmup ratio
  
  # ---------- Optimizer Configuration ----------
  optimizer: fused_adamw          # Optimizer: fused_adamw for CUDA
  weight_decay: 0.01              # L2 regularization
  adam_beta1: 0.9                 # Adam beta1
  adam_beta2: 0.95                # Adam beta2
  adam_epsilon: 1e-8              # Adam epsilon
  
  # ---------- Advanced Optimizer Features ----------
  layerwise_lr: true              # Different LR for different layers
  lr_layer_scale: 0.5             # Scale for layer-wise LR
  gradient_centralization: true   # Center gradients
  
  # ---------- Learning Rate Scheduling ----------
  lr_scheduler_type: cosine       # Scheduler type
  scheduler: cosine               # Alternative scheduler setting
  lr_decay_factor: 0.95           # Decay LR by 5% each restart
  num_restarts: 2                 # Number of cosine restarts
  
  # ---------- Gradient Management ----------
  max_grad_norm: 0.5              # Stricter gradient clipping
  gradient_clip: 1.0              # Alternative gradient clipping
  adaptive_gradient_clipping: true # Dynamic gradient clipping
  gradient_penalty_weight: 0.001  # Penalize large gradients
  
  # ---------- Mixed Precision & FP8 ----------
  mixed_precision: no             # Disabled mixed precision for stability
  use_fp8_training: false         # Enable FP8 training (requires H100/H200)
  fp8_format: e4m3                # FP8 forward pass format
  fp8_grad_format: e5m2           # FP8 gradient format
  use_transformer_engine: false   # NVIDIA Transformer Engine (requires H100+)
  gradient_checkpointing: true    # Gradient checkpointing
  zero_stage: 3                   # ZeRO optimization stage
  
  # ---------- Loss Functions ----------
  # Focal Loss
  use_focal_loss: true            # Enable focal loss
  focal_gamma: 2.0                # Focal loss gamma
  focal_alpha: 0.25               # Focal loss alpha
  focal_blend: 0.3                # Blend with standard loss
  
  # ---------- Anti-Collapse Features ----------
  entropy_regularization_weight: 0.01      # Encourage output diversity
  token_frequency_penalty_weight: 0.1      # Penalize repetitive tokens
  expert_diversity_weight: 0.01            # Encourage expert specialization
  
  # ---------- Curriculum Learning ----------
  curriculum_learning: true       # Enable curriculum learning
  initial_sequence_length: 256    # Start with short sequences
  curriculum_warmup_steps: 1000   # Steps to reach full length
  use_curriculum: false           # Alternative curriculum setting
  curriculum_type: adaptive       # Curriculum type
  initial_difficulty: 0.3         # Initial difficulty
  max_difficulty: 1.0             # Maximum difficulty
  sequence_length_curriculum: true # Enable sequence length curriculum
  initial_seq_length: 256         # Initial sequence length
  
  # Progressive Sequence Growth
  progressive_sequence_growth: true # Continue growing beyond initial
  sequence_growth_rate: 1.5       # Growth multiplier
  sequence_growth_interval: 5000  # Steps between growth
  
  # ---------- Anti-Overfitting Features ----------
  stochastic_depth_prob: 0.1      # Randomly drop layers
  mixout_prob: 0.1                # Mix weights with initialization
  use_ema: true                   # Exponential moving average
  ema_decay: 0.999                # EMA decay rate
  confidence_weighting: true      # Weight loss by confidence
  sam_enabled: false              # Sharpness-aware minimization
  
  # ---------- Progressive Training ----------
  use_progressive: false          # Progressive training
  growth_strategy: layer_stacking # Growth strategy
  initial_layers: 6               # Initial layers
  growth_interval: 5000           # Growth interval
  
  # ---------- Safety Training ----------
  use_constitutional: false       # Constitutional AI
  safety_principles:              # Safety principles
  - Be helpful, harmless, and honest
  - Avoid harmful content
  - Respect user privacy
  num_revisions: 2                # Number of revisions
  safety_weight: 0.1              # Safety weight
  
  # ---------- Active Learning ----------
  use_active_learning: false      # Active learning
  active_learning_strategy: uncertainty  # Strategy
  selection_batch_size: 32        # Selection batch size
  
  # ---------- Smart Checkpointing ----------
  use_smart_checkpointing: false  # Smart checkpointing
  memory_threshold: 0.8           # Memory threshold
  min_recompute_ratio: 1.5        # Min recompute ratio
  always_checkpoint_layers:       # Always checkpoint these
  - attention
  
  # ---------- Evaluation & Checkpointing ----------
  eval_steps: 1000                # Evaluation frequency
  save_steps: 2000                # Checkpoint frequency
  save_total_limit: 3             # Max checkpoints to keep
  logging_steps: 10               # Logging frequency
  
  # ---------- DataLoader Settings ----------
  parallel_loading: true          # Parallel data loading
  num_workers: 2                  # DataLoader workers
  drop_last: true                 # Drop incomplete batches
  prefetch_factor: 2              # Prefetch factor
  persistent_workers: false       # Persistent workers
  pin_memory: true               # Pin memory for CUDA
  
  # ---------- Device Settings ----------
  device: cuda                   # Device: cuda for GPU

# ============================================================
# DISTRIBUTED TRAINING
# ============================================================

# ============================================================
# DISTRIBUTED TRAINING - ENHANCED
# ============================================================

distributed:
  enabled: false                # Enable distributed training
  backend: nccl                 # NCCL backend for GPU communication

  # ---------- Multi-GPU Configuration ----------
  num_gpus: 1                   # Number of GPUs
  device_map: auto              # Device mapping

  # ---------- NVLINK Optimization (Multi-GPU) ----------
  use_nvlink_optimization: false # NVLINK optimization
  nccl_tree_threshold: 0        # Force tree algorithm for NVLINK
  gradient_as_bucket_view: true # Bucket view optimization

# ============================================================
# OUTPUT & EXPERIMENT
# ============================================================

output_dir: ./outputs           # Output directory
experiment_name: moe_gpu_small  # Experiment name
logging_level: INFO             # Logging level
report_to:                     # Reporting backends
- tensorboard
- wandb
seed: 42                       # Random seed

# ============================================================
# FINE-TUNING CONFIGURATION
# ============================================================

fine_tuning:
  # ---------- LoRA Configuration ----------
  use_lora: true                # Enable LoRA
  use_qlora: true               # Enable QLoRA
  freeze_base_model: true       # Freeze base model
  lora_r: 16                    # LoRA rank
  lora_alpha: 32                # LoRA alpha
  lora_dropout: 0.1             # LoRA dropout
  
  # ---------- Early Stopping ----------
  early_stopping: true          # Enable early stopping
  early_stopping_patience: 3    # Patience
  early_stopping_threshold: 0.001  # Threshold
  min_delta: 0.0005             # Minimum change
  
  # ---------- LoRA Target Modules ----------
  lora_target_modules:          # Target modules
  - q_proj
  - v_proj
  - k_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  
  # ---------- Multi-LoRA ----------
  num_lora_experts: 4           # Number of LoRA experts
  task_embedding_dim: 0         # Task embedding dimension
  share_base_weights: true      # Share base weights
  
  # ---------- Fine-tuning Training ----------
  batch_size: 8                 # Batch size
  gradient_accumulation_steps: 4  # Gradient accumulation
  learning_rate: 2e-4           # Learning rate
  num_epochs: 5                 # Number of epochs
  warmup_ratio: 0.1             # Warmup ratio

# ============================================================
# INFERENCE CONFIGURATION
# ============================================================

inference:
  use_speculation: false        # Speculative decoding
  num_draft_experts: 4          # Draft experts
  draft_expert_size_ratio: 0.1  # Draft expert size
  draft_sequence_length: 5      # Draft sequence length
  use_prefetching: false        # Prefetching
  prune_before_deployment: false # Prune before deployment
  target_sparsity: 0.3          # Target sparsity
  prune_experts: true           # Prune experts
  prune_attention: true         # Prune attention
  expert_merge_threshold: 0.95  # Expert merge threshold
  use_flash_attn: true          # Flash attention
  torch_compile: true           # PyTorch compilation
  dtype: bfloat16               # Inference dtype

# ============================================================
# MEMORY OPTIMIZATION
# ============================================================

memory_optimization:
  gradient_checkpointing: true  # Gradient checkpointing
  cpu_offload: true             # CPU offload
  optimizer_offload: true       # Optimizer offload
  parameter_offload: false      # Parameter offload
  activation_checkpointing: true # Activation checkpointing
  memory_efficient_attention: true # Memory efficient attention

# ============================================================
# CUDA OPTIMIZATION (GPU Specific)
# ============================================================

cuda_optimization:
  use_cuda_kernels: true        # Use CUDA kernels
  enable_tensor_cores: true     # Enable Tensor Cores
  optimize_memory_layout: true  # Optimize memory layout
  use_cuda_graphs: true         # Use CUDA graphs
  kernel_fusion: true           # Enable kernel fusion

  # ---------- 2025 Advanced Features ----------
  use_triton_kernels: false     # Replace CUDA with Triton kernels
  torch_compile_mode: default   # PyTorch compilation mode
  use_flash_attn_v3: false      # FlashAttention-3 (requires compatible hardware)
  enable_nvlink_optimization: false # NVLINK optimization for multi-GPU
  use_memory_pool: true         # Advanced CUDA memory pool
  memory_pool_size: 4096        # Memory pool size in MB

# ============================================================
# MONITORING CONFIGURATION
# ============================================================

monitoring:
  use_health_monitoring: false  # Health monitoring
  check_interval: 100           # Check interval
  enable_alerts: true           # Enable alerts
  enable_visualization: false   # Enable visualizations
  use_wandb: true               # Use W&B
  wandb_project: llm-moe-training  # W&B project
  wandb_name: null              # W&B run name
  wandb_tags:                   # W&B tags
  - moe
  - gpu
  - small
  - cuda