    label_smoothing: 0.05  # REDUCED for faster training
    use_moe_balancing: false  # DISABLED for speed
    gradient_balance_weight: 0.0  # DISABLED
    focal_loss: false
    contrastive_loss: false
    diversity_loss: false  # DISABLED for speed
    auxiliary_loss: false  # DISABLED for speed
    adaptive_loss_scaling: false
    contrastive_loss_weight: 0.0  # DISABLED
    diversity_loss_weight: 0.0  # DISABLED
    # Loss configuration defaults
    default_num_future_tokens: 3
    default_mtp_weight: 0.1
    default_initial_temperature: 1.0
    default_label_smoothing: 0.1
    default_gradient_balance_weight: 0.1
