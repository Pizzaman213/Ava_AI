model:
  hidden_size: 96  # 1M parameter model (~1.1M params total)
  num_layers: 4  # 4 layers for ~1M params
  num_attention_heads: 4  # 4 heads (head_dim = 24, even for RoPE)
  intermediate_size: 192  # 2x hidden_size (standard FFN ratio)
  vocab_size: 500  # Small vocab with enhanced-500 tokenizer
  max_position_embeddings: 512  # 512 token sequences
  num_experts: 4  # 4 experts for MoE capacity
  num_experts_per_token: 2  # Standard MoE routing (top-2)
  expert_capacity_factor: 1.5
  router_type: deepseek  # FIXED: Match enhanced_features.architecture.expert_routing_type
  router_aux_loss_coef: 0.01  # Load balancing loss coefficient
  router_jitter_noise: 0.01  # FIXED: Reduced jitter for stability
  use_cache: true
  rope_theta: 10000.0
  attention_dropout: 0.05  # FIXED: Reduced from 0.1 for better learning
  hidden_dropout: 0.05
  use_flash_attention: false  # FIXED: Disabled for compatibility
  layer_norm_eps: 1e-5
  initializer_range: 0.02  # FIXED: Increased from 0.01 to standard value
  hidden_act: gelu
  deepspeed_activation_checkpointing: false
  deepspeed_partition_activations: false
  deepspeed_moe_param_groups: true
  tie_word_embeddings: false  # FIXED: Keep untied to avoid gradient conflicts
  dropout: 0.05  # FIXED: Reduced from 0.1
  use_learned_position_embeddings: false  # FIXED: Use only RoPE, not both
training:
  batch_size: 128  # Larger batch size for faster training
  gradient_accumulation_steps: 1  # No accumulation needed with batch size 128
  max_gradient_norm: 1.0  # Standard clipping
  num_epochs: 10  # NeuML setting: 10 epochs for small model
  max_steps: null  # Use epochs instead of steps
  warmup_steps: 500  # Reduced warmup for quick start
  learning_rate: 0.0002  # Higher LR for small model
  lr_scheduler_type: cosine
  lr_end: 1.0e-05  # Prevent LR collapse
  repetition_penalty_weight: 0.0  # DISABLED: Major slowdown, skip for NeuML speed
  immediate_repetition_weight: 0.0  # DISABLED: Major slowdown, skip for NeuML speed
  min_sequence_length: 40  # INCREASED: Force longer outputs before allowing EOS
  eos_penalty_weight: 2.0  # INCREASED: Much stronger penalty for early EOS
  eos_logit_bias: -1.5  # INCREASED: Strongly discourage EOS token in logits
  adaptive_lr:
    enabled: false
    min_lr: 5.0e-05
    max_lr: 0.0006
    min_improvement: 0.0001
    plateau_patience: 2000
    plateau_factor: 0.7
    lr_check_interval: 100
    batch_loss_window: 100
    stability_threshold: 5
    increase_factor: 1.05
    divergence_threshold: 5.0
    emergency_factor: 0.7
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  entropy_regularization: 0.1  # INCREASED 10x: Strong entropy bonus for diverse predictions
  output_diversity_weight: 0.5  # INCREASED 5x: Heavy penalty for low diversity outputs
  mixed_precision: fp16  # NeuML setting: fp16 precision
  dataloader_num_workers: 2  # NeuML setting: 2 workers
  prefetch_factor: 2
  persistent_workers: false
  gradient_checkpointing: false  # DISABLED: No checkpointing for max speed
  eval_strategy: steps
  eval_steps: 1000  # NeuML speed: Eval less often (every 1000 steps)
  save_strategy: steps
  save_steps: 1000  # NeuML speed: Save every 1000 steps
  save_total_limit: 3  # Keep only 3 checkpoints
  logging_steps: 10  # Log frequently for monitoring
  early_stopping_patience: 5
  early_stopping_threshold: 0.005
  progressive:
    enable_progressive_training: false
    enable_sequence_scaling: false
    initial_seq_length: 128
    final_seq_length: 128
    length_schedule: exponential
    length_growth_epochs: 5
    enable_curriculum: false
    curriculum_metric: loss
    enable_dynamic_batch: false
  dynamic_batching:
    enabled: false
    min_batch_size: 8
    max_batch_size: 8
    target_memory_utilization: 0.85
    adjustment_frequency: 100
    adjustment_factor: 1.0
    warmup_steps: 0
    smooth_transitions: false
  gradient_health:
    enabled: false
    initial_clip_value: 0.1
    final_clip_value: 0.3
    warmup_steps: 10000
    explosion_threshold: 1000.0
    explosion_window: 5
    auto_reduce_lr: false
    lr_reduction_factor: 0.7
  max_grad_norm: 1.0
data:
  data_dir: /project/code/data/processed  # Large-scale datasets (4.8GB: FineWeb, C4, Wikipedia, Orca)
  max_length: 512  # 512 token sequences
  tokenizer_name: /project/code/models/tokenizer/enhanced-500
  padding_side: right
  truncation: true
  max_train_examples: null  # Use all data
  max_eval_examples: 5000
  max_samples: null  # No limit
  val_max_samples: 5000
  val_split_ratio: 0.15
  buffer_size: 10000  # Increased for larger dataset
  dataloader_drop_last: true
  dataloader_pin_memory: false
deepspeed:
  use_deepspeed: false
  zero_stage: 0
  cpu_offload: false
  nvme_offload: false
  precision_type: fp16
  train_batch_size: 32
  micro_batch_size: 8
  gradient_accumulation_steps: 4
  activation_checkpointing: false
enhanced_features:
  architecture:
    use_moh: false
    use_moa: false
    use_cross_attention: true
    use_alibi: false
    expert_routing_type: deepseek
  rag:
    enabled: false
    knowledge_base_path: null
    max_retrieved_docs: 5
    rag_fusion_type: concatenate
  losses:
    use_multi_token_prediction: false  # DISABLED: MTP uses extra memory - disable for speed
    num_future_tokens: 1  # MINIMAL: Reduce memory overhead
    mtp_weight: 0.01  # MINIMAL: Lower weight to avoid interfering with main loss
    initial_temperature: 1.2  # INCREASED: More diverse predictions
    adaptive_temperature: true  # ENABLED: Adapt temperature based on loss
    label_smoothing: 0.05  # ADDED: Smooth labels to prevent overconfidence
    use_moe_balancing: true
    gradient_balance_weight: 0.02
    focal_loss: false
    contrastive_loss: false
    diversity_loss: true  # ENABLED: Encourage diverse token selection
    auxiliary_loss: true
    adaptive_loss_scaling: false
    contrastive_loss_weight: 0.02
    diversity_loss_weight: 0.1  # INCREASED: Stronger diversity incentive
    use_ngram_penalty: false  # DISABLED: Major slowdown
    ngram_size: 3
    ngram_penalty_weight: 0.0  # DISABLED
    use_immediate_repetition_detector: false  # DISABLED: Major slowdown
    immediate_repetition_weight: 0.0  # DISABLED
  adaptive_mtp:
    use_adaptive_mtp: false
    num_prediction_heads: 3
    confidence_threshold_train: 0.6
    confidence_threshold_inference: 0.7
    gate_hidden_dims: 512,256
    gate_dropout: 0.1
    gate_activation: gelu
    use_attention_pooling: false
    head_type: linear
    head_intermediate_size: null
    head_dropout: 0.1
    share_projections: false
    mtp_warmup_epochs: 2
    confidence_reg_strength: 0.01
    use_confidence_weighting: true
    primary_loss_weight: 1.0
    additional_loss_base_weight: 0.1
    enable_dynamic_prediction: true
    min_confidence_for_computation: 0.3
  gradient:
    gradient_surgery: false
    adaptive_gradient_surgery: false
    gradient_surgery_method: pcgrad
    gradient_norm_tracking: false
    gradient_anomaly_detection: false
  memory:
    use_episodic_memory: false
    memory_capacity: 500
    memory_selection_strategy: importance
    memory_importance_threshold: 0.7
    memory_adaptation_rate: 0.01
    memory_performance_window: 100
    memory_replay_ratio: 0.01
    memory_replay_strategy: random
    silent_mode: true
    enable_auto_grad_accumulation: false
  quantization:
    quantization_aware: false
    use_nvfp4: true
    use_torchao_nvfp4: true
    nvfp4_mode: weight_only
    bit_width: 4
    nvfp4_block_size: 16
    stochastic_rounding: false
    use_hadamard_transform: false
data_loading:
  streaming: true
  buffer_size: 2000  # REDUCED: Smaller buffer to reduce memory
  max_samples: null
  val_max_samples: 5000  # REDUCED: Less validation data
  val_split_ratio: 0.15
  multi_column: false
  use_multi_column: false
  distributed: false
  num_workers: 4  # REDUCED: Fewer workers to reduce memory
  enable_bucketing: false  # DISABLED: Bucketing uses extra memory
  bucket_boundaries:
  - 128
  - 256
  - 512
  max_bucket_size: 64
  use_weighted_mixing: false  # DISABLED: Reduce memory overhead
  mixing_temperature: 1.0
  shuffle_seed: 42
  reshuffle_each_epoch: true
  drop_last_batch: true
  prefetch_factor: 2  # REDUCED: Less prefetch to reduce memory
  persistent_workers: false
performance:
  ultra_fast_mode: true  # ENABLED: Disable logging overhead
  fast_progress: false
  minimal_progress: true  # ENABLED: Minimal progress bars for speed
  express_mode: true  # ENABLED: Maximum speed mode
  no_sync: false
  torch_compile:
    enabled: true  # ENABLED: PyTorch 2.0 compilation for speed
    mode: max-autotune  # Maximum optimization
    fullgraph: false
    dynamic: false
    backend: inductor
memory:
  enable_memory_pool: false
  pool_size_gb: 24.0
  gradient_checkpointing: false
  memory_threshold_gb: 24.0
  enable_cpu_offload: false
  clear_cache_frequency: 10000  # Clean memory less often for speed
  silent_mode: true
  target_utilization: 0.9
  warning_threshold: 0.93
  critical_threshold: 0.96
  emergency_threshold: 0.98
evaluation:
  eval_during_training: true  # ENABLED: Need for generation testing (but less frequent)
  eval_metrics: perplexity
  comprehensive_eval: false
  moe_metrics:
    track_expert_utilization: false
    track_routing_entropy: false
    track_load_balance: false
    track_expert_specialization: false
    log_frequency: 50000
output:
  output_dir: outputs/small_enhanced
  save_total_limit: 15
  save_on_each_node: false
run_management:
  experiment_name: ava-small-enhanced-v3
  run_id: null
  resume_from_checkpoint: null
device: auto
fp16: true  # NeuML: Enable mixed precision training
bf16: false
lr_finder:
  enabled: true
  start_lr: 1.0e-08
  end_lr: 0.01
  num_iterations: 1000
  suggestion_method: fastai
  use_suggested_lr: true
  use_savgol_filter: true
  savgol_window: 31
  beta: 0.9
  momentum_cycling: false
  track_validation: false
  num_runs: 1
  gradient_accumulation_steps: 1
wandb:
  enabled: true
  project: Ava
  tags:
  - gpu
  - rtx-3090-ti
  - 150M
  - enhanced
  - moe
  - custom-tokenizer
  - enhanced-65k
  - lr-finder-optimized
  entity: null
  name: null
  notes: 'Enhanced config with: Fixed dropout (0.05), LR collapse prevention (lr_end=1e-04), Limited training (30k steps),
    FastAI LR finder, Repetition penalties

