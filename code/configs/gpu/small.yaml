# GPU Small Configuration - Enhanced
# Small-scale GPU training configuration for Ava MoE++
# Target: ~150M parameters, 8GB+ VRAM, RTX 2070/RTX 3050/RX 6600
# Optimized for: Small GPU experiments and development with enhanced features

model:
  # Core Architecture (DeepSeek-V3 style, smaller for stable training)
  hidden_size: 384
  num_layers: 6
  num_attention_heads: 6
  intermediate_size: 1024
  vocab_size: 50257
  max_position_embeddings: 2048

  # MoE Configuration (DeepSeek-V3 style, reduced for memory)
  num_experts: 4
  num_experts_per_token: 1
  expert_capacity_factor: 1.25
  router_type: "deepseek"  # DeepSeek routing
  router_aux_loss_coef: 0.001
  router_jitter_noise: 0.01

  # Attention & Position Encoding (DeepSeek-V3 style)
  use_cache: true
  rope_theta: 10000.0
  attention_dropout: 0.0  # DeepSeek-V3 uses no dropout
  hidden_dropout: 0.0
  use_flash_attention: true

  # Regularization
  layer_norm_eps: 1e-5
  initializer_range: 0.02
  hidden_act: "gelu"

  # Enhanced Features (DeepSeek-V3 style - minimal complexity)
  use_moh: false  # Disabled for DeepSeek alignment
  use_moa: false  # Disabled for DeepSeek alignment
  use_rag: false
  use_cross_attention: false
  use_episodic_memory: false  # Disabled for DeepSeek alignment
  memory_size: 500

  # DeepSpeed compatibility
  deepspeed_activation_checkpointing: true
  deepspeed_partition_activations: false
  deepspeed_moe_param_groups: true

training:
  # Batch Configuration
  batch_size: 6
  gradient_accumulation_steps: 6
  max_gradient_norm: 1.0  # DeepSeek-V3 standard gradient clipping

  # Training Duration
  num_epochs: 12
  max_steps: -1
  warmup_steps: 2000  # DeepSeek-V3 style warmup

  # Learning Rate & Optimizer (DeepSeek-V3 style)
  learning_rate: 4.2e-4  # DeepSeek-V3 actual learning rate
  weight_decay: 0.1  # Higher weight decay like DeepSeek-V3
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  lr_scheduler_type: "cosine"  # DeepSeek-V3 uses cosine
  lr_end: 4.2e-5  # 10% of peak LR for cosine decay

  # Mixed Precision & Performance (DeepSeek-V3 prefers bf16)
  mixed_precision: "bf16"
  dataloader_num_workers: 4
  gradient_checkpointing: false

  # Evaluation & Logging
  eval_strategy: "steps"
  eval_steps: 750
  save_strategy: "steps"
  save_steps: 1500
  logging_steps: 75

  # Early Stopping
  early_stopping_patience: 4
  early_stopping_threshold: 0.01

data:
  # Dataset Configuration (DeepSeek-V3 style - gradual learning)
  data_dir: "/project/code/data/processed"
  max_length: 2048
  max_train_examples: 50000  # Limit to 50k examples per epoch
  max_eval_examples: 1000

  # Preprocessing
  tokenizer_name: "gpt2"
  padding_side: "right"
  truncation: true

  # Data Loading
  train_batch_size: 6
  eval_batch_size: 12
  dataloader_drop_last: true
  dataloader_pin_memory: true

# Enhanced Configuration Sections

# DeepSpeed Configuration (basic ZeRO for small model)
deepspeed:
  enabled: false  # Can enable for multi-GPU
  zero_stage: 1   # ZeRO-1 for optimizer sharding
  cpu_offload: false
  nvme_offload: false
  precision: "fp16"
  gradient_accumulation_steps: 6
  train_batch_size: 36  # 6 * 6
  micro_batch_size: 6
  activation_checkpointing: true

# Enhanced Features Configuration
enhanced_features:
  # Architecture enhancements (DeepSeek-V3 alignment)
  architecture:
    use_moh: false       # Disabled for DeepSeek alignment
    use_moa: false       # Disabled for DeepSeek alignment
    use_cross_attention: false
    use_alibi: false
    expert_routing_type: "deepseek"  # Use DeepSeek routing

  # RAG System (disabled for small)
  rag:
    enabled: false
    knowledge_base_path: null
    max_retrieved_docs: 5
    rag_fusion_type: "concatenate"

  # Advanced Loss Functions (DeepSeek-V3 style)
  losses:
    focal_loss: false     # Keep simple for DeepSeek alignment
    contrastive_loss: false
    diversity_loss: false
    auxiliary_loss: true  # DeepSeek-V3 uses auxiliary loss for MoE
    adaptive_loss_scaling: false

  # Gradient Surgery (DeepSeek alignment - simplified)
  gradient:
    gradient_surgery: false  # Keep training simple like DeepSeek
    adaptive_gradient_surgery: false
    gradient_surgery_method: "pcgrad"

  # Episodic Memory (DeepSeek alignment - disabled)
  memory:
    use_episodic_memory: false  # DeepSeek doesn't use episodic memory
    memory_capacity: 500
    memory_selection_strategy: "importance"
    memory_importance_threshold: 0.7
    memory_adaptation_rate: 0.01
    memory_performance_window: 100
    memory_replay_ratio: 0.01
    memory_replay_strategy: "random"

  # Quantization (disabled for diagnosis)
  quantization:
    quantization_aware: false  # Disabled during diagnosis
    use_nvfp4: false
    bit_width: 8
    nvfp4_block_size: 64
    stochastic_rounding: true
    use_hadamard_transform: false

# Data Loading Configuration
data_loading:
  # Streaming data (good for development)
  streaming: true
  buffer_size: 1000
  max_samples: 100000

  # Multi-column data
  multi_column: false
  use_multi_column: false

  # Distributed (disabled for single GPU)
  distributed: false

# Performance Configuration
performance:
  # Performance modes (balanced for development)
  ultra_fast_mode: false
  fast_progress: true
  minimal_progress: false
  express_mode: true  # Good for development
  no_sync: false

# Memory Optimization
memory:
  # Memory optimizer settings
  enable_memory_pool: true
  pool_size_gb: 6.0
  gradient_checkpointing: true
  memory_threshold_gb: 6.0
  enable_cpu_offload: false
  clear_cache_frequency: 100

# Evaluation Configuration
evaluation:
  eval_during_training: true
  eval_metrics: "perplexity,bleu"
  comprehensive_eval: false

# Output Configuration
output:
  output_dir: "outputs/small"
  save_total_limit: 5
  save_on_each_node: false

# Run Management
run_management:
  experiment_name: "ava-small-enhanced"
  run_id: null
  resume_from_checkpoint: null

# Hardware Configuration
device: "auto"
fp16: false  # DeepSeek-V3 uses bf16 primarily
bf16: true

# Monitoring (Enhanced)
wandb:
  enabled: true
  project: "ava-moe-gpu-small-enhanced"
  tags: ["gpu", "small", "150M", "deepseek-v3", "aligned", "simple"]
  entity: null
  name: null
  notes: "DeepSeek-V3 aligned training with higher LR, bf16, and clean architecture"
  group: "small-models"
  job_type: "train"
  offline: false
  cache_size: 2000
  cache_flush_interval: 50

# Hardware Requirements
# VRAM: 8GB minimum, 10GB recommended
# Compatible GPUs: RTX 2070, RTX 3060, RTX 3050 8GB, RX 6600 XT
# Features: MoH, episodic memory, focal loss, gradient surgery, quantization