  # Evaluation batch processing
  recent_losses_window_size: 50  # REDUCED for less overhead
  max_validation_batches: 50  # REDUCED for faster evaluation
  default_max_validation_batches: 25  # REDUCED
  cache_clear_frequency: 100  # INCREASED for less clearing
  # Validation thresholds
  val_train_ratio_low_threshold: 0.8
  val_train_ratio_high_threshold: 1.05
  invalid_batch_rate_threshold: 0.2
  perplexity_overflow_threshold: 20
  # Logging limits
  max_nan_loss_logs: 5
  max_inf_loss_logs: 5
  max_invalid_batch_logs: 5
  # Test batches
  num_test_batches: 3
  batch_size_variance_threshold: 2
  moe_metrics:
    track_expert_utilization: false
    track_routing_entropy: false
    track_load_balance: false
    track_expert_specialization: false
    log_frequency: 50000
output:
