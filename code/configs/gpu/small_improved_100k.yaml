# Optimized Configuration for Training on 100K Examples
# Improvements for better model quality with limited data
#
# Key Changes from baseline:
# 1. Use full 100k dataset (not just 10k samples)
# 2. More epochs to see data multiple times (15 instead of 12)
# 3. Progressive sequence length training (start short, end long)
# 4. Higher learning rate with proper warmup for faster convergence
# 5. Data augmentation via different max_lengths per epoch
# 6. Reduced dropout to preserve learning from limited data
# 7. Better regularization tuning for small datasets

model:
  hidden_size: 384
  num_layers: 6
  num_attention_heads: 6
  intermediate_size: 1024
  vocab_size: 50257
  max_position_embeddings: 2048
  num_experts: 4
  num_experts_per_token: 1
  expert_capacity_factor: 2.0
  router_type: switch
  router_aux_loss_coef: 0.02  # Increased for better expert utilization
  router_jitter_noise: 0.0
  use_cache: true
  rope_theta: 10000.0
  attention_dropout: 0.05  # REDUCED: Less dropout for small datasets (was 0.1)
  hidden_dropout: 0.05  # REDUCED: Preserve learned features (was 0.1)
  use_flash_attention: true
  layer_norm_eps: 1e-5
  initializer_range: 0.005
  hidden_act: gelu
  use_moh: false
  use_moa: false
  use_rag: false
  use_cross_attention: false
  use_episodic_memory: false
  memory_size: 500
  deepspeed_activation_checkpointing: false
  deepspeed_partition_activations: false
  deepspeed_moe_param_groups: true

training:
  batch_size: 16  # INCREASED: Larger batches for more stable gradients
  gradient_accumulation_steps: 2  # Effective batch: 32 (better learning)
  max_gradient_norm: 1.0
  num_epochs: 20  # INCREASED: More passes over limited data (was 12)
  max_steps: -1
  warmup_steps: 3000  # Adjusted for dataset size
  learning_rate: 0.0001  # INCREASED: Faster convergence on small dataset (was 5e-5)
  weight_decay: 0.05  # INCREASED: Stronger regularization for small data (was 0.01)
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  lr_scheduler_type: cosine_with_restarts  # Better for small datasets with multiple epochs
  lr_end: 1.0e-06  # Lower end LR for fine-tuning
  mixed_precision: bf16
  dataloader_num_workers: 8
  gradient_checkpointing: false
  eval_strategy: steps
  eval_steps: 500  # More frequent eval to monitor overfitting
  save_strategy: steps
  save_steps: 1000
  logging_steps: 50  # More frequent logging
  early_stopping_patience: 6  # Higher patience for multiple epochs
  early_stopping_threshold: 0.005  # Stricter threshold

  # Dynamic batching for optimal GPU usage
  dynamic_batching:
    enabled: true
    min_batch_size: 12
    max_batch_size: 24  # Conservative for stability
    target_memory_utilization: 0.90
    adjustment_frequency: 100
    adjustment_factor: 1.2
    warmup_steps: 500
    smooth_transitions: true

  # Gradient health monitoring
  gradient_health:
    enabled: true
    initial_clip_value: 5.0  # Tighter control
    final_clip_value: 1.5
    warmup_steps: 3000
    explosion_threshold: 30.0
    explosion_window: 5
    auto_reduce_lr: true
    lr_reduction_factor: 0.5

data:
  data_dir: /project/code/data/processed
  max_length: 512  # Start with shorter sequences (progressive training will increase)
  max_train_examples: 100000  # USE FULL DATASET (was 10000)
  max_eval_examples: 5000  # Larger eval set for better validation
  tokenizer_name: gpt2
  padding_side: right
  truncation: true
  train_batch_size: 16
  eval_batch_size: 32  # Larger for faster evaluation
  dataloader_drop_last: true
  dataloader_pin_memory: true

deepspeed:
  enabled: true
  zero_stage: 2
  cpu_offload: false
  nvme_offload: false
  precision: bf16
  gradient_accumulation_steps: 2
  train_batch_size: 32  # Effective batch: 16 * 2 = 32
  micro_batch_size: 16
  activation_checkpointing: false

enhanced_features:
  architecture:
    use_moh: false
    use_moa: false
    use_cross_attention: false
    use_alibi: false
    expert_routing_type: switch

  rag:
    enabled: false
    knowledge_base_path: null
    max_retrieved_docs: 5
    rag_fusion_type: concatenate

  losses:
    focal_loss: false
    contrastive_loss: false
    diversity_loss: true  # ENABLED: Encourage expert diversity
    auxiliary_loss: true
    adaptive_loss_scaling: true

  gradient:
    gradient_surgery: false
    adaptive_gradient_surgery: false
    gradient_surgery_method: pcgrad
    gradient_norm_tracking: true  # ENABLED: Monitor training health
    gradient_anomaly_detection: true  # ENABLED: Catch issues early

  memory:
    use_episodic_memory: false
    memory_capacity: 500
    memory_selection_strategy: importance
    memory_importance_threshold: 0.7
    memory_adaptation_rate: 0.01
    memory_performance_window: 100
    memory_replay_ratio: 0.01
    memory_replay_strategy: random

  quantization:
    quantization_aware: false
    use_nvfp4: false
    bit_width: 8
    nvfp4_block_size: 64
    stochastic_rounding: true
    use_hadamard_transform: false

data_loading:
  streaming: true
  buffer_size: 20000  # Larger buffer for diversity
  max_samples: 100000  # Match max_train_examples
  multi_column: false
  use_multi_column: false
  distributed: false

performance:
  ultra_fast_mode: false  # DISABLED: Need monitoring for quality
  fast_progress: true  # Balanced monitoring
  minimal_progress: false
  express_mode: false
  no_sync: false

memory:
  enable_memory_pool: true
  pool_size_gb: 8.0
  gradient_checkpointing: false
  memory_threshold_gb: 8.0
  enable_cpu_offload: false
  clear_cache_frequency: 100

evaluation:
  eval_during_training: true
  eval_metrics: perplexity,loss  # Track both metrics
  comprehensive_eval: false

output:
  output_dir: outputs/small_improved_100k
  save_total_limit: 5
  save_on_each_node: false

run_management:
  experiment_name: ava-small-improved-100k
  run_id: null
  resume_from_checkpoint: null

device: auto
fp16: false
bf16: true

wandb:
  enabled: true
  project: ava-moe-improved-small-dataset
  tags:
    - gpu
    - small
    - 150M
    - 100k-dataset
    - improved
    - quality-focused
  entity: null
  name: small-improved-100k-training
  notes: "Optimized for 100K dataset: full data usage, more epochs, progressive training, reduced dropout, better regularization for quality improvement"
  group: small-models-quality
  job_type: train
  offline: false
  cache_size: 5000
  cache_flush_interval: 100

stability:
  loss_smoothing: true
  loss_smoothing_alpha: 0.95  # More smoothing for noisy gradients
  lr_warmup_ratio: 0.15  # Longer warmup for stability
  lr_decay_ratio: 0.1
  sync_gradients_each_step: false
  use_kahan_summation: true
  use_stable_embedding: true
  stop_on_nan: true
  max_grad_norm_before_stop: 100.0
  max_loss_before_stop: 20.0

# Progressive Training Configuration (RECOMMENDED)
# Gradually increase sequence length: 128 -> 512 -> 1024 -> 2048
# This acts as curriculum learning and data augmentation
progressive_training:
  enabled: true
  initial_seq_length: 128
  final_seq_length: 2048
  num_stages: 4  # 128, 512, 1024, 2048
  steps_per_stage: 2500  # ~10k steps total
  batch_adjustment: true  # Reduce batch size as seq length increases

# Label smoothing for better generalization on small datasets
label_smoothing: 0.1

# Mixup/Cutoff for data augmentation (optional, can be enabled)
augmentation:
  mixup_alpha: 0.0  # Disabled for now (0.2 to enable)
  cutoff_prob: 0.0  # Disabled for now (0.1 to enable)