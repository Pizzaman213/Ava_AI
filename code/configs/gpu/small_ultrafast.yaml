model:
  hidden_size: 384
  num_layers: 6
  num_attention_heads: 6
  intermediate_size: 1024
  vocab_size: 50257
  max_position_embeddings: 2048
  num_experts: 4
  num_experts_per_token: 1
  expert_capacity_factor: 2.0
  router_type: switch
  router_aux_loss_coef: 0.015
  router_jitter_noise: 0.0  # Disabled during initialization for stability (was 0.01)
  use_cache: true
  rope_theta: 10000.0
  attention_dropout: 0.1
  hidden_dropout: 0.1
  use_flash_attention: true
  layer_norm_eps: 1e-5
  initializer_range: 0.005  # Reduced for more conservative initialization to prevent explosions
  hidden_act: gelu
  use_moh: false
  use_moa: false
  use_rag: false
  use_cross_attention: false
  use_episodic_memory: false
  memory_size: 500
  deepspeed_activation_checkpointing: false  # SPEED: Disabled for 30% gain (uses more memory)
  deepspeed_partition_activations: false
  deepspeed_moe_param_groups: true
training:
  batch_size: 12  # SPEED: Increased from 8 (remove gradient accumulation)
  gradient_accumulation_steps: 1  # SPEED: Disabled for 50% gain (was 2)
  max_gradient_norm: 1.0
  num_epochs: 12
  max_steps: -1
  warmup_steps: 5000  # Extended for better MoE router stabilization
  learning_rate: 0.00005  # Reduced from 1e-4 to 5e-5 for gentler initialization
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  lr_scheduler_type: cosine
  lr_end: 1.0e-05
  mixed_precision: bf16
  dataloader_num_workers: 12  # SPEED: Increased from 8 for better I/O
  gradient_checkpointing: false  # SPEED: Disabled for 30% gain (uses more memory)
  eval_strategy: steps
  eval_steps: 2000  # SPEED: Reduced frequency from 750 (evaluate less often)
  save_strategy: steps
  save_steps: 3000  # SPEED: Reduced frequency from 1500 (save less often)
  logging_steps: 200  # SPEED: Reduced frequency from 75 (log less often)
  early_stopping_patience: 4
  early_stopping_threshold: 0.01
  dynamic_batching:  # NEW: Automatic batch size adjustment based on GPU memory
    enabled: false  # Disabled - causing gradient accumulation issues
    min_batch_size: 8
    max_batch_size: 48  # Increased for 11.6GB GPU utilization
    target_memory_utilization: 0.95  # Target ~11GB of 11.6GB available
    adjustment_frequency: 100
    adjustment_factor: 1.3  # More aggressive than baseline (1.2)
    warmup_steps: 500
    smooth_transitions: true
  gradient_health:
    enabled: true  # Keep enabled for safety
    initial_clip_value: 10.0  # Higher initial clipping to prevent early explosions
    final_clip_value: 2.0  # MoE models need 2-3x higher than dense models
    warmup_steps: 5000  # Match LR warmup for consistent stabilization
    explosion_threshold: 50.0  # Higher threshold to be less sensitive during initialization
    explosion_window: 5
    auto_reduce_lr: true
    lr_reduction_factor: 0.5
data:
  data_dir: /project/code/data/processed
  max_length: 1024
  max_train_examples: 10000
  max_eval_examples: 1000
  tokenizer_name: gpt2
  padding_side: right
  truncation: true
  train_batch_size: 12  # Synced with training.batch_size
  eval_batch_size: 24  # SPEED: Increased from 16 for faster evaluation
  dataloader_drop_last: true
  dataloader_pin_memory: true
deepspeed:
  enabled: true
  zero_stage: 2
  cpu_offload: false
  nvme_offload: false
  precision: bf16
  gradient_accumulation_steps: 1  # Synced with training config
  train_batch_size: 12  # Effective batch: 12 * 1 = 12
  micro_batch_size: 12  # Synced with training.batch_size
  activation_checkpointing: false  # SPEED: Disabled for 30% gain
enhanced_features:
  architecture:
    use_moh: false
    use_moa: false
    use_cross_attention: false
    use_alibi: false
    expert_routing_type: deepseek
  rag:
    enabled: false
    knowledge_base_path: null
    max_retrieved_docs: 5
    rag_fusion_type: concatenate
  losses:
    focal_loss: false
    contrastive_loss: false
    diversity_loss: false
    auxiliary_loss: true
    adaptive_loss_scaling: true
  gradient:
    gradient_surgery: false  # SPEED: Disabled to avoid multi-task overhead
    adaptive_gradient_surgery: false  # SPEED: Disabled
    gradient_surgery_method: pcgrad
    gradient_norm_tracking: false  # SPEED: Disabled for monitoring reduction
    gradient_anomaly_detection: false  # SPEED: Disabled for monitoring reduction
  memory:
    use_episodic_memory: false
    memory_capacity: 500
    memory_selection_strategy: importance
    memory_importance_threshold: 0.7
    memory_adaptation_rate: 0.01
    memory_performance_window: 100
    memory_replay_ratio: 0.01
    memory_replay_strategy: random
  quantization:
    quantization_aware: false
    use_nvfp4: false
    bit_width: 8
    nvfp4_block_size: 64
    stochastic_rounding: true
    use_hadamard_transform: false
data_loading:
  streaming: true
  buffer_size: 15000  # SPEED: Increased from 10000 for better throughput
  max_samples: 100000
  multi_column: false
  use_multi_column: false
  distributed: false
performance:
  ultra_fast_mode: true  # SPEED: Enable ultra-fast mode (minimal monitoring)
  fast_progress: false  # Overridden by ultra_fast_mode
  minimal_progress: false  # Overridden by ultra_fast_mode
  express_mode: false  # Overridden by ultra_fast_mode
  no_sync: false
memory:
  enable_memory_pool: true
  pool_size_gb: 8.0  # SPEED: Increased from 6.0 (more memory available without checkpointing)
  gradient_checkpointing: false  # SPEED: Disabled
  memory_threshold_gb: 8.0
  enable_cpu_offload: false
  clear_cache_frequency: 200  # SPEED: Reduced frequency from 100
evaluation:
  eval_during_training: true
  eval_metrics: perplexity  # SPEED: Only perplexity (removed BLEU for speed)
  comprehensive_eval: false
output:
  output_dir: outputs/small_ultrafast
  save_total_limit: 3  # SPEED: Reduced from 5 to save disk I/O
  save_on_each_node: false
run_management:
  experiment_name: ava-small-ultrafast
  run_id: null
  resume_from_checkpoint: null
device: auto
fp16: false
bf16: true
wandb:
  enabled: true
  project: ava-moe-gpu-small-ultrafast
  tags:
  - gpu
  - small
  - 150M
  - ultrafast
  - optimized
  - production
  entity: null
  name: null
  notes: "Ultra-fast training config: 2-3x speedup via disabled checkpointing, no gradient accumulation, reduced monitoring. Requires ~30% more GPU memory."
  group: small-models-ultrafast
  job_type: train
  offline: false
  cache_size: 5000  # SPEED: Increased cache from 2000
  cache_flush_interval: 200  # SPEED: Reduced frequency from 50
stability:
  loss_smoothing: true
  loss_smoothing_alpha: 0.9
  lr_warmup_ratio: 0.1
  lr_decay_ratio: 0.1
  sync_gradients_each_step: false
  use_kahan_summation: true
  use_stable_embedding: true
  stop_on_nan: true
  max_grad_norm_before_stop: 100.0
  max_loss_before_stop: 20.0