# GPU Small-Medium Configuration
# Small-to-medium GPU training configuration for Ava MoE++
# Target: ~200M parameters, 10GB+ VRAM, RTX 3060/RTX 2080/RX 6700 XT
# Optimized for: Light training and prototyping

model:
  # Core Architecture
  hidden_size: 640
  num_layers: 14
  num_attention_heads: 10
  intermediate_size: 2560
  vocab_size: 50257
  max_position_embeddings: 1536

  # MoE Configuration
  num_experts: 12
  num_experts_per_token: 2
  expert_capacity_factor: 1.0
  router_type: "switch"
  router_aux_loss_coef: 0.01
  router_jitter_noise: 0.01

  # Attention & Position Encoding
  use_cache: true
  rope_theta: 10000.0
  attention_dropout: 0.1
  hidden_dropout: 0.1

  # Regularization
  layer_norm_eps: 1e-5
  initializer_range: 0.02
  hidden_act: "gelu"

  # Enhanced Features (selective for small-medium model)
  use_moh: false
  use_moa: false
  use_rag: false
  use_cross_attention: false
  use_episodic_memory: false

training:
  # Batch Configuration
  batch_size: 5
  gradient_accumulation_steps: 7
  max_gradient_norm: 1.0

  # Training Duration
  num_epochs: 10
  max_steps: -1
  warmup_steps: 1000

  # Learning Rate & Optimizer
  learning_rate: 2.2e-4
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  lr_scheduler_type: "cosine"

  # Mixed Precision & Performance
  mixed_precision: "fp16"
  dataloader_num_workers: 4
  gradient_checkpointing: false

  # Evaluation & Logging
  eval_strategy: "steps"
  eval_steps: 600
  save_strategy: "steps"
  save_steps: 1200
  logging_steps: 60

  # Early Stopping
  early_stopping_patience: 4
  early_stopping_threshold: 0.01

data:
  # Dataset Configuration
  data_dir: "data/train"
  max_length: 1536
  max_train_examples: -1
  max_eval_examples: 1000

  # Preprocessing
  tokenizer_name: "gpt2"
  padding_side: "right"
  truncation: true

  # Data Loading
  train_batch_size: 5
  eval_batch_size: 10
  dataloader_drop_last: true
  dataloader_pin_memory: true

# Hardware Configuration
device: "auto"
fp16: true
bf16: false

# Monitoring
wandb:
  enabled: true
  project: "ava-moe-gpu-small-medium"
  tags: ["gpu", "small-medium", "200M", "prototyping"]

# Hardware Requirements
# VRAM: 10GB minimum, 12GB recommended
# Compatible GPUs: RTX 3060 12GB, RTX 2080 Ti, RX 6700 XT