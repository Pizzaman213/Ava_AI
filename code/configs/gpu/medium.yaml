model:
  hidden_size: 704
  num_layers: 16
  num_attention_heads: 11
  intermediate_size: 2816
  vocab_size: 50257
  max_position_embeddings: 1536
  num_experts: 14
  num_experts_per_token: 2
  expert_capacity_factor: 1.0
  router_type: switch
  router_aux_loss_coef: 0.01
  router_jitter_noise: 0.0
  use_cache: true
  rope_theta: 10000.0
  attention_dropout: 0.1
  hidden_dropout: 0.1
  layer_norm_eps: 1e-5
  initializer_range: 0.01
  hidden_act: gelu
  use_moh: true
  use_moa: false
  use_rag: false
  use_cross_attention: true
  use_episodic_memory: true
  memory_size: 800
  deepspeed_activation_checkpointing: true
  deepspeed_partition_activations: false
  deepspeed_moe_param_groups: true
training:
  batch_size: 4
  gradient_accumulation_steps: 8
  max_gradient_norm: 5.0  # DeepSeek MoE requires higher gradient clipping
  num_epochs: 10
  max_steps: -1
  warmup_steps: 5000
  learning_rate: 5.0e-05
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  lr_scheduler_type: cosine
  mixed_precision: fp16
  dataloader_num_workers: 4
  gradient_checkpointing: true
  eval_strategy: steps
  eval_steps: 500
  save_strategy: steps
  save_steps: 1000
  logging_steps: 50
  early_stopping_patience: 3
  early_stopping_threshold: 0.01
  gradient_health:
    enabled: true
    initial_clip_value: 2.0
    final_clip_value: 0.5
    warmup_steps: 5000
    explosion_threshold: 5.0
    explosion_window: 5
    auto_reduce_lr: true
    lr_reduction_factor: 0.5
data:
  data_dir: /project/code/data/processed
  max_length: 1536
  max_train_examples: -1
  max_eval_examples: 1000
  tokenizer_name: gpt2
  padding_side: right
  truncation: true
  train_batch_size: 4
  eval_batch_size: 8
  dataloader_drop_last: true
  dataloader_pin_memory: true
device: auto
fp16: true
bf16: false
wandb:
  enabled: true
  project: ava-moe-gpu-medium
  tags:
  - gpu
  - medium
  - 300M
  - research
stability:
  loss_smoothing: true
  loss_smoothing_alpha: 0.9
  lr_warmup_ratio: 0.1
  lr_decay_ratio: 0.1
  sync_gradients_each_step: false
  use_kahan_summation: true
  use_stable_embedding: true
  stop_on_nan: true
  max_grad_norm_before_stop: 100.0
  max_loss_before_stop: 20.0
