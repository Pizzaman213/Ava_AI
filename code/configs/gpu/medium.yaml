# GPU Medium Configuration
# Medium-scale GPU training configuration for Ava MoE++
# Target: ~300M parameters, 12GB+ VRAM, RTX 3060 Ti/RTX 2080 Ti/RX 6800 XT
# Optimized for: Moderate training and research

model:
  # Core Architecture
  hidden_size: 704
  num_layers: 16
  num_attention_heads: 11
  intermediate_size: 2816
  vocab_size: 50257
  max_position_embeddings: 1536

  # MoE Configuration
  num_experts: 14
  num_experts_per_token: 2
  expert_capacity_factor: 1.0
  router_type: "switch"
  router_aux_loss_coef: 0.01
  router_jitter_noise: 0.01

  # Attention & Position Encoding
  use_cache: true
  rope_theta: 10000.0
  attention_dropout: 0.1
  hidden_dropout: 0.1

  # Regularization
  layer_norm_eps: 1e-5
  initializer_range: 0.02
  hidden_act: "gelu"

  # Enhanced Features (moderate for medium model)
  use_moh: true    # Enable MoH
  use_moa: false   # Keep disabled for memory
  use_rag: false
  use_cross_attention: true  # Enable cross-attention
  use_episodic_memory: true
  memory_size: 800

  # DeepSpeed compatibility
  deepspeed_activation_checkpointing: true
  deepspeed_partition_activations: false
  deepspeed_moe_param_groups: true

training:
  # Batch Configuration
  batch_size: 4
  gradient_accumulation_steps: 8
  max_gradient_norm: 1.0

  # Training Duration
  num_epochs: 10
  max_steps: -1
  warmup_steps: 1200

  # Learning Rate & Optimizer
  learning_rate: 2e-4
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  lr_scheduler_type: "cosine"

  # Mixed Precision & Performance
  mixed_precision: "fp16"
  dataloader_num_workers: 4
  gradient_checkpointing: false

  # Evaluation & Logging
  eval_strategy: "steps"
  eval_steps: 500
  save_strategy: "steps"
  save_steps: 1000
  logging_steps: 50

  # Early Stopping
  early_stopping_patience: 3
  early_stopping_threshold: 0.01

data:
  # Dataset Configuration
  data_dir: "/project/code/data/processed"
  max_length: 1536
  max_train_examples: -1
  max_eval_examples: 1000

  # Preprocessing
  tokenizer_name: "gpt2"
  padding_side: "right"
  truncation: true

  # Data Loading
  train_batch_size: 4
  eval_batch_size: 8
  dataloader_drop_last: true
  dataloader_pin_memory: true

# Hardware Configuration
device: "auto"
fp16: true
bf16: false

# Monitoring
wandb:
  enabled: true
  project: "ava-moe-gpu-medium"
  tags: ["gpu", "medium", "300M", "research"]

# Hardware Requirements
# VRAM: 12GB minimum, 14GB recommended
# Compatible GPUs: RTX 3060 Ti, RTX 2080 Ti, RTX 3070, RX 6800 XT