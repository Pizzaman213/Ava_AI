# ============================================================
# MEDIUM CONFIGURATION - GPU OPTIMIZED
# ============================================================
#
# Category: GPU (NVIDIA CUDA)
# Model Size: ~350M parameters
# Device: NVIDIA GPUs with CUDA support
# Optimization Level: HIGH
# Use Case: High-performance training and inference
#
# DESCRIPTION:
# GPU-optimized configuration leveraging CUDA capabilities.
# Includes Flash Attention, mixed precision, fused kernels,
# and parallel expert processing for maximum performance.
#
# HARDWARE REQUIREMENTS:
# - GPU: 8GB+ VRAM recommended
# - CUDA: 11.7 or higher
# - PyTorch: 2.0+ with CUDA support
#
# USAGE:
#   python3 train.py --config configs/gpu/medium.yaml
#   torchrun --nproc_per_node=4 train.py --config configs/gpu/medium.yaml
#
# ============================================================

# ============================================================
# MODEL ARCHITECTURE
# ============================================================

model:
  # ---------- Core Architecture ----------
  size: medium                     # Model size preset
  vocab_size: 50257               # GPT-2 tokenizer vocabulary
  hidden_size: 1024                # Hidden dimension
  num_layers: 24                   # Number of transformer layers
  intermediate_size: 4096          # FFN intermediate dimension
  
  # ---------- Attention Configuration ----------
  num_attention_heads: 16          # Number of attention heads
  num_key_value_heads: 8          # For GQA - reduces memory
  attention_type: gqa              # Options: mha, mqa, gqa
  use_flash_attn: true            # Flash Attention 2.0 for CUDA
  attention_dropout: 0.1           # Dropout in attention layers
  
  # ---------- Position Encoding ----------
  max_position_embeddings: 4096    # Maximum sequence length
  rope_theta: 10000.0              # RoPE base frequency
  
  # ---------- Mixture of Experts (MoE) ----------
  num_experts: 16                  # Number of expert networks
  num_experts_per_tok: 2          # Experts per token
  expert_capacity_factor: 1.25    # Capacity factor for load balancing
  expert_routing_type: switch     # Options: switch, gshard, base
  expert_dropout: 0.1              # Dropout for expert layers
  
  # ---------- Activation & Initialization ----------
  hidden_act: swiglu               # Activation function
  initializer_range: 0.02          # Weight initialization range
  rms_norm_eps: 1.0e-06           # RMSNorm epsilon for stability
  
  # ---------- Regularization ----------
  hidden_dropout: 0.1              # General dropout rate
  label_smoothing: 0.0             # Label smoothing for loss regularization
  
  # ---------- Caching & Optimization ----------
  use_cache: true                  # Enable KV caching for inference
  gradient_checkpointing: false    # Trade compute for memory (disabled for speed)
  use_memory_efficient_attention: false  # Use standard attention for speed
  
  # ---------- Advanced Features ----------
  # Mixture of Depths (MoD)
  use_mod: true                    # Enable MoD for dynamic computation
  mod_mode: adaptive               # Options: learned, fixed, adaptive
  mod_skip_fraction: 0.2           # Fraction of layers to skip
  
  # Speculative Decoding
  use_speculative_decoding: true   # Enable for faster inference
  speculative_draft_layers: 4      # Number of draft layers
  
  # Expert System Features
  use_hierarchical_moe: true       # Hierarchical expert routing
  use_continuous_experts: true     # Continuous expert selection
  use_sparse_experts: true         # Sparse expert activation
  use_expert_cache: true           # Cache expert selections
  
  # Advanced Architecture Components
  use_mod_plus_plus: true          # Enhanced MoD with confidence
  use_memory_augmented: true       # External memory mechanisms
  use_adaptive_inference: true     # Dynamic computation graphs
  use_interpretability: true       # Built-in interpretability
  
  # Multi-Modal & Specialized Features
  use_mixture_tokenizers: false    # Multiple tokenizer support
  use_nas_experts: false           # Neural architecture search
  use_meta_learning: false         # Meta-learning capabilities
  use_federated_learning: false    # Federated learning support
  use_continual_learning: false    # Continual learning
  use_advanced_pretraining: false  # Advanced pretraining objectives
  use_rlaif: false                # RL from AI feedback
  
  # Specialized Expert Types
  use_code_experts: true           # Code-specialized experts
  use_scientific_experts: true     # Science/math experts
  use_tool_experts: false          # Tool-use experts
  use_vision_language: false       # Vision-language capabilities
  use_audio_language: false        # Audio-language capabilities
  
  # Training & Inference Features
  use_adversarial_training: false  # Adversarial robustness
  use_bias_mitigation: false       # Bias reduction mechanisms
  use_privacy_preserving: false    # Privacy-preserving training
  use_watermarking: false          # Model watermarking
  
  # System Integration
  use_distributed_experts: true    # Distributed expert computation
  use_mixed_precision: true        # Enable mixed precision training
  use_torch_compile: true          # PyTorch 2.0 compilation
  use_fused_kernels: true          # Fused CUDA kernels
  
  # Research & Development Features (mostly disabled for medium)
  use_diverse_beam_search: false   # Diverse beam search
  use_mixture_decoders: false      # Multiple decoder heads
  use_streaming_generation: false  # Streaming text generation
  use_batch_optimized: false       # Batch-optimized inference
  use_synthetic_data: false        # Synthetic data generation
  use_online_learning: false       # Online learning capability
  use_multi_task_learning: false   # Multi-task learning
  use_automated_curation: false    # Automated data curation
  use_cross_lingual: false         # Cross-lingual transfer
  use_edge_deployment: false       # Edge deployment optimization
  use_ab_testing: false            # A/B testing framework
  use_model_versioning: false      # Model versioning system
  use_cost_optimization: false     # Cost-aware optimization
  use_global_load_balancing: false # Global load balancing
  
  # Experimental Features
  use_quantum_inspired: false      # Quantum-inspired algorithms
  use_neuromorphic: false          # Neuromorphic computing
  use_self_modifying: false        # Self-modifying networks
  use_causal_reasoning: false      # Causal reasoning
  use_visual_builder: false        # Visual model builder
  use_automated_docs: false        # Automated documentation
  use_interactive_debug: false     # Interactive debugging
  use_playground: false            # Model playground
  use_benchmarking: true           # Automated benchmarking

# ============================================================
# DATA CONFIGURATION
# ============================================================

data:
  # ---------- Dataset Settings ----------
  dataset_type: hf                 # Dataset type (hf = HuggingFace format)
  train_paths:                     # Training data paths
    - ./data/pretraining/processed/train
  val_path: ./data/pretraining/processed/validation
  
  # ---------- Tokenization ----------
  tokenizer: gpt2                  # Tokenizer to use
  max_length: 4096                 # Maximum sequence length
  stride: 2048                     # Stride for overlapping sequences
  
  # ---------- Data Loading ----------
  max_train_examples: null         # No limit on training data
  max_val_examples: 10000          # Validation set size
  
  # ---------- Dataset Arguments ----------
  dataset_args:
    text_column: text              # Column name for text data
    streaming: false               # Load in memory for speed
    num_proc: 8                    # Parallel processing
    keep_in_memory: true           # Keep dataset in memory
    load_from_cache_file: true    # Use cache if available
  
  # ---------- Data Augmentation ----------
  noise_probability: 0.0           # No noise for better quality
  mask_probability: 0.0            # No masking

# ============================================================
# TRAINING CONFIGURATION
# ============================================================

training:
  # ---------- Basic Training ----------
  batch_size: 32                   # Batch size per device
  gradient_accumulation_steps: 2   # Gradient accumulation (effective batch = 64)
  num_epochs: 5                    # Number of training epochs
  max_steps: -1                    # Max steps (-1 = use epochs)
  
  # ---------- Learning Rate ----------
  learning_rate: 3e-4              # Base learning rate
  warmup_steps: 1000               # Warmup steps
  warmup_ratio: 0.05               # Warmup ratio
  
  # ---------- Optimizer Configuration ----------
  optimizer: adamw                 # Optimizer: adamw, lion, sgd
  weight_decay: 0.01               # L2 regularization
  adam_beta1: 0.9                  # Adam beta1
  adam_beta2: 0.999                # Adam beta2
  adam_epsilon: 1e-8               # Adam epsilon
  
  # ---------- Advanced Optimizer Features ----------
  layerwise_lr: true               # Different LR for different layers
  lr_layer_scale: 0.75             # Scale for layer-wise LR
  gradient_centralization: true    # Center gradients
  
  # ---------- Learning Rate Scheduling ----------
  lr_scheduler_type: cosine_with_restarts  # Scheduler type
  scheduler: cosine                # Alternative scheduler setting
  lr_decay_factor: 0.9             # Decay LR by 10% each restart
  num_restarts: 2                  # Number of cosine restarts
  
  # ---------- Gradient Management ----------
  max_grad_norm: 1.0               # Gradient clipping threshold
  gradient_clip: 1.0               # Alternative gradient clipping
  adaptive_gradient_clipping: true # Dynamic gradient clipping
  gradient_penalty_weight: 0.0     # No gradient penalty
  
  # ---------- Mixed Precision ----------
  mixed_precision: bf16            # Mixed precision type (bf16 for A100)
  gradient_checkpointing: false    # Disabled for speed
  zero_stage: 1                    # ZeRO optimization stage
  
  # ---------- Loss Functions ----------
  # Focal Loss
  use_focal_loss: false            # Standard cross-entropy
  focal_gamma: 2.0                 # Focal loss gamma
  focal_alpha: 0.25                # Focal loss alpha
  focal_blend: 0.0                 # No blending
  
  # ---------- Anti-Collapse Features ----------
  entropy_regularization_weight: 0.001     # Encourage output diversity
  token_frequency_penalty_weight: 0.0      # No repetition penalty
  expert_diversity_weight: 0.01            # Encourage expert specialization
  
  # ---------- Curriculum Learning ----------
  curriculum_learning: true        # Enable curriculum learning
  initial_sequence_length: 1024    # Start with shorter sequences
  curriculum_warmup_steps: 5000    # Steps to reach full length
  use_curriculum: true             # Alternative curriculum setting
  curriculum_type: adaptive        # Curriculum type
  initial_difficulty: 0.5          # Initial difficulty
  max_difficulty: 1.0              # Maximum difficulty
  sequence_length_curriculum: true # Enable sequence length curriculum
  initial_seq_length: 1024         # Initial sequence length
  
  # Progressive Sequence Growth
  progressive_sequence_growth: true # Continue growing beyond initial
  sequence_growth_rate: 2.0        # Growth multiplier
  sequence_growth_interval: 10000  # Steps between growth
  
  # ---------- Anti-Overfitting Features ----------
  stochastic_depth_prob: 0.0       # No layer dropping for speed
  mixout_prob: 0.0                 # No mixout
  use_ema: true                    # Exponential moving average
  ema_decay: 0.9999                # EMA decay rate
  confidence_weighting: false      # No confidence weighting
  sam_enabled: true                # Sharpness-aware minimization
  
  # ---------- Progressive Training ----------
  use_progressive: false           # No progressive training
  growth_strategy: layer_stacking  # Growth strategy
  initial_layers: 12               # Initial layers
  growth_interval: 10000           # Growth interval
  
  # ---------- Safety Training ----------
  use_constitutional: false        # Constitutional AI
  safety_principles:              # Safety principles
  - Be helpful, harmless, and honest
  - Avoid harmful content
  num_revisions: 2                # Number of revisions
  safety_weight: 0.1              # Safety weight
  
  # ---------- Active Learning ----------
  use_active_learning: false      # Active learning
  active_learning_strategy: uncertainty  # Strategy
  selection_batch_size: 64        # Selection batch size
  
  # ---------- Smart Checkpointing ----------
  use_smart_checkpointing: false  # Disabled for speed
  memory_threshold: 0.9           # Memory threshold
  min_recompute_ratio: 2.0        # Min recompute ratio
  always_checkpoint_layers:       # Always checkpoint these
  - attention
  
  # ---------- Evaluation & Checkpointing ----------
  eval_steps: 500                 # Evaluation frequency
  save_steps: 1000                # Checkpoint frequency
  save_total_limit: 5             # Max checkpoints to keep
  logging_steps: 10               # Logging frequency
  
  # ---------- DataLoader Settings ----------
  parallel_loading: true          # Parallel data loading
  num_workers: 8                  # DataLoader workers
  drop_last: true                 # Drop incomplete batches
  prefetch_factor: 4              # Prefetch factor
  persistent_workers: true        # Persistent workers
  pin_memory: true                # Pin memory for CUDA
  
  # ---------- Device Settings ----------
  device: cuda                    # Device: cuda, mps, cpu

# ============================================================
# DISTRIBUTED TRAINING
# ============================================================

distributed: true                # Enable distributed training
num_gpus: -1                    # Use all available GPUs
device_map: auto                # Automatic device mapping
backend: nccl                   # Communication backend
find_unused_parameters: false   # DDP setting
broadcast_buffers: true         # Broadcast buffers
gradient_as_bucket_view: true   # Memory optimization

# ============================================================
# OUTPUT & EXPERIMENT
# ============================================================

output_dir: ./outputs            # Output directory
experiment_name: moe_gpu_medium # Experiment name
logging_level: INFO              # Logging level
report_to:                      # Reporting backends
- tensorboard
- wandb
seed: 42                        # Random seed

# ============================================================
# FINE-TUNING CONFIGURATION
# ============================================================

fine_tuning:
  # ---------- LoRA Configuration ----------
  use_lora: true                 # Enable LoRA
  use_qlora: true                # Enable QLoRA for memory efficiency
  freeze_base_model: true       # Freeze base model
  lora_r: 32                    # LoRA rank
  lora_alpha: 64                # LoRA alpha
  lora_dropout: 0.05            # LoRA dropout
  
  # ---------- Early Stopping ----------
  early_stopping: true          # Enable early stopping
  early_stopping_patience: 10   # Patience
  early_stopping_threshold: 0.0001  # Threshold
  min_delta: 0.0001            # Minimum change
  
  # ---------- LoRA Target Modules ----------
  lora_target_modules:          # Target modules
  - q_proj
  - v_proj
  - k_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  
  # ---------- Multi-LoRA ----------
  num_lora_experts: 8           # Number of LoRA experts
  task_embedding_dim: 64        # Task embedding dimension
  share_base_weights: true      # Share base weights
  
  # ---------- Fine-tuning Training ----------
  batch_size: 16                # Batch size
  gradient_accumulation_steps: 2  # Gradient accumulation
  learning_rate: 1e-4           # Learning rate
  num_epochs: 5                 # Number of epochs
  warmup_ratio: 0.05            # Warmup ratio

# ============================================================
# INFERENCE CONFIGURATION
# ============================================================

inference:
  use_speculation: true          # Speculative decoding
  num_draft_experts: 4          # Draft experts
  draft_expert_size_ratio: 0.25  # Draft expert size
  draft_sequence_length: 5      # Draft sequence length
  use_prefetching: true         # Prefetching
  prune_before_deployment: false # No pruning
  target_sparsity: 0.0          # No sparsity
  prune_experts: false          # Don't prune experts
  prune_attention: false        # Don't prune attention
  expert_merge_threshold: 0.95  # Expert merge threshold
  use_flash_attn: true          # Flash attention
  torch_compile: true           # PyTorch compilation
  dtype: bfloat16               # Inference dtype

# ============================================================
# MEMORY OPTIMIZATION
# ============================================================

memory_optimization:
  gradient_checkpointing: false # Disabled for speed
  cpu_offload: false           # No CPU offload
  optimizer_offload: false     # No optimizer offload
  parameter_offload: false     # No parameter offload
  activation_checkpointing: false # No activation checkpointing
  memory_efficient_attention: false # Standard attention

# ============================================================
# GPU OPTIMIZATION (CUDA Specific)
# ============================================================

gpu_optimization:
  use_cuda_graphs: true         # CUDA graphs for optimization
  use_cudnn_benchmark: true     # CuDNN auto-tuning
  use_tensor_cores: true        # Tensor core operations
  matmul_precision: high        # Matrix multiplication precision
  allow_tf32: true              # TF32 for Ampere GPUs
  use_channels_last: false      # Memory format
  compile_mode: max-autotune    # Compilation mode

# ============================================================
# MONITORING CONFIGURATION
# ============================================================

monitoring:
  use_health_monitoring: true   # Health monitoring
  check_interval: 100           # Check interval
  enable_alerts: true           # Enable alerts
  enable_visualization: true    # Enable visualizations
  use_wandb: true               # Use W&B
  wandb_project: llm-moe-gpu    # W&B project
  wandb_name: null              # W&B run name
  wandb_tags:                   # W&B tags
  - moe
  - gpu
  - medium
  - cuda
  log_model: true               # Log model to W&B
  log_gradients: true           # Log gradients
  gradient_log_freq: 100        # Gradient logging frequency