# A100-Optimized Configuration for Enhanced LLM Training
# This configuration maximizes NVIDIA A100 GPU performance with all optimizations enabled

# Model Configuration
model:
  # Core architecture (optimized dimensions for Tensor Cores)
  vocab_size: 50257
  hidden_size: 1536  # Multiple of 128 for optimal Tensor Core usage
  num_hidden_layers: 48
  num_attention_heads: 24  # Multiple of 8 for Tensor Core efficiency
  intermediate_size: 6144  # 4x hidden_size, multiple of 128
  max_position_embeddings: 4096

  # Enhanced features
  num_experts: 16  # Increased for A100's compute capacity
  top_k: 2
  expert_capacity_factor: 1.25
  load_balancing_loss_weight: 0.01

  # A100-optimized settings
  use_mixture_of_heads: true
  use_mixture_of_activations: true
  use_advanced_routing: true
  routing_type: "switch"  # Switch Transformer routing for efficiency

  # Attention optimizations
  use_flash_attention: true
  attention_type: "standard"  # or "block_sparse" for very long sequences
  causal_attention: true
  attention_window_size: 2048  # For sliding window attention
  sequence_parallel: true  # Enable for sequences > 4096

  # Memory optimizations
  gradient_checkpointing: true
  checkpoint_policy: "selective"  # Balance memory vs compute
  memory_efficient_attention: true

  # Structured sparsity (2:4 pattern for A100 hardware acceleration)
  use_structured_sparsity: true
  sparsity_level: 0.5
  sparsity_target_layers: ["experts", "feedforward"]

# Training Configuration
training:
  # Batch settings optimized for A100 memory
  batch_size: 16  # Per GPU, adjust based on sequence length
  micro_batch_size: 4  # For gradient accumulation
  gradient_accumulation_steps: 4
  max_seq_length: 2048

  # Learning rate schedule
  learning_rate: 1.0e-4
  min_learning_rate: 1.0e-6
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  epsilon: 1.0e-8

  # Training steps
  max_steps: 500000
  warmup_steps: 10000
  eval_steps: 5000
  save_steps: 10000

  # Optimization settings
  max_grad_norm: 1.0
  label_smoothing: 0.1

  # Mixed precision settings for A100
  mixed_precision: "bf16"  # BF16 is optimal for A100
  enable_tf32: true  # 10x speedup on matrix operations
  use_cuda_graphs: true  # Reduce kernel launch overhead

  # torch.compile settings
  enable_torch_compile: true
  compile_mode: "max-autotune"  # Maximum optimization for A100
  dynamic_shapes: false  # Static shapes for CUDA graphs

  # Loss function configuration
  use_composite_loss: true
  loss_components:
    cross_entropy:
      weight: 1.0
    focal_loss:
      weight: 0.1
      alpha: 1.0
      gamma: 2.0
    contrastive_loss:
      weight: 0.05
      temperature: 0.07
    diversity_loss:
      weight: 0.01

# A100 Hardware Optimizations
a100_optimizations:
  # Tensor Core optimizations
  enable_tensor_cores: true
  optimize_matrix_dimensions: true
  use_tensor_core_layout: true

  # Memory optimizations
  memory_pool_size_gb: 70  # For A100 80GB, use 35 for A100 40GB
  enable_memory_pool: true
  memory_threshold_gb: 60  # Adaptive checkpointing threshold
  enable_cpu_offload: false  # Usually not needed on A100

  # Communication optimizations (multi-GPU)
  enable_nvlink_optimization: true
  enable_gpu_direct: true
  hierarchical_allreduce: true
  fusion_buffer_size_mb: 128  # Larger for A100's bandwidth

  # MIG settings (if using Multi-Instance GPU)
  mig_enabled: false
  mig_instances: 1
  mig_profile: "MIG 7g.40gb"  # Full A100 instance

  # Profiling settings
  profile_mode: false
  profile_memory: false
  profile_communication: false
  profile_every: 100

# Data Configuration
data:
  # Dataset settings
  dataset_name: "wikitext"
  dataset_config: "wikitext-103-raw-v1"
  streaming: true  # Efficient for large datasets

  # Preprocessing
  tokenizer_name: "gpt2"
  max_length: 2048
  truncation: true
  padding: "max_length"

  # Data loading optimized for A100
  num_workers: 16  # Increased for A100's processing power
  prefetch_factor: 4  # Higher prefetch for fast GPU
  pin_memory: true
  persistent_workers: true

  # Data streaming settings
  buffer_size: 10000
  shuffle_buffer_size: 50000

# Multi-GPU Configuration
distributed:
  # Basic distributed settings
  backend: "nccl"
  init_method: "env://"

  # A100-specific NCCL optimizations
  nccl_settings:
    NCCL_TREE_THRESHOLD: "0"
    NCCL_LL_THRESHOLD: "0"
    NCCL_MIN_NCHANNELS: "16"
    NCCL_MAX_NCHANNELS: "16"
    NCCL_P2P_LEVEL: "NVL"  # Use NVLink
    NCCL_CUMEM_ENABLE: "1"

  # Gradient synchronization
  bucket_cap_mb: 128  # Larger buckets for NVLink bandwidth
  gradient_compression: "none"  # A100 has sufficient bandwidth
  find_unused_parameters: false
  static_graph: true

# Evaluation Configuration
evaluation:
  # Evaluation settings
  eval_during_training: true
  eval_steps: 5000
  eval_batch_size: 32

  # Metrics to compute
  metrics:
    - "perplexity"
    - "bleu"
    - "rouge"
    - "toxicity"
    - "bias"
    - "coherence"

  # Evaluation datasets
  eval_datasets:
    - "wikitext"
    - "lambada"
    - "hellaswag"

# Checkpointing and Logging
checkpointing:
  # Checkpoint settings
  save_dir: "checkpoints/a100_optimized"
  save_every: 10000
  keep_best_k: 3
  keep_last_k: 5

  # Checkpoint optimization
  use_sharded_checkpoints: true
  compression: "gzip"

logging:
  # Logging configuration
  log_level: "INFO"
  log_dir: "logs/a100_optimized"
  log_every: 100

  # Tensorboard logging
  use_tensorboard: true
  tensorboard_dir: "tensorboard/a100_optimized"

  # Weights & Biases logging
  use_wandb: false
  wandb_project: "a100_llm_training"
  wandb_entity: null

# Advanced Features
advanced_features:
  # RAG settings
  use_rag: false
  knowledge_base_path: null
  retrieval_model: "sentence-transformers/all-MiniLM-L6-v2"
  max_retrieved_docs: 5

  # Continual learning
  use_episodic_memory: false
  memory_capacity: 10000
  memory_selection_strategy: "importance"
  replay_ratio: 0.2

  # Quantization (post-training)
  quantization_aware_training: false
  quantization_bit_width: 8
  quantization_symmetric: true
  quantization_per_channel: true

# Inference Optimization (for deployment)
inference:
  # A100 inference optimizations
  max_batch_size: 64
  max_sequence_length: 2048
  use_kv_cache: true
  use_speculative_decoding: false

  # Serving configuration
  serving_backend: "vllm"  # Optimized for A100
  tensor_parallel_size: 1
  pipeline_parallel_size: 1

  # Dynamic batching
  use_dynamic_batching: true
  batch_timeout_ms: 10
  max_waiting_tokens: 128