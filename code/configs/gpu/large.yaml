# ============================================================
# LARGE CONFIGURATION - HIGH-PERFORMANCE GPU TRAINING
# ============================================================
#
# Category: GPU (CUDA)
# Model Size: ~1B parameters
# Device: NVIDIA GPU with CUDA 11.7+
# Optimization Level: MAXIMUM
# Use Case: Production-scale training with maximum features
#
# DESCRIPTION:
# High-performance GPU configuration with comprehensive features.
# Designed for large-scale training on powerful hardware with
# all advanced optimizations enabled. Suitable for production
# deployments and research requiring maximum model capabilities.
#
# HARDWARE REQUIREMENTS:
# - GPU: 24GB+ VRAM (RTX 4090 or A100)
# - CUDA: 11.7 or higher
# - PyTorch: 2.0+ with CUDA support
# - System RAM: 64GB+ recommended
# - Multi-GPU support recommended
#
# USAGE:
#   python3 train_with_data.py --config configs/gpu/large.yaml
#   python3 interact.py --model outputs/large.pt
#   torchrun --nproc_per_node=4 train.py --config configs/gpu/large.yaml
#
# ============================================================

# ============================================================
# MODEL ARCHITECTURE
# ============================================================

model:
  # ---------- Core Architecture ----------
  size: large                     # Model size preset
  vocab_size: 50257               # GPT-2 tokenizer vocabulary
  hidden_size: 1536               # Hidden dimension (1B parameter scale)
  num_layers: 32                  # Number of transformer layers
  intermediate_size: 6144         # FFN intermediate dimension
  
  # ---------- Attention Configuration ----------
  num_attention_heads: 24         # Number of attention heads
  num_key_value_heads: 8          # For GQA - reduces memory
  attention_type: gqa             # Options: mha, mqa, gqa
  use_flash_attn: true            # Flash Attention (CUDA optimized)
  attention_dropout: 0.2          # Dropout in attention layers
  
  # ---------- Position Encoding ----------
  max_position_embeddings: 8192   # Maximum sequence length (large context)
  rope_theta: 10000.0             # RoPE base frequency
  
  # ---------- Mixture of Experts (MoE) ----------
  num_experts: 32                 # Number of experts (large scale)
  num_experts_per_tok: 2          # Experts per token
  expert_capacity_factor: 1.25    # Capacity factor for load balancing
  expert_routing_type: switch     # Options: switch, gshard, base
  expert_dropout: 0.25            # Dropout for expert layers
  
  # ---------- Activation & Initialization ----------
  hidden_act: swiglu              # Activation function
  initializer_range: 0.02         # Weight initialization range
  rms_norm_eps: 1.0e-06          # RMSNorm epsilon for stability
  
  # ---------- Regularization ----------
  hidden_dropout: 0.3             # General dropout rate
  label_smoothing: 0.1            # Label smoothing for loss regularization
  
  # ---------- Caching & Optimization ----------
  use_cache: true                 # Enable KV caching for inference
  gradient_checkpointing: true    # Trade compute for memory
  use_memory_efficient_attention: true  # Memory-efficient attention
  
  # ---------- Advanced Features ----------
  # Mixture of Depths (MoD)
  use_mod: true                   # Enable MoD for efficient computation
  mod_mode: adaptive              # Options: learned, fixed, adaptive
  mod_skip_fraction: 0.25         # Fraction of layers to skip
  
  # Speculative Decoding
  use_speculative_decoding: true  # Enable speculative decoding
  speculative_draft_layers: 6     # Number of draft layers
  
  # Expert System Features
  use_hierarchical_moe: true      # Hierarchical expert routing
  use_continuous_experts: true    # Continuous expert selection
  use_sparse_experts: true        # Sparse expert activation
  use_expert_cache: true          # Cache expert selections
  
  # Advanced Architecture Components
  use_mod_plus_plus: true         # Enhanced MoD with confidence
  use_memory_augmented: true      # External memory mechanisms
  use_adaptive_inference: true    # Dynamic computation graphs
  use_interpretability: true      # Built-in interpretability
  
  # Multi-Modal & Specialized Features
  use_mixture_tokenizers: true    # Multiple tokenizer support
  use_nas_experts: true           # Neural architecture search
  use_meta_learning: true         # Meta-learning capabilities
  use_federated_learning: true    # Federated learning support
  use_continual_learning: true    # Continual learning
  use_advanced_pretraining: true  # Advanced pretraining objectives
  use_rlaif: true                # RL from AI feedback
  
  # Specialized Expert Types
  use_code_experts: true          # Code-specialized experts
  use_scientific_experts: true    # Science/math experts
  use_tool_experts: true          # Tool-use experts
  use_vision_language: true       # Vision-language capabilities
  use_audio_language: true        # Audio-language capabilities
  
  # Training & Inference Features
  use_adversarial_training: true  # Adversarial robustness
  use_bias_mitigation: true       # Bias reduction mechanisms
  use_privacy_preserving: true    # Privacy-preserving training
  use_watermarking: true          # Model watermarking
  
  # System Integration
  use_distributed_experts: true   # Distributed expert computation
  use_mixed_precision: true       # Enable mixed precision training
  use_torch_compile: true         # PyTorch 2.0 compilation
  use_fused_kernels: true         # Fused CUDA kernels
  
  # Research & Development Features
  use_diverse_beam_search: true   # Diverse beam search
  use_mixture_decoders: true      # Multiple decoder heads
  use_streaming_generation: true  # Streaming text generation
  use_batch_optimized: true       # Batch-optimized inference
  use_synthetic_data: true        # Synthetic data generation
  use_online_learning: true       # Online learning capability
  use_multi_task_learning: true   # Multi-task learning
  use_automated_curation: true    # Automated data curation
  use_cross_lingual: true         # Cross-lingual transfer
  use_edge_deployment: true       # Edge deployment optimization
  use_ab_testing: true            # A/B testing framework
  use_model_versioning: true      # Model versioning system
  use_cost_optimization: true     # Cost-aware optimization
  use_global_load_balancing: true # Global load balancing
  
  # Experimental Features
  use_quantum_inspired: true      # Quantum-inspired algorithms
  use_neuromorphic: true          # Neuromorphic computing
  use_self_modifying: true        # Self-modifying networks
  use_causal_reasoning: true      # Causal reasoning
  use_visual_builder: true        # Visual model builder
  use_automated_docs: true        # Automated documentation
  use_interactive_debug: true     # Interactive debugging
  use_playground: true            # Model playground
  use_benchmarking: true          # Automated benchmarking

# ============================================================
# DATA CONFIGURATION
# ============================================================

data:
  # ---------- Dataset Settings ----------
  dataset_type: hf                # Dataset type (hf = HuggingFace format)
  train_paths:                    # Training data paths
    - ./data/pretraining/processed_ace_full/batch_*
  val_path: ./data/pretraining/processed_ace_full/batch_*
  
  # ---------- Tokenization ----------
  tokenizer: gpt2                 # Tokenizer to use
  max_length: 8192                # Maximum sequence length (large context)
  stride: 4096                    # Stride for overlapping sequences
  
  # ---------- Data Loading ----------
  max_train_examples: null        # No limit for large-scale training
  max_val_examples: 2000          # Validation data
  
  # ---------- Dataset Arguments ----------
  dataset_args:
    text_column: text             # Column name for text data
    streaming: true               # Stream data for memory efficiency
    num_proc: 64                  # Many processes for fast loading
    keep_in_memory: false         # Don't load entire dataset in memory
    load_from_cache_file: true    # Use cache if available
  
  # ---------- Data Augmentation ----------
  noise_probability: 0.1          # Random token replacement
  mask_probability: 0.05          # Random masking

# ============================================================
# TRAINING CONFIGURATION
# ============================================================

training:
  # ---------- Basic Training ----------
  batch_size: 4                   # Batch size per device (limited by memory)
  gradient_accumulation_steps: 16 # Large gradient accumulation (effective batch = 64)
  num_epochs: 2                   # Fewer epochs for large model
  max_steps: -1                   # Max steps (-1 = use epochs)
  
  # ---------- Learning Rate ----------
  learning_rate: 2e-4             # Lower learning rate for large model
  warmup_steps: 2000              # Extended warmup
  warmup_ratio: 0.03              # Lower warmup ratio
  
  # ---------- Optimizer Configuration ----------
  optimizer: fused_adamw          # Fused AdamW for CUDA
  weight_decay: 0.01              # L2 regularization
  adam_beta1: 0.9                 # Adam beta1
  adam_beta2: 0.95                # Adam beta2
  adam_epsilon: 1e-8              # Adam epsilon
  
  # ---------- Advanced Optimizer Features ----------
  layerwise_lr: true              # Different LR for different layers
  lr_layer_scale: 0.3             # Lower scale for layer-wise LR
  gradient_centralization: true   # Center gradients
  
  # ---------- Learning Rate Scheduling ----------
  lr_scheduler_type: cosine       # Scheduler type
  scheduler: cosine               # Alternative scheduler setting
  lr_decay_factor: 0.9            # Decay LR by 10% each restart
  num_restarts: 3                 # Number of cosine restarts
  
  # ---------- Gradient Management ----------
  max_grad_norm: 1.0              # Gradient clipping threshold
  gradient_clip: 1.0              # Alternative gradient clipping
  adaptive_gradient_clipping: true # Dynamic gradient clipping
  gradient_penalty_weight: 0.001  # Penalize large gradients
  
  # ---------- Mixed Precision ----------
  mixed_precision: bf16           # BFloat16 for large models
  gradient_checkpointing: true    # Gradient checkpointing
  zero_stage: 3                   # ZeRO-3 optimization
  
  # ---------- Loss Functions ----------
  # Focal Loss
  use_focal_loss: true            # Enable focal loss
  focal_gamma: 2.0                # Focal loss gamma
  focal_alpha: 0.25               # Focal loss alpha
  focal_blend: 0.3                # Blend with standard loss
  
  # ---------- Anti-Collapse Features ----------
  entropy_regularization_weight: 0.01      # Encourage output diversity
  token_frequency_penalty_weight: 0.1      # Penalize repetitive tokens
  expert_diversity_weight: 0.01            # Encourage expert specialization
  
  # ---------- Curriculum Learning ----------
  curriculum_learning: true       # Enable curriculum learning
  initial_sequence_length: 256    # Start with short sequences
  curriculum_warmup_steps: 5000   # Extended curriculum warmup
  use_curriculum: true            # Alternative curriculum setting
  curriculum_type: adaptive       # Curriculum type
  initial_difficulty: 0.1         # Low initial difficulty
  max_difficulty: 1.0             # Maximum difficulty
  sequence_length_curriculum: true # Enable sequence length curriculum
  initial_seq_length: 256         # Initial sequence length
  
  # Progressive Sequence Growth
  progressive_sequence_growth: true # Continue growing beyond initial
  sequence_growth_rate: 1.5       # Growth multiplier
  sequence_growth_interval: 10000 # Steps between growth
  
  # ---------- Anti-Overfitting Features ----------
  stochastic_depth_prob: 0.1      # Randomly drop layers
  mixout_prob: 0.1                # Mix weights with initialization
  use_ema: true                   # Exponential moving average
  ema_decay: 0.9999               # Higher EMA decay rate
  confidence_weighting: true      # Weight loss by confidence
  sam_enabled: false              # Sharpness-aware minimization
  
  # ---------- Progressive Training ----------
  use_progressive: true           # Progressive training
  growth_strategy: layer_stacking # Growth strategy
  initial_layers: 16              # Start with half layers
  growth_interval: 10000          # Growth interval
  
  # ---------- Safety Training ----------
  use_constitutional: true        # Constitutional AI
  safety_principles:              # Safety principles
  - Be helpful, harmless, and honest
  - Avoid generating harmful, illegal, or dangerous content
  - Respect user privacy and confidentiality
  - Provide accurate and truthful information
  - Acknowledge limitations and uncertainties
  num_revisions: 3                # Number of revisions
  safety_weight: 0.2              # Safety weight
  
  # ---------- Active Learning ----------
  use_active_learning: true       # Active learning
  active_learning_strategy: hybrid # Strategy
  selection_batch_size: 128       # Selection batch size
  
  # ---------- Smart Checkpointing ----------
  use_smart_checkpointing: true   # Smart checkpointing
  memory_threshold: 0.9           # Memory threshold
  min_recompute_ratio: 1.2        # Min recompute ratio
  always_checkpoint_layers:       # Always checkpoint these
  - attention
  - moe
  - ffn
  
  # ---------- Evaluation & Checkpointing ----------
  eval_steps: 250                 # Evaluation frequency
  save_steps: 500                 # Checkpoint frequency
  save_total_limit: 3             # Max checkpoints to keep
  logging_steps: 10               # Logging frequency
  
  # ---------- DataLoader Settings ----------
  parallel_loading: true          # Parallel data loading
  num_workers: 8                  # DataLoader workers
  drop_last: true                 # Drop incomplete batches
  prefetch_factor: 2              # Prefetch factor
  persistent_workers: true        # Persistent workers
  pin_memory: true               # Pin memory for CUDA
  
  # ---------- Device Settings ----------
  device: cuda                   # Device: cuda for GPU

# ============================================================
# DISTRIBUTED TRAINING
# ============================================================

distributed: true               # Enable distributed training
num_gpus: 16                   # Number of GPUs
device_map: auto               # Device mapping

# ============================================================
# OUTPUT & EXPERIMENT
# ============================================================

output_dir: ./outputs           # Output directory
experiment_name: moe_gpu_large  # Experiment name
logging_level: INFO             # Logging level
report_to:                     # Reporting backends
- tensorboard
- wandb
seed: 42                       # Random seed

# ============================================================
# FINE-TUNING CONFIGURATION
# ============================================================

fine_tuning:
  # ---------- LoRA Configuration ----------
  use_lora: true                # Enable LoRA
  use_qlora: false              # Disable QLoRA for large model
  freeze_base_model: true       # Freeze base model
  lora_r: 64                    # LoRA rank (higher for large model)
  lora_alpha: 128               # LoRA alpha
  lora_dropout: 0.05            # Lower dropout for stability
  
  # ---------- Early Stopping ----------
  early_stopping: true          # Enable early stopping
  early_stopping_patience: 5    # Higher patience
  early_stopping_threshold: 0.001  # Threshold
  min_delta: 0.0005             # Minimum change
  
  # ---------- LoRA Target Modules ----------
  lora_target_modules:          # Target modules
  - q_proj
  - v_proj
  - k_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  
  # ---------- Multi-LoRA ----------
  num_lora_experts: 16          # Number of LoRA experts (large scale)
  task_embedding_dim: 128       # Task embedding dimension
  share_base_weights: true      # Share base weights
  
  # ---------- Fine-tuning Training ----------
  batch_size: 2                 # Batch size
  gradient_accumulation_steps: 16  # Gradient accumulation
  learning_rate: 5e-5           # Learning rate
  num_epochs: 2                 # Number of epochs
  warmup_ratio: 0.1             # Warmup ratio

# ============================================================
# INFERENCE CONFIGURATION
# ============================================================

inference:
  use_speculation: true         # Speculative decoding
  num_draft_experts: 8          # Draft experts
  draft_expert_size_ratio: 0.1  # Draft expert size
  draft_sequence_length: 8      # Draft sequence length
  use_prefetching: true         # Prefetching
  prune_before_deployment: true # Prune before deployment
  target_sparsity: 0.4          # Target sparsity
  prune_experts: true           # Prune experts
  prune_attention: true         # Prune attention
  expert_merge_threshold: 0.85  # Expert merge threshold
  use_flash_attn: true          # Flash attention
  torch_compile: true           # PyTorch compilation
  dtype: bfloat16               # Inference dtype

# ============================================================
# MEMORY OPTIMIZATION
# ============================================================

memory_optimization:
  gradient_checkpointing: true  # Gradient checkpointing
  cpu_offload: true             # CPU offload
  optimizer_offload: true       # Optimizer offload
  parameter_offload: true       # Parameter offload
  activation_checkpointing: true # Activation checkpointing
  memory_efficient_attention: true # Memory efficient attention

# ============================================================
# CUDA OPTIMIZATION (GPU Specific)
# ============================================================

cuda_optimization:
  use_cuda_kernels: true        # Use CUDA kernels
  enable_tensor_cores: true     # Enable Tensor Cores
  optimize_memory_layout: true  # Optimize memory layout
  use_cuda_graphs: true         # Use CUDA graphs
  kernel_fusion: true           # Enable kernel fusion
  tensor_parallel: true         # Tensor parallelism
  pipeline_parallel: true       # Pipeline parallelism

# ============================================================
# MONITORING CONFIGURATION
# ============================================================

monitoring:
  use_health_monitoring: true   # Health monitoring
  check_interval: 50            # Check interval
  enable_alerts: true           # Enable alerts
  enable_visualization: true    # Enable visualizations
  use_wandb: true               # Use W&B
  wandb_project: llm-moe-training  # W&B project
  wandb_name: null              # W&B run name
  wandb_tags:                   # W&B tags
  - moe
  - gpu
  - large
  - cuda
  - production