# ============================================================
# AVA MOE++ LARGE GPU CONFIGURATION
# ============================================================
# Model Size: ~1.5B parameters
# Hardware: 1x GPU with 24GB+ VRAM (RTX 3090, RTX 4090, A100)
# Use Case: Large-scale training, high-quality generation
# ============================================================

# Model Architecture
model:
  # Core dimensions
  hidden_size: 1536
  num_layers: 24
  num_attention_heads: 24
  ffn_hidden_size: 6144
  vocab_size: 50257
  max_position_embeddings: 4096

  # MoE configuration
  num_experts: 32
  top_k_experts: 4
  expert_capacity: 1.25

  # Regularization
  dropout_rate: 0.1
  attention_dropout: 0.1
  expert_dropout: 0.1

  # MoE features
  use_expert_balancing: true
  use_adaptive_routing: true
  temperature: 1.0
  confidence_threshold: 0.5
  sinkhorn_iterations: 10
  aux_loss_weight: 0.01
  layer_norm_epsilon: 1.0e-5

# Training Configuration
training:
  # Batch settings
  batch_size: 4
  gradient_accumulation_steps: 8

  # Training duration
  num_epochs: 50

  # Optimizer
  learning_rate: 1.0e-4
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8

  # Learning rate schedule
  lr_scheduler_type: cosine_with_restarts
  warmup_steps: 5000

  # Gradient management
  max_grad_norm: 0.5

  # Checkpointing
  eval_steps: 250
  save_steps: 500
  logging_steps: 5

# Data Configuration
data:
  data_dir: /project/code/data/pretraining/processed
  max_length: 4096
  num_workers: 8

# Output Configuration
output:
  output_dir: /project/code/outputs

# Hardware Settings
hardware:
  device: cuda
  cuda_device_id: 0
  mixed_precision: true
  bf16: true
  gradient_checkpointing: true