# ============================================================
# ADVANCED CONFIGURATION - CUTTING-EDGE GPU PERFORMANCE
# ============================================================
#
# Category: GPU (CUDA) - Ultra-Optimized
# Model Size: ~100M+ parameters
# Device: NVIDIA H100/H200/RTX 40/50 series with latest CUDA
# Optimization Level: MAXIMUM
# Use Case: Production training with latest 2025 optimizations
#
# DESCRIPTION:
# State-of-the-art GPU configuration incorporating 2025's latest
# optimization techniques including FP8 training, NVLINK optimization,
# TensorRT-LLM integration, advanced memory management, and
# cutting-edge PyTorch features for maximum performance.
#
# HARDWARE REQUIREMENTS:
# - GPU: H100/H200 (16GB+) or RTX 4090/5090 (24GB+)
# - CUDA: 12.0+ with latest drivers
# - PyTorch: 2.5+ with CUDA support
# - System RAM: 32GB+ recommended
# - NVLINK: For multi-GPU setups
#
# USAGE:
#   python3 train_with_data.py --config configs/gpu/advanced.yaml
#   torchrun --nproc_per_node=8 train.py --config configs/gpu/advanced.yaml
#
# ============================================================

# ============================================================
# MODEL ARCHITECTURE - ULTRA-OPTIMIZED
# ============================================================

model:
  # ---------- Core Architecture ----------
  size: advanced                   # Model size preset
  vocab_size: 50257               # GPT-2 tokenizer vocabulary
  hidden_size: 1024               # Hidden dimension (optimized for H100)
  num_layers: 16                  # Number of transformer layers
  intermediate_size: 4096         # FFN intermediate dimension

  # ---------- Advanced Attention Configuration ----------
  num_attention_heads: 16         # Number of attention heads
  num_key_value_heads: 8          # For GQA - optimized memory usage
  attention_type: gqa             # Grouped Query Attention
  use_flash_attn: true            # FlashAttention-3 with sequence parallelism
  use_flash_attn_v3: true         # Latest FlashAttention version
  attention_dropout: 0.1          # Dropout in attention layers

  # ---------- Position Encoding ----------
  max_position_embeddings: 4096   # Extended context length
  rope_theta: 500000.0            # Extended RoPE base frequency
  rope_scaling_type: dynamic      # Dynamic RoPE scaling

  # ---------- Mixture of Experts (MoE) ----------
  num_experts: 16                 # Increased expert count
  num_experts_per_tok: 2          # Experts per token
  expert_capacity_factor: 1.0     # Optimized capacity factor
  expert_routing_type: switch     # Switch routing
  expert_dropout: 0.1             # Reduced expert dropout

  # ---------- Activation & Initialization ----------
  hidden_act: swiglu              # SwiGLU activation
  initializer_range: 0.02         # Weight initialization range
  rms_norm_eps: 1.0e-06          # RMSNorm epsilon

  # ---------- Regularization ----------
  hidden_dropout: 0.1             # Reduced dropout for better performance
  label_smoothing: 0.0            # Disabled for FP8 compatibility

  # ---------- Advanced Memory & Caching ----------
  use_cache: true                 # Enable KV caching
  gradient_checkpointing: false   # Disabled for FP8 performance
  use_memory_efficient_attention: true  # Memory-efficient attention
  use_kv_cache_compression: true  # Compress KV cache
  kv_cache_dtype: fp8             # FP8 KV cache for H100

  # ---------- Latest 2025 Features ----------
  # FP8 Training Support
  use_fp8_training: true          # Enable FP8 training
  fp8_format: e4m3                # Forward pass format
  fp8_grad_format: e5m2           # Gradient format
  use_transformer_engine: true    # NVIDIA Transformer Engine
  fp8_recipe: DelayedScaling      # FP8 scaling strategy

  # Advanced Attention Features
  use_gqa_optimized_kernels: true # Custom GQA kernels
  attention_backend: triton       # Use Triton kernels
  use_rotary_pos_emb_fast: true   # Fast RoPE implementation

  # Memory Optimization
  use_unified_memory: true        # Grace Hopper unified memory
  cpu_gpu_memory_sharing: true    # CPU-GPU memory sharing
  use_memory_pool: true           # Advanced memory pool
  memory_pool_size: 8192          # Pool size in MB

  # Compilation & Kernels
  use_torch_compile: true         # PyTorch 2.0+ compilation
  torch_compile_mode: max-autotune # Maximum optimization
  use_triton_kernels: true        # Replace CUDA with Triton
  use_custom_kernels: true        # Custom optimized kernels
  kernel_fusion_level: aggressive # Aggressive kernel fusion

  # CUDA Graphs & Optimization
  use_cuda_graphs: true           # CUDA graphs for launch overhead
  cuda_graph_warmup_steps: 10     # Warmup steps for graphs
  use_tensor_parallel_comm_opt: true # Optimized tensor parallel communication

# ============================================================
# DATA CONFIGURATION - HIGH THROUGHPUT
# ============================================================

data:
  # ---------- Dataset Settings ----------
  dataset_type: hf                # HuggingFace format
  train_paths:
    - ./data/training/processed_*
  val_path: ./data/training/processed_validation

  # ---------- Tokenization ----------
  tokenizer: gpt2                 # Tokenizer
  max_length: 4096                # Extended sequence length
  stride: 2048                    # Stride for overlapping sequences

  # ---------- Data Loading Optimization ----------
  max_train_examples: 1000000     # Scale up for production
  max_val_examples: 10000         # Validation examples

  # ---------- Optimized Dataset Arguments ----------
  dataset_args:
    text_column: text
    streaming: false              # Load in memory for speed
    num_proc: 16                  # More processes for H100
    keep_in_memory: true          # Keep in memory
    load_from_cache_file: true    # Use cache
    writer_batch_size: 10000      # Larger batches

  # ---------- Advanced Data Features ----------
  use_data_parallel_loading: true # Parallel data loading
  data_loader_pin_memory: true    # Pin memory for CUDA
  prefetch_factor: 4              # Increased prefetch
  persistent_workers: true        # Persistent workers

# ============================================================
# TRAINING CONFIGURATION - MAXIMUM PERFORMANCE
# ============================================================

training:
  # ---------- Batch Configuration ----------
  batch_size: 32                  # Larger batch for H100
  gradient_accumulation_steps: 2  # Effective batch = 64
  num_epochs: 5                   # Training epochs
  max_steps: -1                   # Use epochs

  # ---------- Learning Rate Optimization ----------
  learning_rate: 3e-4             # Optimized for FP8
  warmup_steps: 1000              # Extended warmup
  warmup_ratio: 0.05              # Warmup ratio

  # ---------- Advanced Optimizer ----------
  optimizer: fused_adamw_fp8      # FP8-optimized AdamW
  weight_decay: 0.01              # L2 regularization
  adam_beta1: 0.9                 # Adam beta1
  adam_beta2: 0.95                # Adam beta2
  adam_epsilon: 1e-8              # Adam epsilon

  # ---------- FP8 Optimizer Features ----------
  use_fp8_optimizer_states: true  # FP8 optimizer states
  optimizer_state_sharding: true  # Shard optimizer states
  layerwise_lr_decay: 0.8         # Layer-wise learning rate decay

  # ---------- Advanced Learning Rate Scheduling ----------
  lr_scheduler_type: cosine_with_restarts # Cosine with restarts
  num_restarts: 3                 # Multiple restarts
  restart_decay: 0.9              # Decay factor for restarts
  min_lr_ratio: 0.1               # Minimum LR ratio

  # ---------- Gradient Optimization ----------
  max_grad_norm: 0.5              # Tighter gradient clipping for FP8
  gradient_clip_algorithm: norm   # Gradient clipping algorithm
  use_gradient_centralization: true # Gradient centralization
  gradient_accumulation_dtype: fp8 # FP8 gradient accumulation

  # ---------- Mixed Precision & FP8 ----------
  mixed_precision: fp8            # FP8 mixed precision
  fp8_autocast: true              # FP8 autocast
  fp8_recipe_type: DelayedScaling # FP8 scaling recipe
  fp8_margin: 0                   # FP8 margin
  fp8_interval: 1                 # FP8 update interval

  # ---------- Memory Optimization ----------
  zero_stage: 3                   # ZeRO-3 optimization
  cpu_offload: false              # Keep on GPU for FP8
  optimizer_cpu_offload: false    # Keep optimizer on GPU
  use_deepspeed: true             # DeepSpeed integration

  # ---------- Advanced Loss Functions ----------
  use_focal_loss: true            # Focal loss
  focal_gamma: 1.5                # Focal loss gamma
  focal_alpha: 0.25               # Focal loss alpha
  use_label_smoothing: false      # Disabled for FP8

  # ---------- Curriculum & Progressive Training ----------
  curriculum_learning: true       # Curriculum learning
  initial_sequence_length: 512    # Start short
  curriculum_steps: 5000          # Curriculum steps
  progressive_layer_training: true # Progressive layer training
  initial_active_layers: 8        # Start with fewer layers

  # ---------- Evaluation & Monitoring ----------
  eval_steps: 500                 # Frequent evaluation
  save_steps: 1000                # Save checkpoints
  save_total_limit: 5             # Keep more checkpoints
  logging_steps: 50               # Detailed logging

  # ---------- DataLoader Optimization ----------
  num_workers: 8                  # Optimized for H100
  drop_last: true                 # Drop incomplete batches
  prefetch_factor: 4              # High prefetch
  persistent_workers: true        # Persistent workers
  pin_memory: true               # Pin memory

  # ---------- Device Settings ----------
  device: cuda                   # CUDA device

# ============================================================
# DISTRIBUTED TRAINING - NVLINK OPTIMIZED
# ============================================================

distributed:
  enabled: true                   # Enable distributed training
  backend: nccl                   # NCCL for NVLINK
  init_method: env://             # Environment initialization

  # ---------- Multi-GPU Configuration ----------
  num_gpus: 8                     # Target 8x H100 setup
  world_size: 8                   # World size

  # ---------- NVLINK Optimization ----------
  use_nvlink_optimization: true   # NVLINK optimization
  nccl_tree_threshold: 0          # Force tree algorithm
  nccl_socket_nthreads: 8         # Socket threads
  nccl_nsocks_perthread: 4        # Sockets per thread

  # ---------- Topology Awareness ----------
  nccl_topo_aware: true           # Topology-aware communication
  nccl_net_gdr_level: 3           # GPU Direct RDMA level
  use_hierarchical_allreduce: true # Hierarchical AllReduce

  # ---------- Communication Optimization ----------
  gradient_as_bucket_view: true   # Bucket view optimization
  static_graph: true              # Static graph optimization
  find_unused_parameters: false   # Don't find unused params
  bucket_cap_mb: 200              # Larger buckets for H100

# ============================================================
# TENSORRT-LLM INTEGRATION
# ============================================================

tensorrt_llm:
  enabled: true                   # Enable TensorRT-LLM
  precision: fp8                  # FP8 precision
  max_batch_size: 128             # Maximum batch size
  max_input_len: 4096             # Maximum input length
  max_output_len: 2048            # Maximum output length

  # ---------- Optimization Settings ----------
  use_gpt_attention_plugin: true  # GPT attention plugin
  use_gemm_plugin: true           # GEMM plugin
  use_layernorm_plugin: true      # LayerNorm plugin
  use_lookup_plugin: true         # Lookup plugin

  # ---------- Advanced Features ----------
  enable_context_fmha: true       # Context FMHA
  enable_generation_fmha: true    # Generation FMHA
  use_custom_all_reduce: true     # Custom AllReduce

# ============================================================
# ADVANCED CUDA OPTIMIZATION
# ============================================================

cuda_optimization:
  # ---------- Basic CUDA Features ----------
  use_cuda_kernels: true          # CUDA kernels
  enable_tensor_cores: true       # Tensor Cores
  optimize_memory_layout: true    # Memory layout optimization
  use_cuda_graphs: true           # CUDA graphs
  kernel_fusion: aggressive       # Aggressive kernel fusion

  # ---------- Latest CUDA Features (2025) ----------
  use_cuda_12_features: true      # CUDA 12+ features
  enable_cooperative_groups: true # Cooperative groups
  use_dynamic_parallelism: true   # Dynamic parallelism
  enable_unified_memory: true     # Unified memory

  # ---------- Memory Optimization ----------
  cuda_memory_pool_size: 16384    # 16GB memory pool
  enable_memory_defragmentation: true # Memory defragmentation
  use_memory_pool_allocator: true # Custom memory allocator

  # ---------- Kernel Optimization ----------
  use_triton_backend: true        # Triton backend
  triton_cache_size: 1024         # Triton cache size
  custom_kernel_path: ./kernels   # Custom kernels

  # ---------- Multi-GPU Features ----------
  enable_nvlink_p2p: true         # NVLINK P2P
  use_nvswitch_optimization: true # NVSwitch optimization
  cross_node_bandwidth_mb: 25000  # Cross-node bandwidth

# ============================================================
# MONITORING & LOGGING
# ============================================================

monitoring:
  # ---------- Performance Monitoring ----------
  use_performance_monitoring: true # Performance monitoring
  monitor_gpu_utilization: true   # GPU utilization
  monitor_memory_usage: true      # Memory usage
  monitor_communication: true     # Communication monitoring

  # ---------- Profiling ----------
  enable_profiling: true          # Enable profiling
  profiler_schedule: 100,10,1,1   # Profiler schedule
  trace_handler: tensorboard      # Trace handler

  # ---------- Logging Configuration ----------
  wandb_project: llm-advanced-gpu # W&B project
  tensorboard_log_dir: ./logs     # TensorBoard logs
  log_level: INFO                 # Log level

  # ---------- Health Monitoring ----------
  gpu_health_check_interval: 300  # Health check interval
  memory_leak_detection: true     # Memory leak detection
  thermal_monitoring: true        # Thermal monitoring

# ============================================================
# OUTPUT & EXPERIMENT
# ============================================================

output_dir: ./outputs/advanced     # Output directory
experiment_name: moe_advanced_gpu  # Experiment name
seed: 42                          # Random seed

# ============================================================
# INFERENCE OPTIMIZATION
# ============================================================

inference:
  # ---------- Performance Settings ----------
  use_kv_cache: true              # KV cache
  kv_cache_dtype: fp8             # FP8 KV cache
  use_static_cache: true          # Static cache
  cache_implementation: optimized  # Optimized cache

  # ---------- Generation Optimization ----------
  use_speculative_decoding: true  # Speculative decoding
  draft_model_layers: 4           # Draft model layers
  speculation_length: 8           # Speculation length

  # ---------- Batch Optimization ----------
  continuous_batching: true       # Continuous batching
  max_batch_size: 256             # Large batch size
  padding_strategy: optimized     # Optimized padding

  # ---------- Compilation ----------
  torch_compile_inference: true   # Compile for inference
  torch_compile_mode: max-autotune-no-cudagraphs # Compilation mode