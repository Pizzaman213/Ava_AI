# Medium MoE Configuration (7B parameters, 16 experts)
# Suitable for: Mid-scale experiments, multi-GPU training (4-8 GPUs)
# Model Size: ~7.2B parameters (total), ~1.8B active per token
# Memory: ~28GB (bf16), ~40GB with activations and gradients

model:
  vocab_size: 50680
  hidden_size: 4096
  num_layers: 32
  num_attention_heads: 32
  intermediate_size: 14336
  max_position_embeddings: 4096
  num_experts: 16
  num_experts_per_token: 2
  router_type: mixtral
  capacity_factor: 1.25
  expert_dropout: 0.0
  activation: swiglu
  use_grouped_gemm: true
  use_triton_kernels: true
  use_torch_compile: true
  use_flash_attention: true
  gradient_checkpointing: true
  use_optimized_moe: true
  router_z_loss_coef: 0.001
  load_balance_loss_coef: 0.05  # COHERENCE FIX: Increased from 0.01 to prevent expert collapse
  diversity_loss_coef: 0.001
  expert_dropout_loss_coef: 0.001
  router_jitter_noise: 0.01
  use_lora_experts: true  # OPTIMIZED: Enable LoRA for 50% memory reduction (16 experts×32 layers=512 total)
  lora_rank: 8  # Higher rank than small config for better capacity
  lora_alpha: 16
  freeze_lora_base: false
  attention_dropout: 0.0
  dropout: 0.0
  layer_norm_eps: 1.0e-05
  initializer_range: 0.02

moe_memory_optimization:
  use_lora_experts: true  # OPTIMIZED: Enable LoRA for memory efficiency
  lora_rank: 8
  lora_alpha: 16
  freeze_lora_base: false
  use_expert_offloading: false
  max_active_experts_gpu: 4
  offload_prefetch_lookahead: 2
  offload_eviction_policy: lru
  offload_pin_memory: true
  offload_async_transfers: true
  use_hierarchical_experts: false
  use_expert_quantization: false  # Set to true for 75% memory savings (INT8) with 10-15% slowdown
  quantization_bits: 8  # Options: 4 (87% memory, 20-30% slower), 8 (75% memory, 10-15% slower)

training:
  batch_size: 64  # OPTIMIZATION: Increased from 48 (LoRA allows larger batch, better GPU utilization)
  gradient_accumulation_steps: 4  # OPTIMIZATION: Reduced from 6 (effective batch=256, faster throughput)
  optimizer: lion  # Lion optimizer: 50% memory reduction vs AdamW
  learning_rate: 0.00005  # LION: 3x smaller than AdamW (0.00015 -> 0.00005)
  lion_betas: [0.9, 0.99]  # Lion-specific betas (different from AdamW's [0.9, 0.999])
  max_steps: 500000
  warmup_steps: 5000
  weight_decay: 0.1
  use_fused_optimizer: true  # OPTIMIZATION: 5-10% faster optimizer step
  offload_optimizer_state: true  # ENABLED: 30-50% memory savings for medium model with minimal slowdown
  save_steps: 10000
  eval_steps: 5000  # OPTIMIZED: Increased from 2000 for 10-15% speedup (less validation overhead)
  logging_steps: 100
  run_validation: true
  validation_batch_size: 64  # Already optimal for multi-GPU setup
  max_validation_batches: 500  # OPTIMIZED: Reduced from 1000 for faster validation
  compute_val_train_ratio: true
  generate_every_n_steps: 5000  # OPTIMIZED: Aligned with eval_steps
  num_generations_per_step: 3
  generation_during_eval: false  # OPTIMIZED: Disabled expensive generation during validation
  test_generation_quality: true

data:
  dataset_name: OpenAssistant_oasst2_processed.jsonl
  streaming: true  # REQUIRED: Enable streaming data loader
  buffer_size: 50000  # Shuffle buffer size for streaming loader
  data_dir: /project/code/data/processed
  max_length: 1024
  train_split: train
  eval_split: validation
  auto_create_validation_split: true
  validation_split_ratio: 0.1
  tokenizer_name: /project/code/models/tokenizer/enhanced-50680
  padding_side: right
  truncation: true
  num_workers: 12
  dataloader_drop_last: true
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 2  # Auto-adjusted based on max_length (see dataloader.py)
  streaming_buffer_size: 5000  # OPTIMIZED: Increased buffer for better throughput

output:
  output_dir: /project/code/outputs/runs/medium_moe
  save_every: 10000
  fresh_start: false

run_management:
  run_name: medium_moe
  run_description: Medium MoE config for multi-GPU training
  run_tags: moe,medium,multi-gpu

performance:
  enable_tf32: true
  float32_matmul_precision: high
  enable_cudnn_benchmark: true
  gradient_check_frequency: 10
  torchinductor_max_autotune: 1  # OPTIMIZATION: Enable auto-tuning for 10-15% speedup

gradient_health:
  enabled: true  # COHERENCE FIX: Re-enabled to detect training instabilities

# OPTIMIZATION SETTINGS - All Phase 1, 2, 3 optimizations are configurable here
optimizations:
  # Phase 1: Quick Wins (40-50% speedup)
  gradient_health_monitoring: true  # COHERENCE FIX: Re-enabled
  torchinductor_autotune: 1  # 0=off, 1=basic, 2=aggressive (10-15% speedup)

  # Memory Management
  memory_cleanup_thresholds:
    warning: 0.990   # Trigger warning at 99.0% GPU memory (was 98.5%)
    critical: 0.995  # Trigger critical cleanup at 99.5% (was 99.2%)
    emergency: 0.999 # Trigger emergency cleanup at 99.9% (was 99.8%)

  # Phase 2: Expert Offloading Optimizations (25-35% speedup)
  expert_prefetch:
    enabled: true              # Multi-stage async prefetch
    lookahead: 3               # OPTIMIZED: Increased from 2 to 3 for deeper pipeline (15-20% faster with offloading)
    use_multiple_streams: true # Use multiple CUDA streams for pipeline parallelism

  expert_cache:
    auto_limit: true           # Automatically limit cache size to prevent OOM
    use_lru_eviction: true     # LRU eviction when cache is full

  # Phase 2: Checkpoint Optimizations (saves 20-30s per checkpoint)
  checkpoint:
    async_saving: true         # Save checkpoints in background thread

  # Phase 2: GPU Memory Cleanup (saves ~2.5s per cleanup)
  memory_cleanup:
    fast_mode: true            # Reduced cleanup rounds (2 vs 5, 1 vs 3)
    remove_sleep: true         # Remove sleep between cleanup rounds

  # Phase 2: Data Loading (20-30% faster I/O)
  dataloader:
    adaptive_file_reading: true    # Adjust samples per file based on file size
    adaptive_multipliers:
      large_files: 4          # Multiplier for files >10MB
      medium_files: 2         # Multiplier for files >1MB
      small_files: 1          # Multiplier for files <1MB

  # Phase 2: Gradient Checkpointing (25% memory, 8% slowdown)
  gradient_checkpointing:
    selective: true            # Only checkpoint MoE/FFN layers, not attention
    checkpoint_attention: false # Set to true for full checkpointing

  # Router Optimizations
  router:
    cache_hash_on_gpu: true    # Compute routing cache hash on GPU (15-20% faster eval)
    compile_routers: true      # torch.compile routers for 20-30% speedup
    compile_mode: "default"    # "default" or "reduce-overhead"
    compile_dynamic: true      # Handle variable sequence lengths

hardware:
  device: cuda
  mixed_precision: bf16
  compile: true

wandb:
  use_wandb: false

deepspeed:
  use_deepspeed: true
  zero_stage: 2
  precision: bf16
  gradient_accumulation_steps: 4
  train_batch_size: 256
  micro_batch_size: 64
