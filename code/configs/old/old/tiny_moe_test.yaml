# Tiny MoE Configuration for Testing
# Minimal config for quick MoE functionality tests
# Model Size: ~10M parameters (total), ~8M active per token

model:
  vocab_size: 50680  # custom tokenizer vocab size
  hidden_size: 256
  num_layers: 2
  num_attention_heads: 4
  intermediate_size: 896  # 3.5x hidden_size
  max_position_embeddings: 512

  # MoE settings
  num_experts: 4
  num_experts_per_token: 2
  router_type: 'mixtral'
  capacity_factor: 1.25
  expert_dropout: 0.0
  activation: 'swiglu'

  # Performance
  use_grouped_gemm: true
  use_triton_kernels: false
  use_torch_compile: false
  gradient_checkpointing: false

  # Flag for optimized MoE
  use_optimized_moe: true

  # MoE losses
  router_z_loss_coef: 0.001
  load_balance_loss_coef: 0.01
  diversity_loss_coef: 0.001
  expert_dropout_loss_coef: 0.0
  router_jitter_noise: 0.01

  # Regularization
  attention_dropout: 0.0
  dropout: 0.0
  layer_norm_eps: 1.0e-5
  initializer_range: 0.02

training:
  batch_size: 2
  gradient_accumulation_steps: 1
  learning_rate: 3.0e-4
  max_steps: 10
  warmup_steps: 2
  weight_decay: 0.1
  save_steps: 20
  eval_steps: 20
  logging_steps: 1

  # Validation during training
  run_validation: true  # Run validation at eval_steps
  validation_batch_size: 4  # Batch size for validation
  max_validation_batches: 100  # Max batches for validation (-1 for all)
  compute_val_train_ratio: true  # Compute validation/training loss ratio

  # Generation during training
  generate_every_n_steps: 5  # Generate samples every N training steps
  num_generations_per_step: 3  # Number of samples to generate each time
  generation_during_eval: true  # Generate during evaluation
  num_eval_generations: 5  # Number of samples during evaluation

  # Generation quality testing
  test_generation_quality: true  # Enable generation quality metrics
  generation_test_interval: 5  # Test quality every N steps (aligns with eval_steps)
  num_quality_samples: 5  # Number of samples for quality testing
  compute_perplexity_on_generated: true  # Compute perplexity on generated text

  # Quality metrics to compute
  compute_repetition_metrics: true  # Measure repetition percentage
  compute_coherence_score: true  # Measure coherence (0-100)
  compute_distinct_ngrams: true  # Distinct-1, Distinct-2 metrics
  compute_entropy: true  # Token distribution entropy
  log_generation_samples: true  # Print sample generations to log

data:
  # Dataset configuration
  dataset_name: "OpenAssistant_oasst2_processed.jsonl"  # Small dataset for testing
  data_dir: "/project/code/data/processed"
  max_length: 64
  train_split: "train[:100]"  # Use first 100 samples for quick testing
  eval_split: "validation[:20]"  # Use 20 samples for validation

  # Auto-split configuration for data download/preparation
  auto_create_validation_split: true  # Automatically create validation split
  validation_split_ratio: 0.1  # 10% of data for validation
  test_split_ratio: 0.05  # 5% of data for test (optional)
  split_strategy: "random"  # Options: "random", "sequential", "stratified"
  split_seed: 42  # Seed for reproducible splits
  preserve_original_splits: false  # Keep original train/val/test if they exist

  # Split behavior options
  min_train_samples: 5  # Minimum samples required for training split (lowered for testing)
  min_val_samples: 5  # Minimum samples required for validation split
  balance_splits: false  # Balance classes across splits (for classification)

  # Data filtering during download
  filter_empty_samples: true  # Remove empty or invalid samples
  min_sample_length: 5  # Minimum tokens per sample
  max_sample_length: 2048  # Maximum tokens per sample

  # Data download configuration
  download_and_split: true  # Enable download with auto-splitting
  save_splits_separately: true  # Save train/val/test as separate files
  split_output_format: "jsonl"  # Format for split files: jsonl, parquet, arrow

  # Split file naming
  train_output_file: "train.jsonl"
  val_output_file: "validation.jsonl"
  test_output_file: "test.jsonl"

  # Validation split sources
  create_val_from_train: true  # Create validation from training data if no val exists
  merge_val_test: false  # Merge validation and test splits if both exist

  # Tokenizer configuration
  tokenizer_name: "/project/code/models/tokenizer/enhanced-50680"  # Custom tokenizer
  padding_side: "right"
  truncation: true

  # Batch sizes
  train_batch_size: 2
  eval_batch_size: 4

  # DataLoader performance settings
  num_workers: 4
  dataloader_drop_last: true
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 2
  dataloader_persistent_workers: false  # False for small test datasets

  # Data loading configuration
  use_weighted_mixing: false
  mixing_temperature: 1.0
  streaming: false
  buffer_size: 1000
  max_samples: 100  # Limit total samples loaded
  shuffle_seed: 42
  reshuffle_each_epoch: true
  drop_last_batch: true

  # Advanced features (disabled for testing)
  multi_column: false
  use_multi_column: false
  enable_bucketing: false
  bucket_boundaries: [32, 64, 128]
  max_bucket_size: 8

  # Examples limits
  max_train_examples: 100  # Limit to 100 training samples for quick testing
  max_eval_examples: 20  # Limit to 20 eval samples

evaluation:
  # Evaluation intervals
  eval_during_training: true  # Run evaluation during training
  eval_at_checkpoints: true  # Evaluate when saving checkpoints

  # Metrics to compute
  compute_perplexity: true  # Compute perplexity on validation set
  compute_loss_metrics: true  # Track train/val loss
  compute_generation_metrics: true  # Run generation quality tests

  # Perplexity settings
  perplexity_stride: 512  # Stride for perplexity computation
  max_perplexity_samples: 1000  # Max samples for perplexity (-1 for all)

  # Reporting
  report_recent_train_loss: true  # Report recent training loss
  recent_loss_window: 100  # Number of batches for recent loss
  log_val_train_ratio: true  # Log validation/training loss ratio

  # Sample output
  num_eval_samples_to_log: 3  # Number of generation samples to log
  log_full_generations: false  # Log complete generations (vs truncated)

generation:
  # Sampling parameters
  do_sample: true
  temperature: 0.8
  top_k: 50
  top_p: 0.9
  num_beams: 1

  # Length control
  max_new_tokens: 128
  min_length: 10
  max_length: 192

  # Repetition control
  repetition_penalty: 1.2
  no_repeat_ngram_size: 3
  use_ngram_blocking: false
  ngram_size: 3

  # Special token handling
  eos_penalty: 0.5
  pad_token_id: 0
  eos_token_id: 2
  bos_token_id: 1

  # Generation prompts for testing
  test_prompts:
    - "Once upon a time"
    - "The future of AI is"
    - "In a world where"

  # Output settings
  save_generations: true
  log_generations: true
  generation_output_file: "generations.txt"

  # Quality thresholds and targets
  target_coherence_score: 75  # Target coherence score (0-100)
  max_repetition_rate: 0.15  # Maximum acceptable repetition (15%)
  min_distinct_2: 0.7  # Minimum distinct-2 score
  min_entropy: 4.0  # Minimum token entropy
  warn_on_quality_degradation: true  # Warn if quality drops below thresholds

  # Generation metrics tracking
  track_generation_metrics: true  # Track metrics over time
  log_metrics_to_tensorboard: true  # Log to tensorboard
  save_metrics_history: true  # Save metrics history to file

hardware:
  device: "cuda"
  mixed_precision: "bf16"
  compile: false

paths:
  output_dir: "/project/code/outputs/test_moe"
  log_dir: "/project/code/outputs/test_moe/logs"
