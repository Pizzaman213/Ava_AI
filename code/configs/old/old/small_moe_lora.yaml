model:
  vocab_size: 50680
  hidden_size: 256
  num_layers: 4
  num_attention_heads: 4
  intermediate_size: 1024
  max_position_embeddings: 512
  num_experts: 8
  num_experts_per_token: 4
  router_type: mixtral
  capacity_factor: 1.25
  expert_dropout: 0.0
  activation: swiglu
  use_lora_experts: true
  lora_rank: 8
  lora_alpha: 16
  freeze_lora_base: false
  use_grouped_gemm: true
  use_triton_kernels: true
  use_torch_compile: false
  gradient_checkpointing: false
  use_optimized_moe: true
  router_z_loss_coef: 0.001
  load_balance_loss_coef: 0.01
  diversity_loss_coef: 0.001
  expert_dropout_loss_coef: 0.0
  router_jitter_noise: 0.01
  attention_dropout: 0.0
  dropout: 0.0
  layer_norm_eps: 1.0e-05
  initializer_range: 0.02
moe_memory_optimization:
  use_lora_experts: true
  lora_rank: 8
  lora_alpha: 16
  freeze_lora_base: false
  use_expert_offloading: false
  max_active_experts_gpu: 4
  offload_prefetch_lookahead: 2
  offload_eviction_policy: lru
  offload_pin_memory: true
  offload_async_transfers: true
  use_hierarchical_experts: false
  num_expert_clusters: 4
  expert_clustering_method: random
  load_only_active_cluster: true
  use_expert_quantization: false
  quantize_inactive_experts: true
  expert_quantization_bits: 8
  expert_quantization_method: per_channel
  use_bitsandbytes: false
training:
  batch_size: 16
  gradient_accumulation_steps: 1
  optimizer: lion  # Lion optimizer: 50% memory reduction vs AdamW
  learning_rate: 0.0001  # LION: 3x smaller than AdamW (0.0003 -> 0.0001)
  lion_betas: [0.9, 0.99]  # Lion-specific betas (different from AdamW's [0.9, 0.999])
  max_steps: 100000
  warmup_steps: 2000
  weight_decay: 0.1
  save_steps: 5000
  eval_steps: 1000
  logging_steps: 100
  run_validation: true
  validation_batch_size: 2
  max_validation_batches: 500
  compute_val_train_ratio: true
  generate_every_n_steps: 1000
  num_generations_per_step: 3
  generation_during_eval: true
  num_eval_generations: 5
  test_generation_quality: true
  generation_test_interval: 1000
  num_quality_samples: 10
  compute_perplexity_on_generated: true
  compute_repetition_metrics: true
  compute_coherence_score: true
  compute_distinct_ngrams: true
  compute_entropy: true
  log_generation_samples: true
data:
  dataset_name: OpenAssistant_oasst2_processed.jsonl
  data_dir: /project/code/data/processed
  max_length: 256
  train_split: train
  eval_split: validation
  auto_create_validation_split: true
  validation_split_ratio: 0.1
  test_split_ratio: 0.05
  split_strategy: random
  split_seed: 42
  preserve_original_splits: false
  min_train_samples: 100
  min_val_samples: 50
  balance_splits: false
  tokenizer_name: /project/code/models/tokenizer/enhanced-50680
  padding_side: right
  truncation: true
output:
  output_dir: /project/code/outputs/runs/small_moe_lora
  save_every: 5000
  fresh_start: false
run_management:
  run_name: small_moe_lora_test
  run_description: Small MoE with LoRA expert sharing - Phase 1 memory optimization
  run_tags: moe,lora,memory-optimization,phase1
performance:
  enable_tf32: true
  float32_matmul_precision: high
  enable_cudnn_benchmark: true
wandb:
  use_wandb: false
  wandb_project: Ava
  wandb_name: small_moe_lora
  wandb_tags:
  - moe
  - lora
  - memory-optimization
deepspeed:
  use_deepspeed: false
