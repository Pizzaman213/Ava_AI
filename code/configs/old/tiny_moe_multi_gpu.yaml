# 500M Parameter Single-GPU MoE Configuration - Memory Constrained (9GB available)
# Full-size 500M parameter model with 16 experts optimized for limited GPU memory

model:
  vocab_size: 50680
  pad_token_id: 0  # FIXED: Added for proper tokenization
  eos_token_id: 3  # FIXED: Added for proper sequence termination
  hidden_size: 1536  # Scaled up from 1024 for 500M params
  num_layers: 20     # Scaled up from 8 for 500M params
  num_attention_heads: 12  # Scaled up from 8 (must divide hidden_size)
  intermediate_size: 4096  # Scaled up from 2560 for expert FFN capacity
  max_position_embeddings: 2048  # Increased context length from 512
  num_experts: 16    # Scaled up from 12 for better specialization
  num_experts_per_token: 2
  router_type: mixtral
  capacity_factor: 1.25
  expert_dropout: 0.0
  activation: swiglu
  use_grouped_gemm: true
  use_triton_kernels: true
  use_torch_compile: false  # SPEED FIX: Disabled - torch.compile adds 2-5min compilation overhead
  use_flash_attention: true
  gradient_checkpointing: true  # MEMORY: CRITICAL - Enable for 25-30% memory savings
  gradient_checkpointing_ratio: 1.0  # Checkpoint all layers
  use_optimized_moe: true
  router_z_loss_coef: 0.001
  load_balance_loss_coef: 0.05
  diversity_loss_coef: 0.001
  expert_dropout_loss_coef: 0.0
  router_jitter_noise: 0.01
  use_expert_offloading: false  # SPEED FIX: Disabled - CPU↔GPU transfers kill performance
  max_active_experts_gpu: 16  # SPEED FIX: Keep all experts on GPU (24GB is enough)
  offload_eviction_policy: lru
  attention_dropout: 0.0
  dropout: 0.0
  layer_norm_eps: 1.0e-05
  initializer_range: 0.02

moe_memory_optimization:
  use_lora_experts: true  # MEMORY OPTIMIZATION: Enable LoRA experts for 80-96% memory savings
  lora_rank: 8
  lora_alpha: 16
  freeze_lora_base: false
  use_expert_offloading: false  # SPEED FIX: Disabled - CPU↔GPU transfers kill performance
  max_active_experts_gpu: 16  # SPEED FIX: Keep all experts on GPU (24GB is enough)
  offload_prefetch_lookahead: 0  # SPEED FIX: Disabled (no offloading)
  offload_eviction_policy: lru
  offload_pin_memory: true
  offload_async_transfers: true
  offload_num_streams: 4  # OPTIMIZED: Multiple CUDA streams for parallel transfers
  offload_overlap_comm_compute: true  # OPTIMIZED: Overlap transfers with computation
  use_hierarchical_experts: false
  use_expert_quantization: true
  expert_quantization_bits: 8
  expert_quantization_method: per_channel
  quantize_inactive_experts: true
  # PHASE 3 OPTIMIZATION: Quantize active experts for 50% memory reduction with minimal quality loss
  quantize_active_experts: true  # Enable INT8 for active experts (not just offloaded)
  fp8_enabled: false  # Set to true for H100+ GPUs for FP8 training

training:
  batch_size: 4  # MEMORY: CRITICAL - Reduced to 4 for 9GB GPU constraint (will be ~6GB model + optimizer)
  gradient_accumulation_steps: 8  # SPEED FIX: Reduced from 48 to 8 for faster optimizer updates
  optimizer: lion  # Lion optimizer: 50% memory reduction vs AdamW
  learning_rate: 0.0001  # LION: Adjusted for larger model (3x smaller than AdamW equivalent)
  lion_betas: [0.9, 0.99]  # Lion-specific betas (different from AdamW's [0.9, 0.999])
  lr_scheduler_type: cosine  # PHASE 1 OPTIMIZATION: Added cosine decay for better convergence
  max_steps: 100000  # Increased for larger model
  warmup_steps: 10000  # Increased warmup for larger model
  weight_decay: 0.1
  save_steps: 10000  # EFFICIENCY: Increased from 5000 to 10000 for less checkpoint overhead
  eval_steps: 5000  # Reduced frequency for less overhead
  eval_steps_schedule:  # EFFICIENCY: Adaptive validation - less frequent as training stabilizes
    - [0, 10000, 2000]      # Steps 0-10k: validate every 2k steps
    - [10000, 50000, 5000]  # Steps 10k-50k: validate every 5k steps
    - [50000, null, 10000]  # Steps 50k+: validate every 10k steps
  # PHASE 2 OPTIMIZATION: Fast vs Full validation
  fast_eval_steps: 1000  # Fast validation every 1000 steps
  fast_eval_batches: 10  # Only 10 batches for fast validation
  full_eval_steps: 10000  # Full validation every 10000 steps
  logging_steps: 100  # Less frequent logging
  run_validation: true
  validation_batch_size: 2  # MEMORY: CRITICAL - Reduced to 2 to prevent OOM during validation
  max_validation_batches: 10  # Reduced for faster validation
  compute_val_train_ratio: true
  generate_every_n_steps: 10000  # EFFICIENCY: Reduced frequency from 5000 to 10000
  num_generations_per_step: 2  # EFFICIENCY: Reduced from 3 to 2 generations
  generation_during_eval: false  # EFFICIENCY: Disabled generation during eval for speed
  test_generation_quality: false  # EFFICIENCY: Disabled for speed
  max_grad_norm: 1.0
  compute_coherence_metrics: false  # EFFICIENCY: Disabled for speed in multi-GPU training

data:
  dataset_name: OpenAssistant_oasst2_processed.jsonl
  streaming: true  # REQUIRED: Enable streaming data loader
  buffer_size: 10000  # MEMORY: Reduced buffer size
  data_dir: /project/code/data/pretokenized  # FIXED: Use pretokenized data
  max_length: 512  # MEMORY: Reduced to save memory (was 1024)
  train_split: train
  eval_split: validation
  auto_create_validation_split: true
  validation_split_ratio: 0.1
  tokenizer_name: /project/code/models/tokenizer/enhanced-50680
  padding_side: right
  truncation: true
  num_workers: 0  # SPEED FIX: Disabled workers (4.5M index shuffling takes 2min per worker!)
  dataloader_drop_last: true
  dataloader_pin_memory: true  # SPEED FIX: Re-enabled for faster host→device transfers
  dataloader_prefetch_factor: 3  # SPEED FIX: Increased from 2 to 3 for better pipeline
  dataloader_persistent_workers: false  # SPEED FIX: Disabled - causes initialization delays
  dataloader_samples_per_file: 512  # PHASE 1 OPTIMIZATION: Increased from 256 to 512 for fewer file rotations (2x reduction)
  use_dynamic_batching: true  # EFFICIENCY: Enable dynamic batching for 10-15% less padding waste
  max_tokens_per_batch: 98304  # PHASE 1 OPTIMIZATION: Increased from 65536 to 98304 (1.5x increase for better GPU utilization)
  # MEMORY: Dynamic batch sizing disabled for stability
  dynamic_batch_sizing:
    enabled: false
    min_batch_size: 2
    max_batch_size: 4
    target_memory_utilization: 0.85
    adjustment_frequency: 100  # Tune every 100 steps
  validation_buffer_size: 500  # MEMORY: Reduced from 1000 to save buffer memory
  # MEMORY OPTIMIZATION: Streaming tokenization (reduces buffer from 15k to 1k samples)
  use_streaming_tokenization: true  # MEMORY: Enabled to save 500MB-1GB RAM
  streaming_buffer_size: 1000  # OPTIMIZED: Balanced for better iteration speed

output:
  output_dir: /project/code/outputs/runs/500m_moe_multi_gpu
  save_every: 5000
  fresh_start: false

run_management:
  run_name: 500m_moe_multi_gpu
  run_description: "500M parameter Multi-GPU MoE training with GPU load balancing - 16 experts across multiple GPUs"
  run_tags: moe,multi-gpu,load-balancing,500m,offloading,quantization

performance:
  enable_tf32: true
  float32_matmul_precision: high
  enable_cudnn_benchmark: true
  enable_gpu_memory_cleanup: true  # MEMORY: CRITICAL - Enable aggressive cleanup
  gradient_check_frequency: 50
  torchinductor_max_autotune: 0  # SPEED FIX: Disabled max-autotune (2-5min compilation overhead)
  enable_torch_compile: false  # SPEED FIX: Disabled torch.compile entirely
  torch_compile_mode: "default"  # SPEED FIX: Use default mode (no autotuning)
  torch_compile_fullgraph: false
  torch_compile_dynamic: false  # PHASE 2 OPTIMIZATION: Static for better compilation

gradient_health:
  enabled: true
  conditional_monitoring: true  # PHASE 2 OPTIMIZATION: Adaptive check frequency (1/10/50/100/200 steps based on stability)
  warmup_fraction: 0.05  # PHASE 2 OPTIMIZATION: Reduce monitoring frequency after 5% of max_steps
  # EFFICIENCY GAINS: Check frequency automatically reduces as training stabilizes:
  # - Steps 0-100: check every step (critical warmup)
  # - Steps 100-1000: check every 10 steps
  # - Steps 1000-5000: check every 50 steps
  # - Steps 5000-20000: check every 100 steps
  # - Steps 20000+: check every 200 steps (4x less overhead than before)

optimizations:
  gradient_health_monitoring: true
  torchinductor_autotune: 1
  memory_headroom_gb: 1.5  # MEMORY: Reserve 1.5GB for safety (tighter budget)
  memory_cleanup_thresholds:
    warning: 0.75   # MEMORY: CRITICAL - Warn early at 75% usage
    critical: 0.85  # MEMORY: CRITICAL - Critical at 85% usage
    emergency: 0.92 # MEMORY: CRITICAL - Emergency at 92% usage

  # Multi-GPU Communication Optimizations (Phase 1)
  ddp:
    # Adaptive bucket size based on model size (25MB, 50MB, or 100MB)
    # Larger buckets = fewer all-reduce calls (10-15% speedup)
    adaptive_bucket_size: true
    bucket_cap_mb: 100  # EFFICIENCY: Increased from 25MB to 100MB for fewer all-reduce calls
    # Avoid gradient copy overhead
    gradient_as_bucket_view: true
    # Skip dynamic graph analysis after first iteration
    static_graph: true
    # Use no_sync() during gradient accumulation (15-25% speedup with accumulation_steps=8)
    optimize_gradient_accumulation: true
    # EFFICIENCY: Find unused parameters only once
    find_unused_parameters: false

  expert_parallel:
    # Async backward all-to-all communication (20-30% speedup in backward pass)
    overlap_backward_comm: true
    # Expert caching to reduce redundant transfers (ENABLED for speed boost)
    enable_expert_cache: true
    expert_cache_size: 16
    # Pipeline routing across layers (ENABLED for speed boost)
    enable_layer_pipelining: true

  expert_prefetch:
    enabled: true
    lookahead: 6  # PHASE 1 OPTIMIZATION: Increased from 4 to 6 for deeper prefetch pipeline (50% deeper, reduces stalls)
    use_multiple_streams: true
    num_prefetch_streams: 6  # PHASE 1 OPTIMIZATION: Increased from 4 to 6 streams (matches lookahead)
    prefetch_threshold: 0.6  # PHASE 1 OPTIMIZATION: Reduced from 0.7 to 0.6 for more aggressive prefetching (catches more cases)
  expert_cache:
    auto_limit: true
    use_lru_eviction: true
    cache_size: 3  # MEMORY: CRITICAL - Reduced to 3 experts (2 active + 1 hot)
    clear_after_optimizer_step: true
    cache_compression: true  # OPTIMIZED: Enable compression for cached experts on CPU
    compression_ratio: 8
  checkpoint:
    async_saving: true
  memory_cleanup:
    fast_mode: true
    remove_sleep: true
  dataloader:
    adaptive_file_reading: true
    adaptive_multipliers:
      large_files: 4
      medium_files: 2
      small_files: 1
  gradient_checkpointing:
    selective: false  # MEMORY: CRITICAL - Checkpoint ALL layers
    checkpoint_attention: true  # MEMORY: CRITICAL - Checkpoint attention too
  router:
    cache_hash_on_gpu: true
    compile_routers: false  # SPEED FIX: Disabled router compilation (adds overhead)
    compile_mode: "default"  # SPEED FIX: Use default mode (no autotuning)
    compile_dynamic: false  # PHASE 2 OPTIMIZATION: Static shapes for faster compilation (change to true if variable batch sizes)
    compile_fullgraph: false  # Allow graph breaks for flexibility with router fix
    enable_router_caching: true  # PHASE 3 OPTIMIZATION: Cache routing decisions for repeated patterns (5-10% speedup)
    router_cache_size: 1000  # Cache 1000 routing patterns

hardware:
  device: cuda
  mixed_precision: bf16
  compile: false  # SPEED FIX: Disabled (consistent with use_torch_compile: false)

  # Single-GPU Configuration
  num_gpus: 1  # HARDWARE FIX: Set to 1 GPU (only 1 RTX 3090 Ti available)

  # GPU Load Balancing Settings (DISABLED for single-GPU)
  use_gpu_load_balancing: false   # DISABLED: Only works with multi-GPU setup
  balancing_strategy: adaptive     # Options: round_robin, memory_aware, compute_aware, adaptive (recommended)
  rebalance_interval: 10000        # EFFICIENCY: Increased from 5000 to 10000 to reduce migration overhead (50% reduction)
  adaptive_rebalance_interval: true  # PHASE 2 OPTIMIZATION: Adaptive interval (500-5000) based on load stability
  enable_expert_migration: true    # Allow experts to migrate between GPUs
  migration_threshold: 0.35        # EFFICIENCY: Increased from 0.3 to 0.35 (less aggressive migration)
  max_migrations_per_rebalance: 1  # EFFICIENCY: Reduced from 2 to 1 to minimize training pauses (50% reduction)
  log_gpu_metrics: true            # Log detailed per-GPU metrics
  overlap_migration: true          # EFFICIENCY: Enable async migration to overlap with training

wandb:
  use_wandb: true  # Enable for multi-GPU metrics tracking
  # EFFICIENCY OPTIMIZATION: Batched logging reduces WandB overhead
  wandb_cache_size: 2000  # Cache metrics for resilience
  wandb_cache_flush_interval: 100  # Flush cache every 100 batches (was 50, reduces API calls by 2x)
  wandb_offline: false  # Set true for offline logging
  disable_wandb: false

deepspeed:
  use_deepspeed: false  # DISABLED: DeepSpeed requires multi-GPU setup, using single GPU
  zero_stage: 2  # SPEED OPTIMIZATION: ZeRO Stage 2 for better gradient memory efficiency
  zero_optimization:
    stage: 2  # Optimizer state + gradient partitioning
    reduce_scatter: true  # Use reduce-scatter instead of all-reduce
    overlap_comm: true  # Overlap gradient communication
    contiguous_gradients: true  # Use contiguous buffers for gradients
    sub_group_size: 1e9  # Process all at once
    reduce_bucket_size: auto  # Auto-tune bucket size
    allgather_bucket_size: auto  # Auto-tune for Stage 2
    stage3_prefetch_bucket_size: auto
    stage3_param_persistence_threshold: auto
    stage3_max_live_parameters: 1e9
    stage3_max_reuse_distance: 1e9
    stage3_gather_16bit_weights_on_model_save: true
  gradient_accumulation_steps: 4  # Match training config (reduced from 16)
  gradient_clipping: 1.0  # Match max_grad_norm
  steps_per_print: 100  # Match logging_steps
  wall_clock_breakdown: false  # Disable for performance
  dump_state: false  # Disable for performance
  cpu_offload: false  # Keep on GPU for Stage 2 (no CPU offload needed)

