# Memory-Efficient Optimizer Configurations
# Use these optimizers to reduce optimizer state memory by 50-75%
#
# Available optimizers:
#   adamw     - Default, full precision (baseline)
#   adamw8bit - 75% optimizer memory savings (bitsandbytes)
#   galore    - 60-70% savings, low-rank gradient projection
#   adafactor - ~50% savings, no momentum storage
#   lion      - Lower memory than AdamW, different dynamics

# Architecture (same as large.yaml)
architecture:
  vocab_size: 50680
  hidden_size: 1024
  num_layers: 16
  num_attention_heads: 16
  intermediate_size: 4096
  num_experts: 8
  num_experts_per_token: 2
  router_type: 'mixtral'
  use_flash_attention: true
  use_rotary_embeddings: true
  activation: 'swiglu'

training:
  # Basic training settings
  batch_size: 16
  gradient_accumulation_steps: 8
  num_epochs: 5
  max_gradient_norm: 1.0
  mixed_precision: 'bf16'
  gradient_checkpointing: true

  # Memory-efficient optimizer configuration
  optimizer:
    # Options: adamw, adamw8bit, galore, adafactor, lion
    type: galore  # Best memory savings for large models

    learning_rate: 0.0004
    weight_decay: 0.1
    betas: [0.9, 0.95]

    # GaLore-specific settings (only used when type: galore)
    galore:
      rank: 128             # Low-rank dimension (higher = more accurate, more memory)
      update_proj_gap: 200  # Steps between projection updates (higher = faster, less accurate)
      scale: 0.25           # Projection scaling factor

  # Scheduler
  warmup_steps: 500
  lr_scheduler_type: 'cosine'

  # Checkpointing
  save_steps: 1000
  eval_steps: 500
  logging_steps: 10

data:
  streaming: true
  buffer_size: 2000
  data_dir: /project/code/data/Ava_Ai/data
  max_length: 512
  train_split: train
  eval_split: validation
  use_pretokenized: true
  num_workers: 4  # Reduced for memory efficiency
  cache_size: 50  # RAM-optimized

output:
  output_dir: /project/code/outputs
  save_every: 500

# Additional memory optimizations
optimizations:
  use_overlapped_checkpointing: true
  gradient_checkpointing: true
