# =============================================================================
# MAXIMUM THROUGHPUT Configuration for RTX 3090 Ti (24GB VRAM)
# =============================================================================
# GOAL: Maximize GPU utilization, minimize CPU→GPU transfer overhead
#
# Key changes from large.yaml:
# ✅ Disable dynamic batching warmup (start at full batch)
# ✅ Larger batch size with gradient accumulation
# ✅ Increased sequence length (more compute per transfer)
# ✅ More aggressive prefetching
# ✅ Reduced logging frequency (less GPU sync)
# ✅ Enable gradient checkpointing (allows larger batches)

model:
  vocab_size: 50680
  pad_token_id: 0
  eos_token_id: 3
  hidden_size: 512       # Smaller for ~200M params
  num_layers: 12
  num_attention_heads: 8
  intermediate_size: 2048
  max_position_embeddings: 512
  num_experts: 8         # More experts for MoE efficiency
  num_experts_per_token: 2
  router_type: mixtral
  capacity_factor: 1.0   # REDUCED from 1.25 - saves ~20% expert memory
  quantize_kv_cache: true
  expert_dropout: 0.0
  activation: swiglu

  # GPU Optimizations - ALL ENABLED
  use_grouped_gemm: true
  use_triton_kernels: true
  use_torch_compile: true   # ENABLED - 10-20% speedup after warmup
  use_flash_attention: true
  gradient_checkpointing: true  # ENABLED - allows 2-3x larger batches
  use_optimized_moe: true

  # MoE loss coefficients
  router_z_loss_coef: 0.001
  load_balance_loss_coef: 0.01
  diversity_loss_coef: 0.0
  expert_dropout_loss_coef: 0.0
  router_jitter_noise: 0.01

  # Regularization
  use_lora_experts: false
  use_expert_offloading: false
  attention_dropout: 0.1
  dropout: 0.1
  layer_norm_eps: 1.0e-5
  initializer_range: 0.02

# Hybrid Caching - maximized for throughput
hybrid_caching:
  enabled: true
  max_cache_size_gb: 2.0  # More cache with gradient checkpointing
  kv_cache_ratio: 0.7
  eviction_policy: hybrid
  prefetch_enabled: true
  prefetch_lookahead: 4  # More lookahead
  min_score_threshold: 0.1

training:
  precision:
    mixed_precision: bf16

  batching:
    # HIGHER THROUGHPUT - capacity_factor=1.0 saves memory
    batch_size: 32  # Increased with memory savings
    gradient_accumulation_steps: 4  # Effective batch size = 128

    # STABLE dynamic batching
    dynamic_batching:
      enabled: true
      min_batch_size: 24   # Higher floor
      max_batch_size: 40   # Higher ceiling
      initial_batch_size: 32  # Start at target

      # NARROW memory thresholds (prevents ping-pong)
      low_memory_threshold: 0.68   # Only increase if really underutilized
      target_memory_threshold: 0.75  # Conservative target
      high_memory_threshold: 0.82   # Small buffer before decrease
      critical_memory_threshold: 0.92

      # SLOW adjustments (let memory stabilize)
      adjustment_frequency: 25   # Check every 25 steps
      cooldown_steps: 50         # Wait 50 steps after adjustment
      max_adjustments_per_session: 50
      min_stable_steps: 20       # Need 20 stable steps before adjusting

      # NO WARMUP - start at full batch
      warmup_steps: 0  # DISABLED
      warmup_strategy: none
      warmup_initial_fraction: 1.0  # Start at 100%

  optimizer:
    type: adamw8bit  # 75% optimizer memory savings via bitsandbytes
    learning_rate: 3.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.1
    eps: 1.0e-8
    max_grad_norm: 1.0

  schedule:
    num_epochs: 3
    max_steps: null
    warmup_steps: 1000
    scheduler_type: cosine_with_restarts
    num_cycles: 3
    min_lr: 1.0e-5

  logging:
    save_steps: 1000  # Less frequent saves
    eval_steps: 1000  # Less frequent evals
    logging_steps: 100  # REDUCE sync overhead

  validation:
    enabled: true
    batch_size: 24  # Safe for 24GB (no gradients stored)
    max_batches: 5  # Fewer validation batches
    compute_train_ratio: false  # Skip extra computation

  generation:
    enabled: false

  coherence:
    enabled: false

data:
  streaming: true
  buffer_size: 10000  # Larger buffer
  data_dir: /project/code/data/Ava_Ai/data
  max_length: 512  # Match model max_position_embeddings
  train_split: train
  eval_split: validation
  auto_create_validation_split: true
  validation_split_ratio: 0.02  # Smaller validation
  tokenizer_name: /project/code/data/Ava_Ai/tokenizer
  padding_side: right
  truncation: true

  # AGGRESSIVE data loading
  num_workers: 6  # More workers (you have 61GB RAM)
  dataloader_drop_last: true
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 4  # MORE prefetch
  dataloader_persistent_workers: true
  dataloader_samples_per_file: 2000  # Larger chunks
  skip_dataloader_validation: true

  # Sequence packing - 20-35% efficiency gain by eliminating padding
  use_sequence_packing: true
  packing_strategy: greedy
  packing_efficiency_threshold: 0.8  # Pack if >80% efficient

  # Pre-tokenized loading
  use_pretokenized: true
  use_all_data: true
  max_files_to_load: null
  lazy_file_discovery: true
  multiprocessing_context: spawn
  cache_size: 30  # More cache per worker
  skip_validation: true
  shuffle_files: true

output:
  output_dir: /project/code/outputs
  save_every: 1000
  fresh_start: true

optimizations:
  use_overlapped_checkpointing: true

# CUDA Stream Optimizations
cuda_streams:
  enabled: true
  num_streams: 6  # More streams
  use_event_timing: true
  use_stream_pool: true
  high_priority_transfers: true

overlapped_checkpointing:
  enabled: true
  stream_overlap: true
  target_layers: "layers"

double_checkpointing:
  enabled: false

fp8:
  enabled: false

performance:
  enable_cudnn_benchmark: true
  enable_tf32: true
  torchinductor_max_autotune: 0
  enable_torch_compile: true  # FIXED: Was false, conflicting with model.use_torch_compile
  torch_compile_mode: default
  torch_compile_fullgraph: false
  torch_compile_dynamic: true

kernel_optimization:
  router_kernel_mode: auto
  use_fused_softmax_topk: true
  router_block_size: 8  # Larger block
  use_sparse_expert_dispatch: false
  use_fused_activations: true
  use_selective_expert_loading: false
  use_vectorized_capacity: true
  use_fused_moe_kernel: false
  enable_kernel_profiling: false

wandb:
  use_wandb: true
  project: ava-training
  entity: null
  tags:
    - rtx3090ti
    - max_throughput
    - optimized
  notes: Maximum throughput configuration

deepspeed:
  use_deepspeed: false