# =============================================================================
# RTX 3090 Ti OPTIMIZED Configuration (24GB VRAM, 61GB RAM)
# =============================================================================
# Hardware: NVIDIA GeForce RTX 3090 Ti (24GB), 61GB System RAM
# Model: 446M parameter MoE with 4 experts
#
# Configuration Schema v2.0 - 8-Section Structure:
#   model, training, data, compute, distributed, logging, checkpoints, experimental
# =============================================================================
# MODEL - Architecture, MoE, tokens, regularization
# =============================================================================
model:
  vocab_size: 32000
  pad_token_id: 0
  eos_token_id: 5
  bos_token_id: 2
  hidden_size: 768
  num_layers: 12
  num_attention_heads: 12
  intermediate_size: 3072
  max_position_embeddings: 512
  num_experts: 4
  num_experts_per_token: 1        # SPEED: top-1 routing (was 2) - 1.15x faster
  router_type: mixtral
  capacity_factor: 1.25
  quantize_kv_cache: true
  expert_dropout: 0.05
  activation: swiglu

  # GPU Optimizations
  use_grouped_gemm: true
  use_triton_kernels: true
  use_flash_attention: true
  gradient_checkpointing: true   # Works with DeepSpeed after routing tiebreaker fix
  use_optimized_moe: true

  # MoE loss coefficients (speed optimized)
  router_z_loss_coef: 0.0001
  load_balance_loss_coef: 0.001
  diversity_loss_coef: 0.0
  expert_dropout_loss_coef: 0.0
  router_jitter_noise: 0.0  # CRITICAL: Must be 0.0 when gradient_checkpointing=true (causes shape mismatch during recomputation)
  aux_loss_frequency: 500

  # Coherence regularization
  entropy_regularization: 0.0
  output_diversity_weight: 0.0
  eos_logit_bias: 0.1

  # Regularization (increased to prevent overfitting)
  attention_dropout: 0.1
  dropout: 0.1
  label_smoothing: 0.1
  # tie_word_embeddings: false - REQUIRED for DeepSpeed ZeRO
  # Weight tying causes "parameter already reduced" errors with ZeRO-1/2/3
  # because the shared parameter gets gradient reduction attempted twice
  tie_word_embeddings: false
  layer_norm_eps: 1.0e-5
  initializer_range: 0.02

# =============================================================================
# TRAINING - Optimizer, schedule, batching, validation
# =============================================================================
training:
  precision:
    mixed_precision: bf16

  # PERF: Pipeline micro-batching for +10-15% throughput via forward/backward overlap
  use_pipeline_microbatching: true
  pipeline_overlap_factor: 2

  batching:
    # SPEED FIX: grad_accum > 1 enables OverlappedGradientAccumulator (10-20% speedup)
    # Overlaps forward(N+1) with backward(N) using CUDA streams
    batch_size: 86
    gradient_accumulation_steps: 2

  optimizer:
    type: AdamW  # 8-bit AdamW: saves ~2.5GB memory with same performance
    learning_rate: 1.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.1
    use_fused: true
    max_grad_norm: 1.0

  schedule:
    num_epochs: 1
    max_steps: null
    steps_per_epoch: 10000  # Explicit value for DeepSpeed scheduler
    warmup_steps: 1000
    scheduler_type: cosine
    num_cycles: 1
    min_lr: 1.0e-5

  logging:
    save_steps: 1000
    eval_steps: 1000
    logging_steps: 10  # Log every 10 steps (reduces GPU sync overhead)
    use_tensorboard: false
    use_wandb: true

  validation:
    enabled: true
    batch_size: 32
    max_batches: 10
    compute_train_ratio: true

  generation:
    enabled: true
    generate_every_n_steps: 100  # Generate sample every 100 steps
    num_per_step: 1
    during_eval: true
    test_quality: true
    max_length: 128
    temperature: 0.1  # Low temp for clearer early training results
    top_p: 0.9
    top_k: 10
    repetition_penalty: 1.2
    no_repeat_ngram_size: 3
    skip_special_tokens: true
    prompt: "Once upon a time, in a land far away,"
    alternative_prompts:
      - "The quick brown fox"
      - "In the beginning"
      - "A long time ago"

  coherence:
    enabled: true
    eval_every_n_steps: 5000
    num_samples: 2
    max_generation_length: 100
    temperature: 0.5
    top_p: 0.9
    top_k: 25
    log_to_wandb: true
    log_to_console: false
    use_fast: true
    use_bf16: true
    micro_batch_size: 16

# =============================================================================
# DATA - Loading, streaming, packing, splits
# =============================================================================
data:
  # SPEED FIX: Disable streaming - was causing ~10s/step due to lazy file discovery
  streaming: false
  buffer_size: 30000
  fast_startup: false  # Not needed without streaming
  progressive_buffer: false
  min_buffer_size: 10000
  warm_start_files: 10
  skip_sequence_count: true
  enable_length_sorting: false

  data_dir: pretokenized_data/data  # All datasets: c4 (413GB) + OpenOrca (33GB) + TinyStories (34GB)
  max_length: 512
  train_split: train
  eval_split: validation
  auto_create_validation_split: true
  validation_split_ratio: 0.05
  tokenizer_name: pretokenized_data/tokenizers/vocab
  padding_side: right
  truncation: false

  # Data loading (optimized for throughput)
  # PERF: Increased workers now that streaming is disabled (no coordination overhead)
  num_workers: 6
  prefetch_factor: 6
  persistent_workers: true
  dataloader_drop_last: true
  dataloader_pin_memory: true
  dataloader_samples_per_file: 200
  skip_dataloader_validation: true
  timeout: 300
  examples_per_random_select: 5000

  # PERF: Sequence packing enabled for +20-35% throughput
  # Code has proper position_ids support for gradient checkpointing compatibility
  use_sequence_packing: true
  packing_strategy: greedy
  packing_target_ratio: 0.95

  # Data discovery
  use_all_data: true
  max_files_to_load: 10
  lazy_file_discovery: false
  multiprocessing_context: fork
  cache_size: 50
  skip_validation: false
  shuffle_files: true
  # Use streaming loader (better for large datasets with many files)
  use_indexed_loader: false
  indexed_num_bins: 8
  indexed_cache_size: 50
  indexed_index_workers: 4

# =============================================================================
# COMPUTE - Device, precision, CUDA, kernels, memory, performance
# =============================================================================
compute:
  memory:
    headroom_gb: 0.1
    cleanup_thresholds:
      warning: 0.98
      critical: 0.99
      emergency: 0.999
    expert_prefetch:
      enabled: true
      lookahead: 2  # Increased for better overlap
      use_multiple_streams: true  # PERF: +5-15% throughput from multi-stream compute

  performance:
    enable_cudnn_benchmark: true
    enable_tf32: true  # 2-3x speedup on Ampere GPUs (RTX 3090)
    torchinductor_max_autotune: 1
    # PERF: torch.compile provides +10-30% speedup via kernel fusion
    # DeepSpeed disabled, so torch.compile can be enabled
    enable_torch_compile: true
    torch_compile_mode: reduce-overhead  # Options: default, reduce-overhead, max-autotune
    torch_compile_fullgraph: false
    torch_compile_dynamic: false

  kernels:
    router_kernel_mode: auto
    use_fused_softmax_topk: true
    router_block_size: 4
    use_sparse_expert_dispatch: false
    use_fused_activations: true
    use_selective_expert_loading: false
    use_vectorized_capacity: true
    use_fused_moe_kernel: true
    enable_kernel_profiling: false

  cuda:
    streams:
      enabled: true
      num_streams: 4
      use_event_timing: true
      use_stream_pool: true
      high_priority_transfers: true

    graphs:
      # PERF: CUDA graphs provide +15-25% speedup for small batches
      # DeepSpeed disabled, so CUDA graphs can be enabled
      enabled: true
      warmup_steps: 10
      capture_mode: automatic

  optimizations:
    # CRITICAL: Disabled for DeepSpeed compatibility
    # use_overlapped_checkpointing causes "parameter already reduced" errors with ZeRO
    use_overlapped_checkpointing: false

  calibration:
    batch_size:
      # PERF: Batch size calibration - auto-finds optimal batch size for +10-30% throughput
      # Enable when you want to maximize hardware utilization
      enabled: false  # Set to true to enable automatic batch size discovery
      target_memory: 0.80  # Conservative target for memory safety
      max_batch_size: 96
      min_batch_size: 8
      perform_optimizer_step: true
      calibration_timeout_sec: 120.0
      calibration_headroom: 0.92
      use_real_dataloader: true
      measure_peak_utilization: true
      use_fresh_models: true

# =============================================================================
# DISTRIBUTED - Multi-GPU, DeepSpeed, load balancing
# =============================================================================
distributed:
  deepspeed:
    enabled: false  # PERF: Disabled for single-GPU - enables CUDA graphs & torch.compile (+25-55% speedup)
    zero_stage: 0  # ZeRO-0: Disabled optimizer sharding to fix "parameter already reduced" error with gradient checkpointing
    cpu_offload: false  # CRITICAL: CPU offload causes 5-10x slowdown
    nvme_offload: false
    nvme_path: "/local_nvme"
    precision_type: "bf16"
    # gradient_accumulation_steps inherited from training.batching (4)
    # micro_batch_size = per-GPU batch size (matches training.batching.batch_size)
    # micro_batch_size: 16  # Match training.batching.batch_size
    # train_batch_size calculated automatically: micro_batch_size * grad_accum * world_size
    activation_checkpointing: false  # Disabled - relying on ZeRO-2 + CPU offload
    partition_activations: false
    gradient_clipping: 1.0
    zero_overlap_comm: true
    zero_contiguous_gradients: true
    zero_reduce_scatter: true
    zero_reduce_bucket_size: 200000000
    zero_allgather_bucket_size: 200000000

# =============================================================================
# LOGGING - Console, WandB, TensorBoard, diagnostics, frequencies
# =============================================================================
logging:
  disabled: false
  silent_mode: false

  console:
    enabled: true
    level: info

  file:
    enabled: true
    level: debug

  progress_bar_enabled: true
  step_logging_enabled: true
  epoch_logging_enabled: true
  log_mode: tqdm     # tqdm mode (visual progress without sync overhead)
  tqdm_update_interval: 1  # Update progress bar every step (cheap, no GPU sync)

  metrics:
    training: true
    gradients: true
    moe: true
    validation: true
    coherence: true
    quality: true
    memory: true
    timing: true
    generations: true

  wandb:
    enabled: true
    project: ava-training
    entity: null
    tags:
      - rtx3090ti
      - 24gb_vram
      - 446m_params
      - optimized
    notes: |
      RTX 3090 Ti optimized configuration.
      Hardware: RTX 3090 Ti (24GB), 61GB RAM
      Key: BF16, Flash Attention, Gradient Checkpointing
    log_freq: 1000  # Increased from 200 to reduce sync overhead
    log_training: true
    log_gradients: true
    log_moe: true
    log_validation: true
    log_coherence: true
    log_quality: true
    log_memory: true
    log_timing: true
    log_generations: true
    log_per_layer_grads: false   # DISABLED - was causing 8s+ overhead per log step
    log_routing_diagnostics: false  # DISABLED - was causing massive sync overhead
    log_model_topology: false    # Only needed once, disable for speed

  tensorboard:
    enabled: false
    log_training: true
    log_gradients: true
    log_moe: true
    log_validation: true

  frequencies:
    # PERF: Increased intervals for +2-5% throughput (reduces GPU sync overhead)
    log_interval: 200       # Sync every 200 steps (was 50)
    verbose_log_interval: 500 # Show verbose logs every 500 steps (was 200)
    metrics: 5000           # Less frequent metrics
    memory_check: 10000     # Memory checks every 10000 steps (was 5000)
    health_summary: 5000    # Less frequent health summaries
    moe_metrics: 20000      # Less frequent MoE metrics

  features:
    timing_breakdown: true
    memory_profiling: true
    health_summaries: true
    tensor_shapes: true
    checkpoint_validation: true
    sample_generations: true
    structured_logging: true
    log_format: default

  diagnostics:
    enabled: false

    per_layer_gradients:
      enabled: false
      log_freq: 1000
      layer_name_patterns:
        - layers
        - experts

    routing:
      enabled: false
      log_freq: 1000
      track_per_expert_load: true
      track_routing_entropy: true
      track_expert_capacity_usage: true

    memory:
      enabled: false
      log_freq: 500
      track_activation_memory: true
      track_gradient_memory: true
      track_optimizer_state_memory: true
      track_parameter_memory: true

    timing:
      enabled: false
      log_freq: 500
      profile_forward: true
      profile_backward: true
      profile_optimizer_step: true
      profile_data_loading: true

# =============================================================================
# CHECKPOINTS - Save/load, model selection, output settings
# =============================================================================
checkpoints:
  output_dir: code/outputs
  save_every: 500
  fresh_start: true

  selection:
    enabled: false
    val_loss_weight: 0.5
    coherence_score_weight: 0.3
    perplexity_weight: 0.2
    perplexity_cap: 100.0
    val_loss_cap: 10.0
    higher_is_better: true
    require_all_metrics: false
    fallback_to_val_loss: true

# =============================================================================
# EXPERIMENTAL - Progressive, FP8, caching, advanced features
# =============================================================================
experimental:
  caching:
    # VRAM OPTIMIZATION: Enable caching to save 300-500MB during gradient checkpointing
    enabled: true
    mode: training

    activation_cache:
      enabled: true
      max_size_gb: 0.2
      eviction_policy: lru

    kv_cache:
      enabled: true
      max_size_gb: 0.4
      eviction_policy: hybrid
      sliding_window: 256
      sink_tokens: 4
      recent_tokens: 256

  checkpointing:
    overlapped:
      # CRITICAL: Disabled for DeepSpeed compatibility
      # Overlapped checkpointing causes "parameter already reduced" errors with ZeRO
      # because it creates nested checkpoint calls that confuse gradient reduction
      enabled: false
      stream_overlap: true
      target_layers: layers

    double:
      # CRITICAL: Disabled for DeepSpeed compatibility
      # Double checkpointing creates nested torch.utils.checkpoint.checkpoint() calls
      # which causes gradient reduction conflicts with DeepSpeed ZeRO stages
      # "The parameter X has already been reduced" error when enabled
      enabled: false
      # VRAM OPTIMIZATION: Reduced from 8 to 4 for more frequent checkpointing (200-400MB savings)
      # Trade-off: ~5% compute overhead but significantly better memory efficiency
      coarse_checkpoint_interval: 4
      fine_checkpoint_interval: 2
      use_cuda_streams: true

  fp8:
    enabled: false
    use_transformer_engine: false
    format: e4m3

  # Multi-Token Prediction (MTP)
  mtp:
    enabled: false
    num_prediction_heads: 4
    confidence_threshold_train: 0.6
    confidence_threshold_inference: 0.7
    use_confidence_weighting: true
    primary_loss_weight: 1.0
    additional_loss_base_weight: 0.1
    mtp_warmup_epochs: 1
    confidence_reg_strength: 0.01

  # Mixture of Heads (MoH)
  moh:
    enabled: false
    num_active_heads: 4
    router_jitter: 0.01
    load_balance_weight: 0.01
    entropy_weight: 0.001

  # Mixture of Activations (MoA)
  moa:
    enabled: false
    num_activations: 4
    activations:
      - gelu
      - silu
      - relu
      - mish
    use_gated: true
    router_temperature: 1.0

  # ALiBi Positional Encoding
  alibi:
    enabled: false

  # Cross-Attention for Multi-Modal
  cross_attention:
    enabled: false
    encoder_hidden_size: 768
    num_cross_attention_layers: 4
    cross_attention_frequency: 3
    use_gated_cross_attention: true
    gate_init_value: 0.0

  # Modality Encoders
  modality_encoders:
    vision:
      enabled: false
      encoder_type: vit
      image_size: 224
      patch_size: 16
      hidden_size: 768
      num_layers: 12
      num_heads: 12
      pretrained: null

    audio:
      enabled: false
      encoder_type: whisper
      input_size: 80
      hidden_size: 768
      num_layers: 6
      num_heads: 8
      conv_downsample: true
      pretrained: null

  # Advanced Loss Functions
  advanced_losses:
    focal_loss:
      enabled: false
      gamma: 2.0
      alpha: 0.25

    contrastive_loss:
      enabled: false
      temperature: 0.07
      weight: 0.1

    diversity_loss:
      enabled: false
      weight: 0.01

    adaptive_temperature:
      enabled: true
      initial_temperature: 1.0
      min_temperature: 0.5
      max_temperature: 2.0
      adaptation_rate: 0.01

    distillation:
      enabled: false
      teacher_model_path: null
      temperature: 2.0
      alpha: 0.5

  # Gradient Surgery
  gradient_surgery:
    enabled: false
    method: pcgrad
    pcgrad:
      enabled: true
    cagrad:
      c: 0.5
    gradnorm:
      alpha: 1.5

  # Auxiliary-Free Router
  aux_free_router:
    enabled: true
    balance_factor: 0.1
    ema_decay: 0.99
    use_capacity_masking: true
