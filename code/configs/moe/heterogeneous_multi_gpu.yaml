# =============================================================================
# Heterogeneous Multi-GPU Configuration
# =============================================================================
# For systems with GPUs of different memory sizes (e.g., 24GB + 48GB)
# Uses the SMALLER GPU's memory as the constraint to prevent OOM
#
# Usage:
#   torchrun --nproc_per_node=2 code/scripts/5_training/train_pipeline.py \
#     --config code/configs/moe/heterogeneous_multi_gpu.yaml
#
# Or for profiling:
#   ./profile_training.sh --config code/configs/moe/heterogeneous_multi_gpu.yaml

model:
  vocab_size: 50680
  pad_token_id: 0
  eos_token_id: 3
  hidden_size: 768
  num_layers: 12
  num_attention_heads: 12
  intermediate_size: 3072
  max_position_embeddings: 1024
  num_experts: 4
  num_experts_per_token: 2
  router_type: mixtral
  capacity_factor: 1.25
  quantize_kv_cache: true
  expert_dropout: 0.0
  activation: swiglu

  # GPU Optimizations - conservative for mixed hardware
  use_grouped_gemm: true
  use_triton_kernels: true
  use_torch_compile: false
  use_flash_attention: true
  gradient_checkpointing: true  # Critical for smaller GPU
  use_optimized_moe: true

  # MoE loss coefficients
  router_z_loss_coef: 0.001
  load_balance_loss_coef: 0.01
  diversity_loss_coef: 0.0
  expert_dropout_loss_coef: 0.0
  router_jitter_noise: 0.01

  # Regularization
  use_lora_experts: false
  use_expert_offloading: false
  attention_dropout: 0.1
  dropout: 0.1
  layer_norm_eps: 1.0e-5
  initializer_range: 0.02

# Hybrid Caching - conservative for smaller GPU
hybrid_caching:
  enabled: true
  max_cache_size_gb: 0.5  # Reduced for smaller GPU
  kv_cache_ratio: 0.7
  eviction_policy: hybrid
  prefetch_enabled: true
  prefetch_lookahead: 2
  min_score_threshold: 0.1

training:
  precision:
    mixed_precision: bf16

  batching:
    # IMPORTANT: Use smaller batch sizes for heterogeneous GPUs
    # Each GPU gets this batch size, so total = batch_size * num_gpus
    batch_size: 16  # Reduced from 32 - must fit on smallest GPU
    gradient_accumulation_steps: 8  # Increased to maintain effective batch size

    dynamic_batching:
      enabled: true
      min_batch_size: 4          # Lower minimum for safety
      max_batch_size: 24         # Conservative max for smaller GPU
      initial_batch_size: 12     # Safe starting point

      # Memory thresholds - more conservative for heterogeneous setup
      low_memory_threshold: 0.50
      target_memory_threshold: 0.65  # Lower target - smaller GPU is constraint
      high_memory_threshold: 0.75
      critical_memory_threshold: 0.85

      adjustment_frequency: 10
      cooldown_steps: 20  # Longer cooldown for stability
      max_adjustments_per_session: 100
      min_stable_steps: 8

      warmup_steps: 30
      warmup_strategy: linear
      warmup_initial_fraction: 0.5  # Start at 50% capacity

      token_budget:
        enabled: true
        target_tokens_per_batch: 8192   # Reduced for smaller GPU
        max_tokens_per_batch: 12288

      unified_batching:
        enabled: true
        base_token_budget: 8192
        min_token_budget: 2048
        max_token_budget: 12288
        reference_seq_len: 512
        sequence_adjustment_strength: 0.5
        target_memory_utilization: 0.65
        attention_memory_factor: 0.001

      sequence_aware: true
      predictive_enabled: true
      trend_detection_enabled: true
      coordinate_with_grad_accum: true
      backward_safety_margin: 1.20  # Higher margin for safety
      adjustment_strategy: geometric

      aggressive_growth:
        enabled: false

  optimizer:
    type: adamw_8bit
    learning_rate: 3.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.1
    use_fused: true
    eps: 1.0e-8
    max_grad_norm: 1.0

  schedule:
    num_epochs: 3
    max_steps: null
    warmup_steps: 1000
    scheduler_type: cosine_with_restarts
    num_cycles: 3
    min_lr: 1.0e-5

  logging:
    save_steps: 500
    eval_steps: 500
    logging_steps: 50

  validation:
    enabled: true
    batch_size: 16  # Match training batch for consistency
    max_batches: 10
    compute_train_ratio: true

  generation:
    enabled: false
    every_n_steps: 500
    num_per_step: 1
    during_eval: true
    test_quality: false
    max_length: 128
    temperature: 0.8
    top_p: 0.9
    top_k: 50
    repetition_penalty: 1.2
    skip_special_tokens: true
    prompt: "Once upon a time, in a land far away,"

  coherence:
    enabled: false
    eval_every_n_steps: 500
    num_samples: 5

data:
  streaming: true
  buffer_size: 5000
  data_dir: code/data/Ava_Ai/data
  max_length: 512
  train_split: train
  eval_split: validation
  auto_create_validation_split: true
  validation_split_ratio: 0.05
  tokenizer_name: code/data/Ava_Ai/tokenizer
  padding_side: right
  truncation: true

  num_workers: 2  # Reduced for multi-GPU - 2 per GPU
  dataloader_drop_last: true
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 2
  dataloader_persistent_workers: true
  dataloader_samples_per_file: 1000
  skip_dataloader_validation: true

  use_sequence_packing: true
  packing_strategy: greedy
  packing_target_ratio: 0.95

  use_pretokenized: true
  use_all_data: true
  max_files_to_load: null
  lazy_file_discovery: true
  multiprocessing_context: spawn
  cache_size: 10  # Reduced cache per worker
  skip_validation: true
  shuffle_files: true

output:
  output_dir: code/outputs
  save_every: 500
  fresh_start: true

optimizations:
  use_overlapped_checkpointing: true

cuda_streams:
  enabled: true
  num_streams: 4
  use_event_timing: true
  use_stream_pool: true
  high_priority_transfers: true

overlapped_checkpointing:
  enabled: true
  stream_overlap: true
  target_layers: "layers"

double_checkpointing:
  enabled: true
  coarse_checkpoint_interval: 8
  fine_checkpoint_interval: 2
  use_cuda_streams: true

fp8:
  enabled: false

performance:
  enable_cudnn_benchmark: true
  enable_tf32: true
  torchinductor_max_autotune: 0
  enable_torch_compile: false
  torch_compile_mode: default
  torch_compile_fullgraph: false
  torch_compile_dynamic: true

kernel_optimization:
  router_kernel_mode: auto
  use_fused_softmax_topk: true
  router_block_size: 4
  use_sparse_expert_dispatch: false
  use_fused_activations: true
  use_selective_expert_loading: false
  use_vectorized_capacity: true
  use_fused_moe_kernel: false
  enable_kernel_profiling: false

wandb:
  use_wandb: true
  project: ava-training
  entity: null
  tags:
    - heterogeneous-gpu
    - multi-gpu
    - mixed-memory
  notes: |
    Heterogeneous multi-GPU configuration.
    Designed for systems with GPUs of different memory sizes.
    Uses conservative settings based on the smallest GPU.

deepspeed:
  use_deepspeed: true
  config_file: code/configs/distributed/deepspeed_zero2.yaml
