# DEBUG: Absolute minimal config to diagnose OOM
# Disables ALL optimizations to find the culprit

model:
  vocab_size: 50680
  pad_token_id: 0
  eos_token_id: 3
  hidden_size: 256  # TINY
  num_layers: 2  # MINIMAL
  num_attention_heads: 4
  intermediate_size: 512  # TINY
  max_position_embeddings: 2048  # Match data length
  num_experts: 4  # MINIMAL
  num_experts_per_token: 1  # MINIMAL
  router_type: mixtral
  capacity_factor: 1.0
  expert_dropout: 0
  activation: gelu  # Standard activation, no SwiGLU
  use_grouped_gemm: false  # DISABLED
  use_triton_kernels: false  # DISABLED - avoid Triton compilation
  use_torch_compile: false  # DISABLED
  use_flash_attention: false  # DISABLED
  gradient_checkpointing: false  # DISABLED
  use_optimized_moe: false  # DISABLED
  router_z_loss_coef: 0.001
  load_balance_loss_coef: 0.01
  diversity_loss_coef: 0
  expert_dropout_loss_coef: 0
  router_jitter_noise: 0
  use_lora_experts: false
  use_expert_offloading: false
  attention_dropout: 0
  dropout: 0
  layer_norm_eps: 0.00001
  initializer_range: 0.02

moe_memory_optimization:
  use_lora_experts: false
  use_expert_offloading: false
  use_hierarchical_experts: false
  use_expert_quantization: false

dynamic_batching:
  enabled: false  # DISABLED

training:
  batch_size: 4  # MINIMAL
  gradient_accumulation_steps: 1
  optimizer: adamw  # Standard optimizer
  learning_rate: 0.0001
  num_epochs: 1
  max_steps: 100  # Quick test
  warmup_steps: 10
  weight_decay: 0.01
  use_fused_optimizer: false  # DISABLED
  offload_optimizer_state: false
  save_steps: 1000
  eval_steps: 50
  logging_steps: 10
  run_validation: false  # DISABLED for speed
  validation_batch_size: 4
  max_validation_batches: 2
  compute_val_train_ratio: false
  generate_every_n_steps: null
  num_generations_per_step: 0
  generation_during_eval: false
  test_generation_quality: false

evaluation:
  moe_metrics:
    track_expert_utilization: false
    log_frequency: 100
    track_routing_decisions: false
    track_load_balance: false

data:
  streaming: true
  buffer_size: 100  # MINIMAL
  data_dir: code/data/Ava_Ai/data
  max_length: 2048  # Match pretokenized data length
  train_split: train
  eval_split: validation
  auto_create_validation_split: true
  validation_split_ratio: 0.1
  tokenizer_name: code/data/Ava_Ai/tokenizer
  padding_side: right
  truncation: true
  num_workers: 0
  dataloader_drop_last: true
  dataloader_pin_memory: false  # DISABLED
  dataloader_prefetch_factor: 2
  dataloader_persistent_workers: false
  dataloader_samples_per_file: 100
  use_dynamic_batching: false
  use_streaming_tokenization: false
  use_pretokenized: true
  use_sequence_packing: false  # DISABLED
  packing_strategy: greedy
  use_all_data: false  # DISABLED - use limited files
  max_files_to_load: 10  # MINIMAL - only 10 files
  multiprocessing_context: spawn
  cache_size: 10  # MINIMAL
  skip_validation: true

output:
  output_dir: code/outputs
  save_every: 1000
  fresh_start: true

run_management:
  run_name: debug_minimal
  run_description: Debug minimal config to find OOM source
  run_tags: debug,minimal

performance:
  enable_tf32: true
  float32_matmul_precision: medium
  enable_cudnn_benchmark: false  # DISABLED
  torchinductor_max_autotune: 0
  enable_torch_compile: false
  torch_compile_mode: default
  torch_compile_fullgraph: false
  torch_compile_dynamic: false

optimizations:
  torchinductor_autotune: 0
  use_overlapped_checkpointing: false  # DISABLED
  memory_headroom_gb: 4
  memory_cleanup_thresholds:
    warning: 0.60
    critical: 0.70
    emergency: 0.80
  expert_prefetch:
    enabled: false
  expert_cache:
    auto_limit: false
    use_lru_eviction: false
    cache_size: 0
  checkpoint:
    async_saving: false  # DISABLED
  memory_cleanup:
    fast_mode: true
    remove_sleep: true
  dataloader:
    adaptive_file_reading: false
  gradient_checkpointing:
    selective: false
    checkpoint_attention: false
    checkpoint_every_n_layers: 1
  router:
    cache_hash_on_gpu: false
    compile_routers: false
    enable_router_caching: false

cuda_streams:
  enabled: false  # DISABLED

overlapped_checkpointing:
  enabled: false  # DISABLED

double_checkpointing:
  enabled: false

hardware:
  device: cuda
  mixed_precision: fp16  # FP16 instead of BF16
  compile: false

wandb:
  use_wandb: false
  project: ava-training
  entity: null
  tags: [debug]

deepspeed:
  use_deepspeed: false
