# Single GPU Optimized MoE Configuration (RTX 3090 Ti - 24GB)
# ~1B parameters designed to fit comfortably in 24GB VRAM

model:
  vocab_size: 50680
  pad_token_id: 0
  eos_token_id: 3
  hidden_size: 768  # Reduced from 1536 for memory savings
  num_layers: 12    # Reduced from 20 for memory savings
  num_attention_heads: 12  # Must divide hidden_size
  intermediate_size: 2048  # Reduced from 4096
  max_position_embeddings: 1024  # Keep reasonable context
  num_experts: 8    # Reduced from 16 for memory savings
  num_experts_per_token: 2
  router_type: mixtral
  capacity_factor: 1.25
  expert_dropout: 0.1  # Added dropout for regularization
  activation: swiglu
  use_grouped_gemm: true
  use_triton_kernels: true
  use_torch_compile: true
  use_flash_attention: true
  gradient_checkpointing: true  # Critical for memory savings
  gradient_checkpointing_ratio: 0.5  # Reduced checkpointing for better speed
  use_optimized_moe: true
  router_z_loss_coef: 0.001
  load_balance_loss_coef: 0.05
  diversity_loss_coef: 0.001
  expert_dropout_loss_coef: 0.0
  router_jitter_noise: 0.01
  use_expert_offloading: true
  max_active_experts_gpu: 4  # Keep only 4 experts in GPU memory
  offload_eviction_policy: lru
  attention_dropout: 0.1
  dropout: 0.1
  layer_norm_eps: 1.0e-05
  initializer_range: 0.02

moe_memory_optimization:
  use_lora_experts: true  # Enable LoRA for massive memory savings
  lora_rank: 8
  lora_alpha: 16
  freeze_lora_base: false
  use_expert_offloading: true
  max_active_experts_gpu: 4
  offload_prefetch_lookahead: 1
  offload_eviction_policy: lru
  offload_pin_memory: true
  offload_async_transfers: true
  use_hierarchical_experts: false
  use_expert_quantization: true
  expert_quantization_bits: 8
  expert_quantization_method: per_channel
  quantize_inactive_experts: true

training:
  batch_size: 8  # Increased for better GPU utilization
  gradient_accumulation_steps: 32  # Reduced for faster optimizer steps
  optimizer: lion  # Lion optimizer: 50% memory reduction vs AdamW
  learning_rate: 0.0003  # Slightly higher for smaller model
  lion_betas: [0.9, 0.99]
  lr_scheduler_type: cosine
  max_steps: 50000  # Reasonable for testing
  warmup_steps: 5000
  weight_decay: 0.1
  save_steps: 2500
  eval_steps: 5000  # OPTIMIZED: Increased from 2000 for 10-15% speedup (less validation overhead)
  logging_steps: 100  # Less frequent logging
  run_validation: true
  validation_batch_size: 4  # OPTIMIZED: Increased from 1 for parallel validation (4x faster)
  max_validation_batches: 10  # OPTIMIZED: Reduced from 20 for faster validation
  compute_val_train_ratio: true
  generate_every_n_steps: 2500
  num_generations_per_step: 3
  generation_during_eval: false  # OPTIMIZED: Disabled expensive generation during validation
  test_generation_quality: true
  max_grad_norm: 1.0
  compute_coherence_metrics: true

data:
  data_dir: /project/code/data/processed
  streaming: true  # REQUIRED: Enable streaming data loader
  buffer_size: 50000  # Shuffle buffer size for streaming loader
  max_length: 512  # Reduced from 1024 for memory savings
  train_split: train
  eval_split: validation
  auto_create_validation_split: true
  validation_split_ratio: 0.1
  tokenizer_name: /project/code/models/tokenizer/enhanced-50680
  padding_side: right
  truncation: true
  num_workers: 8  # Increased for faster data loading
  dataloader_drop_last: true
  dataloader_pin_memory: true  # Enable for faster GPU transfer
  dataloader_prefetch_factor: 6  # Auto-adjusted based on max_length (see dataloader.py)
  dataloader_persistent_workers: true
  dataloader_samples_per_file: 128  # Increased for better I/O efficiency
  validation_buffer_size: 500
  use_streaming_tokenization: true
  streaming_buffer_size: 5000  # OPTIMIZED: Increased from 1000 for 3-5% throughput gain

output:
  output_dir: /project/code/outputs/runs/tiny_moe_single_gpu
  save_every: 2500
  fresh_start: false

run_management:
  run_name: tiny_moe_single_gpu
  run_description: "1B parameter Single GPU MoE training optimized for RTX 3090 Ti (24GB)"
  run_tags: moe,single-gpu,memory-optimized,1b,lora,lion

performance:
  enable_tf32: true
  float32_matmul_precision: high
  enable_cudnn_benchmark: true
  enable_gpu_memory_cleanup: true  # Enable aggressive memory cleanup
  gradient_check_frequency: 50
  torchinductor_max_autotune: 1  # OPTIMIZED: Enabled for 5-10% speedup
  enable_torch_compile: true
  torch_compile_mode: default  # OPTIMIZED: Changed from reduce-overhead for better MoE routing performance
  torch_compile_fullgraph: false
  torch_compile_dynamic: true

gradient_health:
  enabled: true
  conditional_monitoring: true  # OPTIMIZED: Auto-disable after warmup for 5-8% speedup
  warmup_fraction: 0.1  # Monitor only first 10% of training

# PHASE 2 OPTIMIZATION: Monitoring frequency settings
logging:
  memory_check_freq: 200  # OPTIMIZED: Check memory every 200 steps (was 50)

optimizations:
  gradient_health_monitoring: true
  torchinductor_autotune: 1
  memory_headroom_gb: 3.0  # Reserve 3GB for safety on 24GB GPU
  memory_cleanup_thresholds:
    warning: 0.85  # More aggressive thresholds for single GPU
    critical: 0.90
    emergency: 0.95

  # Single GPU optimizations (no DDP needed)
  ddp:
    adaptive_bucket_size: false  # Not needed for single GPU
    gradient_as_bucket_view: false
    static_graph: false
    optimize_gradient_accumulation: true  # Still useful for accumulation

  expert_parallel:
    overlap_backward_comm: false  # No communication on single GPU
    enable_expert_cache: true
    expert_cache_size: 4  # Smaller cache for single GPU
    enable_layer_pipelining: false

  expert_prefetch:
    enabled: true
    lookahead: 1  # Reduced lookahead for memory
    use_multiple_streams: true
  expert_cache:
    auto_limit: true
    use_lru_eviction: true
    clear_after_optimizer_step: true
  checkpoint:
    async_saving: false  # Sync saving for single GPU
  memory_cleanup:
    fast_mode: true
    remove_sleep: true
  dataloader:
    adaptive_file_reading: true
    adaptive_multipliers:
      large_files: 4
      medium_files: 2
      small_files: 1
  gradient_checkpointing:
    selective: true
    checkpoint_attention: true  # Also checkpoint attention for max savings
  router:
    cache_hash_on_gpu: true
    compile_routers: false  # Disable compilation for memory
    compile_mode: "default"
    compile_dynamic: true

hardware:
  device: cuda
  mixed_precision: bf16
  compile: false

  # Single GPU Configuration
  num_gpus: 1  # Single GPU

  # Disable GPU Load Balancing for single GPU
  use_gpu_load_balancing: false
  balancing_strategy: none
  rebalance_interval: 0
  adaptive_rebalance_interval: false
  enable_expert_migration: false
  migration_threshold: 0.0
  max_migrations_per_rebalance: 0
  log_gpu_metrics: true

wandb:
  use_wandb: true
  wandb_cache_size: 1000
  wandb_cache_flush_interval: 100
  wandb_offline: false
  disable_wandb: false

# IMPORTANT: DeepSpeed disabled for single GPU
# ZeRO-1 provides no benefit on single GPU and adds overhead
deepspeed:
  use_deepspeed: false  # DISABLED for single GPU

# Memory calculations for this configuration:
# Model parameters: ~1B (768 hidden × 12 layers × 8 experts)
# With bf16: ~2GB model weights
# Lion optimizer states: ~2GB (50% of AdamW)
# Gradients: ~2GB
# Activations with gradient checkpointing: ~2-4GB
# Total estimated: ~8-10GB out of 24GB available
# Leaves 14-16GB headroom for peak memory usage