# Fine-tuning Configuration - Matches checkpoint from run_20251120_232627
# Checkpoint: 62.4M parameters
# Max length: 256 tokens (from checkpoint)
# Dataset: Can be changed to OpenOrca

model:
  vocab_size: 50680
  pad_token_id: 0
  eos_token_id: 3
  hidden_size: 512
  num_layers: 4
  num_attention_heads: 8
  intermediate_size: 2048
  max_position_embeddings: 256  # CRITICAL: Must match checkpoint (was 256)
  num_experts: 2
  num_experts_per_token: 1
  router_type: mixtral
  capacity_factor: 1
  expert_dropout: 0
  activation: swiglu
  use_grouped_gemm: true
  use_triton_kernels: true
  use_torch_compile: true
  use_flash_attention: true
  gradient_checkpointing: true
  use_optimized_moe: true
  router_z_loss_coef: 0.001
  load_balance_loss_coef: 0.1
  diversity_loss_coef: 0
  expert_dropout_loss_coef: 0
  router_jitter_noise: 0.01
  use_lora_experts: false
  use_expert_offloading: false
  attention_dropout: 0
  dropout: 0
  layer_norm_eps: 0.00001
  initializer_range: 0.02

moe_memory_optimization:
  use_lora_experts: false
  use_expert_offloading: false
  use_hierarchical_experts: false
  use_expert_quantization: false

dynamic_batching:
  enabled: false

training:
  batch_size: 48  # Reduced from 64 to avoid OOM
  gradient_accumulation_steps: 2  # Increased to maintain effective batch size of 512
  optimizer: lion
  learning_rate: 0.00005  # Lower LR for finetuning
  lion_betas:
    - 0.9
    - 0.99
  num_epochs: 3
  max_steps: null
  warmup_steps: 500
  weight_decay: 0.2
  use_fused_optimizer: true
  offload_optimizer_state: false
  save_steps: 1000
  eval_steps: 100
  logging_steps: 10
  run_validation: true
  validation_batch_size: 16  # Reduced from 32 to avoid OOM during validation
  max_validation_batches: 10
  compute_val_train_ratio: true
  generate_every_n_steps: 500  # Generate sample text every 500 steps
  num_generations_per_step: 2   # Generate 2 samples each time
  generation_during_eval: true
  test_generation_quality: true
  generation_max_length: 256
  generation_temperature: 0.85
  generation_top_p: 0.92
  generation_top_k: 50
  generation_repetition_penalty: 1.15
  generation_skip_special_tokens: true
  generation_prompt: "System: You are a helpful assistant.\nUser: What is the capital of France?\nAssistant:"
  alternative_prompts:
    - "System: You are a helpful assistant, who always provides clear explanations.\nUser: Explain how photosynthesis works.\nAssistant:"
    - "System: You are a knowledgeable AI assistant.\nUser: Write a short story about a robot.\nAssistant:"
    - "System: You are a helpful coding assistant.\nUser: Write a Python function to calculate fibonacci numbers.\nAssistant:"

evaluation:
  moe_metrics:
    track_expert_utilization: true
    log_frequency: 50
    track_routing_decisions: true
    track_load_balance: true

data:
  streaming: true
  buffer_size: 2000
  data_dir: /project/code/data/processed  # Change to OpenOrca if desired
  max_length: 256  # Match checkpoint
  train_split: train
  eval_split: validation
  auto_create_validation_split: true
  validation_split_ratio: 0.05
  tokenizer_name: /project/code/data/Ava_Ai/tokenizer
  padding_side: right
  truncation: true
  num_workers: 8
  dataloader_drop_last: true
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 4
  dataloader_persistent_workers: true
  dataloader_samples_per_file: 500
  use_dynamic_batching: false
  use_streaming_tokenization: false
  use_pretokenized: false
  use_sequence_packing: false
  packing_strategy: adaptive
  use_all_data: true
  max_files_to_load: 10000
  multiprocessing_context: spawn
  cache_size: 200
  skip_validation: true

output:
  output_dir: /project/code/outputs
  save_every: 1000
  fresh_start: false

run_management:
  run_name: finetune_from_checkpoint
  run_description: "Fine-tuning from checkpoint with matching architecture"
  run_tags: finetune,resume,checkpoint

performance:
  enable_tf32: true
  float32_matmul_precision: high
  enable_cudnn_benchmark: true
  torchinductor_max_autotune: 1
  enable_torch_compile: true
  torch_compile_mode: reduce-overhead
  torch_compile_fullgraph: false
  torch_compile_dynamic: true

optimizations:
  torchinductor_autotune: 1
  use_overlapped_checkpointing: true # 10-20% speedup from stream-based recomputation
  memory_headroom_gb: 1
  memory_cleanup_thresholds:
    warning: 0.75
    critical: 0.85
    emergency: 0.95
  expert_prefetch:
    enabled: false
  expert_cache:
    auto_limit: false
    use_lru_eviction: false
    cache_size: 0
  checkpoint:
    async_saving: true
  memory_cleanup:
    fast_mode: true
    remove_sleep: true
  dataloader:
    adaptive_file_reading: false
  gradient_checkpointing:
    selective: false
    checkpoint_attention: true
    checkpoint_every_n_layers: 1
  router:
    cache_hash_on_gpu: true
    compile_routers: true
    enable_router_caching: true

# CUDA Stream Optimizations - reduces synchronization overhead
# Uses StreamPool (reusable streams), CUDATimer (event-based timing),
# efficient_sync (current-stream only), NonBlockingTransfer (async CPU<->GPU)
cuda_streams:
  enabled: true
  num_streams: 4              # Stream pool size for recomputation
  use_event_timing: true      # Use CUDA events instead of synchronize+time
  use_stream_pool: true       # Reuse streams instead of creating new
  high_priority_transfers: true  # Priority streams for CPU<->GPU

# Overlapped checkpointing - uses optimized CUDA streams
overlapped_checkpointing:
  enabled: true               # 10-20% speedup from overlapped recomputation
  stream_overlap: true        # Use CUDA StreamPool for overlapping
  target_layers: "layers"     # Apply to transformer layers

# Double checkpointing - disabled for fine-tuning (short sequences)
double_checkpointing:
  enabled: false              # Only enable for sequences > 2048
  coarse_checkpoint_interval: 8
  fine_checkpoint_interval: 2
  use_cuda_streams: true      # Uses optimized stream utilities

hardware:
  device: cuda
  mixed_precision: bf16
  compile: false

wandb:
  use_wandb: true
  enabled: true
  project: ava-finetuning
  entity: null
  tags:
    - finetune
    - checkpoint-resume
  notes: "Fine-tuning from pre-trained checkpoint"
  log_model: false
  log_gradients: false

deepspeed:
  use_deepspeed: false