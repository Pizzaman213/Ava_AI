model:
  vocab_size: 50680
  hidden_size: 1024 
  num_layers: 8
  num_attention_heads: 8
  intermediate_size: 2560
  max_position_embeddings: 512
  num_experts: 12
  num_experts_per_token: 2
  router_type: mixtral
  capacity_factor: 1.25
  expert_dropout: 0.0
  activation: swiglu
  use_grouped_gemm: true
  use_triton_kernels: true
  use_torch_compile: true
  use_flash_attention: true
  gradient_checkpointing: true
  use_optimized_moe: true
  router_z_loss_coef: 0.001
  load_balance_loss_coef: 0.05  # COHERENCE FIX: Increased from 0.01 to prevent expert collapse
  diversity_loss_coef: 0.001
  expert_dropout_loss_coef: 0.0
  router_jitter_noise: 0.01  # COHERENCE FIX: Added exploration noise (was 0.0)
  use_lora_experts: false
  lora_rank: 4
  lora_alpha: 8
  freeze_lora_base: false
  use_expert_offloading: true
  max_active_experts_gpu: 4  # Unified with moe_memory_optimization section for consistency
  offload_eviction_policy: lru
  attention_dropout: 0.0
  dropout: 0.0
  layer_norm_eps: 1.0e-05
  initializer_range: 0.02
moe_memory_optimization:
  # === HYBRID MODE ENABLED ===
  # Combines LoRA + Offloading + Quantization for 99.9%+ memory savings!
  use_lora_experts: true
  lora_rank: 8  # COHERENCE FIX: Increased from 4 for better expert capacity
  lora_alpha: 16  # COHERENCE FIX: Scaled with rank (was 8)
  freeze_lora_base: false
  use_expert_offloading: true
  max_active_experts_gpu: 6  # COHERENCE FIX: Increased from 4 to reduce offloading latency
  offload_prefetch_lookahead: 1
  offload_eviction_policy: lru
  offload_pin_memory: true
  offload_async_transfers: true
  use_hierarchical_experts: false
  # NEW: Enable quantization for hybrid mode
  use_expert_quantization: true  # HYBRID MODE: Enables INT8 quantization
  expert_quantization_bits: 8     # INT8 for balance (8 or 4)
  expert_quantization_method: per_channel  # Better accuracy than per_tensor
  quantize_inactive_experts: true  # Quantize experts when on CPU
training:
  batch_size: 32  # ULTRA-LOW-MEM: Reduced to prevent OOM with dataloader workers
  gradient_accumulation_steps: 8  # ULTRA-LOW-MEM: Increased to maintain effective batch=256
  learning_rate: 0.0002
  max_steps: 50000  # COHERENCE FIX: Changed from 10 to allow proper training
  warmup_steps: 5000  # COHERENCE FIX: Changed from 7000 to 10% of max_steps
  weight_decay: 0.1
  save_steps: 5000
  eval_steps: 1000
  logging_steps: 100
  run_validation: true
  validation_batch_size: 1
  max_validation_batches: 100
  compute_val_train_ratio: true
  generate_every_n_steps: 5000
  num_generations_per_step: 1
  generation_during_eval: false
  test_generation_quality: false
  max_grad_norm: 1.0
  
data:
  dataset_name: OpenAssistant_oasst2_processed.jsonl
  data_dir: /project/code/data/processed
  max_length: 512  # COHERENCE FIX: Increased from 128 to learn longer-range dependencies
  train_split: train
  eval_split: validation
  auto_create_validation_split: true
  validation_split_ratio: 0.1
  tokenizer_name: /project/code/models/tokenizer/enhanced-50680
  padding_side: right
  truncation: true
  num_workers: 2  # ULTRA-LOW-MEM: Minimal workers to prevent CPU OOM (was 0, dataloader overrode to 8)
  dataloader_drop_last: true
  dataloader_pin_memory: false  # ULTRA-LOW-MEM: Disabled to save memory
  dataloader_prefetch_factor: 2  # ULTRA-LOW-MEM: Minimal prefetch per worker (was null)
output:
  output_dir: /project/code/outputs/runs/tiny_moe_ultra_low_mem
  save_every: 5000
  fresh_start: false
run_management:
  run_name: tiny_moe_ultra_low_mem
  run_description: "HYBRID MODE: Ultra low memory with LoRA r=4 + CPU offloading + INT8 quantization (99.9%+ savings)"
  run_tags: moe,lora,offloading,quantization,hybrid-mode,ultra-low-memory
performance:
  enable_tf32: true
  float32_matmul_precision: high
  enable_cudnn_benchmark: true
  enable_gpu_memory_cleanup: false
  gradient_check_frequency: 10
  torchinductor_max_autotune: 1  # OPTIMIZATION: Enable auto-tuning for 10-15% speedup
  torch_compile_mode: default  # BUGFIX: Use 'default' mode instead of 'reduce-overhead' to avoid CUDA graph issues

gradient_health:
  enabled: true  # COHERENCE FIX: Re-enabled to detect training instabilities (5-8% slower)

# OPTIMIZATION SETTINGS - All Phase 1, 2, 3 optimizations are configurable here
optimizations:
  # Phase 1: Quick Wins (40-50% speedup)
  gradient_health_monitoring: true  # COHERENCE FIX: Re-enabled (was false)
  torchinductor_autotune: 1  # 0=off, 1=basic, 2=aggressive (10-15% speedup)

  # Memory Management
  memory_cleanup_thresholds:
    warning: 0.990   # Trigger warning at 99.0% GPU memory (was 98.5%)
    critical: 0.995  # Trigger critical cleanup at 99.5% (was 99.2%)
    emergency: 0.999 # Trigger emergency cleanup at 99.9% (was 99.8%)

  # Phase 2: Expert Offloading Optimizations (25-35% speedup with offloading)
  expert_prefetch:
    enabled: true              # Multi-stage async prefetch (CRITICAL for offloading!)
    lookahead: 1               # Reduced for ultra-low-mem (1-3)
    use_multiple_streams: true # Use multiple CUDA streams

  expert_cache:
    auto_limit: true           # CRITICAL: Automatically limit cache to prevent OOM
    use_lru_eviction: true     # LRU eviction when cache is full

  # Phase 2: Checkpoint Optimizations (saves 20-30s per checkpoint)
  checkpoint:
    async_saving: true         # Save checkpoints in background thread

  # Phase 2: GPU Memory Cleanup (saves ~2.5s per cleanup)
  memory_cleanup:
    fast_mode: true            # Reduced cleanup rounds (2 vs 5, 1 vs 3)
    remove_sleep: true         # Remove sleep between cleanup rounds

  # Phase 2: Data Loading (20-30% faster I/O)
  dataloader:

    adaptive_file_reading: true    # Adjust samples per file based on file size
    adaptive_multipliers:
      large_files: 4          # Multiplier for files >10MB
      medium_files: 2         # Multiplier for files >1MB
      small_files: 1          # Multiplier for files <1MB

  # Phase 2: Gradient Checkpointing (25% memory, 8% slowdown)
  gradient_checkpointing:
    selective: true            # Only checkpoint MoE/FFN layers, not attention
    checkpoint_attention: false # Set to true for full checkpointing

  # Router Optimizations
  router:
    cache_hash_on_gpu: true    # Compute routing cache hash on GPU (15-20% faster eval)
    compile_routers: true      # torch.compile routers for 20-30% speedup
    compile_mode: "default"    # "default" or "reduce-overhead"
    compile_dynamic: true      # Handle variable sequence lengths

hardware:
  device: cuda
  mixed_precision: bf16
  compile: true
wandb:
  use_wandb: false
deepspeed:
  use_deepspeed: false
