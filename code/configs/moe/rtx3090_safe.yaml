# Safe Configuration for RTX 3090 Ti (24GB)
# Disables torch.compile to avoid RAM OOM during compilation
# Conservative batch sizes for stable training

model:
  vocab_size: 50680
  pad_token_id: 0
  eos_token_id: 3
  hidden_size: 1024
  num_layers: 12
  num_attention_heads: 16
  intermediate_size: 4096
  max_position_embeddings: 2048
  num_experts: 8
  num_experts_per_token: 2
  router_type: mixtral
  capacity_factor: 1.25
  expert_dropout: 0
  activation: swiglu
  use_grouped_gemm: true
  use_triton_kernels: true
  use_torch_compile: false  # DISABLED: torch.compile uses huge RAM
  use_flash_attention: true
  gradient_checkpointing: true
  use_optimized_moe: true
  router_z_loss_coef: 0.001
  load_balance_loss_coef: 0.1
  diversity_loss_coef: 0
  expert_dropout_loss_coef: 0
  router_jitter_noise: 0.01
  use_lora_experts: false
  use_expert_offloading: false
  attention_dropout: 0
  dropout: 0
  layer_norm_eps: 0.00001
  initializer_range: 0.02

moe_memory_optimization:
  use_lora_experts: false
  use_expert_offloading: false
  use_hierarchical_experts: false
  use_expert_quantization: false

dynamic_batching:
  enabled: true
  min_batch_size: 4
  max_batch_size: 64  # Conservative for 24GB GPU
  token_budget:
    enabled: true
    target_tokens_per_batch: 4096
    max_tokens_per_batch: 8192
    min_tokens_per_batch: 512
  sequence_aware: false
  base_sequence_length: 128
  sequence_scaling_factor: 0.8
  sync_across_gpus: false
  sync_strategy: min
  coordinate_with_grad_accum: true
  target_effective_batch_size: 256
  dynamic_grad_accum: false
  predictive:
    enabled: true
    calibration_steps: 50
    memory_model: linear
  low_memory_threshold: 0.50
  target_memory_threshold: 0.70  # Conservative
  high_memory_threshold: 0.80
  critical_memory_threshold: 0.90
  warmup_strategy: geometric
  warmup_steps: 50
  warmup_growth_rate: 1.2
  warmup_initial_fraction: 0.25
  trend_detection:
    enabled: true
    window: 20
    oscillation_threshold: 5
    auto_tune_smoothing: true
  increase_factor: 4
  decrease_factor: 8
  adjustment_frequency: 25
  cooldown_steps: 10
  max_adjustments_per_session: 500

training:
  batch_size: 16  # SAFE: Start small, dynamic batching will increase
  gradient_accumulation_steps: 4
  optimizer: lion
  learning_rate: 0.0001
  lion_betas:
    - 0.9
    - 0.99
  num_epochs: 2
  max_steps: null
  warmup_steps: 1000
  weight_decay: 0.1
  use_fused_optimizer: true
  offload_optimizer_state: false
  save_steps: 500
  eval_steps: 50
  logging_steps: 10
  run_validation: true
  validation_batch_size: 32
  max_validation_batches: 10
  compute_val_train_ratio: true
  generate_every_n_steps: null
  num_generations_per_step: 0
  generation_during_eval: false
  test_generation_quality: false
  generation_max_length: 256
  generation_temperature: 0.85
  generation_top_p: 0.92
  generation_top_k: 50
  generation_repetition_penalty: 1.15
  generation_skip_special_tokens: true
  generation_prompt: Once upon a time, in a land far away,
  alternative_prompts:
    - The quick brown fox
    - In the beginning
    - A long time ago

evaluation:
  moe_metrics:
    track_expert_utilization: true
    log_frequency: 50
    track_routing_decisions: true
    track_load_balance: true

data:
  streaming: true
  buffer_size: 2000
  data_dir: code/data/Ava_Ai/data
  max_length: 2048  # Match pretokenized data length
  train_split: train
  eval_split: validation
  auto_create_validation_split: true
  validation_split_ratio: 0.1
  tokenizer_name: code/data/Ava_Ai/tokenizer
  padding_side: right
  truncation: true
  num_workers: 0  # CRITICAL: Prevent RAM OOM from worker processes
  dataloader_drop_last: true
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 2
  dataloader_persistent_workers: false  # DISABLED: With num_workers=0
  dataloader_samples_per_file: 500
  use_dynamic_batching: false
  use_streaming_tokenization: false
  use_pretokenized: true
  use_sequence_packing: true
  packing_strategy: adaptive
  use_all_data: true
  max_files_to_load: 10000
  multiprocessing_context: spawn
  cache_size: 200
  skip_validation: true

output:
  output_dir: code/outputs
  save_every: 500
  fresh_start: false

run_management:
  run_name: rtx3090_safe
  run_description: Safe configuration for RTX 3090 Ti (24GB), no torch.compile
  run_tags: rtx3090,safe,moe

performance:
  enable_tf32: true
  float32_matmul_precision: high
  enable_cudnn_benchmark: true
  torchinductor_max_autotune: 0  # DISABLED: Saves RAM
  enable_torch_compile: false  # CRITICAL: Disabled to prevent RAM OOM
  torch_compile_mode: default
  torch_compile_fullgraph: false
  torch_compile_dynamic: false

optimizations:
  torchinductor_autotune: 0
  use_overlapped_checkpointing: true
  memory_headroom_gb: 2
  memory_cleanup_thresholds:
    warning: 0.70
    critical: 0.80
    emergency: 0.90
  expert_prefetch:
    enabled: false
  expert_cache:
    auto_limit: false
    use_lru_eviction: false
    cache_size: 0
  checkpoint:
    async_saving: true
  memory_cleanup:
    fast_mode: true
    remove_sleep: true
  dataloader:
    adaptive_file_reading: false
  gradient_checkpointing:
    selective: false
    checkpoint_attention: true
    checkpoint_every_n_layers: 1
  router:
    cache_hash_on_gpu: true
    compile_routers: false  # DISABLED: Saves RAM
    enable_router_caching: false

cuda_streams:
  enabled: true
  num_streams: 4
  use_event_timing: true
  use_stream_pool: true
  high_priority_transfers: true

overlapped_checkpointing:
  enabled: true
  stream_overlap: true
  target_layers: "layers"

double_checkpointing:
  enabled: false
  coarse_checkpoint_interval: 8
  fine_checkpoint_interval: 2
  use_cuda_streams: true

hardware:
  device: cuda
  mixed_precision: bf16
  compile: false

wandb:
  use_wandb: false
  project: ava-training
  entity: null
  tags:
    - rtx3090
    - safe
    - moe
  notes: Safe configuration for RTX 3090 Ti (24GB)

deepspeed:
  use_deepspeed: false