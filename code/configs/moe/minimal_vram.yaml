# =============================================================================
# MINIMAL VRAM Configuration - Optimized for low GPU memory usage
# =============================================================================
# Estimated VRAM: ~4-5 GB (down from ~10GB)
# Trade-offs: Slower training, smaller batches, no caching
# =============================================================================

# =============================================================================
# MODEL - Same architecture, memory-saving options enabled
# =============================================================================
model:
  vocab_size: 32000
  pad_token_id: 0
  eos_token_id: 102
  bos_token_id: 101
  tokenizer_path: pretokenized_data/tokenizers/vocab
  hidden_size: 512
  num_layers: 6
  num_attention_heads: 8
  intermediate_size: 1024
  max_position_embeddings: 256
  num_experts: 4
  num_experts_per_token: 2
  router_type: mixtral
  capacity_factor: 1.25
  quantize_kv_cache: true
  expert_dropout: 0.05
  activation: swiglu
  tie_word_embeddings: false

  # GPU Optimizations - ALL ENABLED for memory savings
  use_grouped_gemm: true
  use_triton_kernels: true
  use_torch_compile: false
  use_flash_attention: true           # 40% memory savings
  gradient_checkpointing: true        # 70-80% memory savings
  use_optimized_moe: true

  # MoE loss coefficients
  router_z_loss_coef: 0.001
  load_balance_loss_coef: 0.01
  diversity_loss_coef: 0.01
  expert_dropout_loss_coef: 0.0
  router_jitter_noise: 0.00

  # Regularization
  entropy_regularization: 0.0
  output_diversity_weight: 0.0
  eos_logit_bias: 0.0
  attention_dropout: 0.0
  dropout: 0.0
  layer_norm_eps: 1.0e-5
  initializer_range: 0.02

# =============================================================================
# TRAINING - Smaller batches, memory-efficient optimizer
# =============================================================================
training:
  precision:
    mixed_precision: bf16

  batching:
    batch_size: 16                    # REDUCED from 32 (saves ~30% VRAM)
    gradient_accumulation_steps: 8    # Keep effective batch size = 128
    label_smoothing: 0.0

  optimizer:
    type: adamw                       # Consider: adamw_8bit for more savings
    learning_rate: 5.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.1
    use_fused: true
    max_grad_norm: 1.0

  schedule:
    num_epochs: 3
    max_steps: null
    total_steps: 600000
    steps_per_epoch: 200000
    warmup_steps: 1000
    scheduler_type: constant
    num_cycles: 1
    min_lr: 5.0e-4

  logging:
    save_steps: 500
    eval_steps: 500
    logging_steps: 10
    use_tensorboard: false
    use_wandb: true

  validation:
    enabled: true
    batch_size: 64                    # REDUCED from 128
    max_batches: 10
    compute_train_ratio: true
    early_stopping_patience: 5
    early_stopping_min_delta: 0.01

  generation:
    enabled: true
    generate_every_n_steps: 500
    num_per_step: 3
    during_eval: true
    test_quality: true
    max_length: 100
    temperature: 0.7
    top_p: 0.9
    top_k: 25
    repetition_penalty: 1.2
    no_repeat_ngram_size: 3
    skip_special_tokens: true
    eos_token_id: 102
    bos_token_id: 101
    pad_token_id: 0
    prompt: "Once upon a time"
    alternative_prompts:
      - "The quick brown fox"
      - "In the beginning"
      - "Hello, my name is"

  coherence:
    enabled: false

# =============================================================================
# DATA - Same loading, shorter sequences option
# =============================================================================
data:
  streaming: false
  use_pretokenized: true
  buffer_size: 10000
  enable_length_sorting: false

  data_dir: pretokenized_data/data/TinyStories
  val_data_dir: null
  max_length: 256                     # Can reduce to 128 for more savings
  add_special_tokens: false
  train_split: train
  eval_split: validation
  auto_create_validation_split: true
  validation_split_ratio: 0.05
  tokenizer_name: pretokenized_data/tokenizers/vocab
  padding_side: right
  truncation: false

  # Data loading
  num_workers: 4                      # REDUCED from 6
  prefetch_factor: 2                  # REDUCED from 4
  persistent_workers: true
  dataloader_drop_last: true
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 2
  dataloader_persistent_workers: true
  dataloader_samples_per_file: 4000
  skip_dataloader_validation: true

  # Sequence packing
  use_sequence_packing: true
  packing_strategy: greedy
  packing_target_ratio: 0.95

  # Data discovery
  use_all_data: true
  max_files_to_load: null
  lazy_file_discovery: true
  multiprocessing_context: spawn
  cache_size: 50
  skip_validation: false
  shuffle_files: true

  # Indexed loader
  use_indexed_loader: false

# =============================================================================
# COMPUTE - Memory-focused settings
# =============================================================================
compute:
  performance:
    enable_cudnn_benchmark: true
    enable_tf32: true
    torchinductor_max_autotune: 0
    enable_torch_compile: false
    torch_compile_mode: default
    torch_compile_fullgraph: false
    torch_compile_dynamic: true

  kernels:
    router_kernel_mode: auto
    use_fused_softmax_topk: true
    router_block_size: 4
    use_sparse_expert_dispatch: true
    use_fused_activations: true
    use_selective_expert_loading: true
    use_vectorized_capacity: true
    use_fused_moe_kernel: true
    enable_kernel_profiling: false

  cuda:
    streams:
      enabled: false
    graphs:
      enabled: false

  memory:
    headroom_gb: 2.0                  # REDUCED from 3.0
    cleanup_thresholds:
      warning: 0.80                   # More aggressive cleanup
      critical: 0.85
      emergency: 0.90

  optimizations:
    use_overlapped_checkpointing: false  # DISABLED to save memory

  calibration:
    batch_size:
      enabled: false

# =============================================================================
# DISTRIBUTED
# =============================================================================
distributed:
  deepspeed:
    enabled: false

# =============================================================================
# LOGGING - Reduced frequency to lower overhead
# =============================================================================
logging:
  disabled: false
  silent_mode: false

  console:
    enabled: true
    level: info

  file:
    enabled: true
    level: debug

  progress_bar_enabled: true
  step_logging_enabled: true
  epoch_logging_enabled: true

  metrics:
    training: true
    gradients: false                  # DISABLED to reduce memory
    moe: true
    validation: true
    coherence: false
    quality: true
    memory: true
    timing: false                     # DISABLED
    generations: true

  wandb:
    enabled: true
    project: ava-training
    entity: null
    tags:
      - minimal_vram
      - low_memory
    notes: Minimal VRAM configuration for memory-constrained GPUs
    log_freq: 10
    log_training: true
    log_gradients: false              # DISABLED
    log_moe: true
    log_validation: true
    log_coherence: false
    log_quality: true
    log_memory: true
    log_timing: false
    log_generations: true
    log_per_layer_grads: false
    log_routing_diagnostics: false
    log_model_topology: false

  tensorboard:
    enabled: false

  frequencies:
    log_interval: 500
    verbose_log_interval: 1000
    metrics: 500
    memory_check: 2000
    health_summary: 1000
    moe_metrics: 5000

  features:
    timing_breakdown: false           # DISABLED
    memory_profiling: true
    health_summaries: true
    tensor_shapes: false              # DISABLED
    checkpoint_validation: true
    sample_generations: true
    structured_logging: true
    log_format: default

  diagnostics:
    enabled: false                    # DISABLED

# =============================================================================
# CHECKPOINTS
# =============================================================================
checkpoints:
  output_dir: code/outputs
  save_every: 500
  fresh_start: true

  selection:
    enabled: true
    val_loss_weight: 0.5
    coherence_score_weight: 0.3
    perplexity_weight: 0.2
    perplexity_cap: 100.0
    val_loss_cap: 10.0
    higher_is_better: true
    require_all_metrics: false
    fallback_to_val_loss: true

# =============================================================================
# EXPERIMENTAL - ALL CACHING DISABLED
# =============================================================================
experimental:
  caching:
    enabled: false                    # DISABLED - saves ~2GB

    activation_cache:
      enabled: false
      max_size_gb: 0

    kv_cache:
      enabled: false
      max_size_gb: 0

  checkpointing:
    overlapped:
      enabled: false                  # DISABLED

    double:
      enabled: false                  # DISABLED

  fp8:
    enabled: false
