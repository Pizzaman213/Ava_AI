# =============================================================================
# GENERALIZATION-FOCUSED Configuration
# =============================================================================
# Purpose: Fix model generalization issues (coherent output despite decreasing loss)
#
# USAGE:
#   python code/scripts/5_training/train_pipeline.py --config code/configs/moe/generalization.yaml
#
# Key changes from large.yaml:
#   1. ZERO regularization (was causing memorization, not learning)
#   2. Top-2 routing (robustness vs fragile top-1)
#   3. Clean TinyStories data (no instruction templates like [ASSISTANT], A:)
#   4. Higher generation temperature (show true quality)
#   5. NO gradient checkpointing (fixes "different metadata" recomputation errors)
#   6. ZeRO-1 enabled (compensates for memory without checkpointing)
#   7. Smaller batch size (48 vs 86) with more gradient accumulation
#
# Hardware: NVIDIA GeForce RTX 3090 Ti (24GB), 61GB System RAM
# Model: 446M parameter MoE with 4 experts
# =============================================================================

# =============================================================================
# MODEL - Architecture, MoE, tokens, regularization
# =============================================================================
model:
  vocab_size: 32000
  pad_token_id: 0
  eos_token_id: 5
  bos_token_id: 2
  hidden_size: 768
  num_layers: 12
  num_attention_heads: 12
  intermediate_size: 3072
  max_position_embeddings: 512
  num_experts: 4
  num_experts_per_token: 2        # CHANGED: top-2 routing (was 1) - more robust
  router_type: mixtral
  capacity_factor: 1.5            # CHANGED: increased for top-2 (was 1.25)
  quantize_kv_cache: true
  expert_dropout: 0.0             # CHANGED: removed (was 0.05)
  activation: swiglu

  # GPU Optimizations
  use_grouped_gemm: true
  use_triton_kernels: true
  use_flash_attention: true
  gradient_checkpointing: false    # CHANGED: disabled - incompatible with MoE routing (causes recomputation shape errors)
  use_optimized_moe: true

  # MoE loss coefficients
  router_z_loss_coef: 0.0001
  load_balance_loss_coef: 0.01    # CHANGED: increased for better expert utilization (was 0.001)
  diversity_loss_coef: 0.0
  expert_dropout_loss_coef: 0.0
  router_jitter_noise: 0.0        # CRITICAL: Must be 0.0 when gradient_checkpointing=true
  aux_loss_frequency: 500

  # Coherence regularization
  entropy_regularization: 0.0
  output_diversity_weight: 0.0
  eos_logit_bias: 0.1

  # Regularization - ALL REMOVED to prevent memorization
  attention_dropout: 0.0          # CHANGED: removed (was 0.1)
  dropout: 0.0                    # CHANGED: removed (was 0.1)
  label_smoothing: 0.0            # CHANGED: removed (was 0.1)
  tie_word_embeddings: false
  layer_norm_eps: 1.0e-5
  initializer_range: 0.02

# =============================================================================
# TRAINING - Optimizer, schedule, batching, validation
# =============================================================================
training:
  precision:
    mixed_precision: bf16

  # Pipeline Micro-batching (disabled - only beneficial for 16+ layers)
  use_pipeline_microbatching: false
  pipeline_overlap_factor: 2

  batching:
    batch_size: 24                # CHANGED: reduced for no-checkpointing + top-2 (was 86)
    gradient_accumulation_steps: 8  # CHANGED: increased to compensate for smaller batch

  optimizer:
    type: AdamW
    learning_rate: 1.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.01            # CHANGED: reduced (was 0.1)
    use_fused: true
    max_grad_norm: 1.0

  schedule:
    num_epochs: 1
    max_steps: null
    steps_per_epoch: 10000
    warmup_steps: 2000            # CHANGED: increased (was 1000)
    scheduler_type: cosine
    num_cycles: 1
    min_lr: 1.0e-5

  logging:
    save_steps: 1000
    eval_steps: 1000
    logging_steps: 10
    use_tensorboard: false
    use_wandb: true

  validation:
    enabled: true
    batch_size: 32
    max_batches: 10
    compute_train_ratio: true

  generation:
    enabled: true
    generate_every_n_steps: 100
    num_per_step: 1
    during_eval: true
    test_quality: true
    max_length: 128
    temperature: 0.7              # CHANGED: increased to show true quality (was 0.1)
    top_p: 0.9
    top_k: 50                     # CHANGED: increased (was 10)
    repetition_penalty: 1.2
    no_repeat_ngram_size: 3
    skip_special_tokens: true
    prompt: "Once upon a time, in a land far away,"
    alternative_prompts:
      - "The quick brown fox"
      - "In the beginning"
      - "A long time ago"

  coherence:
    enabled: true
    eval_every_n_steps: 5000
    num_samples: 2
    max_generation_length: 100
    temperature: 0.5
    top_p: 0.9
    top_k: 25
    log_to_wandb: true
    log_to_console: false
    use_fast: true
    use_bf16: true
    micro_batch_size: 16

# =============================================================================
# DATA - Loading, streaming, packing, splits
# =============================================================================
data:
  streaming: false
  buffer_size: 30000
  fast_startup: false
  progressive_buffer: false
  min_buffer_size: 10000
  warm_start_files: 10
  skip_sequence_count: true
  enable_length_sorting: false

  data_dir: pretokenized_data/data/TinyStories  # CHANGED: clean narrative data (no instruction templates)
  max_length: 512
  train_split: train
  eval_split: validation
  auto_create_validation_split: true
  validation_split_ratio: 0.05
  tokenizer_name: pretokenized_data/tokenizers/vocab
  padding_side: right
  truncation: false

  # Data loading
  num_workers: 2
  prefetch_factor: 4
  persistent_workers: true
  dataloader_drop_last: true
  dataloader_pin_memory: true
  dataloader_samples_per_file: 200
  skip_dataloader_validation: true
  timeout: 300
  examples_per_random_select: 5000

  # Sequence packing disabled - conflicts with gradient checkpointing
  use_sequence_packing: false
  packing_strategy: greedy
  packing_target_ratio: 0.95

  # Data discovery
  use_all_data: true
  max_files_to_load: 10
  lazy_file_discovery: false
  multiprocessing_context: fork
  cache_size: 50
  skip_validation: false
  shuffle_files: true
  use_indexed_loader: false
  indexed_num_bins: 8
  indexed_cache_size: 50
  indexed_index_workers: 4

# =============================================================================
# COMPUTE - Device, precision, CUDA, kernels, memory, performance
# =============================================================================
compute:
  memory:
    headroom_gb: 0.1
    cleanup_thresholds:
      warning: 0.98
      critical: 0.99
      emergency: 0.999
    expert_prefetch:
      enabled: true
      lookahead: 2
      use_multiple_streams: true

  performance:
    enable_cudnn_benchmark: true
    enable_tf32: true
    torchinductor_max_autotune: 1
    enable_torch_compile: false
    torch_compile_mode: reduce-overhead
    torch_compile_fullgraph: false
    torch_compile_dynamic: false

  kernels:
    router_kernel_mode: auto
    use_fused_softmax_topk: true
    router_block_size: 4
    use_sparse_expert_dispatch: false
    use_fused_activations: true
    use_selective_expert_loading: false
    use_vectorized_capacity: true
    use_fused_moe_kernel: true
    enable_kernel_profiling: false

  cuda:
    streams:
      enabled: true
      num_streams: 4
      use_event_timing: true
      use_stream_pool: true
      high_priority_transfers: true

    graphs:
      enabled: false
      warmup_steps: 10
      capture_mode: automatic

  optimizations:
    use_overlapped_checkpointing: false

  calibration:
    batch_size:
      enabled: false
      target_memory: 0.80
      max_batch_size: 96
      min_batch_size: 8
      perform_optimizer_step: true
      calibration_timeout_sec: 120.0
      calibration_headroom: 0.92
      use_real_dataloader: true
      measure_peak_utilization: true
      use_fresh_models: true

# =============================================================================
# DISTRIBUTED - Multi-GPU, DeepSpeed, load balancing
# =============================================================================
distributed:
  deepspeed:
    enabled: true
    zero_stage: 2               # CHANGED: enable ZeRO-2 to compensate for disabled gradient checkpointing
    cpu_offload: false
    nvme_offload: false
    nvme_path: "/local_nvme"
    precision_type: "bf16"
    activation_checkpointing: false
    partition_activations: false
    gradient_clipping: 1.0
    zero_overlap_comm: true
    zero_contiguous_gradients: true
    zero_reduce_scatter: true
    zero_reduce_bucket_size: 200000000
    zero_allgather_bucket_size: 200000000

# =============================================================================
# LOGGING - Console, WandB, TensorBoard, diagnostics, frequencies
# =============================================================================
logging:
  disabled: false
  silent_mode: false

  console:
    enabled: true
    level: info

  file:
    enabled: true
    level: debug

  progress_bar_enabled: true
  step_logging_enabled: true
  epoch_logging_enabled: true
  log_mode: tqdm
  tqdm_update_interval: 1

  metrics:
    training: true
    gradients: true
    moe: true
    validation: true
    coherence: true
    quality: true
    memory: true
    timing: true
    generations: true

  wandb:
    enabled: true
    project: ava-training
    entity: null
    tags:
      - rtx3090ti
      - generalization
      - top2-routing
      - zero-regularization
      - tinystories
    notes: |
      Generalization-focused configuration.
      Changes: Zero regularization, top-2 routing, TinyStories data only.
      Goal: Coherent narrative output vs memorization.
    log_freq: 1000
    log_training: true
    log_gradients: true
    log_moe: true
    log_validation: true
    log_coherence: true
    log_quality: true
    log_memory: true
    log_timing: true
    log_generations: true
    log_per_layer_grads: false
    log_routing_diagnostics: false
    log_model_topology: false

  tensorboard:
    enabled: false
    log_training: true
    log_gradients: true
    log_moe: true
    log_validation: true

  frequencies:
    log_interval: 50
    verbose_log_interval: 200
    metrics: 5000
    memory_check: 5000
    health_summary: 5000
    moe_metrics: 20000

  features:
    timing_breakdown: true
    memory_profiling: true
    health_summaries: true
    tensor_shapes: true
    checkpoint_validation: true
    sample_generations: true
    structured_logging: true
    log_format: default

  diagnostics:
    enabled: false

    per_layer_gradients:
      enabled: false
      log_freq: 1000
      layer_name_patterns:
        - layers
        - experts

    routing:
      enabled: false
      log_freq: 1000
      track_per_expert_load: true
      track_routing_entropy: true
      track_expert_capacity_usage: true

    memory:
      enabled: false
      log_freq: 500
      track_activation_memory: true
      track_gradient_memory: true
      track_optimizer_state_memory: true
      track_parameter_memory: true

    timing:
      enabled: false
      log_freq: 500
      profile_forward: true
      profile_backward: true
      profile_optimizer_step: true
      profile_data_loading: true

# =============================================================================
# CHECKPOINTS - Save/load, model selection, output settings
# =============================================================================
checkpoints:
  output_dir: code/outputs
  save_every: 500
  fresh_start: true

  selection:
    enabled: false
    val_loss_weight: 0.5
    coherence_score_weight: 0.3
    perplexity_weight: 0.2
    perplexity_cap: 100.0
    val_loss_cap: 10.0
    higher_is_better: true
    require_all_metrics: false
    fallback_to_val_loss: true

# =============================================================================
# EXPERIMENTAL - Progressive, FP8, caching, advanced features
# =============================================================================
experimental:
  caching:
    enabled: true
    mode: training

    activation_cache:
      enabled: true
      max_size_gb: 0.2
      eviction_policy: lru

    kv_cache:
      enabled: true
      max_size_gb: 0.4
      eviction_policy: hybrid
      sliding_window: 256
      sink_tokens: 4
      recent_tokens: 256

  checkpointing:
    overlapped:
      enabled: false
      stream_overlap: true
      target_layers: layers

    double:
      enabled: false
      coarse_checkpoint_interval: 4
      fine_checkpoint_interval: 2
      use_cuda_streams: true

  fp8:
    enabled: false
    use_transformer_engine: false
    format: e4m3

  # Multi-Token Prediction (MTP)
  mtp:
    enabled: false
    num_prediction_heads: 4
    confidence_threshold_train: 0.6
    confidence_threshold_inference: 0.7
    use_confidence_weighting: true
    primary_loss_weight: 1.0
    additional_loss_base_weight: 0.1
    mtp_warmup_epochs: 1
    confidence_reg_strength: 0.01

  # Mixture of Heads (MoH)
  moh:
    enabled: false
    num_active_heads: 4
    router_jitter: 0.01
    load_balance_weight: 0.01
    entropy_weight: 0.001

  # Mixture of Activations (MoA)
  moa:
    enabled: false
    num_activations: 4
    activations:
      - gelu
      - silu
      - relu
      - mish
    use_gated: true
    router_temperature: 1.0

  # ALiBi Positional Encoding
  alibi:
    enabled: false

  # Cross-Attention for Multi-Modal
  cross_attention:
    enabled: false
    encoder_hidden_size: 768
    num_cross_attention_layers: 4
    cross_attention_frequency: 3
    use_gated_cross_attention: true
    gate_init_value: 0.0

  # Modality Encoders
  modality_encoders:
    vision:
      enabled: false
      encoder_type: vit
      image_size: 224
      patch_size: 16
      hidden_size: 768
      num_layers: 12
      num_heads: 12
      pretrained: null

    audio:
      enabled: false
      encoder_type: whisper
      input_size: 80
      hidden_size: 768
      num_layers: 6
      num_heads: 8
      conv_downsample: true
      pretrained: null

  # Advanced Loss Functions
  advanced_losses:
    focal_loss:
      enabled: false
      gamma: 2.0
      alpha: 0.25

    contrastive_loss:
      enabled: false
      temperature: 0.07
      weight: 0.1

    diversity_loss:
      enabled: false
      weight: 0.01

    adaptive_temperature:
      enabled: true
      initial_temperature: 1.0
      min_temperature: 0.5
      max_temperature: 2.0
      adaptation_rate: 0.01

    distillation:
      enabled: false
      teacher_model_path: null
      temperature: 2.0
      alpha: 0.5

  # Gradient Surgery
  gradient_surgery:
    enabled: false
    method: pcgrad
    pcgrad:
      enabled: true
    cagrad:
      c: 0.5
    gradnorm:
      alpha: 1.5

  # Auxiliary-Free Router
  aux_free_router:
    enabled: true
    balance_factor: 0.1
    ema_decay: 0.99
    use_capacity_masking: true
