# =============================================================================
# RTX 3090 Ti Production Configuration (24GB VRAM)
# =============================================================================
# Model: 446M parameter MoE with 4 experts
# Hardware: NVIDIA GeForce RTX 3090 Ti (24GB), 61GB System RAM
# =============================================================================

# =============================================================================
# MODEL
# =============================================================================
model:
  # Architecture
  vocab_size: 32000
  hidden_size: 768
  num_layers: 12
  num_attention_heads: 12
  intermediate_size: 3072
  max_position_embeddings: 128
  activation: swiglu

  # Special tokens
  pad_token_id: 0
  eos_token_id: 1
  bos_token_id: 2

  # Regularization
  dropout: 0.0
  eos_logit_bias: 0.1
  label_smoothing: 0.1
  attention_dropout: 0.0
  layer_norm_eps: 1.0e-5
  initializer_range: 0.02
  entropy_regularization: 0.005   # Encourages diverse token predictions
  output_diversity_weight: 0.001  # Penalizes repetitive consecutive outputs
  tie_word_embeddings: false

  # General Optimizations
  quantize_kv_cache: true
  use_triton_kernels: true
  use_flash_attention: true
  gradient_checkpointing: true

  # ==========================================================================
  # MoE Configuration (consolidated under model.moe.*)
  # ==========================================================================
  moe:
    architecture:
      num_experts: 4
      num_experts_per_token: 2
      router_type: mixtral
      capacity_factor: 1.25
      expert_dropout: 0.0

    losses:
      router_z_loss_coef: 0.001
      load_balance_loss_coef: 0.01
      diversity_loss_coef: 0.001
      expert_dropout_loss_coef: 0.0
      router_jitter_noise: 0.01
      aux_loss_frequency: 500
      diversity_loss_frequency: 100

    optimization:
      use_optimized_moe: true
      use_grouped_gemm: true
      use_compile_friendly_dispatch: true
      use_fused_moe_kernel: true
      use_sparse_expert_dispatch: false
      use_selective_expert_loading: false
      use_vectorized_capacity: true
      use_fused_softmax_topk: true
      router_kernel_mode: auto
      router_block_size: 4

    prefetch:
      enabled: true
      lookahead: 1
      use_multiple_streams: true

    cache:
      auto_limit: true
      use_lru_eviction: true
      clear_after_optimizer_step: true

    router_compile:
      cache_hash_on_gpu: true
      compile_routers: true
      compile_mode: default
      compile_dynamic: true

    metrics:
      routing_metrics_freq: 100
      moe_metrics_freq: 20000
      log_moe: true
      log_routing_diagnostics: false
      track_expert_utilization: true
      track_routing_decisions: false
      track_load_balance: true

    stable_moe:
      enabled: false

# =============================================================================
# TRAINING
# =============================================================================
training:
  precision:
    mixed_precision: bf16

  batching:
    batch_size: 128
    gradient_accumulation_steps: 2

  optimizer:
    type: adamw
    learning_rate: 1.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.1
    use_fused: true
    max_grad_norm: 1.0

  schedule:
    num_epochs: 1
    max_steps: null
    steps_per_epoch: 10000
    warmup_steps: 1000
    scheduler_type: cosine
    num_cycles: 1
    min_lr: 1.0e-5

  logging:
    save_steps: 1000
    eval_steps: 1000
    logging_steps: 100
    # NOTE: routing_metrics_freq moved to model.moe.metrics.routing_metrics_freq
    use_tensorboard: false
    use_wandb: true

  validation:
    enabled: true                   # Enable to detect overfitting
    batch_size: 32
    max_batches: 20                 # Increased for more robust validation
    compute_train_ratio: true

  generation:
    enabled: true
    generate_every_n_steps: 1000
    num_per_step: 1
    num_return_sequences: 2
    during_eval: true
    test_quality: true
    max_length: 128
    temperature: 0.7
    top_p: 0.9
    top_k: 40
    repetition_penalty: 1.5
    no_repeat_ngram_size: 3
    skip_special_tokens: true
    prompt: "Once upon a time, in a land far away,"
    alternative_prompts:
      - "The quick brown fox"
      - "In the beginning"
      - "A long time ago"

  coherence:
    enabled: true                   # Enable coherence tracking for text quality
    eval_every_n_steps: 1000
    num_samples: 4
    max_generation_length: 128
    temperature: 0.7
    top_p: 0.9
    top_k: 40
    log_to_wandb: true
    log_to_console: true
    use_fast: true
    use_bf16: true
    micro_batch_size: 16

  # Distributed barrier optimization (nanoGPT-style zero-barrier training)
  distributed:
    minimize_distributed_barriers: true   # Skip 20-200ms/epoch overhead from barriers
    sync_loss_across_ranks: false         # Log local loss only (faster)

# =============================================================================
# DATA
# =============================================================================
data:
  data_dir: /root/Ava_AI/pretokenized_data/data
  max_length: 128
  tokenizer_name: pretokenized_data/tokenizers/vocab

  # Loading
  streaming: false
  buffer_size: 30000
  fast_startup: false
  skip_sequence_count: true
  enable_length_sorting: false

  # Splits
  train_split: train
  eval_split: validation
  auto_create_validation_split: true
  validation_split_ratio: 0.05
  padding_side: right
  truncation: false

  # Workers (optimized for throughput)
  num_workers: 8
  prefetch_factor: 4                    # Increased from 2 for better prefetching
  persistent_workers: true              # Keep workers alive between epochs
  dataloader_drop_last: true
  dataloader_pin_memory: true
  dataloader_samples_per_file: 200
  skip_dataloader_validation: true
  timeout: 300
  examples_per_random_select: 50

  # Sequence Packing (20-35% throughput gain)
  use_sequence_packing: true            # ENABLED: Pack short sequences together
  packing_strategy: greedy
  packing_target_ratio: 0.95            # Increased from 0.90 for better packing

  # Discovery
  use_all_data: true
  max_files_to_load: null
  lazy_file_discovery: true             # ENABLED: Memory-efficient for 1000+ file datasets
  multiprocessing_context: spawn
  cache_size: 20
  skip_validation: true
  shuffle_files: true

  # Indexed loader
  use_indexed_loader: true
  indexed_num_bins: 8
  indexed_cache_size: 5
  indexed_numpy_cache_size: 5
  indexed_index_workers: 4

# =============================================================================
# COMPUTE
# =============================================================================
compute:
  memory:
    headroom_gb: 3.0
    cleanup_thresholds:
      warning: 0.80
      critical: 0.85
      emergency: 0.90
    # NOTE: expert_prefetch moved to model.moe.prefetch

  performance:
    enable_cudnn_benchmark: true
    enable_tf32: true
    torchinductor_max_autotune: 1
    enable_torch_compile: false
    torch_compile_mode: reduce-overhead
    torch_compile_fullgraph: false
    torch_compile_dynamic: true

  kernels:
    # NOTE: MoE-related kernel settings moved to model.moe.optimization
    # Non-MoE kernel settings remain here
    use_fused_activations: true
    enable_kernel_profiling: false

  cuda:
    streams:
      enabled: true
      num_streams: 4
      use_event_timing: true
      use_stream_pool: true
      high_priority_transfers: true
    graphs:
      enabled: false
      warmup_steps: 1000
      capture_mode: automatic

  optimizations:
    use_overlapped_checkpointing: false

  calibration:
    batch_size:
      enabled: false
      target_memory: 0.88
      max_batch_size: 128
      min_batch_size: 8

# =============================================================================
# DISTRIBUTED
# =============================================================================
distributed:
  deepspeed:
    enabled: true
    zero_stage: 1
    cpu_offload: false
    nvme_offload: false
    nvme_path: "/local_nvme"
    precision_type: "bf16"
    activation_checkpointing: false
    partition_activations: false
    gradient_clipping: 1.0
    zero_overlap_comm: true
    zero_contiguous_gradients: true
    zero_reduce_scatter: true
    zero_reduce_bucket_size: 200000000
    zero_allgather_bucket_size: 200000000

# =============================================================================
# LOGGING
# =============================================================================
logging:
  disabled: false
  silent_mode: false
  log_mode: tqdm
  progress_bar_enabled: true
  step_logging_enabled: true
  epoch_logging_enabled: true
  tqdm_update_interval: 1

  console:
    enabled: true
    level: info

  file:
    enabled: true
    level: debug

  metrics:
    training: true
    gradients: true
    moe: true
    validation: true
    coherence: true
    quality: true
    memory: true
    timing: true
    generations: true

  wandb:
    enabled: true
    project: ava-training
    entity: null
    tags: [rtx3090ti, 446m_params]
    log_freq: 2000
    log_training: true
    log_gradients: true
    log_moe: true
    log_validation: true
    log_coherence: true
    log_quality: true
    log_memory: true
    log_timing: true
    log_generations: true
    log_per_layer_grads: false
    log_routing_diagnostics: false
    log_model_topology: false

  tensorboard:
    enabled: false

  frequencies:
    log_interval: 50
    verbose_log_interval: 100
    metrics: 5000
    memory_check: 20000
    health_summary: 5000
    # NOTE: moe_metrics moved to model.moe.metrics.moe_metrics_freq

  features:
    timing_breakdown: true
    memory_profiling: true
    health_summaries: true
    tensor_shapes: true
    checkpoint_validation: true
    sample_generations: true
    structured_logging: true
    log_format: default

  diagnostics:
    enabled: false

# =============================================================================
# CHECKPOINTS
# =============================================================================
checkpoints:
  output_dir: code/outputs
  save_every: 500
  fresh_start: true

  selection:
    enabled: true                   # Select best checkpoint by coherence
    val_loss_weight: 0.4            # Balanced weight for validation loss
    coherence_score_weight: 0.4     # Equal weight for coherence score
    perplexity_weight: 0.2
    perplexity_cap: 100.0
    val_loss_cap: 10.0
    higher_is_better: true
    require_all_metrics: false
    fallback_to_val_loss: true

# =============================================================================
# EXPERIMENTAL
# =============================================================================
experimental:
  caching:
    enabled: false
    mode: training
    activation_cache:
      enabled: false
      max_size_gb: 2.0
      eviction_policy: lru
    kv_cache:
      enabled: false
      max_size_gb: 4.0
      eviction_policy: hybrid

  checkpointing:
    overlapped:
      enabled: false
      stream_overlap: true
      target_layers: layers
    double:
      enabled: false
      coarse_checkpoint_interval: 8
      fine_checkpoint_interval: 2
      use_cuda_streams: true

  fp8:
    enabled: false
    use_transformer_engine: false
    format: e4m3

  mtp:
    enabled: false
    num_prediction_heads: 4
    confidence_threshold_train: 0.6
    confidence_threshold_inference: 0.7
    use_confidence_weighting: true
    primary_loss_weight: 1.0
    additional_loss_base_weight: 0.1
    mtp_warmup_epochs: 1
    confidence_reg_strength: 0.01

  moh:
    enabled: false
    num_active_heads: 4
    router_jitter: 0.01
    load_balance_weight: 0.01
    entropy_weight: 0.001

  moa:
    enabled: false
    num_activations: 4
    activations: [gelu, silu, relu, mish]
    use_gated: true
    router_temperature: 1.0

  alibi:
    enabled: false

  cross_attention:
    enabled: false
    encoder_hidden_size: 768
    num_cross_attention_layers: 4
    cross_attention_frequency: 3
    use_gated_cross_attention: true
    gate_init_value: 0.0

  modality_encoders:
    vision:
      enabled: false
    audio:
      enabled: false

  advanced_losses:
    focal_loss:
      enabled: false
    contrastive_loss:
      enabled: false
    diversity_loss:
      enabled: false
    adaptive_temperature:
      enabled: true
      initial_temperature: 1.0
      min_temperature: 0.5
      max_temperature: 2.0
      adaptation_rate: 0.01
    distillation:
      enabled: false

  gradient_surgery:
    enabled: false
    method: pcgrad

  aux_free_router:
    enabled: true
    balance_factor: 0.1
    ema_decay: 0.99
    use_capacity_masking: true
