# =============================================================================
# MAXIMUM THROUGHPUT Configuration - RTX 3090 Ti + RTX 3060 (Optional)
# =============================================================================
# Optimizations:
# - Higher batch size (using more VRAM - currently only 56% utilized)
# - Disabled streaming (pre-load data for lower latency)
# - Disabled experimental features (MTP, MoH, MoA add overhead)
# - Reduced logging frequency (less GPU-CPU sync)
# - Larger prefetch buffer
# =============================================================================

model:
  vocab_size: 30522
  pad_token_id: 0
  eos_token_id: 102
  bos_token_id: 101
  hidden_size: 768
  num_layers: 12
  num_attention_heads: 12
  intermediate_size: 3072
  max_position_embeddings: 512
  num_experts: 4
  num_experts_per_token: 2
  router_type: mixtral
  capacity_factor: 1.25
  quantize_kv_cache: true
  expert_dropout: 0.0
  activation: swiglu

  # GPU Optimizations - ALL ENABLED
  use_grouped_gemm: true
  use_triton_kernels: true
  use_torch_compile: true
  use_flash_attention: true
  gradient_checkpointing: true
  use_optimized_moe: true

  # MoE loss coefficients - reduced frequency
  router_z_loss_coef: 0.0001
  load_balance_loss_coef: 0.001
  diversity_loss_coef: 0.0
  expert_dropout_loss_coef: 0.0
  router_jitter_noise: 0.01
  aux_loss_frequency: 500  # Less frequent aux loss computation

  # Minimal regularization
  entropy_regularization: 0.0
  output_diversity_weight: 0.0
  eos_logit_bias: 0.1
  attention_dropout: 0.0
  dropout: 0.0
  label_smoothing: 0.1
  tie_word_embeddings: true
  layer_norm_eps: 1.0e-5
  initializer_range: 0.02

training:
  precision:
    mixed_precision: bf16

  use_pipeline_microbatching: false

  batching:
    # INCREASED: Using more of the 24GB VRAM (was only using 56%)
    batch_size: 64           # Doubled from 32
    gradient_accumulation_steps: 2  # Reduced from 4 (same effective batch = 128)

  optimizer:
    type: adamw
    learning_rate: 1.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.1
    use_fused: true
    max_grad_norm: 1.0

  schedule:
    num_epochs: 1
    max_steps: null
    warmup_steps: 1000
    scheduler_type: cosine
    num_cycles: 1
    min_lr: 1.0e-5

  logging:
    # REDUCED frequency - less GPU-CPU sync overhead
    save_steps: 2000         # Was 1000
    eval_steps: 2000         # Was 1000
    logging_steps: 500       # Was 100
    use_tensorboard: false
    use_wandb: true

  validation:
    enabled: false
    batch_size: 32
    max_batches: 10
    compute_train_ratio: true

  generation:
    enabled: false

  coherence:
    enabled: false

data:
  # DISABLED STREAMING - Pre-load data is faster
  streaming: false
  buffer_size: 50000         # Larger buffer
  fast_startup: true
  progressive_buffer: false
  min_buffer_size: 20000
  warm_start_files: 10       # More files at startup
  skip_sequence_count: true
  enable_length_sorting: true  # Better batching

  data_dir: pretokenized_data/data
  max_length: 512
  train_split: train
  eval_split: validation
  auto_create_validation_split: true
  validation_split_ratio: 0.05
  tokenizer_name: pretokenized_data/tokenizers/vocab
  padding_side: right
  truncation: false

  # INCREASED data loading parallelism
  num_workers: 12            # Was 8
  prefetch_factor: 8         # Was 4
  persistent_workers: true
  dataloader_drop_last: true
  dataloader_pin_memory: true
  dataloader_samples_per_file: 500  # Was 200
  skip_dataloader_validation: true
  timeout: 300
  examples_per_random_select: 100   # Was 50

  # Sequence packing - keep enabled
  use_sequence_packing: true
  packing_strategy: greedy
  packing_target_ratio: 0.95  # Was 0.90

  # Data discovery
  use_all_data: true
  max_files_to_load: null
  lazy_file_discovery: false
  multiprocessing_context: spawn
  cache_size: 50             # Was 20
  skip_validation: true      # Skip validation for speed
  shuffle_files: true
  use_indexed_loader: true   # Faster than streaming
  indexed_num_bins: 16       # Was 8
  indexed_cache_size: 100    # Was 50
  indexed_index_workers: 16

compute:
  memory:
    headroom_gb: 2.0         # Was 3.0 - use more VRAM
    cleanup_thresholds:
      warning: 0.85
      critical: 0.92
      emergency: 0.96
    expert_prefetch:
      enabled: true
      lookahead: 2           # Was 1
      use_multiple_streams: true

  performance:
    enable_cudnn_benchmark: true
    enable_tf32: true
    torchinductor_max_autotune: 1
    enable_torch_compile: true
    torch_compile_mode: max-autotune
    torch_compile_fullgraph: false
    torch_compile_dynamic: false  # Was true - static shapes are faster

  kernels:
    router_kernel_mode: auto
    use_fused_softmax_topk: true
    router_block_size: 4
    use_sparse_expert_dispatch: false
    use_fused_activations: true
    use_selective_expert_loading: false
    use_vectorized_capacity: true
    use_fused_moe_kernel: true
    enable_kernel_profiling: false  # Disable profiling for speed

  cuda:
    streams:
      enabled: true
      num_streams: 4
      use_event_timing: false  # Disable timing for speed
      use_stream_pool: true
      high_priority_transfers: true

    graphs:
      enabled: true
      warmup_steps: 15         # More warmup for stable graphs
      capture_mode: automatic

  optimizations:
    use_overlapped_checkpointing: true

  calibration:
    batch_size:
      enabled: false

distributed:
  deepspeed:
    enabled: false

logging:
  disabled: false
  silent_mode: false

  console:
    enabled: true
    level: warning           # Was info - less console output

  file:
    enabled: true
    level: info              # Was debug

  progress_bar_enabled: true
  step_logging_enabled: true
  epoch_logging_enabled: true
  log_mode: tqdm
  tqdm_update_interval: 50   # Was 10 - less frequent updates

  metrics:
    training: true
    gradients: false         # Disable for speed
    moe: false               # Disable for speed
    validation: true
    coherence: false
    quality: false
    memory: false
    timing: false
    generations: false

  wandb:
    enabled: true
    project: ava-training
    entity: null
    tags:
      - rtx3090ti
      - max_throughput
    notes: Maximum throughput configuration
    log_freq: 100            # Was 10 - less frequent
    log_training: true
    log_gradients: false
    log_moe: false
    log_validation: true
    log_coherence: false
    log_quality: false
    log_memory: false
    log_timing: false
    log_generations: false
    log_per_layer_grads: false
    log_routing_diagnostics: false
    log_model_topology: false

  tensorboard:
    enabled: false

  frequencies:
    log_interval: 500        # Was 100
    verbose_log_interval: 2000  # Was 500
    metrics: 2000            # Was 500
    memory_check: 10000      # Was 5000
    health_summary: 2000     # Was 500
    moe_metrics: 10000       # Was 5000

  features:
    timing_breakdown: false
    memory_profiling: false
    health_summaries: false
    tensor_shapes: false
    checkpoint_validation: false
    sample_generations: false
    structured_logging: false

  diagnostics:
    enabled: false

checkpoints:
  output_dir: code/outputs
  save_every: 2000           # Was 500
  fresh_start: true

  selection:
    enabled: false

experimental:
  caching:
    enabled: true
    mode: training

    activation_cache:
      enabled: true
      max_size_gb: 4.0       # Increased from 2.0

    kv_cache:
      enabled: true
      max_size_gb: 6.0       # Increased from 4.0
      eviction_policy: hybrid
      sliding_window: null
      sink_tokens: 4
      recent_tokens: 256

  checkpointing:
    overlapped:
      enabled: true
      stream_overlap: true
      target_layers: layers

    double:
      enabled: true
      coarse_checkpoint_interval: 8
      fine_checkpoint_interval: 2
      use_cuda_streams: true

  fp8:
    enabled: false

  # DISABLED experimental features for speed
  mtp:
    enabled: false           # Was true - adds overhead

  moh:
    enabled: false           # Was true - adds overhead

  moa:
    enabled: false           # Was true - adds overhead

  alibi:
    enabled: true            # Keep - lightweight

  cross_attention:
    enabled: false

  modality_encoders:
    vision:
      enabled: false
    audio:
      enabled: false

  advanced_losses:
    focal_loss:
      enabled: false
    contrastive_loss:
      enabled: false
    diversity_loss:
      enabled: false
    adaptive_temperature:
      enabled: false         # Was true - disable for speed
    distillation:
      enabled: false

  gradient_surgery:
    enabled: false

  aux_free_router:
    enabled: false           # Was true - disable for speed
