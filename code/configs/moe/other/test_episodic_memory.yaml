# =============================================================================
# Test Configuration for Episodic Memory Integration
# =============================================================================
# Quick test: python code/scripts/5_training/train_pipeline.py --config code/configs/moe/test_episodic_memory.yaml
# This runs for just 50 steps to verify episodic memory works with the training pipeline.
#
# Configuration Schema v2.0 - 8-Section Structure:
#   model, training, data, compute, distributed, logging, checkpoints, experimental
# =============================================================================

# =============================================================================
# MODEL - Architecture, MoE, tokens, regularization
# =============================================================================
model:
  vocab_size: 30522
  pad_token_id: 0
  eos_token_id: 102
  bos_token_id: 101
  tokenizer_path: pretokenized_data/tokenizers/vocab
  hidden_size: 128
  num_layers: 2
  num_attention_heads: 4
  intermediate_size: 256
  max_position_embeddings: 256
  num_experts: 4
  num_experts_per_token: 2
  router_type: mixtral
  capacity_factor: 1.25
  activation: swiglu
  tie_word_embeddings: false
  use_grouped_gemm: false
  use_triton_kernels: false
  use_flash_attention: true
  gradient_checkpointing: false
  use_optimized_moe: false
  router_z_loss_coef: 0.001
  load_balance_loss_coef: 0.01
  diversity_loss_coef: 0.0
  attention_dropout: 0.0
  dropout: 0.0

# =============================================================================
# TRAINING - Optimizer, schedule, batching, validation
# =============================================================================
training:
  precision:
    mixed_precision: bf16

  batching:
    batch_size: 8
    gradient_accumulation_steps: 1
    label_smoothing: 0.0

  optimizer:
    type: adamw
    learning_rate: 1.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.01
    use_fused: true
    max_grad_norm: 1.0

  schedule:
    num_epochs: 1
    max_steps: 50
    warmup_steps: 10
    scheduler_type: cosine
    min_lr: 1.0e-5

  logging:
    save_steps: 1000
    eval_steps: 25
    logging_steps: 10
    use_tensorboard: false
    use_wandb: false

  validation:
    enabled: true
    batch_size: 4
    max_batches: 5

  generation:
    enabled: false

  coherence:
    enabled: false

# =============================================================================
# DATA - Loading, streaming, packing, splits
# =============================================================================
data:
  streaming: true
  buffer_size: 100
  data_dir: pretokenized_data/data/TinyStories
  val_data_dir: null
  max_length: 256
  add_special_tokens: false
  train_split: train
  eval_split: validation
  auto_create_validation_split: true
  validation_split_ratio: 0.1
  tokenizer_name: pretokenized_data/tokenizers/vocab
  padding_side: right
  truncation: false
  fast_startup: true
  num_workers: 2
  prefetch_factor: 2
  persistent_workers: false
  dataloader_drop_last: true
  dataloader_pin_memory: true
  use_sequence_packing: false
  use_all_data: false
  max_files_to_load: 1
  lazy_file_discovery: true
  cache_size: 5
  skip_validation: true
  shuffle_files: false
  use_indexed_loader: false

# =============================================================================
# COMPUTE - Device, precision, CUDA, kernels, memory, performance
# =============================================================================
compute:
  device:
    type: cuda

  performance:
    enable_tf32: true
    enable_cudnn_benchmark: true

  calibration:
    batch_size:
      enabled: false

# =============================================================================
# DISTRIBUTED - Multi-GPU, DeepSpeed, load balancing
# =============================================================================
distributed:
  deepspeed:
    enabled: false

# =============================================================================
# LOGGING - Console, WandB, TensorBoard, diagnostics, frequencies
# =============================================================================
logging:
  log_mode: verbose
  verbose_log_interval: 10

  console:
    enabled: true

  diagnostics:
    enabled: false

# =============================================================================
# CHECKPOINTS - Save/load, model selection, output settings
# =============================================================================
checkpoints:
  output_dir: code/outputs
  save_every: 1000
  fresh_start: true

# =============================================================================
# EXPERIMENTAL - Progressive, FP8, caching, advanced features
# =============================================================================
experimental:
  caching:
    enabled: false

  # Episodic Memory Configuration - THE KEY FEATURE WE'RE TESTING
  episodic_memory:
    use_episodic_memory: true
    memory_capacity: 100
    memory_replay_ratio: 0.25
    buffer_warmup_steps: 10
    memory_selection_strategy: importance
    priority_exponent: 0.6
    importance_weight_exponent: 0.4
    store_aux_info: false
    silent_mode: false
