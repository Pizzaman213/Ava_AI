# =============================================================================
# RTX 3090 Ti OPTIMIZED Configuration (24GB VRAM, 61GB RAM)
# =============================================================================
# Hardware: NVIDIA GeForce RTX 3090 Ti (24GB), 61GB System RAM
# Model: 446M parameter MoE with 4 experts
#
# Configuration Schema v2.0 - 8-Section Structure:
#   model, training, data, compute, distributed, logging, checkpoints, experimental
# =============================================================================

# =============================================================================
# MODEL - Architecture, MoE, tokens, regularization
# =============================================================================
model:
  vocab_size: 30522
  pad_token_id: 0
  eos_token_id: 102
  bos_token_id: 101
  hidden_size: 768
  num_layers: 12
  num_attention_heads: 12
  intermediate_size: 3072
  max_position_embeddings: 512
  num_experts: 4
  num_experts_per_token: 2
  router_type: mixtral
  capacity_factor: 1.25
  quantize_kv_cache: true
  expert_dropout: 0.05
  activation: swiglu

  # GPU Optimizations
  use_grouped_gemm: true
  use_triton_kernels: true
  use_torch_compile: true
  torch_compile_mode: max-autotune
  use_flash_attention: true
  gradient_checkpointing: true
  use_optimized_moe: true

  # MoE loss coefficients
  router_z_loss_coef: 0.0001
  load_balance_loss_coef: 0.001
  diversity_loss_coef: 0.0
  expert_dropout_loss_coef: 0.0
  router_jitter_noise: 0.01
  aux_loss_frequency: 50

  # Coherence regularization
  entropy_regularization: 0.001
  output_diversity_weight: 0.0
  eos_logit_bias: 0.1

  # Regularization
  attention_dropout: 0.15
  dropout: 0.15
  label_smoothing: 0.1
  tie_word_embeddings: true
  layer_norm_eps: 1.0e-5
  initializer_range: 0.02

# =============================================================================
# TRAINING - Optimizer, schedule, batching, validation
# =============================================================================
training:
  precision:
    mixed_precision: bf16

  batching:
    batch_size: 64
    gradient_accumulation_steps: 2

  optimizer:
    type: adamw
    learning_rate: 1.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.1
    use_fused: true
    max_grad_norm: 1.0

  schedule:
    num_epochs: 3
    max_steps: null
    warmup_steps: 10
    scheduler_type: cosine_with_restarts
    num_cycles: 2
    min_lr: 1.0e-5

  logging:
    save_steps: 10
    eval_steps: 1
    logging_steps: 1
    use_tensorboard: false
    use_wandb: true

  validation:
    enabled: true
    batch_size: 24
    max_batches: 10
    compute_train_ratio: true

  generation:
    enabled: true
    generate_every_n_steps: 1000
    num_per_step: 1
    during_eval: true
    test_quality: true
    max_length: 128
    temperature: 0.5
    top_p: 0.9
    top_k: 25
    repetition_penalty: 1.5
    no_repeat_ngram_size: 3
    skip_special_tokens: true
    prompt: "Once upon a time, in a land far away,"
    alternative_prompts:
      - "The quick brown fox"
      - "In the beginning"
      - "A long time ago"

  coherence:
    enabled: true
    eval_every_n_steps: 5000
    num_samples: 2
    max_generation_length: 100
    temperature: 0.5
    top_p: 0.9
    top_k: 25
    log_to_wandb: true
    log_to_console: false
    use_fast: true
    use_bf16: true
    micro_batch_size: 16

# =============================================================================
# DATA - Loading, streaming, packing, splits
# =============================================================================
data:
  streaming: true
  buffer_size: 100000
  progressive_buffer: false
  min_buffer_size: 10000
  warm_start_files: 3
  skip_sequence_count: true
  enable_length_sorting: false

  data_dir: pretokenized_data/data
  max_length: 512
  train_split: train
  eval_split: validation
  auto_create_validation_split: true
  validation_split_ratio: 0.05
  tokenizer_name: pretokenized_data/tokenizers/vocab
  padding_side: right
  truncation: false

  # Data loading
  num_workers: 2
  prefetch_factor: 2
  persistent_workers: true
  dataloader_drop_last: true
  dataloader_pin_memory: true
  dataloader_samples_per_file: 100
  skip_dataloader_validation: true
  timeout: 300

  # Sequence packing
  use_sequence_packing: true
  packing_strategy: greedy
  packing_target_ratio: 0.90

  # Data discovery
  use_all_data: true
  max_files_to_load: null
  lazy_file_discovery: false
  multiprocessing_context: spawn
  cache_size: 5
  skip_validation: false
  shuffle_files: true
  use_indexed_loader: false
  indexed_num_bins: 8
  indexed_cache_size: 50
  indexed_index_workers: 16

# =============================================================================
# COMPUTE - Device, precision, CUDA, kernels, memory, performance
# =============================================================================
compute:
  performance:
    enable_cudnn_benchmark: true
    enable_tf32: true
    torchinductor_max_autotune: 0
    enable_torch_compile: true
    torch_compile_mode: max-autotune
    torch_compile_fullgraph: false
    torch_compile_dynamic: true

  kernels:
    router_kernel_mode: auto
    use_fused_softmax_topk: true
    router_block_size: 4
    use_sparse_expert_dispatch: false
    use_fused_activations: true
    use_selective_expert_loading: false
    use_vectorized_capacity: true
    use_fused_moe_kernel: false
    enable_kernel_profiling: false

  cuda:
    streams:
      enabled: false
      num_streams: 4
      use_event_timing: true
      use_stream_pool: true
      high_priority_transfers: true

    graphs:
      enabled: false
      warmup_steps: 10
      capture_mode: automatic

  optimizations:
    use_overlapped_checkpointing: true

  calibration:
    batch_size:
      enabled: false
      target_memory: 0.88
      max_batch_size: 128
      min_batch_size: 8
      perform_optimizer_step: true
      calibration_timeout_sec: 120.0
      calibration_headroom: 0.92
      use_real_dataloader: true
      measure_peak_utilization: true
      use_fresh_models: true

# =============================================================================
# DISTRIBUTED - Multi-GPU, DeepSpeed, load balancing
# =============================================================================
distributed:
  deepspeed:
    enabled: true
    zero_stage: 2
    cpu_offload: false
    nvme_offload: false
    nvme_path: "/local_nvme"
    precision_type: "bf16"
    gradient_accumulation_steps: 2
    train_batch_size: 128
    micro_batch_size: 64
    activation_checkpointing: false
    partition_activations: false
    gradient_clipping: 1.0
    zero_overlap_comm: true
    zero_contiguous_gradients: true
    zero_reduce_scatter: true
    zero_reduce_bucket_size: 200000000
    zero_allgather_bucket_size: 200000000

# =============================================================================
# LOGGING - Console, WandB, TensorBoard, diagnostics, frequencies
# =============================================================================
logging:
  disabled: false
  silent_mode: false

  console:
    enabled: true
    level: info

  file:
    enabled: true
    level: debug

  progress_bar_enabled: true
  step_logging_enabled: true
  epoch_logging_enabled: true

  metrics:
    training: true
    gradients: true
    moe: true
    validation: true
    coherence: true
    quality: true
    memory: true
    timing: true
    generations: true

  wandb:
    enabled: true
    project: ava-training
    entity: null
    tags:
      - rtx3090ti
      - 24gb_vram
      - 446m_params
      - optimized
    notes: |
      RTX 3090 Ti optimized configuration.
      Hardware: RTX 3090 Ti (24GB), 61GB RAM
      Key: BF16, Flash Attention, Gradient Checkpointing
    log_freq: 10
    log_training: true
    log_gradients: true
    log_moe: true
    log_validation: true
    log_coherence: true
    log_quality: true
    log_memory: true
    log_timing: true
    log_generations: true
    log_per_layer_grads: false
    log_routing_diagnostics: false
    log_model_topology: false

  tensorboard:
    enabled: false
    log_training: true
    log_gradients: true
    log_moe: true
    log_validation: true

  frequencies:
    log_interval: 500
    verbose_log_interval: 500
    metrics: 500
    memory_check: 2000
    health_summary: 500
    moe_metrics: 5000

  features:
    timing_breakdown: true
    memory_profiling: true
    health_summaries: true
    tensor_shapes: true
    checkpoint_validation: true
    sample_generations: true
    structured_logging: true
    log_format: default

  diagnostics:
    enabled: true

    per_layer_gradients:
      enabled: true
      log_freq: 500
      layer_name_patterns:
        - layers
        - experts

    routing:
      enabled: true
      log_freq: 100
      track_per_expert_load: true
      track_routing_entropy: true
      track_expert_capacity_usage: true

    memory:
      enabled: true
      log_freq: 500
      track_activation_memory: true
      track_gradient_memory: true
      track_optimizer_state_memory: true
      track_parameter_memory: true

    timing:
      enabled: true
      log_freq: 100
      profile_forward: true
      profile_backward: true
      profile_optimizer_step: true
      profile_data_loading: true

# =============================================================================
# CHECKPOINTS - Save/load, model selection, output settings
# =============================================================================
checkpoints:
  output_dir: code/outputs
  save_every: 500
  fresh_start: true

  selection:
    enabled: true
    val_loss_weight: 0.5
    coherence_score_weight: 0.3
    perplexity_weight: 0.2
    perplexity_cap: 100.0
    val_loss_cap: 10.0
    higher_is_better: true
    require_all_metrics: false
    fallback_to_val_loss: true

# =============================================================================
# EXPERIMENTAL - Progressive, FP8, caching, advanced features
# =============================================================================
experimental:
  caching:
    enabled: true
    mode: auto

    activation_cache:
      enabled: true
      max_size_gb: 2.0
      eviction_policy: lru

    kv_cache:
      enabled: true
      max_size_gb: 4.0
      eviction_policy: hybrid
      sliding_window: null
      sink_tokens: 4
      recent_tokens: 256

  checkpointing:
    overlapped:
      enabled: true
      stream_overlap: true
      target_layers: layers

    double:
      enabled: true
      coarse_checkpoint_interval: 8
      fine_checkpoint_interval: 2
      use_cuda_streams: true

  fp8:
    enabled: false
    use_transformer_engine: false
    format: e4m3
