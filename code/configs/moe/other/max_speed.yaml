# =============================================================================
# MAX SPEED Configuration - Optimized for Maximum Throughput
# =============================================================================
# Based on large.yaml with all speed optimizations enabled
# Trade-off: Disables dropout (less regularization) for CUDA graphs support
#
# Expected speedup vs large.yaml: 20-35%
#
# Key changes:
# - Dropout = 0 (enables CUDA graphs)
# - CUDA graphs enabled (15-25% speedup)
# - Reduced logging frequency
# - Disabled coherence evaluation
# - Disabled diagnostics
# - Silent logging mode
#
# Configuration Schema v2.0 - 8-Section Structure:
#   model, training, data, compute, distributed, logging, checkpoints, experimental
# =============================================================================

# =============================================================================
# MODEL - Architecture, MoE, tokens, regularization
# =============================================================================
model:
  vocab_size: 30522
  pad_token_id: 0
  eos_token_id: 102
  bos_token_id: 101
  hidden_size: 768
  num_layers: 12
  num_attention_heads: 12
  intermediate_size: 3072
  max_position_embeddings: 512
  num_experts: 4
  num_experts_per_token: 2
  router_type: mixtral
  capacity_factor: 1.25
  quantize_kv_cache: true
  activation: swiglu

  # GPU Optimizations - ALL ENABLED
  use_grouped_gemm: true
  use_triton_kernels: true
  use_torch_compile: true
  torch_compile_mode: reduce-overhead
  use_flash_attention: true
  gradient_checkpointing: true
  use_optimized_moe: true

  # MoE loss coefficients - Minimal overhead
  router_z_loss_coef: 0.0001
  load_balance_loss_coef: 0.001
  diversity_loss_coef: 0.0
  expert_dropout_loss_coef: 0.0
  router_jitter_noise: 0.0
  aux_loss_frequency: 200

  # Coherence - DISABLED for speed
  entropy_regularization: 0.0
  output_diversity_weight: 0.0
  eos_logit_bias: 0.0

  # DROPOUT = 0 - Required for CUDA graphs
  attention_dropout: 0.0
  dropout: 0.0
  expert_dropout: 0.0
  label_smoothing: 0.0

  tie_word_embeddings: true
  layer_norm_eps: 1.0e-5
  initializer_range: 0.02

# =============================================================================
# TRAINING - Optimizer, schedule, batching, validation
# =============================================================================
training:
  precision:
    mixed_precision: bf16

  # Pipeline Micro-batching - 10-25% additional speedup
  use_pipeline_microbatching: true
  pipeline_overlap_factor: 2

  batching:
    batch_size: 64
    gradient_accumulation_steps: 2

  optimizer:
    type: adamw
    learning_rate: 1.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.1
    use_fused: true
    max_grad_norm: 1.0

  schedule:
    num_epochs: 3
    max_steps: null
    warmup_steps: 50
    scheduler_type: cosine
    num_cycles: 1
    min_lr: 1.0e-5

  logging:
    save_steps: 2000
    eval_steps: 2000
    logging_steps: 500
    use_tensorboard: false
    use_wandb: true

  validation:
    enabled: true
    batch_size: 32
    max_batches: 5
    compute_train_ratio: false

  generation:
    enabled: false

  coherence:
    enabled: false

  # nanoGPT-style distributed optimization
  distributed:
    minimize_distributed_barriers: true
    sync_loss_across_ranks: false

# =============================================================================
# DATA - Loading, streaming, packing, splits
# =============================================================================
data:
  streaming: true
  buffer_size: 200000
  progressive_buffer: false
  min_buffer_size: 10000
  warm_start_files: 5
  skip_sequence_count: true
  enable_length_sorting: false
  data_dir: pretokenized_data/data
  max_length: 512
  train_split: train
  eval_split: validation
  auto_create_validation_split: true
  validation_split_ratio: 0.05
  tokenizer_name: pretokenized_data/tokenizers/vocab
  padding_side: right
  truncation: false

  # Data loading - MAX THROUGHPUT
  num_workers: 12
  prefetch_factor: 6
  persistent_workers: true
  dataloader_drop_last: true
  dataloader_pin_memory: true
  dataloader_samples_per_file: 200
  skip_dataloader_validation: true
  timeout: 300
  examples_per_random_select: 50

  # Sequence packing ENABLED
  use_sequence_packing: true
  packing_strategy: greedy
  packing_target_ratio: 0.90

  use_all_data: true
  max_files_to_load: null
  lazy_file_discovery: false
  multiprocessing_context: spawn
  cache_size: 150
  skip_validation: false
  shuffle_files: true
  use_indexed_loader: false

# =============================================================================
# COMPUTE - Device, precision, CUDA, kernels, memory, performance
# =============================================================================
compute:
  performance:
    enable_cudnn_benchmark: true
    enable_tf32: true
    torchinductor_max_autotune: 0
    enable_torch_compile: true
    torch_compile_mode: reduce-overhead
    torch_compile_fullgraph: false
    torch_compile_dynamic: true

  kernels:
    router_kernel_mode: auto
    use_fused_softmax_topk: true
    router_block_size: 4
    use_sparse_expert_dispatch: true
    use_fused_activations: true
    use_selective_expert_loading: false
    use_vectorized_capacity: true
    use_fused_moe_kernel: true
    enable_kernel_profiling: false

  cuda:
    streams:
      enabled: true
      num_streams: 4
      use_event_timing: true
      use_stream_pool: true
      high_priority_transfers: true

    graphs:
      enabled: true
      warmup_steps: 10
      capture_mode: automatic

  optimizations:
    use_overlapped_checkpointing: true

  calibration:
    batch_size:
      enabled: false
      target_memory: 0.88
      max_batch_size: 128
      min_batch_size: 8

# =============================================================================
# DISTRIBUTED - Multi-GPU, DeepSpeed, load balancing
# =============================================================================
distributed:
  deepspeed:
    enabled: false

# =============================================================================
# LOGGING - Console, WandB, TensorBoard, diagnostics, frequencies
# =============================================================================
logging:
  disabled: false
  silent_mode: true

  console:
    enabled: true
    level: warning

  file:
    enabled: true
    level: info

  progress_bar_enabled: true
  step_logging_enabled: false
  epoch_logging_enabled: true

  metrics:
    training: true
    gradients: false
    moe: false
    validation: true
    coherence: false
    quality: false
    memory: false
    timing: false
    generations: false

  wandb:
    enabled: true
    project: ava-training
    entity: null
    tags:
      - max-speed
      - cuda-graphs
      - benchmark
    notes: |
      Max speed configuration for throughput benchmarking.
      CUDA graphs enabled, dropout=0, minimal logging.
    log_freq: 100
    log_training: true
    log_gradients: false
    log_moe: false
    log_validation: true
    log_coherence: false
    log_quality: false
    log_memory: false
    log_timing: false
    log_generations: false
    log_per_layer_grads: false
    log_routing_diagnostics: false
    log_model_topology: false

  tensorboard:
    enabled: false

  frequencies:
    log_interval: 1000
    verbose_log_interval: 1000
    metrics: 1000
    memory_check: 5000
    health_summary: 2000
    moe_metrics: 10000

  features:
    timing_breakdown: false
    memory_profiling: false
    health_summaries: false
    tensor_shapes: false
    checkpoint_validation: false
    sample_generations: false
    structured_logging: false
    log_format: default

  diagnostics:
    enabled: false

# =============================================================================
# CHECKPOINTS - Save/load, model selection, output settings
# =============================================================================
checkpoints:
  output_dir: code/outputs
  save_every: 2000
  fresh_start: true

  selection:
    enabled: true
    val_loss_weight: 1.0
    coherence_score_weight: 0.0
    perplexity_weight: 0.0
    require_all_metrics: false
    fallback_to_val_loss: true

# =============================================================================
# EXPERIMENTAL - Progressive, FP8, caching, advanced features
# =============================================================================
experimental:
  caching:
    enabled: true
    mode: training

    activation_cache:
      enabled: true
      max_size_gb: 2.0
      eviction_policy: lru

    kv_cache:
      enabled: true
      max_size_gb: 4.0
      eviction_policy: hybrid
      sink_tokens: 4
      recent_tokens: 256

  checkpointing:
    overlapped:
      enabled: true
      stream_overlap: true
      target_layers: layers

    double:
      enabled: true
      coarse_checkpoint_interval: 8
      fine_checkpoint_interval: 2
      use_cuda_streams: true

  fp8:
    enabled: false
