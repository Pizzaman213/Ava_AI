# Minimal Working Configuration for Ava Training Pipeline
# Designed to run on 24GB GPU with guaranteed success
# Model Size: ~300M parameters (ultra-small for testing)
# Memory: Fits comfortably in 11GB with headroom

model:
  vocab_size: 50680
  pad_token_id: 0
  eos_token_id: 3
  hidden_size: 512 # MINIMAL: Very small for guaranteed fit
  num_layers: 2 # MINIMAL: Only 2 layers
  num_attention_heads: 4 # MINIMAL: 4 heads
  intermediate_size: 2048 # MINIMAL: Small FFN
  max_position_embeddings: 1024 # IMPROVED: Increased from 512 to 1024 for longer sequences
  num_experts: 16 # 16 experts total
  num_experts_per_token: 4 # 4 experts active per token (top-k routing)
  router_type: mixtral
  capacity_factor: 1
  expert_dropout: 0
  activation: swiglu
  use_grouped_gemm: true # ENABLED: 15-25% speedup for parallel expert computation
  use_triton_kernels: true # ENABLED: 2-3x speedup with fused routing ops
  use_torch_compile: true # ENABLED: 15% router speedup via compilation
  use_flash_attention: true # ENABLED: Still helps with attention
  gradient_checkpointing: true # ENABLED: Save memory
  use_optimized_moe: true # ENABLED: Fused MoE operations for 10-20% speedup
  router_z_loss_coef: 0.001
  load_balance_loss_coef: 0.1
  diversity_loss_coef: 0
  expert_dropout_loss_coef: 0
  router_jitter_noise: 0.01
  use_lora_experts: false # DISABLED: Full experts for minimal config
  use_expert_offloading: false # DISABLED: Fits in GPU
  attention_dropout: 0
  dropout: 0
  layer_norm_eps: 0.00001
  initializer_range: 0.02

# No MoE memory optimizations needed - model fits in GPU
moe_memory_optimization:
  use_lora_experts: false
  use_expert_offloading: false
  use_hierarchical_experts: false
  use_expert_quantization: false

# Dynamic Batching Configuration (Phase 2 Optimization)
# Automatically adjusts batch size based on GPU memory utilization
# Expected: 15-25% throughput improvement
dynamic_batching:
  enabled: false # DISABLED for minimal config - enable for production
  min_batch_size: 4 # Finer granularity for smoother adjustments
  max_batch_size: 256

  # Token Budget Batching - target tokens instead of samples
  token_budget:
    enabled: true
    target_tokens_per_batch: 4096
    max_tokens_per_batch: 16384
    min_tokens_per_batch: 512

  # Sequence-Aware (disabled - conflicts with token-budget)
  sequence_aware: false
  base_sequence_length: 128
  sequence_scaling_factor: 0.8

  # Multi-GPU Sync
  sync_across_gpus: true
  sync_strategy: min

  # Gradient Accumulation Integration
  coordinate_with_grad_accum: true
  target_effective_batch_size: 512
  dynamic_grad_accum: false

  # Predictive Memory Estimation
  predictive:
    enabled: true
    calibration_steps: 50
    memory_model: linear

  # Memory Thresholds
  low_memory_threshold: 0.50
  target_memory_threshold: 0.75
  high_memory_threshold: 0.85
  critical_memory_threshold: 0.95

  # Geometric Warmup
  warmup_strategy: geometric
  warmup_steps: 100
  warmup_growth_rate: 1.2
  warmup_initial_fraction: 0.25

  # Trend Detection
  trend_detection:
    enabled: true
    window: 20
    oscillation_threshold: 5
    auto_tune_smoothing: true

  # Adjustment parameters (optimized for stability)
  increase_factor: 8
  decrease_factor: 16
  adjustment_frequency: 25
  cooldown_steps: 10
  max_adjustments_per_session: 500

training:
  batch_size: 128 # CONSERVATIVE: 128 fits in 24GB GPU with all optimizations (effective batch = 512)
  gradient_accumulation_steps: 4 # Accumulate 4 steps (maintaining effective batch = 512)
  optimizer: lion # Lion: 50% less memory than AdamW
  learning_rate: 0.0001 # BACK TO: 0.0001 with gradient accumulation makes it effectively 0.00005
  lion_betas:
    - 0.9
    - 0.99
  num_epochs: 2 # Number of epochs to train for (configurable)
  max_steps: null # Adequate training steps (if set, overrides num_epochs)
  warmup_steps: 1000 # MUCH LONGER: 1000 steps to allow more careful learning
  weight_decay: 0.3 # VERY STRONG: 0.3 for maximum regularization to prevent overfitting
  use_fused_optimizer: true
  offload_optimizer_state: false # DISABLED: Not needed for small model
  save_steps: 500
  eval_steps: 50
  logging_steps: 10
  run_validation: true
  validation_batch_size: 64 # OPTIMIZED: Increased from 2 for faster validation
  max_validation_batches: 10 # MINIMAL: Quick validation
  compute_val_train_ratio: true
  # GENERATION DISABLED: Prevents GPU slowdown during training
  # Generation is resource-intensive and slows GPU. Run post-training instead.
  generate_every_n_steps: null # DISABLED: No generation during training
  num_generations_per_step: 0 # DISABLED: No generation samples
  generation_during_eval: false # DISABLED: Skip generation during eval
  test_generation_quality: false # DISABLED: Skip generation tests
  # Generation parameters kept for reference only (not used when generation disabled)
  generation_max_length: 256
  generation_temperature: 0.85
  generation_top_p: 0.92
  generation_top_k: 50
  generation_repetition_penalty: 1.15
  generation_skip_special_tokens: true
  generation_prompt: Once upon a time, in a land far away,
  alternative_prompts:
    - The quick brown fox
    - In the beginning
    - A long time ago

evaluation:
  moe_metrics:
    track_expert_utilization: true
    log_frequency: 50
    track_routing_decisions: true
    track_load_balance: true

data:
  streaming: true
  buffer_size: 2000 # OPTIMIZED: 2000 samples for better prefetching and throughput
  data_dir: /project/code/data/Ava_Ai/data
  max_length: 128
  train_split: train
  eval_split: validation
  auto_create_validation_split: true
  validation_split_ratio: 0.1
  tokenizer_name: /project/code/data/Ava_Ai/tokenizer
  padding_side: right
  truncation: true
  num_workers: 16 # CRITICAL: 8 workers for parallel data loading (was 0, was killing perf!)
  dataloader_drop_last: true
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 4 # OPTIMIZED: 4x batch size buffering for better pipelining
  dataloader_persistent_workers: true # CRITICAL: Keep workers alive (3-5x speedup)
  dataloader_samples_per_file: 500 # Standard: Good batch building granularity
  use_dynamic_batching: false # DISABLED: Keep simple
  use_streaming_tokenization: false # Already tokenized!
  use_pretokenized: false # CRITICAL: Set to FALSE - data is Parquet, not Arrow
  use_sequence_packing: false # Phase 2: Enable for 20-35% speedup (fully implemented, works with Parquet!)
  packing_strategy: adaptive # greedy or adaptive (adaptive recommended)
  use_all_data: true # Load all available data files sequentially
  max_files_to_load: 10000 # Maximum number of parquet files to load
  multiprocessing_context: spawn
  cache_size: 200 # OPTIMIZED: Cache for faster repeated access
  skip_validation: true # SKIP: Data is clean, validation costs 2-3% perf

output:
  output_dir: /project/code/outputs
  save_every: 500
  fresh_start: false

run_management:
  run_name: minimal_working_optimized
  run_description: Fully optimized config with all performance features enabled (2-3x faster)
  run_tags: minimal,testing,working,optimized,phase1

performance:
  enable_tf32: true
  float32_matmul_precision: high
  enable_cudnn_benchmark: true
  torchinductor_max_autotune: 1 # ENABLED: 10-15% additional speedup via aggressive optimization
  enable_torch_compile: true # ENABLED: Whole-model compilation for 15-30% speedup
  torch_compile_mode: reduce-overhead # OPTIMIZED: Best mode for training loops
  torch_compile_fullgraph: false
  torch_compile_dynamic: true # ENABLED: Handle dynamic shapes better

optimizations:
  torchinductor_autotune: 1 # ENABLED: Aggressive autotuning for 10-15% speedup
  use_overlapped_checkpointing: true # 10-20% speedup from stream-based recomputation

  memory_headroom_gb: 1 # More headroom for safety
  memory_cleanup_thresholds:
    warning: 0.75
    critical: 0.85
    emergency: 0.95

  expert_prefetch:
    enabled: false # DISABLED: No offloading

  expert_cache:
    auto_limit: false # DISABLED: No cache needed
    use_lru_eviction: false
    cache_size: 0

  checkpoint:
    async_saving: true # Still helpful

  memory_cleanup:
    fast_mode: true
    remove_sleep: true

  dataloader:
    adaptive_file_reading: false # DISABLED: Keep simple

  gradient_checkpointing:
    selective: false # DISABLED: Full checkpointing
    checkpoint_attention: true
    checkpoint_every_n_layers: 1

  router:
    cache_hash_on_gpu: true # ENABLED: Keep hash on GPU for faster access
    compile_routers: true # ENABLED: 15-25% router speedup via torch.compile
    enable_router_caching: true # ENABLED: Cache routing decisions where possible

# CUDA Stream Optimizations - reduces synchronization overhead
# Uses StreamPool (reusable streams), CUDATimer (event-based timing),
# efficient_sync (current-stream only), NonBlockingTransfer (async CPU<->GPU)
cuda_streams:
  enabled: true
  num_streams: 4              # Stream pool size for recomputation
  use_event_timing: true      # Use CUDA events instead of synchronize+time
  use_stream_pool: true       # Reuse streams instead of creating new
  high_priority_transfers: true  # Priority streams for CPU<->GPU

# Overlapped checkpointing - uses optimized CUDA streams
overlapped_checkpointing:
  enabled: true               # 10-20% speedup from overlapped recomputation
  stream_overlap: true        # Use CUDA StreamPool for overlapping
  target_layers: "layers"     # Apply to transformer layers

# Double checkpointing - disabled for minimal config (short sequences)
double_checkpointing:
  enabled: false              # Only enable for sequences > 2048
  coarse_checkpoint_interval: 8
  fine_checkpoint_interval: 2
  use_cuda_streams: true      # Uses optimized stream utilities

hardware:
  device: cuda
  mixed_precision: bf16
  compile: false

wandb:
  use_wandb: false
  project: ava-training
  entity: null # Set to your username or team name if needed
  tags:
    - minimal
    - testing
    - moe
  notes: Minimal configuration for 100M parameter model training

deepspeed:
  use_deepspeed: false