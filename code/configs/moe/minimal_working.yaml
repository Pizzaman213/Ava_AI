# Minimal Working Configuration for Ava Training Pipeline
# Designed to run on 24GB GPU with guaranteed success
# Model Size: ~300M parameters (ultra-small for testing)
# Memory: Fits comfortably in 11GB with headroom

model:
  vocab_size: 50680
  pad_token_id: 0
  eos_token_id: 3
  hidden_size: 512 # MINIMAL: Very small for guaranteed fit
  num_layers: 2 # MINIMAL: Only 2 layers
  num_attention_heads: 4 # MINIMAL: 4 heads
  intermediate_size: 2048 # MINIMAL: Small FFN
  max_position_embeddings: 1024 # IMPROVED: Increased from 512 to 1024 for longer sequences
  num_experts: 2 # MINIMAL: Only 2 experts
  num_experts_per_token: 1 # MINIMAL: Only 1 expert active per token
  router_type: mixtral
  capacity_factor: 1
  expert_dropout: 0
  activation: swiglu
  use_grouped_gemm: false # DISABLED: Simpler routing
  use_triton_kernels: false # DISABLED: Standard PyTorch ops
  use_torch_compile: false # DISABLED: Faster startup
  use_flash_attention: true # ENABLED: Still helps with attention
  gradient_checkpointing: true # ENABLED: Save memory
  use_optimized_moe: false # DISABLED: Simple MoE
  router_z_loss_coef: 0.001
  load_balance_loss_coef: 0.1
  diversity_loss_coef: 0
  expert_dropout_loss_coef: 0
  router_jitter_noise: 0.01
  use_lora_experts: false # DISABLED: Full experts for minimal config
  use_expert_offloading: false # DISABLED: Fits in GPU
  attention_dropout: 0
  dropout: 0
  layer_norm_eps: 0.00001
  initializer_range: 0.02

# No MoE memory optimizations needed - model fits in GPU
moe_memory_optimization:
  use_lora_experts: false
  use_expert_offloading: false
  use_hierarchical_experts: false
  use_expert_quantization: false

training:
  batch_size: 128 # REDUCED: 128 → 64 to reduce effective data processed per step
  gradient_accumulation_steps: 16 # NEW: Accumulate 2 steps (= batch 128 in terms of gradient steps but slower convergence)
  optimizer: lion # Lion: 50% less memory than AdamW
  learning_rate: 0.0001 # BACK TO: 0.0001 with gradient accumulation makes it effectively 0.00005
  lion_betas:
    - 0.9
    - 0.99
  num_epochs: 2 # Number of epochs to train for (configurable)
  max_steps: null # Adequate training steps (if set, overrides num_epochs)
  warmup_steps: 1000 # MUCH LONGER: 1000 steps to allow more careful learning
  weight_decay: 0.3 # VERY STRONG: 0.3 for maximum regularization to prevent overfitting
  use_fused_optimizer: true
  offload_optimizer_state: false # DISABLED: Not needed for small model
  save_steps: 500
  eval_steps: 50
  logging_steps: 10
  run_validation: true
  validation_batch_size: 2
  max_validation_batches: 10 # MINIMAL: Quick validation
  compute_val_train_ratio: true
  # IMPROVED GENERATION: Better parameters for coherent text
  generate_every_n_steps: 500 # More frequent evaluation
  num_generations_per_step: 1 # Generate only 1 sample per step
  generation_during_eval: true
  test_generation_quality: true
  generation_max_length: 256 # IMPROVED: Match training sequence length for coherence
  generation_temperature: 0.85 # IMPROVED: Increased from 0.7 for more diversity
  generation_top_p: 0.92 # IMPROVED: Optimized from 0.9 (standard best-practice)
  generation_top_k: 50 # IMPROVED: Added top-k sampling
  generation_repetition_penalty: 1.15 # IMPROVED: Reduced from 2.0 (aggressive) to 1.15 (balanced)
  generation_skip_special_tokens: true
  generation_prompt: "Once upon a time, in a land far away,"  # IMPROVED: Longer prompt for better context
  # Alternative prompts to test generation diversity
  alternative_prompts:
    - "The quick brown fox"
    - "In the beginning"
    - "A long time ago"

evaluation:
  moe_metrics:
    track_expert_utilization: true
    log_frequency: 50
    track_routing_decisions: true
    track_load_balance: true

data:
  streaming: true
  buffer_size: 512 # OPTIMIZED: Small buffer for streaming (avoid RAM overload)
  data_dir: /project/code/data/Ava_Ai/data
  max_length: 128
  train_split: train
  eval_split: validation
  auto_create_validation_split: true
  validation_split_ratio: 0.1
  tokenizer_name: /project/code/data/Ava_Ai/tokenizer
  padding_side: right
  truncation: true
  num_workers: 4 # OPTIMIZED: 4 workers (reduced from 16 to prevent memory overload)
  dataloader_drop_last: true
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 2 # OPTIMIZED: 2 (reduced from 16 to prevent memory overload)
  dataloader_persistent_workers: false # OPTIMIZED: false (reload workers to clear memory)
  dataloader_samples_per_file: 1000 # OPTIMIZED: Standard sampling (reduced from 8000)
  use_dynamic_batching: false # OPTIMIZED: disabled (reduce memory)
  use_streaming_tokenization: false
  use_pretokenized: false # OPTIMIZED: false (streaming + tokenization, NOT pre-loading all data)
  use_sequence_packing: false
  use_all_data: false # OPTIMIZED: false (load incrementally, not all at once)
  multiprocessing_context: spawn
  cache_size: 10 # OPTIMIZED: Minimal cache (was 200, now 10 tables max)

output:
  output_dir: code/outputs/runs/minimal_working # Relative to project root
  save_every: 500
  fresh_start: false

run_management:
  run_name: minimal_working
  run_description: Minimal config guaranteed to work on 24GB GPU
  run_tags: minimal,testing,working

performance:
  enable_tf32: true
  float32_matmul_precision: high
  enable_cudnn_benchmark: true
  enable_gpu_memory_cleanup: true
  gradient_check_frequency: 10
  torchinductor_max_autotune: 0 # DISABLED: Faster startup
  enable_torch_compile: false
  torch_compile_mode: default
  torch_compile_fullgraph: false
  torch_compile_dynamic: false

gradient_health:
  enabled: true
  disable_after_steps: 500
  conditional_monitoring: true
  warmup_fraction: 0.1

optimizations:
  gradient_health_monitoring: true
  torchinductor_autotune: 0 # DISABLED: Simpler for minimal config

  memory_headroom_gb: 1 # More headroom for safety
  memory_cleanup_thresholds:
    warning: 0.75
    critical: 0.85
    emergency: 0.95

  expert_prefetch:
    enabled: false # DISABLED: No offloading

  expert_cache:
    auto_limit: false # DISABLED: No cache needed
    use_lru_eviction: false
    cache_size: 0

  checkpoint:
    async_saving: true # Still helpful

  memory_cleanup:
    fast_mode: true
    remove_sleep: true

  dataloader:
    adaptive_file_reading: false # DISABLED: Keep simple

  gradient_checkpointing:
    selective: false # DISABLED: Full checkpointing
    checkpoint_attention: true
    checkpoint_every_n_layers: 1

  router:
    cache_hash_on_gpu: false # DISABLED: Simple routing
    compile_routers: false
    enable_router_caching: false

hardware:
  device: cuda
  mixed_precision: bf16
  compile: false

wandb:
  use_wandb: true
  project: ava-training
  entity: null  # Set to your username or team name if needed
  tags: [minimal, testing, moe]
  notes: Minimal configuration for 100M parameter model training

deepspeed:
  use_deepspeed: false