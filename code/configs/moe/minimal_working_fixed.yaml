# =============================================================================
# 20M Per-Expert Configuration (~80M total with 4 experts)
# =============================================================================
# Model: ~80M parameter MoE with 4 experts (~20M params each)
# Use case: Training with critical bug fixes and optimized hyperparameters
#
# Configuration Schema v2.0 - 8-Section Structure:
#   model, training, data, compute, distributed, logging, checkpoints, experimental
# =============================================================================

# =============================================================================
# MODEL - Architecture, MoE, tokens, regularization
# =============================================================================
model:
  vocab_size: 32000
  pad_token_id: 0
  eos_token_id: 102
  bos_token_id: 101
  tokenizer_path: pretokenized_data/tokenizers/vocab
  hidden_size: 512
  num_layers: 6
  num_attention_heads: 8
  intermediate_size: 1024
  max_position_embeddings: 256
  activation: swiglu

  # CRITICAL: Tied embeddings incompatible with DeepSpeed ZeRO-2/3
  tie_word_embeddings: false

  # GPU Optimizations
  quantize_kv_cache: true
  use_triton_kernels: true
  use_torch_compile: false
  use_flash_attention: true
  gradient_checkpointing: true

  # Phase 1 Optimizations (2025 update)
  use_fused_qkv: true                       # Fused Q/K/V projection (5-10% attention speedup)
  use_fused_norm: false                     # Disabled for Pre-LN architecture

  # Coherence regularization - DISABLED
  entropy_regularization: 0.0
  output_diversity_weight: 0.0
  eos_logit_bias: 0.0

  # Regularization - MINIMAL for faster learning
  attention_dropout: 0.0
  dropout: 0.0
  layer_norm_eps: 1.0e-5
  initializer_range: 0.02

  # ==========================================================================
  # MoE Configuration (consolidated under model.moe.*)
  # ==========================================================================
  moe:
    architecture:
      num_experts: 4
      num_experts_per_token: 2
      router_type: mixtral
      capacity_factor: 1.25
      expert_dropout: 0.05

    losses:
      router_z_loss_coef: 0.001
      load_balance_loss_coef: 0.01
      diversity_loss_coef: 0.01
      expert_dropout_loss_coef: 0.0
      router_jitter_noise: 0.00
      aux_loss_frequency: 500
      diversity_loss_frequency: 100

    optimization:
      use_optimized_moe: true
      use_grouped_gemm: true
      use_compile_friendly_dispatch: true
      use_fused_moe_kernel: true
      use_sparse_expert_dispatch: true
      use_selective_expert_loading: true
      use_vectorized_capacity: true
      use_fused_softmax_topk: true
      router_kernel_mode: auto
      router_block_size: 4

    prefetch:
      enabled: false
      lookahead: 2
      use_multiple_streams: true

    cache:
      auto_limit: true
      use_lru_eviction: true
      clear_after_optimizer_step: true

    router_compile:
      cache_hash_on_gpu: true
      compile_routers: true
      compile_mode: default
      compile_dynamic: true

    metrics:
      routing_metrics_freq: 10
      moe_metrics_freq: 1
      log_moe: true
      log_routing_diagnostics: false
      track_expert_utilization: true
      track_routing_decisions: false
      track_load_balance: true

    stable_moe:
      enabled: false

# =============================================================================
# TRAINING - Optimizer, schedule, batching, validation
# =============================================================================
training:
  precision:
    mixed_precision: bf16

  batching:
    batch_size: 32
    gradient_accumulation_steps: 4
    label_smoothing: 0.0
    use_overlapped_accumulation: true  # ENABLED: 10-20% speedup with accum_steps > 1

  optimizer:
    type: adamw
    learning_rate: 5.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.1
    use_fused: true
    max_grad_norm: 1.0

  schedule:
    num_epochs: 3
    max_steps: null
    total_steps: 600000
    steps_per_epoch: 200000
    warmup_steps: 1000
    scheduler_type: constant
    num_cycles: 1
    min_lr: 5.0e-4

  logging:
    save_steps: 500
    eval_steps: 500
    logging_steps: 1
    use_tensorboard: false
    # NOTE: routing_metrics_freq moved to model.moe.metrics.routing_metrics_freq
    use_wandb: true

  validation:
    enabled: true
    batch_size: 128
    max_batches: 10
    compute_train_ratio: true
    early_stopping_patience: 5
    early_stopping_min_delta: 0.01

  generation:
    enabled: true
    generate_every_n_steps: 500
    num_per_step: 3
    during_eval: true
    test_quality: true
    max_length: 100
    temperature: 0.7
    top_p: 0.9
    top_k: 25
    repetition_penalty: 1.2
    no_repeat_ngram_size: 3
    skip_special_tokens: true
    eos_token_id: 102
    bos_token_id: 101
    pad_token_id: 0
    prompt: "Once upon a time"
    alternative_prompts:
      - "The quick brown fox"
      - "In the beginning"
      - "Hello, my name is"

  coherence:
    enabled: false
    eval_every_n_steps: 5000
    num_samples: 3
    max_generation_length: 100
    temperature: 0.7
    top_p: 0.9
    top_k: 40
    log_to_wandb: true
    log_to_console: true

# =============================================================================
# DATA - Loading, streaming, packing, splits
# =============================================================================
data:
  streaming: false
  use_pretokenized: true
  buffer_size: 10000

  enable_length_sorting: false

  data_dir: pretokenized_data/data/TinyStories
  val_data_dir: null
  max_length: 256
  add_special_tokens: false
  train_split: train
  eval_split: validation
  auto_create_validation_split: true
  validation_split_ratio: 0.05
  tokenizer_name: pretokenized_data/tokenizers/vocab
  padding_side: right
  truncation: false

  # Data loading - OPTIMIZED
  num_workers: 6
  prefetch_factor: 4
  persistent_workers: true
  dataloader_drop_last: true
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 4
  dataloader_persistent_workers: true
  dataloader_samples_per_file: 4000
  skip_dataloader_validation: true

  # Sequence packing - DISABLED for speed
  use_sequence_packing: false
  packing_strategy: greedy
  packing_target_ratio: 0.95

  # Data discovery
  use_all_data: true
  max_files_to_load: null
  lazy_file_discovery: true
  multiprocessing_context: spawn
  cache_size: 50
  skip_validation: false
  shuffle_files: true

  # Indexed loader
  use_indexed_loader: false
  indexed_num_bins: 8
  indexed_cache_size: 50
  indexed_index_workers: 16

# =============================================================================
# COMPUTE - Device, precision, CUDA, kernels, memory, performance
# =============================================================================
compute:
  performance:
    enable_cudnn_benchmark: true
    enable_tf32: true
    torchinductor_max_autotune: 0
    enable_torch_compile: false
    torch_compile_mode: default
    torch_compile_fullgraph: false
    torch_compile_dynamic: true

  kernels:
    # NOTE: MoE-related kernel settings moved to model.moe.optimization
    # Non-MoE kernel settings remain here
    use_fused_activations: true
    enable_kernel_profiling: false

  cuda:
    streams:
      enabled: false  # DISABLED - causes illegal memory access errors
      num_streams: 4
      use_event_timing: true
      use_stream_pool: true
      high_priority_transfers: true

    graphs:
      enabled: false
      warmup_steps: 10

  memory:
    headroom_gb: 3.0
    cleanup_thresholds:
      warning: 0.85
      critical: 0.90
      emergency: 0.95

  optimizations:
    use_overlapped_checkpointing: true

  calibration:
    batch_size:
      enabled: false
      target_memory: 0.92
      max_batch_size: 256
      perform_optimizer_step: true
      calibration_timeout_sec: 90.0
      calibration_headroom: 1.05
      use_real_dataloader: true
      measure_peak_utilization: true

# =============================================================================
# DISTRIBUTED - Multi-GPU, DeepSpeed, load balancing
# =============================================================================
distributed:
  deepspeed:
    enabled: false
    zero_stage: 2
    cpu_offload: false
    nvme_offload: false
    nvme_path: "/local_nvme"
    precision_type: "bf16"
    gradient_accumulation_steps: 1
    train_batch_size: 128
    micro_batch_size: 128
    activation_checkpointing: false
    partition_activations: false
    gradient_clipping: 1.0
    zero_overlap_comm: true
    zero_contiguous_gradients: true
    zero_reduce_scatter: true
    zero_reduce_bucket_size: 200000000
    zero_allgather_bucket_size: 200000000

# =============================================================================
# LOGGING - Console, WandB, TensorBoard, diagnostics, frequencies
# =============================================================================
logging:
  disabled: false
  silent_mode: false

  console:
    enabled: true
    level: info

  file:
    enabled: true
    level: debug

  progress_bar_enabled: true
  step_logging_enabled: true
  epoch_logging_enabled: true

  metrics:
    training: true
    gradients: true
    moe: true
    validation: true
    coherence: true
    quality: true
    memory: true
    timing: true
    generations: true

  wandb:
    enabled: true
    project: ava-training
    entity: null
    tags:
      - 80m_params
      - 20m_per_expert
      - tinystories
      - fast_iteration
    notes: |
      ~80M parameter MoE with 4 experts (~20M params each) trained on TinyStories.
      Key: BF16, Flash Attention, Gradient Checkpointing
    log_freq: 10
    log_training: true
    log_gradients: true
    log_moe: true
    log_experts: true  # Per-expert metrics (utilization, load, capacity)
    log_validation: true
    log_coherence: true
    log_quality: true
    log_memory: true
    log_timing: true
    log_generations: true
    log_per_layer_grads: false
    log_routing_diagnostics: false
    log_model_topology: false

  tensorboard:
    enabled: false
    log_training: true
    log_gradients: true
    log_moe: true
    log_validation: true

  frequencies:
    log_interval: 1
    verbose_log_interval: 1  # Enable INFO logs
    metrics: 1
    memory_check: 1000       # Increased from 100 to reduce GPU-CPU sync overhead
    health_summary: 100
    # NOTE: moe_metrics moved to model.moe.metrics.moe_metrics_freq

  features:
    timing_breakdown: true
    memory_profiling: true
    health_summaries: true
    tensor_shapes: true
    checkpoint_validation: true
    sample_generations: true
    structured_logging: true
    log_format: default

  diagnostics:
    enabled: true  # Enable diagnostics for memory/timing

    per_layer_gradients:
      enabled: false
      log_freq: 500
      layer_name_patterns:
        - layers
        - experts

    routing:
      enabled: true  # Enable MoE routing metrics
      log_freq: 100
      track_per_expert_load: true
      track_routing_entropy: true
      track_expert_capacity_usage: true

    memory:
      enabled: true  # Enable memory metrics
      log_freq: 100
      track_activation_memory: false
      track_gradient_memory: false
      track_optimizer_state_memory: false
      track_parameter_memory: false

    timing:
      enabled: true  # Enable timing metrics
      log_freq: 100
      profile_forward: true
      profile_backward: true
      profile_optimizer_step: true
      profile_data_loading: true

# =============================================================================
# CHECKPOINTS - Save/load, model selection, output settings
# =============================================================================
checkpoints:
  output_dir: code/outputs
  save_every: 500
  fresh_start: true

  selection:
    enabled: true
    val_loss_weight: 0.5
    coherence_score_weight: 0.3
    perplexity_weight: 0.2
    perplexity_cap: 100.0
    val_loss_cap: 10.0
    higher_is_better: true
    require_all_metrics: false
    fallback_to_val_loss: true

# =============================================================================
# EXPERIMENTAL - Progressive, FP8, caching, advanced features
# =============================================================================
experimental:
  caching:
    enabled: false
    mode: auto

    activation_cache:
      enabled: false
      max_size_gb: 2.0
      eviction_policy: lru

    kv_cache:
      enabled: false
      max_size_gb: 3.0
      eviction_policy: hybrid
      sink_tokens: 4
      recent_tokens: 256

  checkpointing:
    overlapped:
      enabled: false
      stream_overlap: false
      target_layers: layers

    double:
      enabled: false
      coarse_checkpoint_interval: 8
      fine_checkpoint_interval: 2
      use_cuda_streams: false

  fp8:
    enabled: false
    use_transformer_engine: false
    format: e4m3
