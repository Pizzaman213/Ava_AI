# ============================================================
# ULTRA TINY CONFIGURATION - MINIMAL CPU TRAINING
# ============================================================
#
# Category: CPU
# Model Size: ~10M parameters
# Device: CPU (x86_64/ARM64)
# Optimization Level: MINIMAL
# Use Case: Testing, debugging, and ultra-constrained environments
#
# DESCRIPTION:
# Minimal CPU configuration for testing and development.
# Optimized for fast iteration with essential features only.
# Perfect for proof-of-concepts, debugging, and environments
# with very limited computational resources. Includes only
# the most basic MoE functionality.
#
# HARDWARE REQUIREMENTS:
# - CPU: 2+ cores (Intel/AMD x86_64 or ARM64)
# - RAM: 4GB+ system memory
# - Storage: Any storage type
# - OS: Linux, macOS, or Windows
#
# USAGE:
#   python3 train_with_data.py --config configs/cpu/ultra_tiny.yaml
#   python3 interact.py --model outputs/cpu_ultra_tiny.pt
#
# ============================================================

# ============================================================
# MODEL ARCHITECTURE
# ============================================================

model:
  # ---------- Core Architecture ----------
  size: ultra_tiny                # Model size preset
  vocab_size: 50257               # GPT-2 tokenizer vocabulary
  hidden_size: 128                # Hidden dimension (ultra minimal)
  num_layers: 2                   # Number of transformer layers (minimal)
  intermediate_size: 512          # FFN intermediate dimension
  ffn_hidden_size: 512            # Alternative FFN size parameter

  # ---------- Attention Configuration ----------
  num_attention_heads: 2          # Number of attention heads (minimal)
  num_key_value_heads: 1          # For GQA - reduces memory
  attention_type: standard        # Options: mha, mqa, gqa (standard for simplicity)
  use_flash_attn: false           # Flash Attention (not supported on CPU)
  attention_dropout: 0.1          # Dropout in attention layers
  dropout_rate: 0.1               # General dropout

  # ---------- Position Encoding ----------
  max_position_embeddings: 256    # Maximum sequence length (reduced)
  rope_theta: 10000.0             # RoPE base frequency

  # ---------- Mixture of Experts (MoE) ----------
  num_experts: 2                  # Minimal number of experts
  num_experts_per_tok: 1          # Single expert per token
  expert_capacity_factor: 1.0     # Minimal capacity factor
  expert_routing_type: switch     # Options: switch, gshard, base
  expert_dropout: 0.25            # Dropout for expert layers
  
  # ---------- Activation & Initialization ----------
  hidden_act: gelu                # Activation function (simpler than swiglu)
  initializer_range: 0.02         # Weight initialization range
  rms_norm_eps: 1.0e-06          # RMSNorm epsilon for stability
  
  # ---------- Regularization ----------
  hidden_dropout: 0.3             # General dropout rate
  label_smoothing: 0.1            # Label smoothing for loss regularization
  
  # ---------- Caching & Optimization ----------
  use_cache: true                 # Enable KV caching for inference
  gradient_checkpointing: true    # Trade compute for memory
  use_memory_efficient_attention: true  # Memory-efficient attention
  
  # ---------- Advanced Features ----------
  # Mixture of Depths (MoD)
  use_mod: false                  # Disabled for ultra tiny model
  mod_mode: none                  # Options: learned, fixed, adaptive
  mod_skip_fraction: 0.0          # Fraction of layers to skip
  
  # Speculative Decoding
  use_speculative_decoding: false # Disabled for CPU
  speculative_draft_layers: 0     # Number of draft layers
  
  # Expert System Features
  use_hierarchical_moe: false     # Disabled for ultra tiny model
  use_continuous_experts: false   # Continuous expert selection
  use_sparse_experts: false       # Disabled for CPU
  use_expert_cache: true          # Cache expert selections
  
  # Advanced Architecture Components
  use_mod_plus_plus: false        # Disabled for ultra tiny
  use_memory_augmented: false     # External memory mechanisms
  use_adaptive_inference: true    # Dynamic computation graphs
  use_interpretability: false     # Built-in interpretability
  
  # Multi-Modal & Specialized Features
  use_mixture_tokenizers: false   # Multiple tokenizer support
  use_nas_experts: false          # Neural architecture search
  use_meta_learning: false        # Meta-learning capabilities
  use_federated_learning: false   # Federated learning support
  use_continual_learning: false   # Continual learning
  use_advanced_pretraining: false # Advanced pretraining objectives
  use_rlaif: false               # RL from AI feedback
  
  # Specialized Expert Types
  use_code_experts: false         # Code-specialized experts
  use_scientific_experts: false   # Science/math experts
  use_tool_experts: false         # Tool-use experts
  use_vision_language: false      # Vision-language capabilities
  use_audio_language: false       # Audio-language capabilities
  
  # Training & Inference Features
  use_adversarial_training: false # Adversarial robustness
  use_bias_mitigation: false      # Bias reduction mechanisms
  use_privacy_preserving: false   # Privacy-preserving training
  use_watermarking: false         # Model watermarking
  
  # System Integration
  use_distributed_experts: false  # Distributed expert computation
  use_mixed_precision: false      # Mixed precision (limited CPU support)
  use_torch_compile: false        # PyTorch 2.0 compilation (CPU issues)
  use_fused_kernels: false        # Fused kernels (not available on CPU)
  
  # Research & Development Features (mostly disabled for ultra tiny)
  use_diverse_beam_search: false  # Diverse beam search
  use_mixture_decoders: false     # Multiple decoder heads
  use_streaming_generation: false # Streaming text generation
  use_batch_optimized: false      # Batch-optimized inference
  use_synthetic_data: false       # Synthetic data generation
  use_online_learning: false      # Online learning capability
  use_multi_task_learning: false  # Multi-task learning
  use_automated_curation: false   # Automated data curation
  use_cross_lingual: false        # Cross-lingual transfer
  use_edge_deployment: false      # Edge deployment optimization
  use_ab_testing: false           # A/B testing framework
  use_model_versioning: false     # Model versioning system
  use_cost_optimization: false    # Cost-aware optimization
  use_global_load_balancing: false # Global load balancing
  
  # Experimental Features
  use_quantum_inspired: false     # Quantum-inspired algorithms
  use_neuromorphic: false         # Neuromorphic computing
  use_self_modifying: false       # Self-modifying networks
  use_causal_reasoning: false     # Causal reasoning
  use_visual_builder: false       # Visual model builder
  use_automated_docs: false       # Automated documentation
  use_interactive_debug: false    # Interactive debugging
  use_playground: false           # Model playground
  use_benchmarking: false         # Automated benchmarking

# ============================================================
# DATA CONFIGURATION
# ============================================================

data:
  # ---------- Dataset Settings ----------
  dataset_type: hf                # Dataset type (hf = HuggingFace format)
  train_paths:                    # Training data paths
    - /project/code/data/processed/combined_processed.jsonl
  val_path: /project/code/data/processed/combined_processed.jsonl
  
  # ---------- Tokenization ----------
  tokenizer: gpt2                 # Tokenizer to use
  max_length: 128                 # Maximum sequence length (ultra tiny)
  stride: 128                     # Stride for overlapping sequences
  
  # ---------- Data Loading ----------
  max_train_examples: 5000        # Very limited training data
  max_val_examples: 100           # Very limited validation data
  
  # ---------- Dataset Arguments ----------
  dataset_args:
    text_column: text             # Column name for text data
    streaming: true               # Stream data for memory efficiency
    num_proc: 1                   # Single process for simplicity
    keep_in_memory: false         # Don't load entire dataset in memory
    load_from_cache_file: true    # Use cache if available
  
  # ---------- Data Augmentation ----------
  noise_probability: 0.1          # Random token replacement
  mask_probability: 0.05          # Random masking

# ============================================================
# TRAINING CONFIGURATION
# ============================================================

training:
  # ---------- Basic Training ----------
  batch_size: 4                  # Batch size per device (reduced for memory)
  gradient_accumulation_steps: 1  # No gradient accumulation for simplicity
  num_epochs: 10                  # More epochs for ultra tiny model
  max_steps: -1                   # Max steps (-1 = use epochs)
  
  # ---------- Learning Rate ----------
  learning_rate: 1e-3             # Higher learning rate for tiny model
  warmup_steps: 10                # Minimal warmup
  warmup_ratio: 0.0               # No warmup ratio
  
  # ---------- Optimizer Configuration ----------
  optimizer: adamw                # AdamW optimizer (CPU-compatible)
  weight_decay: 0.0               # No weight decay for ultra tiny
  adam_beta1: 0.9                 # Adam beta1
  adam_beta2: 0.999               # Adam beta2
  adam_epsilon: 1e-8              # Adam epsilon
  
  # ---------- Advanced Optimizer Features ----------
  layerwise_lr: false             # Disabled for ultra tiny model
  lr_layer_scale: 1.0             # No layer-wise scaling
  gradient_centralization: false  # Disabled for CPU
  
  # ---------- Learning Rate Scheduling ----------
  lr_scheduler_type: constant     # Constant scheduler for simplicity
  scheduler: cosine               # Alternative scheduler setting
  lr_decay_factor: 1.0            # No decay
  num_restarts: 0                 # No restarts
  
  # ---------- Gradient Management ----------
  max_grad_norm: 1.0              # Gradient clipping threshold
  gradient_clip: 1.0              # Alternative gradient clipping
  adaptive_gradient_clipping: true # Dynamic gradient clipping
  gradient_penalty_weight: 0.001  # Penalize large gradients
  
  # ---------- Mixed Precision ----------
  mixed_precision: false          # No mixed precision on CPU
  gradient_checkpointing: false   # Disabled for speed on ultra tiny
  zero_stage: 0                   # No ZeRO optimization on CPU
  
  # ---------- Loss Functions ----------
  # Focal Loss
  use_focal_loss: false           # Disabled for ultra tiny
  focal_gamma: 2.0                # Focal loss gamma
  focal_alpha: 0.25               # Focal loss alpha
  focal_blend: 0.3                # Blend with standard loss
  
  # ---------- Anti-Collapse Features ----------
  entropy_regularization_weight: 0.01      # Encourage output diversity
  token_frequency_penalty_weight: 0.1      # Penalize repetitive tokens
  expert_diversity_weight: 0.01            # Encourage expert specialization
  
  # ---------- Curriculum Learning ----------
  curriculum_learning: true       # Enable curriculum learning
  initial_sequence_length: 64     # Start with very short sequences
  curriculum_warmup_steps: 200    # Very short curriculum warmup
  use_curriculum: false           # Alternative curriculum setting
  curriculum_type: linear         # Simple linear curriculum
  initial_difficulty: 0.8         # High initial difficulty
  max_difficulty: 1.0             # Maximum difficulty
  sequence_length_curriculum: true # Enable sequence length curriculum
  initial_seq_length: 64          # Initial sequence length
  
  # Progressive Sequence Growth
  progressive_sequence_growth: false # Disabled for ultra tiny
  sequence_growth_rate: 1.5       # Growth multiplier
  sequence_growth_interval: 1000  # Steps between growth
  
  # ---------- Anti-Overfitting Features ----------
  stochastic_depth_prob: 0.0      # Disabled for ultra tiny
  mixout_prob: 0.0                # Disabled
  use_ema: false                  # Disabled for simplicity
  ema_decay: 0.999                # EMA decay rate
  confidence_weighting: false     # Disabled
  sam_enabled: false              # Sharpness-aware minimization
  
  # ---------- Progressive Training ----------
  use_progressive: false          # Progressive training
  growth_strategy: layer_stacking # Growth strategy
  initial_layers: 2               # Initial layers
  growth_interval: 2000           # Growth interval
  
  # ---------- Safety Training ----------
  use_constitutional: false       # Constitutional AI
  safety_principles:              # Safety principles
  - Be helpful and harmless
  num_revisions: 1                # Number of revisions
  safety_weight: 0.1              # Safety weight
  
  # ---------- Active Learning ----------
  use_active_learning: false      # Active learning
  active_learning_strategy: uncertainty  # Strategy
  selection_batch_size: 8         # Selection batch size
  
  # ---------- Smart Checkpointing ----------
  use_smart_checkpointing: false  # Disabled for ultra tiny
  memory_threshold: 0.7           # Memory threshold
  min_recompute_ratio: 2.0        # Min recompute ratio
  always_checkpoint_layers:       # Always checkpoint these
  - attention
  
  # ---------- Evaluation & Checkpointing ----------
  eval_steps: 50                  # Frequent evaluation
  save_steps: 100                 # Frequent checkpointing
  save_total_limit: 1             # Only keep latest checkpoint
  logging_steps: 5                # Very frequent logging
  
  # ---------- DataLoader Settings ----------
  parallel_loading: true          # Parallel data loading
  num_workers: 1                  # Single DataLoader worker
  drop_last: true                 # Drop incomplete batches
  prefetch_factor: 2              # Prefetch factor
  persistent_workers: false       # Persistent workers
  pin_memory: false              # No pin memory on CPU
  
  # ---------- Device Settings ----------
  device: cpu                    # Device: CPU

# ============================================================
# DISTRIBUTED TRAINING
# ============================================================

distributed: false              # No distributed training on CPU
num_gpus: 0                    # Number of GPUs
device_map: cpu                # Device mapping

# ============================================================
# OUTPUT & EXPERIMENT
# ============================================================

output_dir: ./outputs           # Output directory
experiment_name: moe_cpu_ultra_tiny  # Experiment name
logging_level: INFO             # Logging level
report_to:                     # Reporting backends
- tensorboard
seed: 42                       # Random seed

# ============================================================
# FINE-TUNING CONFIGURATION
# ============================================================

fine_tuning:
  # ---------- LoRA Configuration ----------
  use_lora: true                # Enable LoRA
  use_qlora: false              # QLoRA not supported on CPU
  freeze_base_model: true       # Freeze base model
  lora_r: 8                     # LoRA rank
  lora_alpha: 16                # LoRA alpha
  lora_dropout: 0.1             # LoRA dropout
  
  # ---------- Early Stopping ----------
  early_stopping: true          # Enable early stopping
  early_stopping_patience: 3    # Patience
  early_stopping_threshold: 0.001  # Threshold
  min_delta: 0.0005             # Minimum change
  
  # ---------- LoRA Target Modules ----------
  lora_target_modules:          # Target modules (minimal)
  - q_proj
  - v_proj
  - k_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  
  # ---------- Multi-LoRA ----------
  num_lora_experts: 1           # Single LoRA expert for ultra tiny
  task_embedding_dim: 0         # Task embedding dimension
  share_base_weights: true      # Share base weights
  
  # ---------- Fine-tuning Training ----------
  batch_size: 16                # Batch size
  gradient_accumulation_steps: 1  # No gradient accumulation
  learning_rate: 5e-4           # Learning rate
  num_epochs: 5                 # Number of epochs
  warmup_ratio: 0.1             # Warmup ratio

# ============================================================
# INFERENCE CONFIGURATION
# ============================================================

inference:
  use_speculation: false        # Speculative decoding
  num_draft_experts: 1          # Single draft expert
  draft_expert_size_ratio: 0.5  # Draft expert size
  draft_sequence_length: 1      # Minimal draft sequence
  use_prefetching: false        # Prefetching
  prune_before_deployment: true # Prune before deployment
  target_sparsity: 0.2          # Target sparsity
  prune_experts: true           # Prune experts
  prune_attention: true         # Prune attention
  expert_merge_threshold: 0.95  # Expert merge threshold
  use_flash_attn: false         # No Flash Attention on CPU
  torch_compile: false          # PyTorch compilation
  dtype: float32                # Inference dtype (float32 for CPU)

# ============================================================
# MEMORY OPTIMIZATION
# ============================================================

memory_optimization:
  gradient_checkpointing: true  # Gradient checkpointing
  cpu_offload: false            # Already on CPU
  optimizer_offload: false      # Optimizer offload
  parameter_offload: false      # Parameter offload
  activation_checkpointing: true # Activation checkpointing
  memory_efficient_attention: true # Memory efficient attention

# ============================================================
# CPU OPTIMIZATION (CPU Specific)
# ============================================================

cpu_optimization:
  use_mkl: true                 # Use Intel MKL if available
  num_threads: 2                # Number of CPU threads (ultra tiny)
  enable_jemalloc: true         # Use jemalloc for memory management
  optimize_for_inference: true  # Optimize for inference
  use_openmp: true              # Use OpenMP for parallelization

# ============================================================
# MONITORING CONFIGURATION
# ============================================================

monitoring:
  use_health_monitoring: false  # Health monitoring
  check_interval: 1000          # Check interval
  enable_alerts: false          # Enable alerts
  enable_visualization: false   # Enable visualizations
  use_wandb: false              # Disabled for ultra tiny (optional)
  wandb_project: llm-moe-training  # W&B project
  wandb_name: null              # W&B run name
  wandb_tags:                   # W&B tags
  - moe
  - cpu
  - ultra_tiny
  - 10m_params