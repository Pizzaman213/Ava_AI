# ============================================================
# AVA MOE++ MEDIUM CPU CONFIGURATION
# ============================================================
# Model Size: ~200M parameters
# Hardware: 16+ CPU cores, 32GB RAM
# Use Case: Small-scale training, fine-tuning
# ============================================================

# Model Architecture
model:
  # Core dimensions
  hidden_size: 768
  num_layers: 12
  num_attention_heads: 12
  ffn_hidden_size: 3072
  vocab_size: 50257
  max_position_embeddings: 2048

  # MoE configuration
  num_experts: 8
  top_k_experts: 2
  expert_capacity: 1.25

  # Regularization
  dropout_rate: 0.1
  attention_dropout: 0.1
  expert_dropout: 0.1

  # MoE features
  use_expert_balancing: true
  use_adaptive_routing: true
  temperature: 1.0
  confidence_threshold: 0.5
  sinkhorn_iterations: 3
  aux_loss_weight: 0.01
  layer_norm_epsilon: 1.0e-5

# Training Configuration
training:
  # Batch settings
  batch_size: 2
  gradient_accumulation_steps: 16

  # Training duration
  num_epochs: 20

  # Optimizer
  learning_rate: 3.0e-4
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8

  # Learning rate schedule
  lr_scheduler_type: cosine
  warmup_steps: 1000

  # Gradient management
  max_grad_norm: 1.0

  # Checkpointing
  eval_steps: 500
  save_steps: 1000
  logging_steps: 25

# Data Configuration
data:
  data_dir: /project/code/data/pretraining/processed
  max_length: 2048
  num_workers: 8

# Output Configuration
output:
  output_dir: /project/code/outputs

# Hardware Settings
hardware:
  device: cpu
  num_threads: 16