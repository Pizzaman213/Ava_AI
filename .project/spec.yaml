specVersion: v2
specMinorVersion: 2
meta:
    name: Ava_AI
    image: project-ava_ai
    description: "PyTorch AI Development Environment"
    labels: []
    createdOn: "2025-09-14T17:01:37Z"
    defaultBranch: main
layout:
    - path: code/
      type: code
      storage: git
    - path: models/
      type: models
      storage: gitlfs
    - path: data/
      type: data
      storage: gitlfs
    - path: data/scratch/
      type: data
      storage: gitignore
environment:
    base:
        registry: nvcr.io
        image: nvidia/pytorch:24.09-py3
        build_timestamp: ""
        name: PyTorch with CUDA 12.6
        supported_architectures: []
        cuda_version: 12.6.0
        description: PyTorch with CUDA 12.6 and Python 3.10
        entrypoint_script: ""
        labels:
            - cuda12.6
            - pytorch
        apps:
            - name: jupyterlab
              type: jupyterlab
              class: webapp
              start_command: jupyter lab --allow-root --port 8888 --ip 0.0.0.0 --no-browser --NotebookApp.base_url=\$PROXY_PREFIX --NotebookApp.default_url=/lab --NotebookApp.allow_origin='*'
              health_check_command: '[ \$(echo url=\$(jupyter lab list | head -n 2 | tail -n 1 | cut -f1 -d'' '' | grep -v ''Currently'' | sed "s@/?@/lab?@g") | curl -o /dev/null -s -w ''%{http_code}'' --config -) == ''200'' ]'
              stop_command: jupyter lab stop 8888
              user_msg: ""
              logfile_path: ""
              timeout_seconds: 60
              icon_url: ""
              webapp_options:
                autolaunch: true
                port: "8888"
                proxy:
                    trim_prefix: false
                url_command: jupyter lab list | head -n 2 | tail -n 1 | cut -f1 -d' ' | grep -v 'Currently'
        programming_languages:
            - python3
        icon_url: ""
        image_version: 24.09
        os: linux
        os_distro: ubuntu
        os_distro_release: "22.04"
        schema_version: v2
        user_info:
            uid: "0"
            gid: "0"
            username: root
        package_managers:
            - name: apt
              binary_path: /usr/bin/apt
              installed_packages:
                - ""
            - name: pip
              binary_path: /usr/local/bin/pip
              installed_packages:
                - torch
                - torchvision
                - torchaudio
                - jupyterlab
                - numpy
                - pandas
                - matplotlib
                - scikit-learn
                - tensorboard
                - transformers
                - accelerate
        package_manager_environment:
            name: base
            target: /usr/local
    compose_file_path: ""
execution:
    apps:
        - name: VS Code
          type: vs-code
          class: native
          start_command: ""
          health_check_command: '[ \$(ps aux | grep ".vscode-server" | grep -v grep | wc -l ) -gt 4 ] && [ \$(ps aux | grep "/.vscode-server/bin/.*/node .* net.createConnection" | grep -v grep | wc -l) -gt 0 ]'
          stop_command: ""
          user_msg: ""
          logfile_path: ""
          timeout_seconds: 120
          icon_url: ""
    resources:
        gpu:
            requested: 1
        sharedMemoryMB: 20480
    secrets: []
    mounts:
        - type: project
          target: /project/
          description: Project directory
          options: rw
